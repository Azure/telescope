parameters:
- name: cloud
  type: string
- name: regions
  type: object
- name: topology
  type: string
- name: engine
  type: string
- name: engine_input
  type: object
  default: {}
- name: matrix
  type: object
  default: {}
- name: max_parallel
  type: number
- name: terraform_modules_dir
  type: string
  default: ''
- name: terraform_input_file_mapping
  type: object
  default: []
- name: terraform_arguments
  type: string
  default: ''
- name: terraform_input_varibles
  type: object
  default: {}
- name: test_modules_dir
  type: string
  default: ''
- name: run_id
  type: string
  default: ''
- name: timeout_in_minutes
  type: number
  default: 60 # default when not specified is 60 minutes
- name: cancel_timeout_in_minutes
  type: number
  default: 5
- name: retry_attempt_count
  type: number
  default: 3
- name: destroy_retry_attempt_count
  type: number
  default: 3
- name: preserve_state_on_apply_failure
  type: string
  default: "false"
- name: credential_type
  type: string
  default: service_connection
  values:
  - service_connection
  - variable_group
- name: ssh_key_enabled
  type: boolean
  default: true
- name: skip_publish
  type: boolean
  default: false
- name: emit_resume_manifest
  type: boolean
  default: false
- name: resume_manifest_region
  type: string
  default: ''
- name: resume_manifest_tfvars_path
  type: string
  default: ''
- name: debug_preserve
  type: string
  default: "false"

jobs:
- job: ${{ parameters.cloud }}
  variables:
    CLUSTERMESH_JOB_TIMEOUT_MINUTES: ${{ parameters.timeout_in_minutes }}
    CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES: ${{ parameters.cancel_timeout_in_minutes }}
  strategy:
    maxParallel: ${{ parameters.max_parallel }}
    matrix:
      ${{ parameters.matrix }}
  timeoutInMinutes: ${{ parameters.timeout_in_minutes }}
  cancelTimeoutInMinutes: ${{ parameters.cancel_timeout_in_minutes }}
  condition: >-
    and(eq(variables['CLUSTERMESH_REUSE_SMOKE_MODE'], ''),
    or(eq(variables['Build.Reason'], 'Manual'),
    and(eq(variables['Build.Reason'], 'Schedule'),
    eq(variables['Build.SourceBranchName'], 'main'))))
  steps:
  - template: /steps/setup-tests.yml
    parameters:
      cloud: ${{ parameters.cloud }}
      region: ${{ parameters.regions[0] }}
      run_id: ${{ parameters.run_id }}
      test_modules_dir: ${{ parameters.test_modules_dir }}
      retry_attempt_count: ${{ parameters.retry_attempt_count }}
      credential_type: ${{ parameters.credential_type }}
      ssh_key_enabled: ${{ parameters.ssh_key_enabled }}
  - template: /steps/provision-resources.yml
    parameters:
      cloud: ${{ parameters.cloud }}
      regions: ${{ parameters.regions }}
      terraform_modules_dir: ${{ parameters.terraform_modules_dir }}
      terraform_input_file_mapping: ${{ parameters.terraform_input_file_mapping }}
      terraform_arguments: ${{ parameters.terraform_arguments }}
      terraform_input_varibles: ${{ parameters.terraform_input_varibles }}
      retry_attempt_count: ${{ parameters.retry_attempt_count }}
      preserve_state_on_apply_failure: ${{ parameters.preserve_state_on_apply_failure }}
      debug_preserve: ${{ parameters.debug_preserve }}
  - template: /steps/validate-resources.yml
    parameters:
      cloud: ${{ parameters.cloud }}
      regions: ${{ parameters.regions }}
      topology: ${{ parameters.topology }}
      engine: ${{ parameters.engine }}
  - template: /steps/execute-tests.yml
    parameters:
      cloud: ${{ parameters.cloud }}
      topology: ${{ parameters.topology }}
      engine: ${{ parameters.engine }}
      regions: ${{ parameters.regions }}
      engine_input: ${{ parameters.engine_input }}
  - ${{ if not(parameters.skip_publish) }}:
    - template: /steps/publish-results.yml
      parameters:
        cloud: ${{ parameters.cloud }}
        topology: ${{ parameters.topology }}
        engine: ${{ parameters.engine }}
        regions: ${{ parameters.regions }}
        engine_input: ${{ parameters.engine_input }}
        credential_type: ${{ parameters.credential_type }}
  - template: /steps/topology/clustermesh-scale/reuse/write-resume-manifest.yml
    parameters:
      enabled: ${{ parameters.emit_resume_manifest }}
      region: ${{ parameters.resume_manifest_region }}
      tfvars_path: ${{ parameters.resume_manifest_tfvars_path }}
  - template: /steps/cleanup-resources.yml
    parameters:
      cloud: ${{ parameters.cloud }}
      regions: ${{ parameters.regions }}
      terraform_arguments: ${{ parameters.terraform_arguments }}
      retry_attempt_count: ${{ parameters.destroy_retry_attempt_count }}
