trigger: none

parameters:
  # Each entry is a full vmagent/konnectivity config to run SEQUENTIALLY
  # against the SAME provisioned CP/DP clusters (see
  # steps/engine/vmagent-loadtest/execute.yml's config_combinations
  # each-loop) -- add/remove/edit entries here to sweep rateLimit,
  # maxBlockSize, or konnectivity images without paying for a separate
  # terraform apply/destroy per combination. rate_limit/max_block_size
  # default to current prod values; konn_server_image/konn_agent_image
  # default to prod's current resolved tag. queues is intentionally not
  # exposed here -- prod doesn't set that flag at all.
  - name: config_combinations
    type: object
    default:
      - run_label: old-konnectivity-images
        rate_limit: 2097152      # 2 MiB/s — current prod value
        max_block_size: 524288   # .5 MiB — current prod value
        konn_server_image: 'mcr.microsoft.com/oss/v2/kubernetes/apiserver-network-proxy/server:v0.32.1-11'
        konn_agent_image: 'mcr.microsoft.com/oss/v2/kubernetes/apiserver-network-proxy/agent:v0.32.1-11'
      - run_label: new-konnectivity-images
        rate_limit: 2097152
        max_block_size: 524288 
        konn_server_image: 'imranpochi/proxy-server:aksmaster-holfix'
        konn_agent_image: 'imranpochi/proxy-agent:aksmaster-holfix'

pool:
  name: 'AKS-Telescope-Airlock'

variables:
  SCENARIO_TYPE: perf-eval
  SCENARIO_NAME: vmagent-loadtest

stages:
  - stage: eastus_real
    dependsOn: []
    jobs:
      - template: /jobs/competitive-test.yml
        parameters:
          cloud: azure
          regions:
            - eastus
          topology: vmagent-loadtest
          engine: vmagent-loadtest
          engine_input:
            config_combinations: ${{ parameters.config_combinations }}
          matrix:
            # Single leg, ONE provisioned cluster pair -- every entry in
            # config_combinations runs sequentially against it (see
            # engine_input above); TIERS/SOAK_MINUTES/REAL_TARGETS/PARALLEL
            # are shared/global across all combinations.
            real_targets_sweep:
              TIERS: "500,1000,1500,2000"
              SOAK_MINUTES: 5
              REAL_TARGETS: "true"
              PARALLEL: "false"
          max_parallel: 1
          timeout_in_minutes: 2500
          credential_type: service_connection
          ssh_key_enabled: false


