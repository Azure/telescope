trigger: none

pool:
  name: 'AKS-Telescope-Airlock'

variables:
  SCENARIO_TYPE: perf-eval
  SCENARIO_NAME: image-pull-n1000

stages:
  - stage: azure_centraluseuap_image_pull
    dependsOn: []
    jobs:
      - template: /jobs/competitive-test.yml
        parameters:
          cloud: azure
          regions:
            - centraluseuap
          engine: clusterloader2
          engine_input:
            image: "ghcr.io/azure/clusterloader2:v20250513"
          terraform_input_file_mapping:
            - centraluseuap: "scenarios/perf-eval/image-pull-n1000/terraform-inputs/azure-500nodes.tfvars"
          topology: image-pull
          matrix:
            image-pull-500nodes:
              desired_nodes: 504
              node_count: 500
              max_pods: 7
              repeats: 1
              operation_timeout: 60m
              load_type: memory
              memory_request_override: "1000Mi"
              scrape_containerd: True
              scrape_kubelets: False
              scrape_registry: False
              containerd_scrape_interval: 30s
              registry_endpoint: elasticstoragecuseuap.azurecr.io
              test_image: "layertest:5g-15m-15m"
              kubernetes_version: "1.34"
              pod_startup_latency_threshold: 10m
              anonymous_pull: False
          max_parallel: 1
          credential_type: service_connection
          ssh_key_enabled: false
          timeout_in_minutes: 100
