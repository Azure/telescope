trigger: none

pool:
  name: 'AKS-Telescope-Airlock'

variables:
  SCENARIO_TYPE: perf-eval
  SCENARIO_NAME: k8s-gpu-cluster-crud
  GPU_NODE_POOL: ""
  ENABLE_MANAGED_GPU: "false"
  GPU_INSTANCE_PROFILE: ""
  GPU_MIG_STRATEGY: ""
  MANIFEST_DIR: ""
  AKS_CLI_CUSTOM_CONFIG: ""
  AKS_CLI_CUSTOM_HEADERS: ""

stages:
  - stage: azure_australiaeast
    dependsOn: []
    jobs:
      - template: /jobs/competitive-test.yml
        parameters:
          cloud: azure
          regions:
            - australiaeast
          topology: k8s-crud-gpu
          engine: crud
          matrix:
            cpu_vmss_default_contract:
              pool_name: testpool
              vm_size: Standard_D4s_v3
              create_node_count: 1
              scale_node_count: 2
              scale_step_size: 1
              step_time_out: 900
              step_wait_time: 1
              count: 1
              replicas: 3
              completions: 1
              system_node_pool: '{"name":"default","node_count":1,"vm_size":"Standard_D4s_v3","vm_set_type":"VirtualMachineScaleSets"}'
          max_parallel: 1
          credential_type: service_connection
          ssh_key_enabled: false
          timeout_in_minutes: 90
