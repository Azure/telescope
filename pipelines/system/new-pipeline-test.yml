trigger: none

parameters:
  # Each entry is a full vmagent/konnectivity config to run SEQUENTIALLY
  # against the SAME provisioned CP/DP clusters (see
  # steps/engine/vmagent-loadtest/execute.yml's config_combinations
  # each-loop) -- add/remove/edit entries here to sweep rateLimit,
  # maxBlockSize, or konnectivity images without paying for a separate
  # terraform apply/destroy per combination. rate_limit/max_block_size
  # default to current prod values; konn_server_image/konn_agent_image
  # default to prod's current resolved tag.
  #
  # Current sweep: rateLimit 2->20 MiB/s (block size at .5 MiB baseline
  # unless called out), each combo at a single 2000-node tier (see TIERS
  # below) with a 5-minute dwell -- trimmed to 1 tier for a first pass.
  # Judge results from ADX's full metrics set (dropped packets, pending
  # backlog, etc.), not a single bespoke check.
  - name: config_combinations
    type: object
    default:
      - run_label: rl-2mb-baseline
        rate_limit: 2097152      # 2 MiB/s — current prod value
        max_block_size: 524288   # .5 MiB — current prod value
      # - run_label: rl-4mb
      #   rate_limit: 4194304
      #   max_block_size: 524288
      - run_label: rl-6mb
        rate_limit: 6291456
        max_block_size: 524288
      # - run_label: rl-8mb
      #   rate_limit: 8388608
      #   max_block_size: 524288
      # - run_label: rl-10mb-bs-2mb
      #   rate_limit: 10485760
      #   max_block_size: 2097152
      # - run_label: rl-12mb
      #   rate_limit: 12582912
      #   max_block_size: 524288
      # - run_label: rl-14mb
      #   rate_limit: 14680064
      #   max_block_size: 524288
      # - run_label: rl-16mb
      #   rate_limit: 16777216
      #   max_block_size: 524288
      - run_label: rl-18mb
        rate_limit: 18874368
        max_block_size: 524288
      - run_label: rl-20mb-bs-10mb
        rate_limit: 20971520
        max_block_size: 10485760

pool:
  name: 'AKS-Telescope-Airlock'

variables:
  SCENARIO_TYPE: perf-eval
  SCENARIO_NAME: vmagent-loadtest

stages:
  - stage: eastus_real
    dependsOn: []
    jobs:
      - template: /jobs/competitive-test.yml
        parameters:
          cloud: azure
          regions:
            - eastus
          topology: vmagent-loadtest
          engine: vmagent-loadtest
          engine_input:
            config_combinations: ${{ parameters.config_combinations }}
          matrix:
            # Single leg, ONE provisioned cluster pair -- every entry in
            # config_combinations runs sequentially against it (see
            # engine_input above); TIERS/SOAK_MINUTES/REAL_TARGETS/PARALLEL
            # are shared/global across all combinations. SOAK_MINUTES=5 is
            # the dwell per tier for every combo in the sweep above.
            # FIXED_POOLS=true uses the terraform-provisioned tier-block
            # pools (dpblocka-d + dpagentpool) instead of az-cli-scaling
            # nodepool1 per combo -- no re-ramp/teardown between combos.
            real_targets_sweep:
              TIERS: "2000"
              SOAK_MINUTES: 5
              REAL_TARGETS: "true"
              PARALLEL: "false"
              FIXED_POOLS: "true"
          max_parallel: 1
          timeout_in_minutes: 2500
          credential_type: service_connection
          ssh_key_enabled: false


