trigger: none

pool:
  name: 'AKS-Telescope-Airlock'

variables:
  SCENARIO_TYPE: perf-eval
  SCENARIO_NAME: vmagent-loadtest

stages:
  # Two parallel stages: fake targets in westus2, real targets in eastus.
  # dependsOn: [] on both makes them run concurrently. Within each stage the
  # 1000/2000 tiers run sequentially (real-targets reshapes the DP nodepool
  # per tier via multi-nodepool fan-out).
  - stage: westus2_fake
    dependsOn: []
    jobs:
      - template: /jobs/competitive-test.yml
        parameters:
          cloud: azure
          regions:
            - westus2
          topology: vmagent-loadtest
          engine: vmagent-loadtest
          matrix:
            fake_targets:
              TIERS: "500,1000,1500,2000"
              SOAK_MINUTES: 15
              REAL_TARGETS: "false"
              RUN_LABEL: "fake-targets"
              PARALLEL: "false"
              RATE_LIMIT: 524288      # .5 MiB/s — current prod default (unchanged baseline)
              MAX_BLOCK_SIZE: 524288  # .5 MiB — current prod default (unchanged baseline)
            fake_targets_rate2x:
              TIERS: "500,1000,1500,2000"
              SOAK_MINUTES: 15
              REAL_TARGETS: "false"
              RUN_LABEL: "rate2x"
              PARALLEL: "false"
              RATE_LIMIT: 2097152     # 2 MiB/s (4x) — candidate from aks-operator PR #16345543
              MAX_BLOCK_SIZE: 524288  # unchanged; bump only if rate2x alone still backlogs
          max_parallel: 1
          timeout_in_minutes: 900
          credential_type: service_connection
          ssh_key_enabled: false

  - stage: eastus_real
    dependsOn: []
    jobs:
      - template: /jobs/competitive-test.yml
        parameters:
          cloud: azure
          regions:
            - eastus
          topology: vmagent-loadtest
          engine: vmagent-loadtest
          matrix:
            real_targets:
              TIERS: "500,1000,1500,2000"
              SOAK_MINUTES: 15
              REAL_TARGETS: "true"
              RUN_LABEL: "real-targets"
              PARALLEL: "false"
          max_parallel: 1
          timeout_in_minutes: 500
          credential_type: service_connection
          ssh_key_enabled: false

