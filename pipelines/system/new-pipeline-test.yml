trigger: none

pool:
  name: 'AKS-Telescope-Airlock'

variables:
  SCENARIO_TYPE: perf-eval
  SCENARIO_NAME: csi-autoscale-5k

stages:
- stage: azure_eastus2_csi_scale
  dependsOn: []
  jobs:
  - template: /jobs/competitive-test.yml
    parameters:
      cloud: azure
      regions:
      - eastus2
      terraform_input_file_mapping:
      - eastus2: scenarios/perf-eval/csi-autoscale-5k/terraform-inputs/azure.tfvars
      engine: clusterloader2
      engine_input:
        image: ghcr.io/azure/clusterloader2:v20250423
      topology: csi-autoscale
      matrix:
        disk_limit_autoscale_5000_nodes:
          node_count: 5000
          scale_up_timeout_seconds: 10800
          scale_down_timeout_seconds: 21600
          storage_cleanup_timeout: 360
          storage_class: managed-csi
          node_label_selector: "cas=dedicated"
          capacity_type: on-demand
      max_parallel: 1
      timeout_in_minutes: 2880
      credential_type: service_connection
      ssh_key_enabled: false
