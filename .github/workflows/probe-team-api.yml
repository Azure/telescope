name: Team API Permission Probe

on:
  push:
    branches: [leonarddu/merge-gate-tf-integration]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify gh CLI is installed
        run: |
          set -eu
          echo "=== which gh ==="
          which gh
          echo "=== gh --version ==="
          gh --version

      - name: Try list telescope-oncall members via gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== gh api /orgs/Azure/teams/telescope-oncall/members ==="
          gh api /orgs/Azure/teams/telescope-oncall/members --paginate --jq '.[].login' || echo "gh exit code: $?"

      - name: Cross-check with raw curl
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== curl (raw response, includes HTTP status) ==="
          curl -sS -w "\nHTTP_STATUS: %{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/Azure/teams/telescope-oncall/members

      - name: Cross-check curl on a public endpoint (sanity check network)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== curl a public endpoint to prove network + auth OK ==="
          curl -sS -w "\nHTTP_STATUS: %{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Azure/telescope | head -20
