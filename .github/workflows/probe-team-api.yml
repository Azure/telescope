name: Team API Permission Probe

on:
  push:
    branches: [leonarddu/merge-gate-tf-integration]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify gh CLI is installed
        run: |
          which gh
          gh --version

      - name: Test with default GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Default GITHUB_TOKEN ==="
          gh api /orgs/Azure/teams/telescope-oncall/members --paginate --jq '.[].login' || echo "GITHUB_TOKEN exit: $?"

      - name: Test with existing GH_PAT secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "=== Existing GH_PAT secret ==="
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT is empty/unset"
            exit 0
          fi
          gh api /orgs/Azure/teams/telescope-oncall/members --paginate --jq '.[].login' || echo "GH_PAT exit: $?"
