name: CODEOWNERS Match Probe

on:
  push:
    branches: [leonarddu/merge-gate-tf-integration]

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sender: [LeonardCareer, wonderyl, liyu-ma, alyssa1303, anson627, sumanthreddy29, xinWeiWei24, vittoriasalim, notInList, malicious-user, Leonardcareer]
    steps:
      - name: Fetch CODEOWNERS and try to match
        env:
          SENDER: ${{ matrix.sender }}
        run: |
          set -eu
          echo "=== Fetching CODEOWNERS from main ==="
          curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/main/CODEOWNERS" \
            | grep -v '^\s*#' | grep -v '^\s*$' | head -1 \
            | grep -oE '@[A-Za-z0-9_-]+' | tr -d '@' > /tmp/owners
          echo "Parsed owners:"
          cat /tmp/owners
          echo ""
          echo "=== Testing SENDER=$SENDER ==="
          if grep -Fxq "$SENDER" /tmp/owners; then
            echo "MATCH: $SENDER is authorized"
          else
            echo "NO MATCH: $SENDER is not authorized"
            exit 1
          fi
