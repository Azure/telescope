apiVersion: azmonitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-agent-full
  namespace: kube-system
spec:
  labelLimit: 63
  labelNameLengthLimit: 511
  labelValueLengthLimit: 1023
  selector:
    matchLabels:
      k8s-app: cilium
  namespaceSelector:
    matchNames:
      - kube-system
  podMetricsEndpoints:
    - port: prometheus
      interval: 15s
      path: /metrics
      honorLabels: true
      relabelings:
        - replacement: cilium-agent-full
          targetLabel: job
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
---
