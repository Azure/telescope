apiVersion: v1
kind: ServiceAccount
metadata:
  name: cl2-cri-pilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cl2-cri-pilot
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cl2-cri-pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cl2-cri-pilot
subjects:
  - kind: ServiceAccount
    name: cl2-cri-pilot
    namespace: cl2-cri-pilot
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cl2-cri-pilot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 4200
  template:
    spec:
      serviceAccountName: cl2-cri-pilot
      restartPolicy: Never
      nodeSelector:
        agentpool: default
        kubernetes.io/os: linux
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cl2
          image: ghcr.io/azure/clusterloader2:v20250513
          workingDir: /root/perf-tests/clusterloader2
          command: ["/bin/sh", "-c"]
          args:
            - |
              ./clusterloader2 --provider=aks --v=2 --run-from-cluster=true \
                --enable-exec-service=False --enable-prometheus-server=True \
                --prometheus-scrape-kubelets=True --tear-down-prometheus-server=False \
                --prometheus-scrape-kube-state-metrics=False --prometheus-scrape-metrics-server=False \
                --testconfig /root/perf-tests/clusterloader2/config/config.yaml \
                --testoverrides=/root/perf-tests/clusterloader2/config/overrides.yaml \
                --report-dir /root/perf-tests/clusterloader2/results
              rc=$?
              printf '%s\n' "$rc" > exit-code.tmp
              mv exit-code.tmp exit-code
              for i in $(seq 1 300); do
                test -f reports-collected && exit "$rc"
                sleep 2
              done
              echo "Report collection timed out" >&2
              exit 124
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /root/perf-tests/clusterloader2/config
              readOnly: true
            - name: results
              mountPath: /root/perf-tests/clusterloader2/results
      volumes:
        - name: config
          configMap:
            name: cl2-cri-pilot
        - name: results
          emptyDir: {}
