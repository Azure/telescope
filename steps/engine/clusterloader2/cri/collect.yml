parameters:
  - name: cloud
    type: string
    default: ""
  - name: engine_input
    type: object
    default: {}
  - name: region
    type: string
  - name: registry_info
    type: string
    default: ""

steps:
  - script: |
      set -eu

      mkdir -p "$CL2_REPORT_DIR"
      if ! kubectl --request-timeout=30s get pods --all-namespaces \
        -l group=resource-consumer -o json > "$CL2_REPORT_DIR/pods.json"; then
        echo "##vso[task.logissue type=warning;] Unable to collect benchmark pod status."
      fi
      if ! kubectl --request-timeout=30s get events --all-namespaces \
        --sort-by=.metadata.creationTimestamp -o json > "$CL2_REPORT_DIR/events.json"; then
        echo "##vso[task.logissue type=warning;] Unable to collect Kubernetes events."
      fi
    displayName: "Collect Failed Benchmark Diagnostics"
    condition: and(failed(), eq(variables['CRI_BENCHMARK_STARTED'], 'true'))
    env:
      CL2_REPORT_DIR: $(Pipeline.Workspace)/s/modules/python/clusterloader2/cri/results
  - script: |
      set -eo pipefail

      PYTHONPATH=$PYTHONPATH:$(pwd) python3 $PYTHON_SCRIPT_FILE collect \
        --node_count $NODE_COUNT \
        --max_pods $MAX_PODS \
        --repeats $REPEATS \
        --load_type $LOAD_TYPE \
        --cl2_report_dir $CL2_REPORT_DIR \
        --cloud_info "$CLOUD_INFO" \
        --run_id $RUN_ID \
        --run_url $RUN_URL \
        --result_file $TEST_RESULTS_FILE \
        --scrape_kubelets ${SCRAPE_KUBELETS:-False} \
        --registry_info ${REGISTRY_INFO:-""}

    workingDirectory: modules/python
    env:
      CLOUD: ${{ parameters.cloud }}
      REGISTRY_INFO: ${{ parameters.registry_info }}
      RUN_URL: $(RUN_URL)
      PYTHON_SCRIPT_FILE: $(Pipeline.Workspace)/s/modules/python/clusterloader2/cri/cri.py
      CL2_REPORT_DIR: $(Pipeline.Workspace)/s/modules/python/clusterloader2/cri/results
    displayName: "Collect Results"
    condition: and(succeededOrFailed(), eq(variables['CRI_BENCHMARK_STARTED'], 'true'))

  - task: PublishPipelineArtifact@1
    displayName: "Publish Failed Benchmark Diagnostics"
    condition: and(failed(), eq(variables['CRI_BENCHMARK_STARTED'], 'true'))
    inputs:
      targetPath: $(Pipeline.Workspace)/s/modules/python/clusterloader2/cri/results
      artifact: cri-diagnostics-$(System.JobId)-${{ parameters.region }}
