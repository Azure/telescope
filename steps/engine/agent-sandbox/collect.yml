parameters:
- name: cloud
  type: string
  default: ''
- name: engine_input
  type: object
  default: {}
- name: region
  type: string

steps:
- template: /steps/cloud/${{ parameters.cloud }}/collect-cloud-info.yml
  parameters:
    region: ${{ parameters.region }}
- script: |
    set -eo pipefail

    python3 -m agent_sandbox.main collect \
      --workdir "$WORKDIR" \
      --run_id $RUN_ID \
      --run_url $RUN_URL \
      --cloud_info "$CLOUD_INFO" \
      --result_file $TEST_RESULTS_FILE
  workingDirectory: modules/python
  condition: always()
  env:
    CLOUD: ${{ parameters.cloud }}
    RUN_URL: $(RUN_URL)
    WORKDIR: $(TEST_RESULTS_DIR)/agent-sandbox
  displayName: "Collect Agent Sandbox Results"
