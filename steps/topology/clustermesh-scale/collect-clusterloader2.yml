parameters:
  - name: cloud
    type: string
    default: ""
  - name: engine_input
    type: object
    default: {}
  - name: regions
    type: object
    default: {}

steps:
  - template: /steps/set-run-id.yml
  - template: /steps/engine/clusterloader2/clustermesh-scale/collect.yml
    parameters:
      cloud: ${{ parameters.cloud }}
      engine_input: ${{ parameters.engine_input }}
      region: ${{ parameters.regions[0] }}

  - template: /steps/topology/clustermesh-scale/collect-control-plane-metrics.yml
    parameters:
      cloud: ${{ parameters.cloud }}
      region: ${{ parameters.regions[0] }}
