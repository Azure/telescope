parameters:
  - name: cloud
    type: string
  - name: regions
    type: object
  - name: engine
    type: string

steps:
  - ${{ if ne(parameters.cloud, 'azure') }}:
      - template: /steps/cloud/${{ parameters.cloud }}/update-kubeconfig.yml
        parameters:
          role: network-load
          region: ${{ parameters.regions[0] }}
  # reusing slo validation because it is generic and simple, and it does not save any artifacts. At time of this writing, it only checks node count
  - ${{ if eq(parameters.cloud, 'azure') }}:
      - template: /steps/cloud/azure/setup-kubeconfig.yml
        parameters:
          role: network-load
          region: ${{ parameters.regions[0] }}

  - template: /steps/engine/clusterloader2/large-cluster/validate.yml
    parameters:
      desired_nodes: 13
      validation_timeout_in_minutes: 30
