parameters:
  - name: cloud
    type: string
  - name: engine
    type: string
  - name: regions
    type: object

steps:
  - ${{ if ne(parameters.cloud, 'azure') }}:
      - template: /steps/cloud/${{ parameters.cloud }}/update-kubeconfig.yml
        parameters:
          role: storage
          region: ${{ parameters.regions[0] }}
  - ${{ if eq(parameters.cloud, 'azure') }}:
      - template: /steps/cloud/azure/setup-kubeconfig.yml
        parameters:
          role: storage
          region: ${{ parameters.regions[0] }}
  - template: /steps/engine/${{ parameters.engine }}/validate.yml
    parameters:
      storage_name: $(STORAGE_NAME)
      desired_nodes: $(DESIRED_NODES)
      operation_timeout_in_minutes: 10
