parameters:
- name: cloud
  type: string
- name: engine
  type: string
- name: regions
  type: object

steps:
- template: /steps/cloud/${{ parameters.cloud }}/update-kubeconfig.yml
  parameters:
    role: client
    region: ${{ parameters.regions[0] }}
- ${{ if eq(parameters.cloud, 'azure') }}:
  - template: /steps/cloud/azure/authenticate-acr.yml
    parameters:
      role: client
      region: ${{ parameters.regions[0] }}
- template: /steps/engine/clusterloader2/large-cluster/validate.yml
  parameters:
    desired_nodes: $(desired_nodes)
    validation_timeout_in_minutes: 40
    # Tolerate a few nodes that never join, then size the benchmark to the ready benchmark nodes (READY_NODE_COUNT)
    min_ready_percent: 95
    stable_minutes: 5
    node_label: cri-resource-consume=true
