parameters:
- name: cloud
  type: string
- name: engine_input
  type: object
- name: regions
  type: object

steps:
- script: |
    set -euo pipefail
    python3 "$(Pipeline.Workspace)/s/scenarios/perf-eval/image-pull-n5/pull.py" \
      --image "$REGISTRY_ENDPOINT/$TEST_IMAGE" \
      --runner-image "$RUNNER_IMAGE" \
      --result-file "$TEST_RESULTS_FILE" \
      --run-id "$RUN_ID" \
      --run-url "$RUN_URL"
  displayName: "Download test1gb once on each of five workers"
  env:
    RUNNER_IMAGE: ${{ parameters.engine_input.image }}
    ACR_PULL_USERNAME: $(ACR_PULL_USERNAME)
    ACR_PULL_PASSWORD: $(ACR_PULL_PASSWORD)
- task: PublishPipelineArtifact@1
  displayName: "Publish five-pull results"
  condition: always()
  inputs:
    targetPath: $(TEST_RESULTS_DIR)
    artifact: image-pull-$(System.JobId)
