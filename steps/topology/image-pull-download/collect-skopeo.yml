parameters:
- name: cloud
  type: string
- name: engine_input
  type: object
- name: regions
  type: object

steps:
- template: /steps/cloud/${{ parameters.cloud }}/collect-cloud-info.yml
  parameters:
    region: ${{ parameters.regions[0] }}
- script: |
    set -euo pipefail
    jq -e '.status == "success" and .successful_pulls == 5' "$TEST_RESULTS_FILE"
  displayName: "Validate all five image downloads"
