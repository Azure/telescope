parameters:
- name: cloud
  type: string
- name: regions
  type: object
- name: engine
  type: string

steps:
- ${{ if ne(parameters.cloud, 'azure') }}:
  - template: /steps/cloud/${{ parameters.cloud }}/update-kubeconfig.yml
    parameters:
      role: gpu
      region: ${{ parameters.regions[0] }}

- ${{ if eq(parameters.cloud, 'azure') }}:
  - template: /steps/cloud/azure/setup-kubeconfig.yml
    parameters:
      role: gpu
      region: ${{ parameters.regions[0] }}
