parameters:
  - name: cloud
    type: string
  - name: engine
    type: string
  - name: regions
    type: object

# MOCK-mode validation is the real clustermesh-scale validation (Fleet + ACNS +
# clustermesh-apiserver readiness and cross-cluster smoke on the real thin
# worker pool). The additive KWOK + mock-cilium-agent layer is deployed later,
# after managed-telemetry configuration finishes its `az aks update` calls, so
# those cluster mutations cannot destabilize freshly-created synthetic Nodes.
steps:
  - template: /steps/topology/clustermesh-scale/validate-resources.yml@self
    parameters:
      cloud: ${{ parameters.cloud }}
      engine: ${{ parameters.engine }}
      regions: ${{ parameters.regions }}
