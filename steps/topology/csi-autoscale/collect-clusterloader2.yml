parameters:
- name: cloud
  type: string
  default: ''
- name: engine_input
  type: object
  default: {}
- name: regions
  type: object
  default: {}

steps:
- template: /steps/cloud/${{ parameters.cloud }}/collect-cloud-info.yml
  parameters:
    region: ${{ parameters.regions[0] }}

- script: |
    set -euo pipefail
    PYTHONPATH="$PWD" python3 -m clusterloader2.autoscale.disk_autoscale collect \
      --report-file "$TEST_RESULTS_DIR/disk-autoscale.json" \
      --result-file "$TEST_RESULTS_FILE"
  workingDirectory: modules/python
  env:
    RUN_URL: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=logs&j=$(System.JobId)
  displayName: Collect disk-bound autoscale results
