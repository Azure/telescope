parameters:
- name: cloud
  type: string
  default: ''
- name: engine_input
  type: object
  default: {}
- name: regions
  type: object
  default: {}

steps:
- script: |
    set -euo pipefail
    PYTHONPATH="$PWD" python3 -m clusterloader2.autoscale.disk_autoscale execute \
      --node-count "$NODE_COUNT" \
      --selector "$NODE_LABEL_SELECTOR" \
      --storage-class "$STORAGE_CLASS" \
      --timeout-seconds "$SCALE_UP_TIMEOUT_SECONDS" \
      --scale-down-timeout-seconds "$SCALE_DOWN_TIMEOUT_SECONDS" \
      --storage-cleanup-timeout-minutes "$STORAGE_CLEANUP_TIMEOUT" \
      --report-file "$TEST_RESULTS_DIR/disk-autoscale.json"
  workingDirectory: modules/python
  displayName: Verify disk-bound node autoscaling

- script: |
    set -uo pipefail

    mkdir -p "$TEST_RESULTS_DIR"
    kubectl get events --all-namespaces --field-selector type=Warning \
      --sort-by=.lastTimestamp > "$TEST_RESULTS_DIR/kubernetes-warning-events.txt" || \
      echo "##vso[task.logissue type=warning;] Failed to collect Kubernetes warning events."

    while read -r pod; do
      [ -z "$pod" ] && continue
      kubectl logs -n kube-system "$pod" --all-containers --prefix \
        >> "$TEST_RESULTS_DIR/azuredisk-csi.log" || \
        echo "##vso[task.logissue type=warning;] Failed to collect logs from $pod."
    done < <(kubectl get pods -n kube-system -o name | grep azuredisk || true)
  displayName: Collect Azure Disk CSI diagnostics
  condition: always()

- task: PublishPipelineArtifact@1
  displayName: Publish disk autoscale report and diagnostics
  condition: always()
  inputs:
    targetPath: $(TEST_RESULTS_DIR)
    artifact: disk-autoscale-$(System.JobId)
