parameters:
- name: cloud
  type: string
- name: topology
  type: object
- name: engine
  type: string
- name: regions
  type: object
- name: engine_input
  type: object
  default: {}
- name: credential_type
  type: string

steps:
- template: /steps/topology/${{ parameters.topology }}/collect-${{ parameters.engine }}.yml@self
  parameters:
    cloud: ${{ parameters.cloud }}
    regions: ${{ parameters.regions }}
    engine_input: ${{ parameters.engine_input }}

- template: /steps/collect-telescope-metadata.yml
  parameters:
    engine: ${{ parameters.engine }}
    topology: ${{ parameters.topology }}
    engine_input: ${{ parameters.engine_input }}
    cloud: ${{ parameters.cloud }}
    credential_type: ${{ parameters.credential_type }}
    regions: ${{ parameters.regions }}

- template: /steps/cloud/azure/upload-storage-account.yml
  parameters:
    credential_type: ${{ parameters.credential_type }}
    cloud: ${{ parameters.cloud }}

- ${{ if eq(parameters.engine, 'clusterloader2') }}:
  - bash: |
      set -euo pipefail
      status=0
      found=false
      while IFS= read -r -d '' file; do
        found=true
        code=$(cat "$file")
        if [[ ! "$code" =~ ^(0|[1-9][0-9]{0,2})$ ]] || (( code > 255 )); then
          echo "Invalid CL2 exit status in $file" >&2
          status=1
        elif (( code != 0 && status == 0 )); then
          status=$code
        fi
        artifact="${file%.exit-code}.log"
        if [[ -f "$artifact" ]]; then echo "##vso[task.uploadfile]$artifact"; fi
      done < <(find "$(Pipeline.Workspace)/s/modules/python/clusterloader2" -name 'cl2-driver-*.exit-code' -print0)
      if [[ "$found" == false ]]; then echo "CL2 Job exit status missing" >&2; exit 1; fi
      exit "$status"
    displayName: "Return CL2 Job exit status after collection"
