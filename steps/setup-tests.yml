parameters:
  - name: cloud
    type: string
  - name: region
    type: string
  - name: test_modules_dir
    type: string
    default: ""
  - name: run_id
    type: string
    default: ""
  - name: retry_attempt_count
    type: number
    default: 3
  - name: credential_type
    type: string
  - name: ssh_key_enabled
    type: boolean

steps:
  - template: /steps/set-run-id.yml
    parameters:
      run_id: ${{ parameters.run_id }}

  - script: |
      set -euo pipefail

      fail_job_preflight() {
        local message="$1"
        echo "##vso[task.setvariable variable=SKIP_RESOURCE_MANAGEMENT]true"
        echo "##vso[task.logissue type=error;]$message"
        echo "$message" >&2
        exit 1
      }

      parse_nonnegative_integer() {
        local output_name="$1"
        local input_name="$2"
        local raw_value="$3"
        local maximum="$4"
        if ! [[ "$raw_value" =~ ^(0|[1-9][0-9]*)$ ]]; then
          fail_job_preflight \
            "$input_name must be a canonical non-negative integer, got '$raw_value'."
        fi
        if [ "${#raw_value}" -gt "${#maximum}" ] || {
          [ "${#raw_value}" -eq "${#maximum}" ] &&
            [[ "$raw_value" > "$maximum" ]]
        }; then
          fail_job_preflight "$input_name exceeds the supported maximum $maximum."
        fi
        printf -v "$output_name" '%d' "$raw_value"
      }

      job_start_epoch=$(date +%s)
      echo "ClusterMesh job start epoch: $job_start_epoch"
      echo "##vso[task.setvariable variable=CLUSTERMESH_JOB_START_EPOCH]$job_start_epoch"

      parse_nonnegative_integer suite_budget_seconds \
        SUITE_TOTAL_BUDGET_SECONDS "${SUITE_TOTAL_BUDGET_SECONDS:-0}" 2147483647
      parse_nonnegative_integer timeout_buffer_seconds \
        SUITE_JOB_TIMEOUT_BUFFER_SECONDS \
        "${SUITE_JOB_TIMEOUT_BUFFER_SECONDS:-3600}" 2147483647
      parse_nonnegative_integer job_timeout_minutes \
        CLUSTERMESH_JOB_TIMEOUT_MINUTES \
        "${CLUSTERMESH_JOB_TIMEOUT_MINUTES:-0}" 35790

      if [ "$suite_budget_seconds" -gt 0 ]; then
        required_timeout_seconds=$((suite_budget_seconds + timeout_buffer_seconds))
        if [ "$job_timeout_minutes" -eq 0 ]; then
          echo "ClusterMesh job timeout: unlimited; suite=${suite_budget_seconds}s" \
            "required post-suite buffer=${timeout_buffer_seconds}s"
        else
          actual_timeout_seconds=$((job_timeout_minutes * 60))
          required_timeout_minutes=$(((required_timeout_seconds + 59) / 60))
          echo "ClusterMesh job timeout envelope: actual=${job_timeout_minutes}m" \
            "required>=${required_timeout_minutes}m suite=${suite_budget_seconds}s" \
            "post-suite buffer=${timeout_buffer_seconds}s"
          if [ "$actual_timeout_seconds" -lt "$required_timeout_seconds" ]; then
            fail_job_preflight \
              "ClusterMesh job timeout is too short: need at least ${required_timeout_minutes}m, got ${job_timeout_minutes}m."
          fi
        fi
      fi
    displayName: "Record ClusterMesh job start"
    condition: startsWith(variables['SCENARIO_NAME'], 'clustermesh')

  - script: |
      set -euo pipefail

      fail_capacity_preflight() {
        local message="$1"
        echo "##vso[task.setvariable variable=SKIP_RESOURCE_MANAGEMENT]true"
        echo "##vso[task.logissue type=error;]$message"
        echo "$message" >&2
        exit 1
      }

      parse_nonnegative_integer() {
        local output_name="$1"
        local input_name="$2"
        local raw_value="$3"
        local maximum="$4"
        if ! [[ "$raw_value" =~ ^(0|[1-9][0-9]*)$ ]]; then
          fail_capacity_preflight \
            "$input_name must be a canonical non-negative integer, got '$raw_value'."
        fi
        if [ "${#raw_value}" -gt "${#maximum}" ] || {
          [ "${#raw_value}" -eq "${#maximum}" ] &&
            [[ "$raw_value" > "$maximum" ]]
        }; then
          fail_capacity_preflight "$input_name exceeds the supported maximum $maximum."
        fi
        printf -v "$output_name" '%d' "$raw_value"
      }

      cpu_cores=$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc)
      memory_total_kb=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
      memory_available_kb=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
      disk_total_kb=""
      disk_available_kb=""
      read -r disk_total_kb disk_available_kb < <(
        df -Pk "$PIPELINE_WORKSPACE" | awk 'NR == 2 {print $2, $4}'
      ) || true

      for name_value in \
        "online CPU count=$cpu_cores" \
        "total memory KiB=$memory_total_kb" \
        "available memory KiB=$memory_available_kb" \
        "workspace disk total KiB=$disk_total_kb" \
        "workspace disk available KiB=$disk_available_kb"; do
        name="${name_value%%=*}"
        value="${name_value#*=}"
        if ! [[ "$value" =~ ^[1-9][0-9]*$ ]]; then
          fail_capacity_preflight "Unable to determine ClusterMesh agent $name."
        fi
      done

      parse_nonnegative_integer minimum_disk_gi \
        AGENT_DISK_MIN_FREE_GI "${AGENT_DISK_MIN_FREE_GI:-10}" 1048576
      parse_nonnegative_integer minimum_memory_gi \
        AGENT_MEMORY_MIN_FREE_GI "${AGENT_MEMORY_MIN_FREE_GI:-0}" 1048576

      memory_total_mib=$((memory_total_kb / 1024))
      memory_available_mib=$((memory_available_kb / 1024))
      disk_total_gi=$((disk_total_kb / 1024 / 1024))
      disk_available_gi=$((disk_available_kb / 1024 / 1024))
      load_average=$(awk '{print $1, $2, $3}' /proc/loadavg)
      open_file_limit=$(ulimit -n)
      process_limit=$(ulimit -u)
      docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)

      echo "ClusterMesh agent capacity:" \
        "agent=${AGENT_NAME:-unknown} cpu=${cpu_cores} load=${load_average}"
      echo "  memory=${memory_available_mib} MiB available /" \
        "${memory_total_mib} MiB total; minimum=${minimum_memory_gi} GiB"
      echo "  workspace disk=${disk_available_gi} GiB available /" \
        "${disk_total_gi} GiB total; minimum=${minimum_disk_gi} GiB"
      echo "  docker root=${docker_root:-unavailable}" \
        "open-files=${open_file_limit} processes=${process_limit}"
      echo "##vso[task.setvariable variable=CLUSTERMESH_AGENT_CPU_CORES]$cpu_cores"
      echo "##vso[task.setvariable variable=CLUSTERMESH_AGENT_MEMORY_TOTAL_MIB]$memory_total_mib"
      echo "##vso[task.setvariable variable=CLUSTERMESH_AGENT_MEMORY_AVAILABLE_MIB]$memory_available_mib"
      echo "##vso[task.setvariable variable=CLUSTERMESH_AGENT_DISK_TOTAL_GI]$disk_total_gi"
      echo "##vso[task.setvariable variable=CLUSTERMESH_AGENT_DISK_AVAILABLE_GI]$disk_available_gi"

      if [ "$disk_available_kb" -lt $((minimum_disk_gi * 1024 * 1024)) ]; then
        fail_capacity_preflight \
          "ClusterMesh agent workspace disk is below the configured ${minimum_disk_gi} GiB watermark."
      fi
      if [ "$memory_available_kb" -lt $((minimum_memory_gi * 1024 * 1024)) ]; then
        fail_capacity_preflight \
          "ClusterMesh agent memory is below the configured ${minimum_memory_gi} GiB watermark."
      fi
    displayName: "Preflight ClusterMesh agent capacity"
    condition: startsWith(variables['SCENARIO_NAME'], 'clustermesh')
    env:
      PIPELINE_WORKSPACE: $(Pipeline.Workspace)

  - script: |
      run_url="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=logs&j=$(System.JobId)"
      echo "Run URL: $run_url"
      echo "##vso[task.setvariable variable=RUN_URL]$run_url"

      code_url="$(Build.Repository.Uri)/commit/$(Build.SourceVersion)"
      echo "Code URL: $code_url"
      echo "##vso[task.setvariable variable=CODE_URL]$code_url"
    displayName: "Set Run URL & Code URL"

  - script: |
      test_results_directory=$(Pipeline.Workspace)/s/$(RUN_ID)
      mkdir -p $test_results_directory
      echo "Test Results directory: $test_results_directory"
      echo "##vso[task.setvariable variable=TEST_RESULTS_DIR]$test_results_directory"

      test_results_file=$test_results_directory/results.json

      echo "Test Results file: $test_results_file"
      echo "##vso[task.setvariable variable=TEST_RESULTS_FILE]$test_results_file"
    displayName: "Set Test Results Directory"

  - script: |
      python3 --version && pip3 --version
      jq --version
      kubectl version --client
      az version
      aws --version
      helm version
    displayName: "Check Dependencies"

  - script: |
      set -e
      echo "Install Python dependencies"
      # Constrain pip to versions below 24 due to compatibility issues with some packages and breaking changes introduced in pip 24.
      pip3 install --upgrade "pip<24"
      pip3 install -r $(Pipeline.Workspace)/s/modules/python/requirements.txt

      echo "Install Ubuntu packages"
      # Hosted/shared agents can have an automatic package operation in flight.
      # Wait on dpkg's lock instead of failing an otherwise healthy long run.
      configured=false
      for attempt in $(seq 1 60); do
        if sudo dpkg --configure -a; then
          configured=true
          break
        fi
        echo "dpkg is busy (attempt $attempt/60); retrying in 5s..."
        sleep 5
      done
      if [ "$configured" != "true" ]; then
        echo "Timed out waiting for dpkg configuration lock." >&2
        exit 1
      fi
      sudo apt-get -o DPkg::Lock::Timeout=300 update
      sudo apt-get -o DPkg::Lock::Timeout=300 -y install bc netcat
    displayName: "Install Dependencies"

  - template: /steps/cloud/${{ parameters.cloud }}/login.yml
    parameters:
      region: ${{ parameters.region }}
      credential_type: ${{ parameters.credential_type }}

  - script: |
      set -euo pipefail

      required="${CLUSTERMESH_REQUIRED_MANAGED_CLUSTERS:-${CLUSTER_COUNT:?CLUSTER_COUNT is required}}"
      headroom="${CLUSTERMESH_MANAGED_CLUSTER_QUOTA_HEADROOM:-0}"
      for value in "$required" "$headroom"; do
        if ! [[ "$value" =~ ^[0-9]+$ ]]; then
          echo "ClusterMesh managed-cluster quota values must be non-negative integers: required=$required headroom=$headroom" >&2
          exit 1
        fi
      done

      actual_subscription_id=$(az account show --query id -o tsv)
      if [[ "${actual_subscription_id,,}" != "${AZURE_SUBSCRIPTION_ID,,}" ]]; then
        echo "Expected Azure subscription ${AZURE_SUBSCRIPTION_ID}, got ${actual_subscription_id}" >&2
        exit 1
      fi

      usage=$(az rest --method get \
        --url "https://management.azure.com/subscriptions/${actual_subscription_id}/providers/Microsoft.ContainerService/locations/${REGION}/usages?api-version=2024-01-01" \
        -o json)
      quota=$(echo "$usage" | jq -c \
        '[.value[] | select(.name.value == "ManagedClusters")][0] // empty')
      if [ -z "$quota" ]; then
        echo "Unable to resolve Microsoft.ContainerService ManagedClusters quota in $REGION." >&2
        exit 1
      fi

      current=$(echo "$quota" | jq -r '.currentValue')
      limit=$(echo "$quota" | jq -r '.limit')
      for value in "$current" "$limit"; do
        if ! [[ "$value" =~ ^[0-9]+$ ]]; then
          echo "ManagedClusters quota returned malformed usage: current=$current limit=$limit" >&2
          exit 1
        fi
      done

      required_with_headroom=$(( required + headroom ))
      available=$(( limit - current ))
      echo "ClusterMesh managed-cluster quota preflight: subscription=$actual_subscription_id region=$REGION"
      echo "  current=$current limit=$limit available=$available"
      echo "  run requirement=$required clusters + reserved headroom=$headroom clusters"
      if [ "$available" -lt "$required_with_headroom" ]; then
        echo "Insufficient ManagedClusters quota in $REGION: need $required_with_headroom available clusters, have $available (current=$current limit=$limit)." >&2
        exit 1
      fi
    displayName: "Preflight ClusterMesh managed-cluster quota"
    condition: and(startsWith(variables['SCENARIO_NAME'], 'clustermesh'),
                   eq(variables['CLUSTERMESH_QUOTA_PREFLIGHT_ENABLED'], 'true'))
    env:
      REGION: ${{ parameters.region }}

  - script: |
      set -euo pipefail

      family_name="${CLUSTERMESH_VM_FAMILY_QUOTA_NAME:?CLUSTERMESH_VM_FAMILY_QUOTA_NAME is required}"
      required="${CLUSTERMESH_REQUIRED_FAMILY_VCPUS:?CLUSTERMESH_REQUIRED_FAMILY_VCPUS is required}"
      headroom="${CLUSTERMESH_QUOTA_HEADROOM_VCPUS:-0}"
      for value in "$required" "$headroom"; do
        if ! [[ "$value" =~ ^[0-9]+$ ]]; then
          echo "ClusterMesh quota values must be non-negative integers: required=$required headroom=$headroom" >&2
          exit 1
        fi
      done

      actual_subscription_id=$(az account show --query id -o tsv)
      if [[ "${actual_subscription_id,,}" != "${AZURE_SUBSCRIPTION_ID,,}" ]]; then
        echo "Expected Azure subscription ${AZURE_SUBSCRIPTION_ID}, got ${actual_subscription_id}" >&2
        exit 1
      fi

      usage=$(az vm list-usage --location "$REGION" -o json)
      family=$(echo "$usage" | jq -c --arg name "$family_name" \
        '[.[] | select(.name.value == $name)][0] // empty')
      regional=$(echo "$usage" | jq -c \
        '[.[] | select(.name.value == "cores")][0] // empty')
      if [ -z "$family" ] || [ -z "$regional" ]; then
        echo "Unable to resolve VM quota usage for family=$family_name or regional cores in $REGION." >&2
        exit 1
      fi

      family_current=$(echo "$family" | jq -r '.currentValue')
      family_limit=$(echo "$family" | jq -r '.limit')
      regional_current=$(echo "$regional" | jq -r '.currentValue')
      regional_limit=$(echo "$regional" | jq -r '.limit')
      required_with_headroom=$(( required + headroom ))
      family_available=$(( family_limit - family_current ))
      regional_available=$(( regional_limit - regional_current ))

      echo "ClusterMesh quota preflight: subscription=$actual_subscription_id region=$REGION"
      echo "  family=$family_name current=$family_current limit=$family_limit available=$family_available"
      echo "  regional cores current=$regional_current limit=$regional_limit available=$regional_available"
      echo "  run requirement=$required vCPU + reserved headroom=$headroom vCPU"
      if [ "$family_available" -lt "$required_with_headroom" ]; then
        echo "Insufficient $family_name quota: need $required_with_headroom available vCPU, have $family_available." >&2
        exit 1
      fi
      if [ "$regional_available" -lt "$required_with_headroom" ]; then
        echo "Insufficient regional core quota: need $required_with_headroom available vCPU, have $regional_available." >&2
        exit 1
      fi
    displayName: "Preflight ClusterMesh VM quota"
    condition: and(startsWith(variables['SCENARIO_NAME'], 'clustermesh'),
                   eq(variables['CLUSTERMESH_QUOTA_PREFLIGHT_ENABLED'], 'true'))
    env:
      REGION: ${{ parameters.region }}

  - script: |
      # Early managed-telemetry preflight, run BEFORE Terraform, so a doomed
      # AKS control-plane managed-Prometheus configuration (missing preview
      # feature registration, a provider surface that doesn't support the
      # requested ingestion limits, or a regional AMW quota that is already
      # exhausted) fails fast instead of after clusters/mesh are provisioned.
      # configure-managed-prometheus.sh (steps/topology/clustermesh-scale/
      # configure-control-plane-metrics.yml) re-checks/enforces all of this
      # again at configure time; this preflight is a cheap, read-only,
      # no-resource-creation early warning using the same UI-selected
      # subscription and az CLI patterns as the VM quota preflight above.
      set -euo pipefail

      cluster_count="${CLUSTER_COUNT:?CLUSTER_COUNT is required}"
      amw_clusters_per_workspace="${AKS_AMW_CLUSTERS_PER_WORKSPACE:-1}"
      amw_regional_workspace_limit="${AKS_AMW_REGIONAL_WORKSPACE_LIMIT:-100}"
      amw_max_active_time_series="${AKS_AMW_MAX_ACTIVE_TIME_SERIES:-1000000}"
      amw_max_events_per_minute="${AKS_AMW_MAX_EVENTS_PER_MINUTE:-1000000}"
      for name_value in \
        "CLUSTER_COUNT=$cluster_count" \
        "AKS_AMW_CLUSTERS_PER_WORKSPACE=$amw_clusters_per_workspace" \
        "AKS_AMW_REGIONAL_WORKSPACE_LIMIT=$amw_regional_workspace_limit" \
        "AKS_AMW_MAX_ACTIVE_TIME_SERIES=$amw_max_active_time_series" \
        "AKS_AMW_MAX_EVENTS_PER_MINUTE=$amw_max_events_per_minute"; do
        name="${name_value%%=*}"
        value="${name_value#*=}"
        if ! [[ "$value" =~ ^[1-9][0-9]*$ ]]; then
          echo "$name must be a positive integer, got '$value'." >&2
          exit 1
        fi
      done

      # ---- selected-subscription verification ----
      actual_subscription_id=$(az account show --query id -o tsv)
      if [[ "${actual_subscription_id,,}" != "${AZURE_SUBSCRIPTION_ID,,}" ]]; then
        echo "Expected Azure subscription ${AZURE_SUBSCRIPTION_ID}, got ${actual_subscription_id}" >&2
        exit 1
      fi

      # ---- preview feature registration state ----
      register_preview="${AKS_CONTROL_PLANE_METRICS_REGISTER_PREVIEW:-false}"
      feature_name="AzureMonitorMetricsControlPlanePreview"
      if [ "${register_preview,,}" = "true" ]; then
        echo "AKS_CONTROL_PLANE_METRICS_REGISTER_PREVIEW=true; configure-managed-prometheus.sh will register $feature_name if it is not already Registered. Skipping the hard Registered-state requirement in this preflight."
      else
        feature_state=$(az feature show \
          --namespace Microsoft.ContainerService \
          --name "$feature_name" \
          --query properties.state -o tsv 2>/dev/null || true)
        if [ "$feature_state" != "Registered" ]; then
          echo "##vso[task.logissue type=error;] AKS control-plane metrics preview feature $feature_name is ${feature_state:-unknown}, not Registered." >&2
          echo "Register it once with:" >&2
          echo "  az feature register --namespace Microsoft.ContainerService --name $feature_name" >&2
          echo "then re-register Microsoft.ContainerService, or set AKS_CONTROL_PLANE_METRICS_REGISTER_PREVIEW=true so the configure step registers it." >&2
          exit 1
        fi
        echo "Preview feature $feature_name is Registered."
      fi

      # ---- existing regional Azure Monitor accounts (AMWs), fetched once ----
      # Shared by the direct ARM metricsContainers probe below and the
      # regional workspace quota check further down, so this preflight makes
      # exactly one `az monitor account list` call regardless of which of
      # those checks end up needing it.
      amw_existing_accounts_json=$(az monitor account list --output json)
      amw_existing_regional_accounts_json=$(
        printf '%s' "$amw_existing_accounts_json" \
          | jq --arg region "$REGION" \
            '[.[] | select((.location // "" | ascii_downcase) == ($region | ascii_downcase))]'
      )
      amw_existing_regional_workspace_count=$(
        printf '%s' "$amw_existing_regional_accounts_json" | jq 'length'
      )

      # ---- Microsoft.Monitor/accounts/metricsContainers direct ARM verification ----
      # Only required when the requested ingestion limits exceed the 1,000,000
      # platform default -- that override is what deploys the metricsContainers
      # child resource (see configure-managed-prometheus.sh).
      #
      # `az provider show` does NOT enumerate metricsContainers as a nested
      # resourceType under Microsoft.Monitor/accounts (it only lists top-level
      # resource types), so it can never reliably confirm this preview surface
      # is actually usable -- it always reports "not exposed", a permanent
      # false failure. Instead, verify directly against ARM: find the first
      # existing Azure Monitor workspace (AMW) account in $REGION and GET its
      # `<id>/metricsContainers/default` child resource at the exact preview
      # api-version configure-managed-prometheus.sh will use. This makes a
      # real, authoritative call against the actual resource/api-version
      # combination instead of guessing from provider metadata.
      #
      # No resource is created by this probe. If no AMW exists yet in $REGION,
      # this capability genuinely cannot be probed until configure-managed-
      # prometheus.sh creates the first one -- that is logged as an
      # informational skip, not a false failure; the configure step performs
      # its own authoritative check once that first AMW exists.
      #
      # The probed AMW is arbitrary (the first one found regionally) and, at
      # the platform default of 1,000,000, may never have had a
      # metricsContainers/default child created for it -- so a
      # ResourceNotFound/404 on THAT CHILD is not proof the api-version/
      # feature is unsupported; it is only proof this particular AMW never
      # created one. That case is logged as informational/inconclusive and
      # this preflight continues (configure-time creation/verification
      # remains authoritative). Genuine unsupported-surface errors
      # (NoRegisteredProviderFound / InvalidApiVersion / UnsupportedApiVersion
      # / an unsupported resource type) and authorization/subscription errors
      # (AuthorizationFailed / Forbidden / subscription-scope failures) are
      # still fail-fast, as is any other unexpected error -- reported with a
      # sanitized, actionable message rather than the raw az CLI stderr.
      _sanitize_az_error() {
        # Single line, capped length, with GUIDs (subscription/tenant/
        # object ids) redacted so pipeline logs never surface those
        # verbatim from the underlying az CLI error.
        printf '%s' "$1" \
          | tr '\n' ' ' \
          | sed -E 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/[redacted-guid]/g' \
          | cut -c1-300
      }
      required_metrics_container_api_version="2025-05-03-preview"
      if [ "$amw_max_active_time_series" -gt 1000000 ] ||
         [ "$amw_max_events_per_minute" -gt 1000000 ]; then
        amw_probe_id=$(printf '%s' "$amw_existing_regional_accounts_json" | jq -r '.[0].id // empty')
        if [ -n "$amw_probe_id" ]; then
          amw_probe_rc=0
          amw_probe_stderr=$(az resource show \
              --ids "${amw_probe_id}/metricsContainers/default" \
              --api-version "$required_metrics_container_api_version" \
              -o none 2>&1) || amw_probe_rc=$?
          if [ "$amw_probe_rc" -eq 0 ]; then
            echo "Verified Microsoft.Monitor/accounts/metricsContainers api-version $required_metrics_container_api_version directly against existing AMW $amw_probe_id (required for max_active_time_series=$amw_max_active_time_series, max_events_per_minute=$amw_max_events_per_minute)."
          else
            case "$amw_probe_stderr" in
              *NoRegisteredProviderFound*|*InvalidApiVersion*|*UnsupportedApiVersion*|*"not supported"*|*ResourceTypeNotSupported*)
                echo "##vso[task.logissue type=error;] Requested Azure Monitor ingestion limits (max_active_time_series=$amw_max_active_time_series, max_events_per_minute=$amw_max_events_per_minute) exceed the 1,000,000 platform default and require Microsoft.Monitor/accounts/metricsContainers api-version $required_metrics_container_api_version, but direct ARM verification against existing AMW $amw_probe_id shows this subscription/region does not support that resource type/api-version: $(_sanitize_az_error "$amw_probe_stderr")" >&2
                exit 1
                ;;
              *AuthorizationFailed*|*Forbidden*|*SubscriptionNotFound*|*InvalidSubscriptionId*|*InvalidAuthenticationToken*)
                echo "##vso[task.logissue type=error;] Direct ARM verification of Microsoft.Monitor/accounts/metricsContainers against existing AMW $amw_probe_id failed due to an authorization/subscription error: $(_sanitize_az_error "$amw_probe_stderr"). Confirm the pipeline's service connection/identity has Reader access to $amw_probe_id and that the selected subscription is correct." >&2
                exit 1
                ;;
              *ResourceNotFound*|*NotFound*|*404*)
                echo "Direct ARM probe of Microsoft.Monitor/accounts/metricsContainers/default against existing AMW $amw_probe_id returned ResourceNotFound (informational, inconclusive): this specific AMW may never have had a metricsContainers/default child created (e.g. it was created at the 1,000,000 platform default). This does NOT indicate api-version $required_metrics_container_api_version or the metricsContainers resource type is unsupported for the subscription. Continuing without a hard failure here -- configure-managed-prometheus.sh performs the authoritative creation/verification check at configure time."
                ;;
              *)
                echo "##vso[task.logissue type=error;] Unexpected error while verifying Microsoft.Monitor/accounts/metricsContainers api-version $required_metrics_container_api_version against existing AMW $amw_probe_id: $(_sanitize_az_error "$amw_probe_stderr")" >&2
                exit 1
                ;;
            esac
          fi
        else
          echo "No existing Azure Monitor workspace found in $REGION yet; Microsoft.Monitor/accounts/metricsContainers api-version $required_metrics_container_api_version cannot be probed until configure-managed-prometheus.sh creates the first AMW. Continuing without a hard failure here -- the configure step performs its own authoritative check at creation time."
        fi
      fi

      # ---- regional Azure Monitor workspace (AMW) quota ----
      # desired = ceil(cluster_count / clusters_per_workspace). existing is
      # counted across every Microsoft.Monitor/accounts in $REGION in the
      # selected subscription (matches the real regional quota, which applies
      # regardless of resource name/prefix).
      amw_desired_workspace_count=$(( (cluster_count + amw_clusters_per_workspace - 1) / amw_clusters_per_workspace ))
      amw_rotation_enabled="${AKS_AMW_ROTATION_ENABLED:-false}"
      amw_name_prefix="${AKS_CONTROL_PLANE_AMW_NAME_PREFIX:-cmsh-scale-${REGION}-amw}"

      if [ "${amw_rotation_enabled,,}" = "true" ]; then
        # Rotation-enabled (e.g. n=2 full-telemetry): the actual generation
        # (base prefix vs a bounded ring of "-rN" alternates) is only
        # selected later at configure time, based on real-time per-
        # generation capacity -- see configure-managed-prometheus.sh. This
        # preflight cannot know which generation will be picked, so it
        # conservatively assumes every desired workspace is newly created on
        # top of whatever already exists regionally (an upper bound). This
        # can only make the check fail sooner/tighter, never let a run past
        # the real regional quota.
        amw_missing_workspace_count=$amw_desired_workspace_count
      else
        # Rotation-disabled (e.g. n=100): workspace naming is fully
        # deterministic from CLUSTER_COUNT / AKS_AMW_CLUSTERS_PER_WORKSPACE /
        # AKS_CONTROL_PLANE_AMW_NAME_PREFIX and matches
        # build_workspace_assignments() in configure-managed-prometheus.sh
        # exactly: clusters_per_workspace=1 -> "<prefix>-mesh-<i>" for i in
        # 1..cluster_count (cluster roles are "mesh-1".."mesh-N");
        # clusters_per_workspace>1 -> "<prefix>-shard-<NNN>" for NNN in
        # 001..ceil(cluster_count/clusters_per_workspace). Rather than
        # assuming every desired workspace is newly created, compute
        # precisely which target names are still MISSING from the region
        # and only count those toward the projected total -- this is what
        # lets an n=100 RERUN pass once the same base workspaces already
        # exist, while still catching a genuine quota overflow when target
        # names are still missing.
        amw_target_workspace_names=()
        if [ "$amw_clusters_per_workspace" -gt 1 ]; then
          for ((amw_i = 1; amw_i <= amw_desired_workspace_count; amw_i++)); do
            amw_target_workspace_names+=("$(printf '%s-shard-%03d' "$amw_name_prefix" "$amw_i")")
          done
        else
          for ((amw_i = 1; amw_i <= cluster_count; amw_i++)); do
            amw_target_workspace_names+=("${amw_name_prefix}-mesh-${amw_i}")
          done
        fi

        declare -A amw_existing_name_set=()
        while IFS= read -r amw_existing_name; do
          [ -n "$amw_existing_name" ] && amw_existing_name_set["$amw_existing_name"]=1
        done < <(printf '%s' "$amw_existing_regional_accounts_json" | jq -r '.[].name')

        amw_missing_workspace_count=0
        for amw_target_name in "${amw_target_workspace_names[@]}"; do
          if [ -z "${amw_existing_name_set[$amw_target_name]:-}" ]; then
            amw_missing_workspace_count=$((amw_missing_workspace_count + 1))
          fi
        done
      fi

      amw_projected_regional_workspace_count=$((
        amw_existing_regional_workspace_count + amw_missing_workspace_count
      ))
      echo "Managed-telemetry AMW preflight: subscription=$actual_subscription_id region=$REGION rotation_enabled=${amw_rotation_enabled,,}"
      echo "  cluster_count=$cluster_count clusters_per_workspace=$amw_clusters_per_workspace desired_workspaces=$amw_desired_workspace_count"
      echo "  existing regional Microsoft.Monitor/accounts=$amw_existing_regional_workspace_count missing_workspaces=$amw_missing_workspace_count projected_total=$amw_projected_regional_workspace_count limit=$amw_regional_workspace_limit"
      if [ "$amw_projected_regional_workspace_count" -gt "$amw_regional_workspace_limit" ]; then
        echo "##vso[task.logissue type=error;] Projected Azure Monitor regional workspace count ($amw_projected_regional_workspace_count = existing $amw_existing_regional_workspace_count + missing $amw_missing_workspace_count) in $REGION would exceed AKS_AMW_REGIONAL_WORKSPACE_LIMIT ($amw_regional_workspace_limit)." >&2
        exit 1
      fi
    displayName: "Preflight ClusterMesh managed-telemetry (control-plane metrics)"
    condition: and(startsWith(variables['SCENARIO_NAME'], 'clustermesh'),
                   eq(variables['AKS_CONTROL_PLANE_METRICS_ENABLED'], 'true'))
    env:
      REGION: ${{ parameters.region }}

  - script: |
      # Install the Azure Fleet preview CLI extension required by the
      # clustermesh-scale scenario. The Fleet ClusterMeshProfile API surface
      # is private-preview and only the bundled wheel exposes the
      # `az fleet clustermeshprofile` and `az fleet member create --labels`
      # commands invoked by terraform local-exec at provision time.
      #
      # The wheel is vendored in-repo at scenarios/perf-eval/clustermesh-scale/vendor/.
      set -euo pipefail
      whl="$(Pipeline.Workspace)/s/scenarios/perf-eval/$(SCENARIO_NAME)/vendor/fleet-2.0.4-py3-none-any.whl"
      if [ ! -f "$whl" ]; then
        echo "##vso[task.logissue type=error;] Vendored fleet wheel not found at $whl"
        exit 1
      fi
      az extension remove --name fleet --only-show-errors 2>/dev/null || true
      az extension add --source "$whl" --yes --only-show-errors
      az fleet --help >/dev/null
      az fleet clustermeshprofile --help >/dev/null
      echo "Fleet preview CLI installed from $whl"
    displayName: "Install Fleet preview CLI (clustermesh scenarios)"
    condition: and(startsWith(variables['SCENARIO_NAME'], 'clustermesh'), ne(variables['CLUSTERMESH_FLEET_ENABLED'], 'false'))

  - script: |
      # Install cilium-cli on the runner for richer ClusterMesh diagnostics.
      # `cilium clustermesh status --context <ctx>` reports per-remote-cluster
      # connection state, endpoint counts, and version skew — info that the
      # in-pod `cilium-dbg status` doesn't expose. Used by topology
      # validate-resources.yml on each cluster context.
      set -euo pipefail
      CILIUM_CLI_VERSION=v0.16.20
      CLI_ARCH=amd64
      curl -sSL --fail --remote-name-all \
        "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz"
      sudo tar xzvfC "cilium-linux-${CLI_ARCH}.tar.gz" /usr/local/bin
      rm "cilium-linux-${CLI_ARCH}.tar.gz"
      cilium version --client
    displayName: "Install cilium-cli (clustermesh scenarios)"
    condition: startsWith(variables['SCENARIO_NAME'], 'clustermesh')

  - script: |
      if [ -n "${TEST_MODULES_DIR}" ]; then
        test_modules_directory=$(Pipeline.Workspace)/s/${TEST_MODULES_DIR}
      else
        test_modules_directory=$(Pipeline.Workspace)/s/modules/bash
      fi
      echo "Script modules directory: $test_modules_directory"
      echo "##vso[task.setvariable variable=TEST_MODULES_DIR]$test_modules_directory"
    displayName: "Set Script Module Directory"
    env:
      TEST_MODULES_DIR: ${{ parameters.test_modules_dir }}

  - ${{ if eq(parameters.ssh_key_enabled, true) }}:
      - template: /steps/ssh/setup-key.yml
        parameters:
          cloud: ${{ parameters.cloud }}
