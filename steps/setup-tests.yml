parameters:
  - name: cloud
    type: string
  - name: region
    type: string
  - name: test_modules_dir
    type: string
    default: ""
  - name: run_id
    type: string
    default: ""
  - name: retry_attempt_count
    type: number
    default: 3
  - name: credential_type
    type: string
  - name: ssh_key_enabled
    type: boolean

steps:
  - template: /steps/set-run-id.yml
    parameters:
      run_id: ${{ parameters.run_id }}

  - script: |
      job_start_epoch=$(date +%s)
      echo "ClusterMesh job start epoch: $job_start_epoch"
      echo "##vso[task.setvariable variable=CLUSTERMESH_JOB_START_EPOCH]$job_start_epoch"
    displayName: "Record ClusterMesh job start"
    condition: startsWith(variables['SCENARIO_NAME'], 'clustermesh')

  - script: |
      run_url="$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=logs&j=$(System.JobId)"
      echo "Run URL: $run_url"
      echo "##vso[task.setvariable variable=RUN_URL]$run_url"

      code_url="$(Build.Repository.Uri)/commit/$(Build.SourceVersion)"
      echo "Code URL: $code_url"
      echo "##vso[task.setvariable variable=CODE_URL]$code_url"
    displayName: "Set Run URL & Code URL"

  - script: |
      test_results_directory=$(Pipeline.Workspace)/s/$(RUN_ID)
      mkdir -p $test_results_directory
      echo "Test Results directory: $test_results_directory"
      echo "##vso[task.setvariable variable=TEST_RESULTS_DIR]$test_results_directory"

      test_results_file=$test_results_directory/results.json

      echo "Test Results file: $test_results_file"
      echo "##vso[task.setvariable variable=TEST_RESULTS_FILE]$test_results_file"
    displayName: "Set Test Results Directory"

  - script: |
      python3 --version && pip3 --version
      jq --version
      kubectl version --client
      az version
      aws --version
      helm version
    displayName: "Check Dependencies"

  - script: |
      set -e
      echo "Install Python dependencies"
      # Constrain pip to versions below 24 due to compatibility issues with some packages and breaking changes introduced in pip 24.
      pip3 install --upgrade "pip<24"
      pip3 install -r $(Pipeline.Workspace)/s/modules/python/requirements.txt

      echo "Install Ubuntu packages"
      # Hosted/shared agents can have an automatic package operation in flight.
      # Wait on dpkg's lock instead of failing an otherwise healthy long run.
      configured=false
      for attempt in $(seq 1 60); do
        if sudo dpkg --configure -a; then
          configured=true
          break
        fi
        echo "dpkg is busy (attempt $attempt/60); retrying in 5s..."
        sleep 5
      done
      if [ "$configured" != "true" ]; then
        echo "Timed out waiting for dpkg configuration lock." >&2
        exit 1
      fi
      sudo apt-get -o DPkg::Lock::Timeout=300 update
      sudo apt-get -o DPkg::Lock::Timeout=300 -y install bc netcat
    displayName: "Install Dependencies"

  - template: /steps/cloud/${{ parameters.cloud }}/login.yml
    parameters:
      region: ${{ parameters.region }}
      credential_type: ${{ parameters.credential_type }}

  - script: |
      set -euo pipefail

      family_name="${CLUSTERMESH_VM_FAMILY_QUOTA_NAME:?CLUSTERMESH_VM_FAMILY_QUOTA_NAME is required}"
      required="${CLUSTERMESH_REQUIRED_FAMILY_VCPUS:?CLUSTERMESH_REQUIRED_FAMILY_VCPUS is required}"
      headroom="${CLUSTERMESH_QUOTA_HEADROOM_VCPUS:-0}"
      for value in "$required" "$headroom"; do
        if ! [[ "$value" =~ ^[0-9]+$ ]]; then
          echo "ClusterMesh quota values must be non-negative integers: required=$required headroom=$headroom" >&2
          exit 1
        fi
      done

      actual_subscription_id=$(az account show --query id -o tsv)
      if [[ "${actual_subscription_id,,}" != "${AZURE_SUBSCRIPTION_ID,,}" ]]; then
        echo "Expected Azure subscription ${AZURE_SUBSCRIPTION_ID}, got ${actual_subscription_id}" >&2
        exit 1
      fi

      usage=$(az vm list-usage --location "$REGION" -o json)
      family=$(echo "$usage" | jq -c --arg name "$family_name" \
        '[.[] | select(.name.value == $name)][0] // empty')
      regional=$(echo "$usage" | jq -c \
        '[.[] | select(.name.value == "cores")][0] // empty')
      if [ -z "$family" ] || [ -z "$regional" ]; then
        echo "Unable to resolve VM quota usage for family=$family_name or regional cores in $REGION." >&2
        exit 1
      fi

      family_current=$(echo "$family" | jq -r '.currentValue')
      family_limit=$(echo "$family" | jq -r '.limit')
      regional_current=$(echo "$regional" | jq -r '.currentValue')
      regional_limit=$(echo "$regional" | jq -r '.limit')
      required_with_headroom=$(( required + headroom ))
      family_available=$(( family_limit - family_current ))
      regional_available=$(( regional_limit - regional_current ))

      echo "ClusterMesh quota preflight: subscription=$actual_subscription_id region=$REGION"
      echo "  family=$family_name current=$family_current limit=$family_limit available=$family_available"
      echo "  regional cores current=$regional_current limit=$regional_limit available=$regional_available"
      echo "  run requirement=$required vCPU + reserved headroom=$headroom vCPU"
      if [ "$family_available" -lt "$required_with_headroom" ]; then
        echo "Insufficient $family_name quota: need $required_with_headroom available vCPU, have $family_available." >&2
        exit 1
      fi
      if [ "$regional_available" -lt "$required_with_headroom" ]; then
        echo "Insufficient regional core quota: need $required_with_headroom available vCPU, have $regional_available." >&2
        exit 1
      fi
    displayName: "Preflight ClusterMesh VM quota"
    condition: and(startsWith(variables['SCENARIO_NAME'], 'clustermesh'),
                   eq(variables['CLUSTERMESH_QUOTA_PREFLIGHT_ENABLED'], 'true'))
    env:
      REGION: ${{ parameters.region }}

  - script: |
      # Install the Azure Fleet preview CLI extension required by the
      # clustermesh-scale scenario. The Fleet ClusterMeshProfile API surface
      # is private-preview and only the bundled wheel exposes the
      # `az fleet clustermeshprofile` and `az fleet member create --labels`
      # commands invoked by terraform local-exec at provision time.
      #
      # The wheel is vendored in-repo at scenarios/perf-eval/clustermesh-scale/vendor/.
      set -euo pipefail
      whl="$(Pipeline.Workspace)/s/scenarios/perf-eval/$(SCENARIO_NAME)/vendor/fleet-2.0.4-py3-none-any.whl"
      if [ ! -f "$whl" ]; then
        echo "##vso[task.logissue type=error;] Vendored fleet wheel not found at $whl"
        exit 1
      fi
      az extension remove --name fleet --only-show-errors 2>/dev/null || true
      az extension add --source "$whl" --yes --only-show-errors
      az fleet --help >/dev/null
      az fleet clustermeshprofile --help >/dev/null
      echo "Fleet preview CLI installed from $whl"
    displayName: "Install Fleet preview CLI (clustermesh scenarios)"
    condition: and(startsWith(variables['SCENARIO_NAME'], 'clustermesh'), ne(variables['CLUSTERMESH_FLEET_ENABLED'], 'false'))

  - script: |
      # Install cilium-cli on the runner for richer ClusterMesh diagnostics.
      # `cilium clustermesh status --context <ctx>` reports per-remote-cluster
      # connection state, endpoint counts, and version skew — info that the
      # in-pod `cilium-dbg status` doesn't expose. Used by topology
      # validate-resources.yml on each cluster context.
      set -euo pipefail
      CILIUM_CLI_VERSION=v0.16.20
      CLI_ARCH=amd64
      curl -sSL --fail --remote-name-all \
        "https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz"
      sudo tar xzvfC "cilium-linux-${CLI_ARCH}.tar.gz" /usr/local/bin
      rm "cilium-linux-${CLI_ARCH}.tar.gz"
      cilium version --client
    displayName: "Install cilium-cli (clustermesh scenarios)"
    condition: startsWith(variables['SCENARIO_NAME'], 'clustermesh')

  - script: |
      if [ -n "${TEST_MODULES_DIR}" ]; then
        test_modules_directory=$(Pipeline.Workspace)/s/${TEST_MODULES_DIR}
      else
        test_modules_directory=$(Pipeline.Workspace)/s/modules/bash
      fi
      echo "Script modules directory: $test_modules_directory"
      echo "##vso[task.setvariable variable=TEST_MODULES_DIR]$test_modules_directory"
    displayName: "Set Script Module Directory"
    env:
      TEST_MODULES_DIR: ${{ parameters.test_modules_dir }}

  - ${{ if eq(parameters.ssh_key_enabled, true) }}:
      - template: /steps/ssh/setup-key.yml
        parameters:
          cloud: ${{ parameters.cloud }}
