parameters:
- name: cloud
  type: string
- name: regions
  type: object
- name: terraform_modules_dir
  type: string
  default: ''
- name: terraform_input_file_mapping
  type: object
- name: terraform_user_data_path
  type: string
  default: ''
- name: terraform_arguments
  type: string
  default: ''
- name: terraform_input_varibles
  type: object
  default: {}
- name: retry_attempt_count
  type: number
  default: 3
- name: preserve_state_on_apply_failure
  type: string
  default: "false"
- name: debug_preserve
  type: string
  default: "false"

steps:
- template: /steps/terraform/set-working-directory.yml
  parameters:
    cloud: ${{ parameters.cloud }}
    modules_dir: ${{ parameters.terraform_modules_dir }}

- template: /steps/terraform/set-input-file.yml
  parameters:
    cloud: ${{ parameters.cloud }}
    regions: ${{ parameters.regions }}
    input_file_mapping: ${{ parameters.terraform_input_file_mapping }}

- template: /steps/terraform/set-user-data-path.yml
  parameters:
    user_data_path: ${{ parameters.terraform_user_data_path }}

- template: /steps/terraform/set-input-variables-${{ parameters.cloud }}.yml@self
  parameters:
    cloud: ${{ parameters.cloud }}
    regions: ${{ parameters.regions }}
    input_variables: ${{ parameters.terraform_input_varibles }}

- script: |
    set -euo pipefail
    fail_provision() {
      echo "##vso[task.logissue type=error;] $1"
      echo "##vso[task.setvariable variable=SKIP_RESOURCE_MANAGEMENT]true"
      exit 1
    }
    parse_nonnegative_integer() {
      local output_name="$1"
      local input_name="$2"
      local raw_value="$3"
      local maximum="$4"
      if ! [[ "$raw_value" =~ ^(0|[1-9][0-9]*)$ ]]; then
        fail_provision \
          "$input_name must be a canonical non-negative integer, got '$raw_value'."
      fi
      if [ "${#raw_value}" -gt "${#maximum}" ] || {
        [ "${#raw_value}" -eq "${#maximum}" ] &&
          [[ "$raw_value" > "$maximum" ]]
      }; then
        fail_provision "$input_name exceeds the supported maximum $maximum."
      fi
      printf -v "$output_name" '%d' "$raw_value"
    }
    terraform_input_file=$(echo $TERRAFORM_REGIONAL_CONFIG | jq -r --arg region "$region" '.[$region].TERRAFORM_INPUT_FILE')
    terraform_input_sha256=$(sha256sum "$terraform_input_file" | awk '{print $1}')
    echo "Terraform input SHA256: $terraform_input_sha256"
    echo "##vso[task.setvariable variable=CLUSTERMESH_DEBUG_TFVARS_SHA256]$terraform_input_sha256"
    deletion_delay_value=$(grep -E '^[[:space:]]*deletion_delay[[:space:]]*=' "$terraform_input_file" 2>/dev/null | awk -F'=' '{gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}' || true)
    deletion_delay_pattern='^"([1-9][0-9]*)h"([[:space:]]*(#|//).*)?$'
    if [ -n "$deletion_delay_value" ]; then
      if [[ "$deletion_delay_value" =~ $deletion_delay_pattern ]]; then
        parse_nonnegative_integer deletion_delay \
          deletion_delay "${BASH_REMATCH[1]}" 596523
      else
        fail_provision \
          "Invalid deletion_delay in $terraform_input_file: $deletion_delay_value"
      fi
      echo "Deletion Delay: $deletion_delay hr"

      # Matrix variables are automatically exported to task environments by ADO.
      # A long share-infra suite must never outlive the resource-group janitor
      # lease. Reserve another four hours for provisioning, telemetry, destroy,
      # and post-failure inspection beyond the scenario suite's own budget.
      parse_nonnegative_integer suite_budget_seconds \
        SUITE_TOTAL_BUDGET_SECONDS "${SUITE_TOTAL_BUDGET_SECONDS:-0}" 2147483647
      parse_nonnegative_integer lease_buffer_seconds \
        RESOURCE_LEASE_BUFFER_SECONDS \
        "${RESOURCE_LEASE_BUFFER_SECONDS:-14400}" 2147483647
      parse_nonnegative_integer job_timeout_minutes \
        CLUSTERMESH_JOB_TIMEOUT_MINUTES \
        "${CLUSTERMESH_JOB_TIMEOUT_MINUTES:-0}" 35790
      parse_nonnegative_integer job_cancel_timeout_minutes \
        CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES \
        "${CLUSTERMESH_JOB_CANCEL_TIMEOUT_MINUTES:-5}" 35790
      deletion_delay_seconds=$((deletion_delay * 3600))
      suite_lease_seconds=$((suite_budget_seconds + lease_buffer_seconds))
      required_lease_seconds=$suite_lease_seconds
      job_envelope_seconds=0
      if [ "$suite_budget_seconds" -gt 0 ]; then
        if [ "$job_timeout_minutes" -eq 0 ]; then
          fail_provision \
            "Budgeted ClusterMesh suites require a finite job timeout for resource-lease validation."
        fi
        job_envelope_seconds=$((
          (job_timeout_minutes + job_cancel_timeout_minutes) * 60
        ))
        if [ "$job_envelope_seconds" -gt "$required_lease_seconds" ]; then
          required_lease_seconds=$job_envelope_seconds
        fi
      fi
      if [ "$suite_budget_seconds" -gt 0 ] &&
         [ "$deletion_delay_seconds" -lt "$required_lease_seconds" ]; then
        fail_provision \
          "Resource lease is too short: deletion_delay=${deletion_delay}h (${deletion_delay_seconds}s), suite_with_buffer=${suite_lease_seconds}s, job_with_cancel=${job_envelope_seconds}s, required=${required_lease_seconds}s. Increase deletion_delay before provisioning."
      fi

      deletion_due_time=$(date -u -d "+${deletion_delay} hour" +'%Y-%m-%dT%H:%M:%SZ')
      echo "Deletion Due Time: $deletion_due_time"
      echo "##vso[task.setvariable variable=DELETION_DUE_TIME]$deletion_due_time"
    elif [ "$cloud" != "gcp" ]; then
      fail_provision "Missing deletion_delay in $terraform_input_file for cloud=$cloud"
    else
      echo "No deletion_delay in $terraform_input_file; skipping lease calculation for GCP."
    fi

    owner=$(grep "owner" "$terraform_input_file" 2>/dev/null | awk -F'=' '{gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2}' | sed 's/^"//;s/"$//' || true)
    if [ -z "$owner" ]; then
      fail_provision "Missing owner in $terraform_input_file"
    fi
    echo "Owner: $owner"
    echo "##vso[task.setvariable variable=OWNER]$owner"
  displayName: "Validate Resource Lease and Get Owner"
  condition: ne(variables['SKIP_RESOURCE_MANAGEMENT'], 'true')
  env:
    cloud: ${{ parameters.cloud }}
    region: ${{ parameters.regions[0] }}

- script: |
    set -eu
    echo "Create resource group $RUN_ID in region $region"
    az group create --name $RUN_ID --location $region \
      --tags "run_id=$RUN_ID" "scenario=${SCENARIO_TYPE}-${SCENARIO_NAME}" "owner=${OWNER}" "creation_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "deletion_due_time=${DELETION_DUE_TIME}" "SkipAKSCluster=1" "SkipASB_Audit=true" "clustermesh_debug_preserved=${CLUSTERMESH_DEBUG_PRESERVE:-false}" "clustermesh_debug_source_version=${BUILD_SOURCEVERSION:-unknown}" "clustermesh_debug_tfvars_sha256=${CLUSTERMESH_DEBUG_TFVARS_SHA256:-unknown}" "clustermesh_debug_expected_clusters=${CLUSTER_COUNT:-unknown}"
  displayName: "Create Resource Group"
  condition: and(succeeded(), ${{ eq(parameters.cloud, 'azure') }}, ne(variables['SKIP_RESOURCE_MANAGEMENT'], 'true'))
  env:
    region: ${{ parameters.regions[0] }}
    CLUSTERMESH_DEBUG_PRESERVE: ${{ parameters.debug_preserve }}
    BUILD_SOURCEVERSION: $(Build.SourceVersion)
    CLUSTER_COUNT: $(CLUSTER_COUNT)

- template: /steps/terraform/run-command.yml
  parameters:
    command: version
    retry_attempt_count: ${{ parameters.retry_attempt_count }}

- template: /steps/terraform/run-command.yml
  parameters:
    command: init
    retry_attempt_count: ${{ parameters.retry_attempt_count }}

- template: /steps/terraform/run-command.yml
  parameters:
    command: apply
    arguments: ${{ parameters.terraform_arguments }}
    regions: ${{ parameters.regions }}
    cloud: ${{ parameters.cloud }}
    retry_attempt_count: ${{ parameters.retry_attempt_count }}
    preserve_state_on_apply_failure: ${{ parameters.preserve_state_on_apply_failure }}
