apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web-{{NODE_POOL_NAME}}
spec:
  selector:
    matchLabels:
      app: nginx
  serviceName: nginx
  replicas: {{STATEFULSET_REPLICAS}}
  minReadySeconds: 10
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app: nginx
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: nginx
          image: mcr.microsoft.com/oss/nginx/nginx:1.15.5-alpine
          ports:
            - containerPort: 80
              name: web
          volumeMounts:
            - name: www
              mountPath: /usr/share/nginx/html
      nodeSelector: {{NODE_SELECTOR}}
  volumeClaimTemplates:
    - metadata:
        name: www
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 5Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
