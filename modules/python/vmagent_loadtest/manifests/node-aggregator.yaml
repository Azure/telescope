# node-aggregator — real, unmodified Prometheus running as a DaemonSet on
# DP nodes, prototype for pre-filtering/combining the 6 real-target scrapes
# (kubelet, cadvisor, kube-proxy, azure-cns, node-exporter, node-runtime)
# node-locally instead of vmagent scraping each of them individually through
# konnectivity. Central vmagent then scrapes ONE combined endpoint per node
# via this Prometheus's real /federate -- vmagent itself is push-only and
# has no equivalent pull/federation capability of its own.
#
# hostNetwork: true so it can reach the node's real kubelet/cadvisor/etc. on
# localhost, exactly like a genuine node-level daemon would.
#
# Template variables:
#   __NAMESPACE__            — test namespace
#   __NODE_AGGREGATOR_IMAGE__ — Prometheus image
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-aggregator
  namespace: __NAMESPACE__
---
# kubelet-api-admin: nodes/proxy, nodes/metrics -- same access setup_dp_access()
# grants kubelet-scraper, needed here too since this pod scrapes the node's
# own kubelet/cadvisor directly.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-aggregator-kubelet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kubelet-api-admin
subjects:
  - kind: ServiceAccount
    name: node-aggregator
    namespace: __NAMESPACE__
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-aggregator-config
  namespace: __NAMESPACE__
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s

    scrape_configs:
      # All 6 targets reached via localhost (hostNetwork) -- no konnectivity
      # tunnel, no vmagent-proxy sidecar needed for the local hop.
      - job_name: kubelet
        scheme: https
        metrics_path: /metrics
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets: ["localhost:10250"]

      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        static_configs:
          - targets: ["localhost:10250"]
        # Mirrors prod's cadvisor metric_relabel_configs (aks-operator
        # scale_scrape_configs.yaml), translated from vmagent's if:-based
        # MetricsQL selector syntax to standard Prometheus relabel_configs
        # since this DaemonSet runs real, unmodified Prometheus.
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_cpu_cfs_throttled_seconds_total|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total|container_cpu_load_average_10s|container_cpu_system_seconds_total|container_cpu_usage_seconds_total|container_cpu_user_seconds_total|container_memory_cache|container_memory_failcnt|container_memory_failures_total|container_memory_mapped_file|container_memory_rss|container_memory_swap|container_memory_usage_bytes|container_memory_working_set_bytes|container_oom_events_total|container_spec_memory_limit_bytes|container_spec_memory_reservation_limit_bytes|container_spec_memory_swap_limit_bytes|container_network_transmit_errors_total|container_network_receive_errors_total|container_network_transmit_packets_dropped_total|container_network_receive_packets_dropped_total|container_network_receive_packets_total|container_network_transmit_packets_total|container_fs_reads_bytes_total|container_fs_writes_bytes_total|container_scrape_error|container_tasks_state|go_memstats_heap_alloc_bytes|go_memstats_heap_idle_bytes|go_memstats_heap_inuse_bytes|go_memstats_heap_objects|go_memstats_alloc_bytes_total|go_gc_duration_seconds($|_count|_sum)|go_gc_pauses_seconds_(bucket|count|sum)|go_gc_cycles_automatic_gc_cycles_total|go_goroutines|go_threads|process_open_fds|process_cpu_seconds_total'
            action: keep
          - source_labels: [namespace]
            regex: '(aks-istio-ingress|aks-istio-system|app-routing-system|applink-system|eno-system|gatekeeper-system|kube-system|tigera-operator|^$)'
            action: keep
          - source_labels: [container]
            regex: '(alb-controller|app-monitoring-webhook|keda-admission-webhooks|keda-operator|keda-operator-metrics-apiserver|konnectivity-agent|updater|recommender|admission-controller|cilium-agent|istio-proxy|cilium-envoy|fqdn-policy|kube-proxy|retina|cns-container|blob|azuredisk|azurefile|coredns|gatekeeper-controller-container|workspace|kaito_workload|eviction-autoscaler|discovery|daemon|cluster-health-monitor)'
            target_label: cadvisor_keep_label
            replacement: keep_metric
          - source_labels: [pod]
            regex: '(alb-controller.*|app-monitoring-webhook.*|keda-admission-webhooks.*|keda-operator.*|keda-operator-metrics-apiserver.*|konnectivity-agent.*|vpa-updater.*|vpa-recommender.*|vpa-admission-controller.*|cilium-agent.*|ztunnel.*|acns-security-agent.*|acns-security-agent.*|kube-proxy.*|retina_basic.*|azure-cns.*|blob.*|csi-azuredisk-node.*|csi-azurefile-node.*|coredns.*|gatekeeper-controller.*|kaito-workspace.*|kaito_workload.*|eviction-autoscaler.*|istiod.*|kube-egress-gateway-daemon-manager.*|cluster-health-monitor.*)'
            target_label: cadvisor_keep_label
            replacement: keep_metric
          - source_labels: [cadvisor_keep_label]
            action: keep
            regex: (.*)
          - action: labeldrop
            regex: cadvisor_keep_label
          - action: labeldrop
            regex: id|image

      - job_name: kubeproxy
        metrics_path: /metrics
        static_configs:
          - targets: ["localhost:10249"]

      - job_name: azure-cns
        metrics_path: /metrics
        static_configs:
          - targets: ["localhost:10092"]

      - job_name: node-exporter
        metrics_path: /metrics
        static_configs:
          - targets: ["localhost:19100"]

      - job_name: node-runtime
        metrics_path: /v1/metrics
        static_configs:
          - targets: ["localhost:10257"]

      # Self-scrape -- its own CPU/memory footprint, otherwise invisible.
      # Excluded from the upstream /federate match[] (see deploy.py's
      # _REAL_TARGET_JOBS_AGGREGATOR) so it's readable via vmsingle for our
      # own resource-peak queries without inflating ingested row count with
      # ~800 internal Prometheus engine metrics per node.
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-aggregator
  namespace: __NAMESPACE__
  labels:
    app: node-aggregator
spec:
  selector:
    matchLabels:
      app: node-aggregator
  template:
    metadata:
      labels:
        app: node-aggregator
    spec:
      serviceAccountName: node-aggregator
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: prometheus
          image: __NODE_AGGREGATOR_IMAGE__
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/tmp/prometheus-data
            - --storage.tsdb.retention.time=15m
            - --web.listen-address=0.0.0.0:9090
          ports:
            - name: federate
              containerPort: 9090
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: node-aggregator-config
