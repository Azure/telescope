# VMAgent — deployed on the "control plane" cluster (same namespace as konnectivity-server)
# Scrapes targets on the dataplane via konnectivity-server proxy tunnel.
#
# Scrape configuration is in scrape-config.yaml (separate ConfigMap).
#
# vmagent-proxy sidecar runs the REAL Go binary (prometheus-extensions
# vmagent-proxy), matching prod's actual topology, not a harness simulation.
# It only handles HTTP-only proxied jobs via proxy_url: http://localhost:8080
# (kube-proxy, CNS, localdns, NPD, azuredisk-node) — HTTPS jobs (kubelet,
# cadvisor) bypass it entirely via direct CONNECT to konnectivity-server with
# proxy_tls_config, exactly like prod's scale_scrape_configs.yaml.
#
# Template variables:
#   __NAMESPACE__        — test namespace
#   __VMAGENT_IMAGE__    — VMAgent image (fixed to prod's pinned version, not overridable)
#   __VMAGENT_REPLICAS__ — vmagent shard count (native clustering members)
#   __VMAGENT_CPU_REQ__ / __VMAGENT_MEM_REQ__ — vmagent requests (per shard)
#   __VMAGENT_CPU_LIM__ / __VMAGENT_MEM_LIM__ — vmagent limits (per shard)
#   __VMAGENT_PROXY_IMAGE__    — vmagent-proxy image (real Go binary; fixed to prod's pinned version)
#   __PROXY_CPU_REQ__   / __PROXY_MEM_REQ__   — vmagent-proxy requests (per shard)
#   __PROXY_CPU_LIM__   / __PROXY_MEM_LIM__   — vmagent-proxy limits (per shard)
#   __VMAGENT_RATE_LIMIT__      — -remoteWrite.rateLimit bytes/sec (prod default since 2026-07-28: 2097152 = 2 MiB/s; prod's own 2k-node test found this still insufficient)
#   __VMAGENT_MAX_BLOCK_SIZE__  — -remoteWrite.maxBlockSize bytes (prod still pinned at 524288 = .5 MiB; 8388608 = 8 MiB VM stock default is the pending/unvalidated recommendation)
#   __VMAGENT_MAX_ROWS_PER_BLOCK__ — -remoteWrite.maxRowsPerBlock (prod doesn't set this; VM stock default 10000 — raise alongside maxBlockSize per VM guidance)
#   __VMAGENT_FLUSH_INTERVAL__  — -remoteWrite.flushInterval duration (prod default since 2026-07-28: 1s, was 30s)
#   __VMAGENT_QUEUES__          — -remoteWrite.queues count (prod does NOT set this flag — silently defaults to ~2xGOMAXPROCS; explicit 8-16 is the pending/unvalidated recommendation)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmagent
  namespace: __NAMESPACE__
  labels:
    app: vmagent
spec:
  replicas: __VMAGENT_REPLICAS__
  serviceName: vmagent
  selector:
    matchLabels:
      app: vmagent
  template:
    metadata:
      labels:
        app: vmagent
    spec:
      containers:
        # VMAgent — scrapes targets through the proxy sidecar.
        # Native clustering shards scrape targets across replicas: each pod
        # scrapes only the subset whose target hash maps to its member number
        # (derived from the StatefulSet pod ordinal), so N replicas each carry
        # ~1/N of the targets and run an independent proxy sidecar.
        - name: vmagent
          image: __VMAGENT_IMAGE__
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          args:
            - -promscrape.config=/config/prometheus.yml
            - -httpListenAddr=:8429
            - -promscrape.cluster.membersCount=__VMAGENT_REPLICAS__
            - -promscrape.cluster.memberNum=$(POD_NAME)
            - -promscrape.cluster.replicationFactor=1
            - -promscrape.suppressDuplicateScrapeTargetErrors
            - -promscrape.noStaleMarkers=true
            - -promscrape.config.strictParse=true
            - -promscrape.maxScrapeSize=33554432
            # Scale/memory tuning:
            #   dropOriginalLabels — drop pre-relabel label copies (mem savings)
            #   discovery.concurrency — faster SD convergence across shards
            #   memory.allowedPercent — GC against 80% of limit to absorb spikes
            #   remoteWrite.queues — more senders drain the WAL faster (anti-OOM)
            - -promscrape.dropOriginalLabels=true
            - -promscrape.discovery.concurrency=200
            - -memory.allowedPercent=80
            - -remoteWrite.url=http://vmsingle:8428/api/v1/write
            - -remoteWrite.label=cluster_id=__NAMESPACE__
            - -remoteWrite.showURL=true
            - -remoteWrite.flushInterval=__VMAGENT_FLUSH_INTERVAL__
            - -remoteWrite.sendTimeout=10s
            - -remoteWrite.maxDiskUsagePerURL=1073741824
            - -remoteWrite.rateLimit=__VMAGENT_RATE_LIMIT__
            - -remoteWrite.maxBlockSize=__VMAGENT_MAX_BLOCK_SIZE__
            - -remoteWrite.maxRowsPerBlock=__VMAGENT_MAX_ROWS_PER_BLOCK__
            - -remoteWrite.queues=__VMAGENT_QUEUES__
            - -remoteWrite.tmpDataPath=/tmp/vmagent-remotewrite-data
            - -remoteWrite.dropSamplesOnOverload=true
          ports:
            - name: http
              containerPort: 8429
          resources:
            requests:
              cpu: __VMAGENT_CPU_REQ__
              memory: __VMAGENT_MEM_REQ__
            limits:
              cpu: "__VMAGENT_CPU_LIM__"
              memory: __VMAGENT_MEM_LIM__
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: kubelet-token
              mountPath: /var/run/secrets/kubelet
              readOnly: true
            # konnectivity client certs — vmagent scrapes HTTPS targets
            # (real-kubelet/real-cadvisor) by issuing CONNECT directly to
            # konnectivity-server:8083 over mTLS via proxy_tls_config (mirrors
            # production; bypasses vmagent-proxy for the HTTPS path).
            - name: certs
              mountPath: /certs
              readOnly: true

        # vmagent-proxy sidecar — the real Go binary (prometheus-extensions),
        # not a harness simulation. Only handles HTTP-only proxied jobs via
        # proxy_url: http://localhost:8080; HTTPS jobs bypass it (see above).
        - name: vmagent-proxy
          image: __VMAGENT_PROXY_IMAGE__
          args:
            - --addr=:8080
            - --proxyAddr=konnectivity-server:8083
            - --caFile=/certs/ca.crt
            - --certFile=/certs/client.crt
            - --keyFile=/certs/client.key
            - --metricsAddr=:9090
            - --enableTunnelReuse=true
          ports:
            - name: proxy
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: __PROXY_CPU_REQ__
              memory: __PROXY_MEM_REQ__
            limits:
              cpu: "__PROXY_CPU_LIM__"
              memory: __PROXY_MEM_LIM__
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: vmagent-config
        - name: certs
          secret:
            secretName: konnectivity-certs
        - name: kubelet-token
          secret:
            secretName: kubelet-scrape-token
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: vmagent
  namespace: __NAMESPACE__
  labels:
    app: vmagent
spec:
  clusterIP: None
  selector:
    app: vmagent
  ports:
    - name: http
      port: 8429
      targetPort: 8429
