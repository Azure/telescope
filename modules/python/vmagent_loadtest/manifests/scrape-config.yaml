# VMAgent scrape configuration — deployed as ConfigMap "vmagent-config"
#
# Template variables:
#   __NAMESPACE__        — test namespace
#   __DP_API_SERVER__    — DP cluster API server URL (for kubernetes_sd_configs)
#   __TIER_BLOCK_REGEX__ — kept against node label loadtest.io/tier-block on
#                          every role:node job; selects in-scope fixed node
#                          blocks (default ".*" = unaffected by tier-blocks).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: __NAMESPACE__
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s

    scrape_configs:
      # ================================================================
      # Fake exporter jobs (role: pod in fake-exporter namespace)
      # These simulate N nodes by running N replicas of each role.
      # ================================================================
      - job_name: fake-nodeexp
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-nodeexp
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:19100
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-cadvisor
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-cadvisor
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:19101
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-kubelet
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-kubelet
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:10250
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-kubeproxy
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-kubeproxy
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:10249
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-cns
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-cns
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:10092
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-npd
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-npd
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:20257
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-runtime
        stream_parse: true
        proxy_url: "http://localhost:8080"
        metrics_path: /v1/metrics
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-runtime
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:10257
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-azurefile
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-azurefile
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:29615
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-ksm
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-ksm
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8080
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-csi-azuredisk
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-csi-azuredisk
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:29614
          - source_labels: [__address__]
            target_label: instance

      - job_name: fake-localdns
        stream_parse: true
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["fake-exporter"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: fake-localdns
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9253
          - source_labels: [__address__]
            target_label: instance

      # ================================================================
      # Real target jobs (role: node — kubelet, cadvisor, kube-proxy, azure-cns)
      # These scrape actual endpoints on DP cluster nodes via HTTPS/HTTP.
      # This job block is one of two variants picked in deploy.py: the 6
      # direct per-node-per-role jobs below (default), or a single
      # per-node-aggregator federate job (node_aggregator=True prototype).
      # ================================================================
__REAL_TARGET_JOBS__

      # ================================================================
      # DaemonSet targets (role: node — localdns, NPD)
      # These scrape daemon processes on each DP node via API server proxy.
      # Matches production scrape configs from KCL manifests.
      # ================================================================
      - job_name: localdns
        stream_parse: true
        scheme: https
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubelet/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_kubernetes_azure_com_localdns_state]
            action: keep
            regex: enabled
          - target_label: __address__
            replacement: "__DP_API_SERVER_HOST__"
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}:9253/proxy/metrics
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: instance
            replacement: $1:9253

      # node-problem-detector job intentionally removed: unlike localdns
      # (guarded by a node label present only when it's actually enabled),
      # this job's role:node SD generates one target per node unconditionally
      # with no such guard -- NPD isn't a stock AKS/terraform-provisioned
      # DaemonSet (it's deployed by AKS-RP's own reconciliation on real
      # control planes), so every one of those targets permanently fails,
      # inflating ScrapeTargetsTotal/deflating scrape_success_rate with
      # ~500 guaranteed-down phantom targets that were never going to work.
          - source_labels: [__meta_kubernetes_node_label_agentpool]
            target_label: nodepool

      - job_name: csi-azuredisk-node
        stream_parse: true
        proxy_url: "http://localhost:8080"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["kube-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: csi-azuredisk-node.*
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_kubernetes_azure_com_managedby, __meta_kubernetes_pod_label_app]
            regex: aks;csi-azuredisk.*
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: azuredisk
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_container_port_number]
            separator: ":"
            target_label: __address__
          - source_labels: [__address__]
            target_label: instance
        # Mirrors prod's csi-azuredisk-node metric_relabel_configs verbatim
        # (aks-operator scale_scrape_configs.yaml).
        metric_relabel_configs:
          - action: keep
            if: '{__name__=~"azuredisk_csi_driver_operation_duration_seconds_(bucket|count|sum)|azuredisk_csi_driver_operation_duration_seconds_labeled_(bucket|count|sum)|azuredisk_csi_driver_operations_total|go_memstats_heap_alloc_bytes|go_memstats_heap_idle_bytes|go_memstats_heap_inuse_bytes|go_memstats_heap_objects|go_memstats_alloc_bytes_total|go_gc_duration_seconds($|_count|_sum)|go_gc_pauses_seconds_(bucket|count|sum)|go_gc_cycles_automatic_gc_cycles_total|go_goroutines|go_threads|process_open_fds|process_cpu_seconds_total"}'

      - job_name: csi-blob-node
        stream_parse: true
        proxy_url: "http://localhost:8080"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["kube-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: blob
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_label_kubernetes_azure_com_managedby]
            regex: csi-blob-node.*;aks
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_container_port_number]
            separator: ":"
            target_label: __address__
          - source_labels: [__address__]
            target_label: instance
        # Mirrors prod's blob metric_relabel_configs verbatim (aks-operator
        # scale_scrape_configs.yaml, job_name: blob).
        metric_relabel_configs:
          - action: keep
            if: '{__name__=~"grpc_server_started_total|grpc_server_handled_total|grpc_server_msg_received_total|grpc_server_msg_sent_total|blob_csi_driver_operation_duration_seconds_(bucket|count|sum)|blob_csi_driver_operation_duration_seconds_labeled_(bucket|count|sum)|blob_csi_driver_operations_total|go_memstats_heap_alloc_bytes|go_memstats_heap_idle_bytes|go_memstats_heap_inuse_bytes|go_memstats_heap_objects|go_memstats_alloc_bytes_total|go_gc_duration_seconds($|_count|_sum)|go_gc_pauses_seconds_(bucket|count|sum)|go_gc_cycles_automatic_gc_cycles_total|go_goroutines|go_threads|process_open_fds|process_cpu_seconds_total"}'

      - job_name: csi-azurefile-node
        stream_parse: true
        proxy_url: "http://localhost:8080"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["kube-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: csi-azurefile-node.*
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_kubernetes_azure_com_managedby, __meta_kubernetes_pod_label_app]
            regex: aks;csi-azurefile.*
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: azurefile
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_container_port_number]
            separator: ":"
            target_label: __address__
          - source_labels: [__address__]
            target_label: instance
        # Mirrors prod's csi-azurefile-node metric_relabel_configs verbatim
        # (aks-operator scale_scrape_configs.yaml).
        metric_relabel_configs:
          - action: keep
            if: '{__name__=~"grpc_server_started_total|grpc_server_handled_total|grpc_server_msg_received_total|grpc_server_msg_sent_total|cloudprovider_azure_api_request_throttled_count|cloudprovider_azure_api_request_ratelimited_count|cloudprovider_azure_api_request_errors|cloudprovider_azure_api_request_duration_seconds_(bucket|count|sum)|cloudprovider_azure_op_failure_count|cloudprovider_azure_op_duration_seconds_(bucket|count|sum)|azurefile_csi_driver_operation_duration_seconds_(bucket|count|sum)|azurefile_csi_driver_operation_duration_seconds_labeled_(bucket|count|sum)|azurefile_csi_driver_operations_total|arm_request_errors_counter_total|arm_request_rate_limit_counter_total|arm_request_throttle_counter_total|arm_request_duration_seconds_(bucket|count|sum)|go_memstats_heap_alloc_bytes|go_memstats_heap_idle_bytes|go_memstats_heap_inuse_bytes|go_memstats_heap_objects|go_memstats_alloc_bytes_total|go_gc_duration_seconds($|_count|_sum)|go_gc_pauses_seconds_(bucket|count|sum)|go_gc_cycles_automatic_gc_cycles_total|go_goroutines|go_threads|process_open_fds|process_cpu_seconds_total"}'

      # ---- kube-state-metrics (KSM) — pod restarts, OOMKills, etc. ----
      - job_name: kube-state-metrics
        stream_parse: true
        proxy_url: "http://localhost:8080"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["kube-system"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app__kubernetes__io__name]
            regex: kube-state-metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8080"
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8080
          - source_labels: [__address__]
            target_label: instance

      # ================================================================
      # Infrastructure self-monitoring jobs (local to CP, no proxy)
      # These scrape the control-plane infrastructure components directly.
      # ================================================================
      - job_name: konnectivity-server
        scrape_interval: 15s
        metrics_path: /metrics
        # Use DNS-SD against the headless service so EVERY server replica is
        # scraped individually. The regular Service load-balances to a single
        # pod per scrape, hiding N-1 replicas in multi-replica deployments.
        dns_sd_configs:
          - names: ["konnectivity-server-metrics"]
            type: A
            port: 8096

      - job_name: vmagent-self
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets: ["localhost:8429"]

      # vmagent-proxy sidecar (real Go binary) — tunnel-reuse/dial/active-connection
      # metrics, the direct signal for whether --enableTunnelReuse is actually working.
      # job_name matches prod's real job (aks-operator default_scrape_configs.yaml)
      # exactly, but WITHOUT prod's metric_relabel_configs keep-filter -- prod's
      # filter drops vmagent_proxy_active_connections/dials_total, the two metrics
      # that actually measure tunnel reuse; this harness keeps them so the ramp
      # can validate reuse, which prod currently cannot.
      - job_name: vmagent-proxy
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: vmsingle
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets: ["vmsingle:8428"]

      # ---- Konnectivity agent metrics (on DP cluster, needs proxy tunnel) ----
      - job_name: konnectivity-agent
        scrape_interval: 15s
        metrics_path: /metrics
        proxy_url: "http://localhost:8080"
        kubernetes_sd_configs:
          - role: pod
            api_server: "__DP_API_SERVER__"
            bearer_token_file: /var/run/secrets/kubelet/token
            tls_config:
              insecure_skip_verify: true
            namespaces:
              names: ["__NAMESPACE__"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: konnectivity-agent
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8094
          - source_labels: [__address__]
            target_label: instance
