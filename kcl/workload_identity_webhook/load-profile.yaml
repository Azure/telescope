version: 1
description: WI Pod CREATE exploratory benchmark - __RATE__ creates/sec for 10 minutes
specs:
  - rate: __RATE__
    duration: 600
    total: 0
    client: 600
    conns: 20
    contentType: json
    maxRetries: 0
    requests:
      - shares: 1
        postDel:
          group: ""
          version: v1
          resource: pods
          namespace: "__RUN_NAMESPACE__"
          deleteRatio: 0
          pod:
            labels:
              azure.workload.identity/use: "true"
              benchmark-run: "__PHASE_RUN_ID__"
            serviceAccountName: pod-benchmark
            schedulerName: kperf-admission-only
