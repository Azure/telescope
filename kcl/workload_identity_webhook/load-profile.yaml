version: 1
description: WI Pod CREATE exploratory benchmark - 400 creates/sec for 10 minutes
specs:
  - rate: 400
    duration: 600
    total: 0
    client: 600
    conns: 20
    contentType: json
    maxRetries: 0
    requests:
      - shares: 1
        postDel:
          group: ""
          version: v1
          resource: pods
          namespace: "__RUN_NAMESPACE__"
          deleteRatio: 0
          # PAYLOAD environment padding, not the complete submitted JSON size.
          payloadSize: 3650
          pod:
            labels:
              azure.workload.identity/use: "true"
            serviceAccountName: pod-benchmark
            schedulerName: kperf-admission-only
