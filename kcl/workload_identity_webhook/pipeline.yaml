name: Workload Identity Webhook Benchmark
pool: AKS-Telescope-Airlock
trigger: none
parameters:
- name: keep_cluster
  displayName: Keep cluster after benchmark (phase namespaces are deleted)
  type: boolean
  default: false
pr: none
jobs:
- job: benchmark
  displayName: 'Baseline Run: 50/100/150 RPS'
  timeoutInMinutes: 240
  cancelTimeoutInMinutes: 25
  variables:
    RUN_ID: wi-$(Build.BuildId)-$(System.JobAttempt)
    RESOURCE_GROUP: $(RUN_ID)
    CLUSTER: wi-webhook
    KUBECONFIG: $(Agent.TempDirectory)/$(RUN_ID).kubeconfig
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az account set --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
        az config set defaults.location="westus2"
        az account show
    displayName: Login to Azure
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |+
        set -exo pipefail
        az group create \
          --name "$(RESOURCE_GROUP)" \
          --location "westus2" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

    displayName: Create resource group in westus2 (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az monitor account create \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --resource-group "$(RESOURCE_GROUP)" \
          --name wi-benchmark-prometheus \
          --location "westus2"
    displayName: Create benchmark Prometheus workspace
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az extension add \
          --name aks-preview \
          --version 20.0.0b6 \
          --allow-preview true \
          --yes
        az aks create \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --resource-group "$(RESOURCE_GROUP)" \
          --name "$(CLUSTER)" \
          --location "westus2" \
          --kubernetes-version "1.36" \
          --dns-name-prefix "$(RUN_ID)" \
          --tier standard \
          --control-plane-scaling-size H2 \
          --enable-oidc-issuer \
          --enable-workload-identity \
          --enable-azure-monitor-metrics \
          --azure-monitor-workspace-resource-id "/subscriptions/b8ceb4e5-f05b-4562-a9f5-14acb1f24219/resourceGroups/$(RESOURCE_GROUP)/providers/Microsoft.Monitor/accounts/wi-benchmark-prometheus" \
          --generate-ssh-keys \
          --nodepool-name systempool \
          --node-count 3 \
          --node-vm-size Standard_D4_v4 \
          --max-pods 50 \
          --network-plugin azure \
          --network-plugin-mode overlay \
          --pod-cidr 10.64.0.0/10 \
          --service-cidr 10.0.0.0/16 \
          --dns-service-ip 10.0.0.10 \
          --outbound-type managedNATGateway \
          --nat-gateway-managed-outbound-ip-count 10 \
          --tags SkipAKSCluster=true \
          --yes
    displayName: Create H2 cluster with OIDC and workload identity
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: "set -exo pipefail\ncreate_node_pool() {\n  local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds\n  deadline=$(($(date +%s) + 600))\n  while :; do\n    attempt=$((attempt + 1))\n    if output=$(az aks nodepool add \"$@\" 2>&1); then\n      rc=0\n    else\n      rc=$?\n    fi\n    echo \"$output\"\n    if [ \"$rc\" -eq 0 ]; then\n      return 0\n    fi\n    if echo \"$output\" | grep -qiE \"OperationNotAllowed\"; then\n      now=$(date +%s)\n      if [ \"$now\" -ge \"$deadline\" ]; then\n        echo \"Retriable error persisted past 600s retry window ($attempt attempts); giving up.\"\n        return \"$rc\"\n      fi\n      remaining_retry_seconds=$((deadline - now))\n      echo \"Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window).\"\n      sleep \"$sleep_between\"\n    else\n      echo \"Non-retriable error (rc=$rc); giving up after attempt $attempt.\"\n      return \"$rc\"\n    fi\n  done\n}\n\n\ncreate_node_pool \\\n  --cluster-name \"$(CLUSTER)\" \\\n  --resource-group \"$(RESOURCE_GROUP)\" \\\n  --subscription \"b8ceb4e5-f05b-4562-a9f5-14acb1f24219\" \\\n  --name \"workerpool\" \\\n  --node-count 3 \\\n  --node-vm-size \"Standard_D2s_v5\" \\\n  --mode User \\\n  \n"
    displayName: Create node pool workerpool
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks get-credentials \
          --name "$(CLUSTER)" \
          --resource-group "$(RESOURCE_GROUP)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing \
          -f $(KUBECONFIG)
    displayName: Get credentials for $(CLUSTER)
  - script: |
      set -euo pipefail
      set -x

      temp_dir=$(mktemp -p /tmp -d kperfinstall.XXXX)
      docker rmi ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647 2>/dev/null || true
      docker pull ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647
      docker run --rm -v $temp_dir:/install-dir \
        ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647 bash -c "set -x; install /kperf /runkperf /install-dir"

      sudo install $temp_dir/kperf $temp_dir/runkperf /usr/local/bin
      rm -rf $temp_dir
      docker rmi ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647 2>/dev/null || true
    displayName: Install runkperf binary
  - bash: |
      set -exo pipefail
      TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
      echo "BENCHMARK_START_TIME: $TIMESTAMP"
      echo "##vso[task.setvariable variable=BENCHMARK_START_TIME]$TIMESTAMP"
    displayName: Record current time as BENCHMARK_START_TIME
  - bash: |
      set -euo pipefail
      namespace="$(RUN_ID)-r50"
      deleting=$(kubectl --request-timeout=60s get namespace "$namespace" --ignore-not-found -o jsonpath='{.metadata.deletionTimestamp}')
      if [ -n "$deleting" ]; then
        echo "Namespace $namespace is already terminating; cannot prepare this phase." >&2
        exit 1
      fi
      kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      kubectl create serviceaccount pod-benchmark --namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      # Use a fake client ID because benchmark Pods do not access Azure resources.
      kubectl --request-timeout=60s annotate serviceaccount pod-benchmark \
        --namespace "$namespace" \
        "azure.workload.identity/client-id=00000000-0000-4000-8000-000000000001" \
        --overwrite
    displayName: Prepare WI resources for 50/sec
  - bash: |
      set -euo pipefail
      profile="$(Agent.TempDirectory)/$(RUN_ID)-r50-load-profile.yaml"
      sed \
        -e 's/__RUN_NAMESPACE__/$(RUN_ID)-r50/g' \
        -e 's/__RATE__/50/g' \
        -e 's/__PHASE_RUN_ID__/$(RUN_ID)-r50/g' \
        "$(Build.SourcesDirectory)/kcl/workload_identity_webhook/load-profile.yaml" > "$profile"
      if grep -q '__[A-Z_]*__' "$profile"; then
        echo "Unresolved load-profile placeholders" >&2
        exit 1
      fi
    displayName: Prepare 50/sec load profile
  - script: |
      set -euo pipefail
      set -x

      kperf runner run \
        --config "$(Agent.TempDirectory)/$(RUN_ID)-r50-load-profile.yaml" \
        --kubeconfig "$(KUBECONFIG)"
    displayName: Run kperf at 50 CREATEs/sec
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      kubectl --request-timeout=60s delete namespace "$(RUN_ID)-r50" \
        --ignore-not-found=true \
        --wait=false
      echo "Namespace deletion requested for 50/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: always()
    displayName: Delete namespace from 50/sec run
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Starting five-minute pause after 50/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      sleep 300
      echo "Finished pause after 50/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: always()
    displayName: Pause 5 minutes after 50/sec
    timeoutInMinutes: 6
  - bash: |
      set -euo pipefail
      namespace="$(RUN_ID)-r100"
      deleting=$(kubectl --request-timeout=60s get namespace "$namespace" --ignore-not-found -o jsonpath='{.metadata.deletionTimestamp}')
      if [ -n "$deleting" ]; then
        echo "Namespace $namespace is already terminating; cannot prepare this phase." >&2
        exit 1
      fi
      kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      kubectl create serviceaccount pod-benchmark --namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      # Use a fake client ID because benchmark Pods do not access Azure resources.
      kubectl --request-timeout=60s annotate serviceaccount pod-benchmark \
        --namespace "$namespace" \
        "azure.workload.identity/client-id=00000000-0000-4000-8000-000000000001" \
        --overwrite
    displayName: Prepare WI resources for 100/sec
  - bash: |
      set -euo pipefail
      profile="$(Agent.TempDirectory)/$(RUN_ID)-r100-load-profile.yaml"
      sed \
        -e 's/__RUN_NAMESPACE__/$(RUN_ID)-r100/g' \
        -e 's/__RATE__/100/g' \
        -e 's/__PHASE_RUN_ID__/$(RUN_ID)-r100/g' \
        "$(Build.SourcesDirectory)/kcl/workload_identity_webhook/load-profile.yaml" > "$profile"
      if grep -q '__[A-Z_]*__' "$profile"; then
        echo "Unresolved load-profile placeholders" >&2
        exit 1
      fi
    displayName: Prepare 100/sec load profile
  - script: |
      set -euo pipefail
      set -x

      kperf runner run \
        --config "$(Agent.TempDirectory)/$(RUN_ID)-r100-load-profile.yaml" \
        --kubeconfig "$(KUBECONFIG)"
    displayName: Run kperf at 100 CREATEs/sec
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      kubectl --request-timeout=60s delete namespace "$(RUN_ID)-r100" \
        --ignore-not-found=true \
        --wait=false
      echo "Namespace deletion requested for 100/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: always()
    displayName: Delete namespace from 100/sec run
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Starting five-minute pause after 100/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      sleep 300
      echo "Finished pause after 100/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: always()
    displayName: Pause 5 minutes after 100/sec
    timeoutInMinutes: 6
  - bash: |
      set -euo pipefail
      namespace="$(RUN_ID)-r150"
      deleting=$(kubectl --request-timeout=60s get namespace "$namespace" --ignore-not-found -o jsonpath='{.metadata.deletionTimestamp}')
      if [ -n "$deleting" ]; then
        echo "Namespace $namespace is already terminating; cannot prepare this phase." >&2
        exit 1
      fi
      kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      kubectl create serviceaccount pod-benchmark --namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      # Use a fake client ID because benchmark Pods do not access Azure resources.
      kubectl --request-timeout=60s annotate serviceaccount pod-benchmark \
        --namespace "$namespace" \
        "azure.workload.identity/client-id=00000000-0000-4000-8000-000000000001" \
        --overwrite
    displayName: Prepare WI resources for 150/sec
  - bash: |
      set -euo pipefail
      profile="$(Agent.TempDirectory)/$(RUN_ID)-r150-load-profile.yaml"
      sed \
        -e 's/__RUN_NAMESPACE__/$(RUN_ID)-r150/g' \
        -e 's/__RATE__/150/g' \
        -e 's/__PHASE_RUN_ID__/$(RUN_ID)-r150/g' \
        "$(Build.SourcesDirectory)/kcl/workload_identity_webhook/load-profile.yaml" > "$profile"
      if grep -q '__[A-Z_]*__' "$profile"; then
        echo "Unresolved load-profile placeholders" >&2
        exit 1
      fi
    displayName: Prepare 150/sec load profile
  - script: |
      set -euo pipefail
      set -x

      kperf runner run \
        --config "$(Agent.TempDirectory)/$(RUN_ID)-r150-load-profile.yaml" \
        --kubeconfig "$(KUBECONFIG)"
    displayName: Run kperf at 150 CREATEs/sec
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      kubectl --request-timeout=60s delete namespace "$(RUN_ID)-r150" \
        --ignore-not-found=true \
        --wait=false
      echo "Namespace deletion requested for 150/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: always()
    displayName: Delete namespace from 150/sec run
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Starting five-minute pause after 150/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      sleep 300
      echo "Finished pause after 150/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: always()
    displayName: Pause 5 minutes after 150/sec
    timeoutInMinutes: 6
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        RESOURCE_UID=$(az aks show \
          --resource-group "$(RESOURCE_GROUP)" \
          --name "$(CLUSTER)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --query "resourceUid" -o tsv)

        if [ -z "$RESOURCE_UID" ]; then
          echo "##[warning]Failed to fetch resourceUid, skipping ASI URL"
          exit 1
        fi

        END_TIME=""
        if [ -z "$END_TIME" ]; then
          END_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
        fi

        FROM_ENCODED=$(echo "$(BENCHMARK_START_TIME)" | sed 's/:/%3A/g')
        TO_ENCODED=$(echo "$END_TIME" | sed 's/:/%3A/g')

        echo "============================================"
        echo "ASI Managed Cluster Dashboard URL:"
        echo "https://asi.azure.ms/services/AKS/pages/Managed%20Cluster?clusterVersion=$RESOURCE_UID&globalFrom=$FROM_ENCODED&globalTo=$TO_ENCODED"
        echo ""
        echo "ASI API Server Analyzer URL:"
        echo "https://asi.azure.ms/services/AKS/pages/API%20Server%20Analyzer?clusterVersion=$RESOURCE_UID&globalFrom=$FROM_ENCODED&globalTo=$TO_ENCODED"
        echo "============================================"
    condition: always()
    continueOnError: true
    displayName: Print ASI dashboard URL
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az group delete --name "$(RESOURCE_GROUP)" --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --yes
    condition: and(always(), not(${{ parameters.keep_cluster }}))
    displayName: Delete resource group (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
