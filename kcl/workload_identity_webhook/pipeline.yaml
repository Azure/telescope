name: Workload Identity Webhook Benchmark
pool: AKS-Telescope-Airlock
trigger: none
parameters:
- name: existing_resource_group
  displayName: Existing resource group (none creates a cluster)
  type: string
  default: none
- name: existing_cluster
  displayName: Existing cluster name (provide together with resource group)
  type: string
  default: none
- name: keep_cluster
  displayName: Keep cluster after benchmark (phase Pods are deleted)
  type: boolean
  default: false
pr: none
jobs:
- job: benchmark
  displayName: Run WI webhook traffic on a new or existing cluster
  timeoutInMinutes: 240
  cancelTimeoutInMinutes: 25
  variables:
    RUN_ID: wi-$(Build.BuildId)-$(System.JobAttempt)
    RESOURCE_GROUP_CREATED: 'false'
    USE_EXISTING_CLUSTER: unresolved
    KUBECONFIG: $(Agent.TempDirectory)/$(RUN_ID).kubeconfig
    PHASE_50_STARTED: 'false'
    PHASE_100_STARTED: 'false'
    PHASE_200_STARTED: 'false'
  steps:
  - bash: |
      set -euo pipefail
      resource_group="$PARAM_EXISTING_RESOURCE_GROUP"
      cluster="$PARAM_EXISTING_CLUSTER"
      if [ "$resource_group" = "none" ]; then resource_group=""; fi
      if [ "$cluster" = "none" ]; then cluster=""; fi
      if { [ -z "$resource_group" ] && [ -n "$cluster" ]; } ||
         { [ -n "$resource_group" ] && [ -z "$cluster" ]; }; then
        echo "existing_resource_group and existing_cluster must be provided together." >&2
        exit 1
      fi
      if [ -n "$cluster" ]; then
        use_existing=true
      else
        use_existing=false
        resource_group="$RUN_ID"
        cluster=wi-webhook
      fi
      # Reused resource groups also name the existing Kubernetes namespace.
      if ! [[ "$resource_group" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]] ||
         [ "${#resource_group}" -gt 63 ]; then
        echo "The resource group must also be a valid Kubernetes namespace (lowercase DNS label, at most 63 characters)." >&2
        exit 1
      fi
      if ! [[ "$cluster" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]] ||
         [ "${#cluster}" -gt 63 ]; then
        echo "Invalid existing cluster name." >&2
        exit 1
      fi
      echo "Benchmark target: cluster=$cluster resource_group=$resource_group namespace=$resource_group existing=$use_existing"
      echo "##vso[task.setvariable variable=RESOURCE_GROUP]$resource_group"
      echo "##vso[task.setvariable variable=CLUSTER]$cluster"
      echo "##vso[task.setvariable variable=BENCHMARK_NAMESPACE]$resource_group"
      echo "##vso[task.setvariable variable=USE_EXISTING_CLUSTER]$use_existing"
    displayName: Resolve benchmark cluster
    env:
      PARAM_EXISTING_RESOURCE_GROUP: ${{ parameters.existing_resource_group }}
      PARAM_EXISTING_CLUSTER: ${{ parameters.existing_cluster }}
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az account set --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
        az config set defaults.location="westus2"
        az account show
    displayName: Login to Azure
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        exists=$(az group exists --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --name "$(RESOURCE_GROUP)")
        if [ "$exists" != "false" ]; then
          echo "Refusing to reuse an existing or unverified resource group: $(RESOURCE_GROUP)" >&2
          exit 1
        fi
    condition: and(succeeded(), eq(variables['USE_EXISTING_CLUSTER'], 'false'))
    displayName: Verify resource group does not already exist
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |+
        set -exo pipefail
        az group create \
          --name "$(RESOURCE_GROUP)" \
          --location "westus2" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

    condition: and(succeeded(), eq(variables['USE_EXISTING_CLUSTER'], 'false'))
    displayName: Create resource group in westus2 (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        echo "##vso[task.setvariable variable=RESOURCE_GROUP_CREATED]true"
        az extension add \
          --name aks-preview \
          --version 20.0.0b6 \
          --allow-preview true \
          --yes
        az aks create \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --resource-group "$(RESOURCE_GROUP)" \
          --name "$(CLUSTER)" \
          --location "westus2" \
          --kubernetes-version "1.36" \
          --dns-name-prefix "$(RUN_ID)" \
          --tier standard \
          --control-plane-scaling-size H2 \
          --enable-oidc-issuer \
          --enable-workload-identity \
          --enable-azure-monitor-metrics \
          --azure-monitor-workspace-resource-id "/subscriptions/b8ceb4e5-f05b-4562-a9f5-14acb1f24219/resourceGroups/wi-benchmark-monitoring/providers/Microsoft.Monitor/accounts/wi-benchmark-prometheus" \
          --generate-ssh-keys \
          --nodepool-name systempool \
          --node-count 3 \
          --node-vm-size Standard_D4_v4 \
          --max-pods 50 \
          --network-plugin azure \
          --network-plugin-mode overlay \
          --pod-cidr 10.64.0.0/10 \
          --service-cidr 10.0.0.0/16 \
          --dns-service-ip 10.0.0.10 \
          --outbound-type managedNATGateway \
          --nat-gateway-managed-outbound-ip-count 10 \
          --tags SkipAKSCluster=true \
          --yes
    condition: and(succeeded(), eq(variables['USE_EXISTING_CLUSTER'], 'false'))
    displayName: Create H2 cluster with OIDC and workload identity
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: "set -exo pipefail\ncreate_node_pool() {\n  local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds\n  deadline=$(($(date +%s) + 600))\n  while :; do\n    attempt=$((attempt + 1))\n    if output=$(az aks nodepool add \"$@\" 2>&1); then\n      rc=0\n    else\n      rc=$?\n    fi\n    echo \"$output\"\n    if [ \"$rc\" -eq 0 ]; then\n      return 0\n    fi\n    if echo \"$output\" | grep -qiE \"OperationNotAllowed\"; then\n      now=$(date +%s)\n      if [ \"$now\" -ge \"$deadline\" ]; then\n        echo \"Retriable error persisted past 600s retry window ($attempt attempts); giving up.\"\n        return \"$rc\"\n      fi\n      remaining_retry_seconds=$((deadline - now))\n      echo \"Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window).\"\n      sleep \"$sleep_between\"\n    else\n      echo \"Non-retriable error (rc=$rc); giving up after attempt $attempt.\"\n      return \"$rc\"\n    fi\n  done\n}\n\n\ncreate_node_pool \\\n  --cluster-name \"$(CLUSTER)\" \\\n  --resource-group \"$(RESOURCE_GROUP)\" \\\n  --subscription \"b8ceb4e5-f05b-4562-a9f5-14acb1f24219\" \\\n  --name \"workerpool\" \\\n  --node-count 3 \\\n  --node-vm-size \"Standard_D2s_v5\" \\\n  --mode User \\\n  \n"
    condition: and(succeeded(), eq(variables['USE_EXISTING_CLUSTER'], 'false'))
    displayName: Create node pool workerpool
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks get-credentials \
          --name "$(CLUSTER)" \
          --resource-group "$(RESOURCE_GROUP)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing \
          -f $(KUBECONFIG)
    displayName: Get credentials for $(CLUSTER)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set -u
        kubectl create namespace "$(BENCHMARK_NAMESPACE)" --dry-run=client -o yaml | kubectl apply -f -
        kubectl create serviceaccount pod-benchmark --namespace "$(BENCHMARK_NAMESPACE)" --dry-run=client -o yaml | kubectl apply -f -
        # Use a fake client ID because benchmark Pods do not access Azure resources.
        kubectl annotate serviceaccount pod-benchmark \
          --namespace "$(BENCHMARK_NAMESPACE)" \
          "azure.workload.identity/client-id=00000000-0000-4000-8000-000000000001" \
          --overwrite
    displayName: Prepare WI resources
  - script: |
      set -euo pipefail
      set -x

      temp_dir=$(mktemp -p /tmp -d kperfinstall.XXXX)
      docker rmi ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647 2>/dev/null || true
      docker pull ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647
      docker run --rm -v $temp_dir:/install-dir \
        ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647 bash -c "set -x; install /kperf /runkperf /install-dir"

      sudo install $temp_dir/kperf $temp_dir/runkperf /usr/local/bin
      rm -rf $temp_dir
      docker rmi ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647 2>/dev/null || true
    displayName: Install runkperf binary
  - bash: |
      set -euo pipefail
      profile="$(Agent.TempDirectory)/$(RUN_ID)-r50-load-profile.yaml"
      sed \
        -e 's/__RUN_NAMESPACE__/$(BENCHMARK_NAMESPACE)/g' \
        -e 's/__RATE__/50/g' \
        -e 's/__PHASE_RUN_ID__/$(RUN_ID)-r50/g' \
        "$(Build.SourcesDirectory)/kcl/workload_identity_webhook/load-profile.yaml" > "$profile"
      if grep -q '__[A-Z_]*__' "$profile"; then
        echo "Unresolved load-profile placeholders" >&2
        exit 1
      fi
      echo "Starting 50 CREATEs/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ); ownership=$(RUN_ID)-r50"
      echo "##vso[task.setvariable variable=PHASE_50_STARTED]true"
    displayName: Prepare 50/sec load profile
  - script: |
      set -euo pipefail
      set -x

      kperf runner run \
        --config "$(Agent.TempDirectory)/$(RUN_ID)-r50-load-profile.yaml" \
        --kubeconfig "$(KUBECONFIG)"
    displayName: Run kperf at 50 CREATEs/sec
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Cleaning 50/sec phase Pods at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      kubectl --request-timeout=60s delete pods \
        --namespace "$(BENCHMARK_NAMESPACE)" \
        --selector "benchmark-run=$(RUN_ID)-r50" \
        --wait=true \
        --timeout=10m
      echo "Finished 50/sec phase cleanup at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: and(always(), eq(variables['PHASE_50_STARTED'], 'true'))
    displayName: Delete 50/sec phase Pods
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Starting five-minute pause after 50/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      sleep 300
      echo "Finished pause after 50/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: and(always(), eq(variables['PHASE_50_STARTED'], 'true'))
    displayName: Pause 5 minutes after 50/sec
    timeoutInMinutes: 6
  - bash: |
      set -euo pipefail
      profile="$(Agent.TempDirectory)/$(RUN_ID)-r100-load-profile.yaml"
      sed \
        -e 's/__RUN_NAMESPACE__/$(BENCHMARK_NAMESPACE)/g' \
        -e 's/__RATE__/100/g' \
        -e 's/__PHASE_RUN_ID__/$(RUN_ID)-r100/g' \
        "$(Build.SourcesDirectory)/kcl/workload_identity_webhook/load-profile.yaml" > "$profile"
      if grep -q '__[A-Z_]*__' "$profile"; then
        echo "Unresolved load-profile placeholders" >&2
        exit 1
      fi
      echo "Starting 100 CREATEs/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ); ownership=$(RUN_ID)-r100"
      echo "##vso[task.setvariable variable=PHASE_100_STARTED]true"
    displayName: Prepare 100/sec load profile
  - script: |
      set -euo pipefail
      set -x

      kperf runner run \
        --config "$(Agent.TempDirectory)/$(RUN_ID)-r100-load-profile.yaml" \
        --kubeconfig "$(KUBECONFIG)"
    displayName: Run kperf at 100 CREATEs/sec
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Cleaning 100/sec phase Pods at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      kubectl --request-timeout=60s delete pods \
        --namespace "$(BENCHMARK_NAMESPACE)" \
        --selector "benchmark-run=$(RUN_ID)-r100" \
        --wait=true \
        --timeout=10m
      echo "Finished 100/sec phase cleanup at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: and(always(), eq(variables['PHASE_100_STARTED'], 'true'))
    displayName: Delete 100/sec phase Pods
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Starting five-minute pause after 100/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      sleep 300
      echo "Finished pause after 100/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: and(always(), eq(variables['PHASE_100_STARTED'], 'true'))
    displayName: Pause 5 minutes after 100/sec
    timeoutInMinutes: 6
  - bash: |
      set -euo pipefail
      profile="$(Agent.TempDirectory)/$(RUN_ID)-r200-load-profile.yaml"
      sed \
        -e 's/__RUN_NAMESPACE__/$(BENCHMARK_NAMESPACE)/g' \
        -e 's/__RATE__/200/g' \
        -e 's/__PHASE_RUN_ID__/$(RUN_ID)-r200/g' \
        "$(Build.SourcesDirectory)/kcl/workload_identity_webhook/load-profile.yaml" > "$profile"
      if grep -q '__[A-Z_]*__' "$profile"; then
        echo "Unresolved load-profile placeholders" >&2
        exit 1
      fi
      echo "Starting 200 CREATEs/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ); ownership=$(RUN_ID)-r200"
      echo "##vso[task.setvariable variable=PHASE_200_STARTED]true"
    displayName: Prepare 200/sec load profile
  - script: |
      set -euo pipefail
      set -x

      kperf runner run \
        --config "$(Agent.TempDirectory)/$(RUN_ID)-r200-load-profile.yaml" \
        --kubeconfig "$(KUBECONFIG)"
    displayName: Run kperf at 200 CREATEs/sec
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Cleaning 200/sec phase Pods at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      kubectl --request-timeout=60s delete pods \
        --namespace "$(BENCHMARK_NAMESPACE)" \
        --selector "benchmark-run=$(RUN_ID)-r200" \
        --wait=true \
        --timeout=10m
      echo "Finished 200/sec phase cleanup at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: and(always(), eq(variables['PHASE_200_STARTED'], 'true'))
    displayName: Delete 200/sec phase Pods
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Starting five-minute pause after 200/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      sleep 300
      echo "Finished pause after 200/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: and(always(), eq(variables['PHASE_200_STARTED'], 'true'))
    displayName: Pause 5 minutes after 200/sec
    timeoutInMinutes: 6
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az group delete --name "$(RESOURCE_GROUP)" --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --yes
    condition: and(always(), eq(variables['USE_EXISTING_CLUSTER'], 'false'), eq(variables['RESOURCE_GROUP_CREATED'], 'true'), not(${{ parameters.keep_cluster }}))
    displayName: Delete resource group (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
