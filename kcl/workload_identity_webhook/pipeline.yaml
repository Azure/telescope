name: Workload Identity Webhook Benchmark
pool: AKS-Telescope-Airlock
trigger: none
parameters:
- name: keep_cluster
  displayName: Keep cluster and benchmark Pods after benchmark
  type: boolean
  default: false
pr: none
jobs:
- job: benchmark
  displayName: Create H2 cluster and run WI webhook traffic
  timeoutInMinutes: 240
  cancelTimeoutInMinutes: 10
  variables:
    RUN_ID: wi-$(Build.BuildId)-$(System.JobAttempt)
    RESOURCE_GROUP_CREATED: 'false'
    KUBECONFIG: $(Agent.TempDirectory)/$(RUN_ID).kubeconfig
    KPERF_PROFILE: $(Agent.TempDirectory)/$(RUN_ID)-load-profile.yaml
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az account set --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
        az config set defaults.location="westus2"
        az account show
    displayName: Login to Azure
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        exists=$(az group exists --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --name "$(RUN_ID)")
        if [ "$exists" != "false" ]; then
          echo "Refusing to reuse an existing or unverified resource group: $(RUN_ID)" >&2
          exit 1
        fi
    displayName: Verify resource group does not already exist
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |+
        set -exo pipefail
        az group create \
          --name "$(RUN_ID)" \
          --location "westus2" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

    displayName: Create resource group in westus2 (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        echo "##vso[task.setvariable variable=RESOURCE_GROUP_CREATED]true"
        az extension add \
          --name aks-preview \
          --version 20.0.0b6 \
          --allow-preview true \
          --yes
        az aks create \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --resource-group "$(RUN_ID)" \
          --name wi-webhook \
          --location "westus2" \
          --kubernetes-version "1.36" \
          --dns-name-prefix "$(RUN_ID)" \
          --tier standard \
          --control-plane-scaling-size H2 \
          --enable-oidc-issuer \
          --enable-workload-identity \
          --generate-ssh-keys \
          --nodepool-name systempool \
          --node-count 3 \
          --node-vm-size Standard_D4_v4 \
          --max-pods 50 \
          --network-plugin azure \
          --network-plugin-mode overlay \
          --pod-cidr 10.64.0.0/10 \
          --service-cidr 10.0.0.0/16 \
          --dns-service-ip 10.0.0.10 \
          --outbound-type managedNATGateway \
          --nat-gateway-managed-outbound-ip-count 10 \
          --tags SkipAKSCluster=true \
          --yes
    displayName: Create H2 cluster with OIDC and workload identity
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        create_node_pool \
          --cluster-name "wi-webhook" \
          --resource-group "$(RUN_ID)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --name "workerpool" \
          --node-count 3 \
          --node-vm-size "Standard_D2s_v5" \
          --mode User \
          --max-pods 50
    displayName: Create node pool workerpool
  - script: |
      set -euo pipefail
      set -x

      temp_dir=$(mktemp -p /tmp -d kperfinstall.XXXX)
      docker rmi ghcr.io/liyu-ma/kperf@sha256:67e4924b23d2aea35526479721dd83f9afe707685a6efafd60916423017479d4 2>/dev/null || true
      docker pull ghcr.io/liyu-ma/kperf@sha256:67e4924b23d2aea35526479721dd83f9afe707685a6efafd60916423017479d4
      docker run --rm -v $temp_dir:/install-dir \
        ghcr.io/liyu-ma/kperf@sha256:67e4924b23d2aea35526479721dd83f9afe707685a6efafd60916423017479d4 bash -c "set -x; install /kperf /runkperf /install-dir"

      sudo install $temp_dir/kperf $temp_dir/runkperf /usr/local/bin
      rm -rf $temp_dir
      docker rmi ghcr.io/liyu-ma/kperf@sha256:67e4924b23d2aea35526479721dd83f9afe707685a6efafd60916423017479d4 2>/dev/null || true
    displayName: Install runkperf binary
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks get-credentials \
          --name "wi-webhook" \
          --resource-group "$(RUN_ID)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing \
          -f $(KUBECONFIG)
    displayName: Get credentials for wi-webhook
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set -u
        profile="$(KPERF_PROFILE)"
        kubectl create namespace "$(RUN_ID)"
        kubectl create serviceaccount pod-benchmark --namespace "$(RUN_ID)"
        # Use a fake client ID because benchmark Pods do not access Azure resources.
        kubectl annotate serviceaccount pod-benchmark \
          --namespace "$(RUN_ID)" \
          "azure.workload.identity/client-id=00000000-0000-4000-8000-000000000001"

        sed \
          -e 's/__RUN_NAMESPACE__/$(RUN_ID)/g' \
          "$(Build.SourcesDirectory)/kcl/workload_identity_webhook/load-profile.yaml" > "$profile"
        if grep -q '__[A-Z_]*__' "$profile"; then
          echo "Unresolved load-profile placeholders" >&2
          exit 1
        fi
    displayName: Prepare WI resources and load profile
  - script: |
      set -euo pipefail
      set -x

      kperf runner run \
        --config "$(KPERF_PROFILE)" \
        --kubeconfig "$(KUBECONFIG)"
    displayName: Run kperf runner
    timeoutInMinutes: 15
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az group delete --name "$(RUN_ID)" --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --yes
    condition: and(always(), eq(variables['RESOURCE_GROUP_CREATED'], 'true'), not(${{ parameters.keep_cluster }}))
    displayName: Delete resource group (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
