name: Workload Identity Webhook Benchmark
pool: AKS-Telescope-Airlock
trigger: none
parameters:
- name: keep_cluster
  displayName: Keep cluster after benchmark (phase namespaces are deleted)
  type: boolean
  default: false
pr: none
jobs:
- job: benchmark
  displayName: 'Baseline Run: 50/100/150/200 RPS'
  timeoutInMinutes: 240
  cancelTimeoutInMinutes: 25
  variables:
    RESOURCE_GROUP: $(RUN_ID)
    CLUSTER: wi-webhook
  steps:
  - bash: |
      set -eo pipefail

      job_id="$(System.JobId)"
      RUN_ID=$(Build.BuildId)-${job_id:0:8}
      echo "Run ID: $RUN_ID"

      echo "##vso[task.setvariable variable=RUN_ID]$RUN_ID"
    displayName: Set Run ID
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az account set --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
        az config set defaults.location="australiaeast"
        az account show
    displayName: Login to Azure
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |+
        set -exo pipefail
        az group create \
          --name "$(RESOURCE_GROUP)" \
          --location "australiaeast" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

    displayName: Create resource group in australiaeast (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az extension add \
          --name aks-preview \
          --version 21.0.0b17 \
          --allow-preview true \
          --yes
        az aks create \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --resource-group "$(RESOURCE_GROUP)" \
          --name "$(CLUSTER)" \
          --location "australiaeast" \
          --kubernetes-version "1.36" \
          --dns-name-prefix "$(RUN_ID)" \
          --tier standard \
          --control-plane-scaling-size H2 \
          --enable-oidc-issuer \
          --enable-workload-identity \
          --generate-ssh-keys \
          --nodepool-name systempool \
          --node-count 3 \
          --node-vm-size Standard_D4_v4 \
          --max-pods 50 \
          --network-plugin azure \
          --network-plugin-mode overlay \
          --pod-cidr 10.64.0.0/10 \
          --service-cidr 10.0.0.0/16 \
          --dns-service-ip 10.0.0.10 \
          --outbound-type managedNATGateway \
          --nat-gateway-managed-outbound-ip-count 10 \
          --tags SkipAKSCluster=true \
          --yes
    displayName: Create H2 cluster with OIDC and workload identity
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: "set -exo pipefail\ncreate_node_pool() {\n  local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds\n  deadline=$(($(date +%s) + 600))\n  while :; do\n    attempt=$((attempt + 1))\n    if output=$(az aks nodepool add \"$@\" 2>&1); then\n      rc=0\n    else\n      rc=$?\n    fi\n    echo \"$output\"\n    if [ \"$rc\" -eq 0 ]; then\n      return 0\n    fi\n    if echo \"$output\" | grep -qiE \"OperationNotAllowed\"; then\n      now=$(date +%s)\n      if [ \"$now\" -ge \"$deadline\" ]; then\n        echo \"Retriable error persisted past 600s retry window ($attempt attempts); giving up.\"\n        return \"$rc\"\n      fi\n      remaining_retry_seconds=$((deadline - now))\n      echo \"Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window).\"\n      sleep \"$sleep_between\"\n    else\n      echo \"Non-retriable error (rc=$rc); giving up after attempt $attempt.\"\n      return \"$rc\"\n    fi\n  done\n}\n\n\ncreate_node_pool \\\n  --cluster-name \"$(CLUSTER)\" \\\n  --resource-group \"$(RESOURCE_GROUP)\" \\\n  --subscription \"b8ceb4e5-f05b-4562-a9f5-14acb1f24219\" \\\n  --name \"runner\" \\\n  --node-count 1 \\\n  --node-vm-size \"Standard_D4s_v5\" \\\n  --mode User \\\n  \n"
    displayName: Create node pool runner
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks get-credentials \
          --name "$(CLUSTER)" \
          --resource-group "$(RESOURCE_GROUP)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing
    displayName: Get credentials for $(CLUSTER)
  - script: |
      set -euo pipefail
      set -x

      temp_dir=$(mktemp -p /tmp -d kperfinstall.XXXX)
      docker rmi ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647 2>/dev/null || true
      docker pull ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647
      docker run --rm -v $temp_dir:/install-dir \
        ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647 bash -c "set -x; install /kperf /runkperf /install-dir"

      sudo install $temp_dir/kperf $temp_dir/runkperf /usr/local/bin
      rm -rf $temp_dir
      docker rmi ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647 2>/dev/null || true
    displayName: Install runkperf binary
  - bash: |
      set -exo pipefail
      TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
      echo "BENCHMARK_START_TIME: $TIMESTAMP"
      echo "##vso[task.setvariable variable=BENCHMARK_START_TIME]$TIMESTAMP"
    displayName: Record current time as BENCHMARK_START_TIME
  - bash: |
      set -euo pipefail
      namespace="$(RUN_ID)-r50"
      kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      kubectl create serviceaccount pod-benchmark --namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      # Use a fake client ID because benchmark Pods do not access Azure resources.
      kubectl --request-timeout=60s annotate serviceaccount pod-benchmark \
        --namespace "$namespace" \
        "azure.workload.identity/client-id=00000000-0000-4000-8000-000000000001" \
        --overwrite
    displayName: Prepare WI resources for 50/sec
  - bash: |
      set -euo pipefail
      profile="$(Agent.TempDirectory)/$(RUN_ID)-r50-runner-group.yaml"
      sed \
        -e 's/__RUN_NAMESPACE__/$(RUN_ID)-r50/g' \
        -e 's/__RATE__/50/g' \
        -e 's/__PHASE_RUN_ID__/$(RUN_ID)-r50/g' \
        "$(Build.SourcesDirectory)/kcl/workload_identity_webhook/runner-group.yaml" > "$profile"
      if grep -q '__[A-Z_]*__' "$profile"; then
        echo "Unresolved runner-group placeholders" >&2
        exit 1
      fi
    displayName: Prepare 50/sec runner group
  - script: |
      set -euo pipefail
      set -x

      run_rg() {
        args=(
          rg run
          --runner-image="ghcr.io/liyu-ma/kperf@sha256:36f8e1cdbb6a4bd2fde4b29bf0cb5e4e014484ae9ddca9136f43449897ffb647"
          --runnergroup="file://$(Agent.TempDirectory)/$(RUN_ID)-r50-runner-group.yaml"
        )
        if [ -n "" ]; then
          args+=(--runner-flowcontrol="")
        fi
        if [ -n "agentpool=runner" ]; then
          args+=(--affinity="agentpool=runner")
        fi
        kperf "${args[@]}"
      }

      cleanup_rg() {
        kperf rg delete || true
        kubectl -n runnergroups-kperf-io delete pod runnergroup-server \
          --force --grace-period=0 --ignore-not-found=true --timeout=120s || true
      }

      cleanup_rg

      attempt=0
      max_attempts=10
      until run_rg; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge "$max_attempts" ]; then
          echo "kperf rg run failed after $attempt attempts" >&2
          kubectl -n runnergroups-kperf-io get pods -o wide || true
          kubectl -n runnergroups-kperf-io describe pod runnergroup-server || true
          kubectl -n runnergroups-kperf-io get events --sort-by=.lastTimestamp | tail -50 || true
          exit 1
        fi
        cleanup_rg
        echo "attempt $attempt failed; cleaning up and retrying in 120s" >&2
        sleep 120
      done
    displayName: Run kperf runner group at 50 CREATEs/sec
  - bash: |
      set -euo pipefail
      sleep 0
      attempt=0
      max_attempts=5
      until kperf rg result --wait | tee "$(Agent.TempDirectory)/$(RUN_ID)-r50-result.json"; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge "$max_attempts" ]; then
          exit 1
        fi
        echo "attempt $attempt failed; retry in 10s" >&2
        sleep 10
      done
    continueOnError: true
    displayName: Wait for 50/sec runner group result
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      kubectl delete namespace "$(RUN_ID)-r50" \
        --ignore-not-found=true \
        --wait=true
      echo "Namespace cleanup completed for 50/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: not(canceled())
    continueOnError: true
    displayName: Delete namespace from 50/sec run
    timeoutInMinutes: 15
  - bash: |
      set -euo pipefail
      echo "Starting five-minute pause after 50/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      sleep 300
      echo "Finished pause after 50/sec phase at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    condition: not(canceled())
    displayName: Pause 5 minutes after kperf run
    timeoutInMinutes: 6
  - bash: |
      set -euo pipefail
      namespace="$(RUN_ID)-r100"
      kubectl create namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      kubectl create serviceaccount pod-benchmark --namespace "$namespace" --dry-run=client -o yaml | kubectl --request-timeout=60s apply -f -
      # Use a fake client ID because benchmark Pods do not access Azure resources.
      kubectl --request-timeout=60s annotate serviceaccount pod-benchmark \
        --namespace "$namespace" \
        "azure.workload.identity/client-id=00000000-0000-4000-8000-000000000001" \
        --overwrite
