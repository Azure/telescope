name: node-validation
pool: AKS-Telescope-Airlock
trigger: none
stages:
- stage: nodes250
  displayName: Two 250-node pools
  dependsOn: []
  condition: succeeded()
  jobs:
  - job: node_validation
    displayName: Provision and validate node initialization
    timeoutInMinutes: 240
    cancelTimeoutInMinutes: 60
    steps:
    - bash: |
        set -euo pipefail
        mkdir -p "$(Agent.TempDirectory)/node-validation-$(System.JobId)"
        jq -n \
          --arg cluster "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
          --arg subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --arg location "westus2" \
          --arg buildId "$(Build.BuildId)" \
          --argjson nodesPerPool 250 \
          '{cluster: $cluster, resourceGroup: $cluster, subscription: $subscription,
            location: $location, buildId: $buildId, nodesPerPool: $nodesPerPool,
            systemNodes: 2, sku: "Standard_D2_v4", kubernetesVersion: "1.36.4",
            timeoutSeconds: 900}' | tee "$(Agent.TempDirectory)/node-validation-$(System.JobId)/configuration.json"
      displayName: Record benchmark configuration
    - task: AzureCLI@2
      inputs:
        azureSubscription: Azure-for-Telescope-internal
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          az account set --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
          az config set defaults.location="westus2"
          az account show
      displayName: Login to Azure
    - task: AzureCLI@2
      inputs:
        azureSubscription: Azure-for-Telescope-internal
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |+
          set -exo pipefail
          az group create \
            --name "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
            --location "westus2" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

      displayName: Create resource group in westus2 (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
    - task: AzureCLI@2
      inputs:
        azureSubscription: Azure-for-Telescope-internal
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          az aks create \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --resource-group "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
            --name "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
            --location "westus2" \
            --kubernetes-version "1.36.4" \
            --tier standard \
            --nodepool-name systempool \
            --node-count 2 \
            --node-vm-size Standard_D2_v4 \
            --max-pods 250 \
            --network-plugin azure \
            --network-plugin-mode overlay \
            --pod-cidr 10.64.0.0/10 \
            --service-cidr 10.0.0.0/16 \
            --dns-service-ip 10.0.0.10 \
            --outbound-type managedNATGateway \
            --nat-gateway-managed-outbound-ip-count 10 \
            --enable-managed-identity \
            --generate-ssh-keys \
            --yes
      displayName: Create Standard-tier cluster
    - task: AzureCLI@2
      inputs:
        azureSubscription: Azure-for-Telescope-internal
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          deadline=$(($(date +%s) + 600))
          sleep_between=30
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            set +e
            output=$(az aks nodepool add \
              --cluster-name "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
              --resource-group "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
              --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
              --name "workerpool0" \
              --node-count 250 \
              --node-vm-size "Standard_D2_v4" \
              --mode User \
              --max-pods 250 2>&1)
            rc=$?
            set -e
            echo "$output"
            if [ $rc -eq 0 ]; then
              exit 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ $now -ge $deadline ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                exit $rc
              fi
              remaining=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining seconds remain in retry window)."
              sleep $sleep_between
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              exit $rc
            fi
          done
      displayName: Create node pool workerpool0
    - task: AzureCLI@2
      inputs:
        azureSubscription: Azure-for-Telescope-internal
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          deadline=$(($(date +%s) + 600))
          sleep_between=30
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            set +e
            output=$(az aks nodepool add \
              --cluster-name "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
              --resource-group "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
              --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
              --name "workerpool1" \
              --node-count 250 \
              --node-vm-size "Standard_D2_v4" \
              --mode User \
              --max-pods 250 2>&1)
            rc=$?
            set -e
            echo "$output"
            if [ $rc -eq 0 ]; then
              exit 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ $now -ge $deadline ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                exit $rc
              fi
              remaining=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining seconds remain in retry window)."
              sleep $sleep_between
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              exit $rc
            fi
          done
      displayName: Create node pool workerpool1
    - task: AzureCLI@2
      inputs:
        azureSubscription: Azure-for-Telescope-internal
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          az aks get-credentials \
            --name "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
            --resource-group "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --overwrite-existing \
            -f $(Agent.TempDirectory)/$(System.JobId)-kubeconfig
      displayName: Get credentials for nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)
    - bash: |
        bash "$(Build.SourcesDirectory)/kcl/node-validation/wait-for-node-validation.sh" \
          "$(Agent.TempDirectory)/$(System.JobId)-kubeconfig" 250 "$(Agent.TempDirectory)/node-validation-$(System.JobId)"
      displayName: Wait up to 15 minutes for Ready, untainted nodes
    - bash: |
        set -euo pipefail
        mkdir -p "$(Agent.TempDirectory)/node-validation-$(System.JobId)"
        if [ ! -f "$(Agent.TempDirectory)/$(System.JobId)-kubeconfig" ]; then
          echo "##[warning]No kubeconfig available for node diagnostics"
          exit 0
        fi
        if ! timeout 30s kubectl --kubeconfig "$(Agent.TempDirectory)/$(System.JobId)-kubeconfig" --request-timeout=25s \
          -n kube-system get daemonset cloud-node-manager -o json \
          > "$(Agent.TempDirectory)/node-validation-$(System.JobId)/cloud-node-manager-daemonset.json"; then
          echo "##[warning]Could not collect cloud-node-manager DaemonSet"
        fi
        if [ ! -f "$(Agent.TempDirectory)/node-validation-$(System.JobId)/nodes.json" ]; then
          echo "##[warning]No valid node snapshot available for log selection"
          exit 0
        fi
        if ! timeout 30s kubectl --kubeconfig "$(Agent.TempDirectory)/$(System.JobId)-kubeconfig" --request-timeout=25s \
          -n kube-system get pods -l k8s-app=cloud-node-manager -o json \
          > "$(Agent.TempDirectory)/node-validation-$(System.JobId)/cloud-node-manager-pods.json"; then
          echo "##[warning]Could not discover cloud-node-manager pods"
          exit 0
        fi
        jq -r '
          [.items[]
            | select(any(.spec.taints[]?; .effect == "NoSchedule"))
            | {name: .metadata.name,
               pool: (.metadata.labels.agentpool // .metadata.labels["kubernetes.azure.com/agentpool"])}]
          | group_by(.pool) | .[] | .[0].name' "$(Agent.TempDirectory)/node-validation-$(System.JobId)/nodes.json" \
          > "$(Agent.TempDirectory)/node-validation-$(System.JobId)/diagnostic-nodes.txt"
        while read -r node; do
          pod=$(jq -r --arg node "$node" \
            '[.items[] | select(.spec.nodeName == $node)][0].metadata.name // empty' \
            "$(Agent.TempDirectory)/node-validation-$(System.JobId)/cloud-node-manager-pods.json")
          if [ -z "$pod" ]; then
            echo "##[warning]No cloud-node-manager pod found for $node"
            continue
          fi
          if ! timeout 30s kubectl --kubeconfig "$(Agent.TempDirectory)/$(System.JobId)-kubeconfig" --request-timeout=25s \
            -n kube-system logs "$pod" --timestamps --tail=50 \
            > "$(Agent.TempDirectory)/node-validation-$(System.JobId)/$pod.log" 2>&1; then
            echo "##[warning]Could not fetch logs for $pod"
          fi
        done < "$(Agent.TempDirectory)/node-validation-$(System.JobId)/diagnostic-nodes.txt"
      condition: failed()
      displayName: Collect bounded cloud-node-manager diagnostics
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(Agent.TempDirectory)/node-validation-$(System.JobId)
        artifact: node-validation-$(System.StageName)-$(System.JobAttempt)
      condition: always()
      displayName: Publish node validation evidence
    - task: AzureCLI@2
      inputs:
        azureSubscription: Azure-for-Telescope-internal
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          az group delete --name "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --yes
      condition: always()
      displayName: Delete resource group (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
