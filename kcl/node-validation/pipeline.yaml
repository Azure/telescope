        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          az aks get-credentials \
            --name "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
            --resource-group "nodevalidation-$(Build.BuildId)-$(System.StageName)-$(System.JobAttempt)" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
