# count: number of runner pods = actual concurrent client count for the test.
count: 50
loadProfile:
  version: 1
  description: "Scenario 3 / clients=50 / payload=100KB — POST(pods) + PUT(configmaps), equal shares, 100 req/s per runner for 600s"
  # Setup assumption (NOT enforced by this profile):
  #   runkperf data cm add --namespace default --size 102400 --total 10000 write
  specs:
    - rate: 100
      total: 500
      # Need at least 5 clients to reach 100 QPS (Little's Law); 10 for headroom.
      conns: 10
      client: 10
      contentType: json
      disableHTTP2: false
      maxRetries: 0
      requests:
        - postDel:
            version: v1
            resource: pods
            namespace: kperf
            deleteRatio: 0
            payloadSize: 102400
          shares: 1
        - put:
            version: v1
            resource: configmaps
            namespace: kperf
            name: runkperf-cm-write
            keySpaceSize: 10000
            payloadSize: 102400
          shares: 1
