# count: number of runner pods = actual concurrent client count for the test.
count: 50
loadProfile:
  version: 1
  description: "clients=50 — GET+LIST (equal shares), 100 req/s total per runner for 600s, against 10000 pre-populated ~1KB ConfigMaps"
  # Setup assumption (NOT enforced by this profile):
  #   runkperf data cm add --namespace default --size 1024 --total 10000 get
  specs:
    - rate: 100
      duration: 300
      # Need at least 5 clients to reach 100 QPS (Little's Law); 10 for headroom.
      conns: 10
      client: 10
      contentType: json
      disableHTTP2: false
      maxRetries: 0
      requests:
        - staleGet:
            version: v1
            resource: configmaps
            namespace: kperf
            name: runkperf-cm-get-0
          shares: 1
        - staleList:
            version: v1
            resource: configmaps
            namespace: kperf
          shares: 1
