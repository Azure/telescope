# count: number of runner pods = actual concurrent client count for the test.
count: 10
loadProfile:
  version: 1
  description: "Scenario 4 / clients=10 / objects=100 x 1KB — quorumList configmaps, 100 req/s per runner for 600s"
  # Setup assumption (NOT enforced by this profile):
  #   runkperf data cm add --namespace default --size 1024 --total 100 list
  #   -> objects named runkperf-cm-list-0 ... runkperf-cm-list-99
  # Cleanup after the run:
  #   runkperf data cm delete list
  specs:
    - rate: 100
      duration: 300
      # Need at least 5 clients to reach 100 QPS (Little's Law); 10 for headroom.
      conns: 10
      client: 10
      contentType: json
      disableHTTP2: false
      maxRetries: 0
      requests:
        # quorumList bypasses the watch cache and reads from etcd — stresses
        # both apiserver marshaling and etcd range-read memory.
        - quorumList:
            version: v1
            resource: configmaps
            namespace: kperf
            limit: 0
          shares: 100
