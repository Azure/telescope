# count: number of runner pods = actual concurrent client count for the test.
count: 10
loadProfile:
  version: 1
  description: "clients=10 — quorumList configmaps, 100 req/s per runner for 300s"
  specs:
    - rate: 100
      duration: 300
      conns: 10
      client: 10
      contentType: json
      disableHTTP2: false
      maxRetries: 0
      requests:
        - quorumList:
            version: v1
            resource: configmaps
            namespace: kperf
            limit: 0
          shares: 100
