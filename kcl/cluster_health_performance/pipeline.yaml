        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          deadline=$(($(date +%s) + 600))
          sleep_between=30
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            set +e
            output=$(az aks nodepool add \
