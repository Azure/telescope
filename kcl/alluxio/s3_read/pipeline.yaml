          exit 1
      }
      trap 'echo "ALLUXIO S3 READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
      runs_file="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/summary-runs.jsonl"
      : > "$runs_file"
      while IFS= read -r entry; do
          run_file="$(Build.ArtifactStagingDirectory)/alluxio-s3-read/runs/$(jq -r '"\(.id)-\(.side)-\(.rep)"' <<< "$entry").json"
          jq -c --argjson entry "$entry" '$entry + .' "$run_file" >> "$runs_file"
      done < "$(Build.ArtifactStagingDirectory)/alluxio-s3-read/runs/index.jsonl"
      [[ -s "$(Build.ArtifactStagingDirectory)/alluxio-s3-read/checkpoint/summary.json" ]] || fail "the checkpoint summary is missing"
      jq -s -L "$(Build.SourcesDirectory)/kcl/alluxio/s3_read" 'include "checks"; scenario_summary' "$runs_file" > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/scenarios.json"
      # Scenarios 1-10 must all be present.
      jq -e 'map(.id) == [range(1; 11)]' "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/scenarios.json" > /dev/null ||
          fail "the summary does not cover exactly scenarios 1-10"
      jq -n \
          --slurpfile scenarios "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/scenarios.json" \
          --slurpfile checkpoint "$(Build.ArtifactStagingDirectory)/alluxio-s3-read/checkpoint/summary.json" \
          '{scenarios: $scenarios[0], checkpoint: $checkpoint[0]}' > "$(Build.ArtifactStagingDirectory)/alluxio-s3-read/summary.json"
      rm -f -- "$runs_file" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/scenarios.json"
    displayName: Summarize the S3 read results
    name: s3_read_summary
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-s3-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        if [[ ! -s "$KUBECONFIG" ]]; then
            echo '{"cluster_access":"not established"}' > "$(Build.ArtifactStagingDirectory)/alluxio-s3-read/diagnostics.json"
            exit 0
        fi
        for namespace in alx-ns alluxio-operator; do
            kubectl get pods -n "$namespace" -o json |
                jq --arg namespace "$namespace" '{
                    ($namespace): [.items[] | {
                        name: .metadata.name, node: .spec.nodeName, phase: .status.phase,
                        containers: [(.status.containerStatuses // []) + (.status.initContainerStatuses // []) | .[] |
                            {name, ready, restarts: .restartCount,
                             state: (.state | with_entries(.value |= {reason, exitCode}))}]
                    }]
                }' > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/diagnostics-$namespace.json"
        done
        jq -s 'add' "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/diagnostics-alx-ns.json" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/diagnostics-alluxio-operator.json" \
            > "$(Build.ArtifactStagingDirectory)/alluxio-s3-read/diagnostics.json"
    condition: always()
    displayName: Collect safe deployment diagnostics
    name: alluxio_diagnostics
  - bash: |
      set +x
      set -Eeuo pipefail
      umask 077
      mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-s3-read"
      chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
      export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
      export KUBECONFIG="$HOME/.kube/config"
      # Avoid WebSocket stream closures during long-running AKS exec commands.
      export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
      fail() {
          echo "ALLUXIO WARP FAILED: $*" >&2
          exit 1
      }
      trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
      trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
      fail() {
          echo "ALLUXIO S3 READ FAILED: $*" >&2
          exit 1
      }
      trap 'echo "ALLUXIO S3 READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
      if grep -rq 'sig=' "$(Build.ArtifactStagingDirectory)/alluxio-s3-read"; then
          find "$(Build.ArtifactStagingDirectory)/alluxio-s3-read" -mindepth 1 -delete
          echo "ALLUXIO S3 READ FAILED: a SAS signature (sig=) was present in the results; the results were deleted, not published" >&2
          exit 1
      fi
    condition: always()
    displayName: Refuse to publish results that contain a SAS signature
    name: s3_read_sas_check
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/alluxio-s3-read
      artifact: alluxio-s3-read-$(System.JobAttempt)
    condition: always()
    displayName: Publish S3 read results and diagnostics
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        for NODE_RG in $(az aks list \
          --resource-group "alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --query "[].nodeResourceGroup" \
          --output tsv); do
          echo "Checking VMSS rolling upgrades in node resource group: $NODE_RG"
          for VMSS in $(az vmss list \
            --resource-group "$NODE_RG" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --query "[].name" \
            --output tsv); do
            echo "Attempting to cancel rolling upgrade for VMSS: $VMSS"
            az vmss rolling-upgrade cancel \
              --resource-group "$NODE_RG" \
              --name "$VMSS" \
              --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
              && echo "Cancelled rolling upgrade for $VMSS." \
              || echo "No active rolling upgrade to cancel for $VMSS (or cancel not applicable)."
          done
        done

        az group delete --name "alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)" --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --yes
    condition: and(always(), eq(variables['SHOULD_CLEAN_UP_RESOURCE_GROUP'], 'true'))
    displayName: Delete resource group (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
