                    jq -Rse -L "$(Build.SourcesDirectory)/kcl/alluxio/s3_read" 'include "checks"; validate_all_cached' "$(Build.ArtifactStagingDirectory)/alluxio-s3-read/cache-$name.txt" > /dev/null; then
                    return 0
                fi
                (( attempt == 6 )) || sleep 10
            done
