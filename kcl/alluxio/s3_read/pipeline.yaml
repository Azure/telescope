name: Alluxio S3 read vs Azure Blob
pool: AKS-Telescope-Airlock
trigger: none
pr: none
jobs:
- job: alluxio_s3_read
  displayName: Alluxio S3 API reads compared with direct Azure Blob reads
  timeoutInMinutes: 240
  cancelTimeoutInMinutes: 30
  steps:
  - bash: |
      set -eo pipefail

      job_id="$(System.JobId)"
      RUN_ID=$(Build.BuildId)-${job_id:0:8}
      echo "Run ID: $RUN_ID"

      echo "##vso[task.setvariable variable=RUN_ID]$RUN_ID"
    displayName: Set Run ID
  - bash: |-
      set -euo pipefail
      if ! command -v helm >/dev/null 2>&1; then
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      fi
      helm version --short
    displayName: Install Helm
  - task: KubeloginInstaller@0
    displayName: Install kubelogin
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-s3-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        alluxio_image="telescope.azurecr.io/alluxio-enterprise"
        operator_image="telescope.azurecr.io/alluxio-operator"
        subscription="b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
        resource_group="alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)"
        cluster="alluxio-s3-read"
        location="westeurope"
        images='{}'
        for image in "$alluxio_image" "$operator_image"; do
            tag="AI-3.8-15.1.28"
            if [[ "$image" == "$operator_image" ]]; then tag="3.7.6"; fi
            digest="$(az acr repository show \
                --name "telescope" \
                --subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" \
                --image "${image#*/}:$tag" | jq -er '.digest')"
            images="$(jq --arg image "$image:$tag" --arg digest "$digest" '. + {($image): $digest}' <<< "$images")"
        done
        exists="$(az group exists \
            --name "$resource_group" \
            --subscription "$subscription")"
        [[ "$exists" == false ]] || fail "Resource group already exists or could not be verified; refusing to provision into it"
        echo '##vso[task.setvariable variable=SHOULD_CLEAN_UP_RESOURCE_GROUP]true'

        jq -n \
            --arg acr_name "telescope" --arg acr_subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" \
            --arg alluxio_image "$alluxio_image" --arg operator_image "$operator_image" \
            --arg resource_group "$resource_group" --arg subscription "$subscription" \
            --arg cluster "$cluster" --arg location "$location" --arg storage_account "alx$(Build.BuildId)l$(System.JobAttempt)" \
            --argjson image_digests "$images" \
            --arg operator_chart "oci://telescope.azurecr.io/helm/alluxio-operator" \
            --arg operator_version "3.7.6" --arg curl_version "8.12.1" \
            '$ARGS.named + {
                worker_cache: "396Gi", worker_cache_reserved: "1Gi",
                support_nodes: {count: 3, sku: "Standard_D8s_v6", max_egress_mbps_per_vm: 12500},
                worker_nodes: {count: 5, sku: "Standard_D16ds_v6", max_egress_mbps_per_vm: 12500},
                client_nodes: {count: 5, sku: "Standard_D8s_v6", max_egress_mbps_per_vm: 12500}
            }' > "$(Build.ArtifactStagingDirectory)/alluxio-s3-read/configuration.json"
    displayName: Record run configuration and image digests
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |+
        set -exo pipefail
        az group create \
          --name "alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)" \
          --location "westeurope" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

    displayName: Create resource group in westeurope (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks create \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --resource-group "alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)" \
          --name "alluxio-s3-read" \
          --location "westeurope" \
          --kubernetes-version "1.36" \
          --nodepool-name systempool \
          --node-count 3 \
          --node-vm-size Standard_D8s_v6 \
          --network-plugin azure \
          --network-plugin-mode overlay \
          --enable-managed-identity \
          --enable-aad \
          --enable-azure-rbac \
          --disable-local-accounts \
          --no-ssh-key \
          --tier standard \
          --yes
    displayName: Create cluster
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        create_node_pool \
          --cluster-name "alluxio-s3-read" \
          --resource-group "alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --name "workerpool" \
          --node-count 5 \
          --node-vm-size "Standard_D16ds_v6" \
          --mode User \
          --node-taints alluxio=true:NoSchedule \
          --node-osdisk-type Managed
    displayName: Create node pool workerpool
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        create_node_pool \
          --cluster-name "alluxio-s3-read" \
          --resource-group "alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --name "clientpool" \
          --node-count 5 \
          --node-vm-size "Standard_D8s_v6" \
          --mode User \
          --node-taints warp=true:NoSchedule
    displayName: Create node pool clientpool
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks get-credentials \
          --name "alluxio-s3-read" \
          --resource-group "alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing
    displayName: Get credentials for alluxio-s3-read
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |-
        set -exo pipefail
        kubelogin convert-kubeconfig -l azurecli
    displayName: Convert kubeconfig to Entra ID login
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-s3-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        private_command() {
            if "$@" > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" 2> "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err"; then
                cat "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out"
            else
                fail "$1 failed; secret-bearing output withheld"
            fi
        }
        require_secret() {
            [[ -n "${!1:-}" && "${!1}" != '$('* ]] || fail "Required secret pipeline variable $1 is missing"
        }
        # The shared registry has a delete lock; keep credentials inside the disposable cluster instead of creating RBAC grants.
        login_server="$(az acr show --name "telescope" --subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" | jq -er '.loginServer')"
        REGISTRY_TOKEN="$(private_command az acr login \
            --name "telescope" \
            --subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" \
            --expose-token --query accessToken --output tsv)"
        export REGISTRY_TOKEN
        for namespace in alx-ns alluxio-operator; do
            kubectl create namespace "$namespace"
            pull_secret="$(jq -n --arg server "$login_server" --arg namespace "$namespace" '{
                apiVersion: "v1", kind: "Secret",
                metadata: {name: "alluxio-acr", namespace: $namespace},
                type: "kubernetes.io/dockerconfigjson",
                stringData: {".dockerconfigjson": ({
                    auths: {($server): {
                        username: "00000000-0000-0000-0000-000000000000",
                        password: env.REGISTRY_TOKEN,
                        auth: ("00000000-0000-0000-0000-000000000000:" + env.REGISTRY_TOKEN | @base64)
                    }}
                } | tojson)}
            }')"
            printf '%s\n' "$pull_secret" |
                private_command kubectl create --validate=strict -f - > /dev/null
        done
        unset REGISTRY_TOKEN pull_secret
    displayName: Configure short-lived ACR image pull credentials
    name: alluxio_acr_credentials
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-s3-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        fail() {
            echo "ALLUXIO S3 READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO S3 READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        private_command() {
            if "$@" > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" 2> "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err"; then
                cat "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out"
            else
                fail "$1 failed; secret-bearing output withheld"
            fi
        }
        require_secret() {
            [[ -n "${!1:-}" && "${!1}" != '$('* ]] || fail "Required secret pipeline variable $1 is missing"
        }
        # Prints a container SAS for the account selected by AZURE_STORAGE_ACCOUNT/KEY.
        # $1 container, $2 permissions, $3 lifetime in hours.
        make_sas() {
            az storage container generate-sas \
                --name "$1" \
                --permissions "$2" \
                --expiry "$(date -u -d "+$3 hours" +%Y-%m-%dT%H:%MZ)" \
                --https-only 2> /dev/null |
                jq -er 'select(type == "string" and length > 0)' 2> /dev/null
        }
        # Exports $2 as a secret pipeline variable named $1; the value never reaches the log.
        publish_secret() {
            local value="$2"
            value="${value//'%'/'%AZP25'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//$'\r'/'%0D'}"
            printf '##vso[task.setvariable variable=%s;issecret=true]%s\n' "$1" "$value"
        }
        seed_account() {
            local account="$1" location="$2" index
            az storage account create \
                --name "$account" \
                --resource-group "alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)" \
                --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
                --location "$location" \
                --kind StorageV2 \
                --sku Standard_LRS \
                --https-only true \
                --min-tls-version TLS1_2 \
                --allow-blob-public-access false \
                --hns false > /dev/null
            export AZURE_STORAGE_ACCOUNT="$account"
            AZURE_STORAGE_KEY="$(private_command az storage account keys list \
                --account-name "$account" \
                --resource-group "alluxio-s3-read-$(RUN_ID)-$(System.JobAttempt)" \
                --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" | jq -er '.[0].value')"
            export AZURE_STORAGE_KEY
            az storage container create \
                --name s3-data \
                --public-access off > /dev/null
            for ((index = 0; index < 16; index++)); do
                # Fixed per-object keys produce deterministic, nonzero 64 MiB payloads.
                head -c 67108864 /dev/zero |
                    openssl enc -aes-256-ctr -K "$(printf '%064x' "$index")" \
                        -iv 00000000000000000000000000000000 > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin"
                az storage blob upload \
                    --container-name s3-data \
                    --name "$(printf 'object-%02d.bin' "$index")" \
                    --file "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" \
                    --overwrite false > /dev/null
            done
            rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin"
            mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/small"
            for ((index = 0; index < 1024; index++)); do
                # Offset the key so small objects differ from the big ones; 1 MiB each.
                head -c 1048576 /dev/zero |
                    openssl enc -aes-256-ctr -K "$(printf '%064x' "$((index + 16))")" \
                        -iv 00000000000000000000000000000000 > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/small/$(printf 'obj-%04d.bin' "$index")"
            done
            # One batch upload: each single `az storage blob upload` costs about 2 s of fixed overhead.
            az storage blob upload-batch \
                --destination s3-data \
                --destination-path small \
                --source "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/small" \
                --overwrite false > /dev/null
            rm -rf -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/small"
            # --include m exposes metadata.hdi_isfolder; --num-results is explicit so a truncated listing cannot pass.
            az storage blob list \
                --container-name s3-data \
                --include m \
                --num-results 5000 |
                jq -e -L "$(Build.SourcesDirectory)/kcl/alluxio/s3_read" 'include "checks"; validate_s3_read_dataset' > /dev/null
        }
        seed_account "alx$(Build.BuildId)l$(System.JobAttempt)" "westeurope"
        # The reads cover the whole 240-minute job timeout; an 8-hour read SAS is twice that,
        # so it cannot expire mid-run. The write SAS is used by SeedCheckpointSets, which runs soon
        # after this step; 2 hours covers it.
        local_data_sas="$(make_sas s3-data rl 8)" || fail "Could not generate the local data SAS; secret-bearing output withheld"
        az storage container create \
            --name checkpoint \
            --public-access off > /dev/null
        checkpoint_read_sas="$(make_sas checkpoint rl 8)" || fail "Could not generate the checkpoint read SAS; secret-bearing output withheld"
        checkpoint_write_sas="$(make_sas checkpoint cw 2)" || fail "Could not generate the checkpoint write SAS; secret-bearing output withheld"
        unset AZURE_STORAGE_KEY
        seed_account "alx$(Build.BuildId)r$(System.JobAttempt)" "eastus"
        remote_data_sas="$(make_sas s3-data rl 8)" || fail "Could not generate the remote data SAS; secret-bearing output withheld"
        unset AZURE_STORAGE_KEY
        publish_secret LOCAL_DATA_SAS "$local_data_sas"
        publish_secret REMOTE_DATA_SAS "$remote_data_sas"
        publish_secret CHECKPOINT_READ_SAS "$checkpoint_read_sas"
        publish_secret CHECKPOINT_WRITE_SAS "$checkpoint_write_sas"
        unset local_data_sas remote_data_sas checkpoint_read_sas checkpoint_write_sas
        jq -n \
            --arg local_account "alx$(Build.BuildId)l$(System.JobAttempt)" --arg local_location "westeurope" \
            --arg remote_account "alx$(Build.BuildId)r$(System.JobAttempt)" --arg remote_location "eastus" \
            '$ARGS.named + {container: "s3-data", big_object_count: 16, big_object_bytes: 67108864, small_object_count: 1024, small_object_bytes: 1048576}' \
            > "$(Build.ArtifactStagingDirectory)/alluxio-s3-read/dataset.json"
    displayName: Create local and remote Blob datasets for S3 reads
    name: s3_read_dataset
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-s3-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        fail() {
            echo "ALLUXIO S3 READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO S3 READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        kubectl create -f "$(Build.SourcesDirectory)/kcl/alluxio/s3_read/nvme.yaml" > /dev/null
        # One pod per workerpool node.
        kubectl rollout status daemonset/alluxio-nvme -n kube-system --timeout=600s
        [[ "$(kubectl get daemonset alluxio-nvme -n kube-system -o jsonpath='{.status.numberReady}')" == 5 ]] ||
            fail "expected 5 ready NVMe pods"
        for pod in $(kubectl get pods -n kube-system -l app=alluxio-nvme -o name); do
            kubectl logs -n kube-system "$pod" | grep -q 'NVME READY /mnt/alluxio-nvme' ||
                fail "$pod did not report NVME READY"
        done
    displayName: Mount the local NVMe disk on every worker node
    name: alluxio_nvme
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-s3-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
