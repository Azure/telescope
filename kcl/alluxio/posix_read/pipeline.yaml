            # server during a long one. "pending" is a run that is still going, and an empty file a status that is
            # still being written.
            while :; do
                if rc="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.rc 2> "$POSIX_WORK/poll-$pod.err")"; then
                    last_ok=$SECONDS
                    [[ "$rc" =~ ^[0-9]+$ ]] && break
