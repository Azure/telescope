name: Alluxio POSIX read vs BlobFuse2 and DACS
pool: AKS-Telescope-Airlock
trigger: none
pr: none
jobs:
- job: alluxio_posix_read
  displayName: Alluxio FUSE reads compared with BlobFuse2 and BlobFuse2 with DACS
  timeoutInMinutes: 360
  cancelTimeoutInMinutes: 30
  steps:
  - bash: |
      set -eo pipefail

      job_id="$(System.JobId)"
      RUN_ID=$(Build.BuildId)-${job_id:0:8}
      echo "Run ID: $RUN_ID"

      echo "##vso[task.setvariable variable=RUN_ID]$RUN_ID"
    displayName: Set Run ID
  - bash: |-
      set -euo pipefail
      if ! command -v helm >/dev/null 2>&1; then
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      fi
      helm version --short
    displayName: Install Helm
  - task: KubeloginInstaller@0
    displayName: Install kubelogin
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        alluxio_image="telescope.azurecr.io/alluxio-enterprise"
        operator_image="telescope.azurecr.io/alluxio-operator"
        subscription="b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
        resource_group="alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)"
        cluster="alluxio-posix-read"
        location="westeurope"
        images='{}'
        for image in "$alluxio_image" "$operator_image"; do
            tag="AI-3.8-15.1.28"
            if [[ "$image" == "$operator_image" ]]; then tag="3.7.6"; fi
            digest="$(az acr repository show \
                --name "telescope" \
                --subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" \
                --image "${image#*/}:$tag" | jq -er '.digest')"
            images="$(jq --arg image "$image:$tag" --arg digest "$digest" '. + {($image): $digest}' <<< "$images")"
        done
        client_digest="$(az acr repository show \
            --name "telescope" \
            --subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" \
            --image "elbencho:v3.0-37" | jq -er '.digest')"
        images="$(jq --arg image "telescope.azurecr.io/elbencho:v3.0-37" --arg digest "$client_digest" '. + {($image): $digest}' <<< "$images")"
        exists="$(az group exists \
            --name "$resource_group" \
            --subscription "$subscription")"
        [[ "$exists" == false ]] || fail "Resource group already exists or could not be verified; refusing to provision into it"
        echo '##vso[task.setvariable variable=SHOULD_CLEAN_UP_RESOURCE_GROUP]true'

        jq -n \
            --arg acr_name "telescope" --arg acr_subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" \
            --arg alluxio_image "$alluxio_image" --arg operator_image "$operator_image" \
            --arg resource_group "$resource_group" --arg subscription "$subscription" \
            --arg cluster "$cluster" --arg location "$location" --arg storage_account "alx$(Build.BuildId)p$(System.JobAttempt)" \
            --argjson image_digests "$images" \
            --arg operator_chart "oci://telescope.azurecr.io/helm/alluxio-operator" \
            --arg operator_version "3.7.6" --arg elbencho_version "3.0-37" \
            '$ARGS.named + {
                worker_cache: "396Gi", worker_cache_reserved: "1Gi",
                support_nodes: {count: 3, sku: "Standard_D8s_v6", max_egress_mbps_per_vm: 12500},
                worker_nodes: {count: 5, sku: "Standard_D16ds_v6", max_egress_mbps_per_vm: 12500},
                client_nodes: {count: 5, sku: "Standard_D8s_v6", max_egress_mbps_per_vm: 12500}
            }' > "$(Build.ArtifactStagingDirectory)/alluxio-posix-read/configuration.json"
    displayName: Record run configuration and image digests
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |+
        set -exo pipefail
        az group create \
          --name "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
          --location "westeurope" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

    displayName: Create resource group in westeurope (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks create \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
          --name "alluxio-posix-read" \
          --location "westeurope" \
          --kubernetes-version "1.36" \
          --nodepool-name systempool \
          --node-count 3 \
          --node-vm-size Standard_D8s_v6 \
          --network-plugin azure \
          --network-plugin-mode overlay \
          --enable-managed-identity \
          --enable-aad \
          --enable-azure-rbac \
          --disable-local-accounts \
          --enable-blob-driver \
          --no-ssh-key \
          --tier standard \
          --yes
    displayName: Create cluster
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        create_node_pool \
          --cluster-name "alluxio-posix-read" \
          --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --name "clientpool" \
          --node-count 5 \
          --node-vm-size "Standard_D8s_v6" \
          --mode User \
          --node-taints warp=true:NoSchedule
    displayName: Create node pool clientpool
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks get-credentials \
          --name "alluxio-posix-read" \
          --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing
    displayName: Get credentials for alluxio-posix-read
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |-
        set -exo pipefail
        kubelogin convert-kubeconfig -l azurecli
    displayName: Convert kubeconfig to Entra ID login
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        private_command() {
            if "$@" > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" 2> "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err"; then
                cat "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out"
            else
                fail "$1 failed; secret-bearing output withheld"
            fi
        }
        require_secret() {
            [[ -n "${!1:-}" && "${!1}" != '$('* ]] || fail "Required secret pipeline variable $1 is missing"
        }
        # The shared registry has a delete lock; keep credentials inside the disposable cluster instead of creating RBAC grants.
        login_server="$(az acr show --name "telescope" --subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" | jq -er '.loginServer')"
        REGISTRY_TOKEN="$(private_command az acr login \
            --name "telescope" \
            --subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" \
            --expose-token --query accessToken --output tsv)"
        export REGISTRY_TOKEN
        for namespace in alx-ns alluxio-operator; do
            kubectl create namespace "$namespace"
            pull_secret="$(jq -n --arg server "$login_server" --arg namespace "$namespace" '{
                apiVersion: "v1", kind: "Secret",
                metadata: {name: "alluxio-acr", namespace: $namespace},
                type: "kubernetes.io/dockerconfigjson",
                stringData: {".dockerconfigjson": ({
                    auths: {($server): {
                        username: "00000000-0000-0000-0000-000000000000",
                        password: env.REGISTRY_TOKEN,
                        auth: ("00000000-0000-0000-0000-000000000000:" + env.REGISTRY_TOKEN | @base64)
                    }}
                } | tojson)}
            }')"
            printf '%s\n' "$pull_secret" |
                private_command kubectl create --validate=strict -f - > /dev/null
        done
        unset REGISTRY_TOKEN pull_secret
    displayName: Configure short-lived ACR image pull credentials
    name: alluxio_acr_credentials
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        POSIX_WORK="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        POSIX_RESULT="$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        POSIX_NS="alx-ns"
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        private_command() {
            if "$@" > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" 2> "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err"; then
                cat "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out"
            else
                fail "$1 failed; secret-bearing output withheld"
            fi
        }
        require_secret() {
            [[ -n "${!1:-}" && "${!1}" != '$('* ]] || fail "Required secret pipeline variable $1 is missing"
        }
        # Prints a container SAS for the account selected by AZURE_STORAGE_ACCOUNT/KEY.
        # $1 container, $2 permissions, $3 lifetime in hours.
        make_sas() {
            az storage container generate-sas \
                --name "$1" \
                --permissions "$2" \
                --expiry "$(date -u -d "+$3 hours" +%Y-%m-%dT%H:%MZ)" \
                --https-only 2> /dev/null |
                jq -er 'select(type == "string" and length > 0)' 2> /dev/null
        }
        # Exports $2 as a secret pipeline variable named $1; the value never reaches the log.
        publish_secret() {
            local value="$2"
            value="${value//'%'/'%AZP25'}"
            value="${value//$'\n'/'%0A'}"
            value="${value//$'\r'/'%0D'}"
            printf '##vso[task.setvariable variable=%s;issecret=true]%s\n' "$1" "$value"
        }
        redact() {
            local line secret
            while IFS= read -r line || [[ -n "$line" ]]; do
                for secret in "${read_sas:-}" "${write_sas:-}"; do
                    if [[ -n "$secret" ]]; then line="${line//"$secret"/<redacted>}"; fi
                done
                printf '%s\n' "$line"
            done
        }
        # Runs a script in a pod, detached. A kubectl exec stream can drop during a long run and still return 0
        # while the work keeps going in the pod. So one short exec writes the script, sets its status file to
        # "pending" and starts it with setsid, stdio not tied to the exec, and later short execs poll the status
        # file until it holds the exit status. The starter script also records the pod's own clock right before
        # and after the script, and the process group id so a run can be killed. Every short exec is cut off after
        # 60 s, so a stalled stream cannot hang the step. A poll whose exec fails or is cut off is tried again, but
        # when no poll has read the status for POSIX_POLL_LOST_SECONDS, the pod is gone or kubectl can no longer reach
        # it, for example because the step's sign-in has lapsed: the run then fails with the last error. A run whose
        # status is still "pending" at its limit fails too, and the message tells whether the script was still running
        # or had stopped without writing its status. In both cases its process group is killed, if the pod can still
        # be reached. After a successful run the log and the two times are fetched again and again until they
        # arrive, never from a failed exec's error text. The log goes to stdout (or to stderr when the script
        # fails), through redact when the step defines it, as do the poll errors; POSIX_RUN_START and POSIX_RUN_END
        # hold the pod-side UTC times.
        # Usage: pod_run <pod> <limit seconds> <script text> [args...]
        pod_run() {
            local pod="$1" limit="$2" script="$3" rc="" deadline last_ok log state=""
            shift 3
            [[ "$limit" =~ ^[0-9]+$ ]] || fail "pod_run: the limit must be a number of seconds, got $limit"
            timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'printf "%s\n" "$1" > /tmp/posix-run.sh
                printf "%s\n" "$2" > /tmp/posix-start.sh
                shift 2
                rm -f /tmp/posix-run.rc /tmp/posix-run.log /tmp/posix-run.start /tmp/posix-run.end /tmp/posix-run.pid
                echo pending > /tmp/posix-run.rc
                setsid sh /tmp/posix-start.sh "$@" < /dev/null > /dev/null 2>&1 &
                echo $! > /tmp/posix-run.pid' sh "$script" 'date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.start
        sh /tmp/posix-run.sh "$@" > /tmp/posix-run.log 2>&1
        status=$?
        date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.end
        echo $status > /tmp/posix-run.rc' "$@" || fail "$pod: could not start the script"
            deadline=$((SECONDS + limit))
            last_ok=$SECONDS
            # Poll every 15 s: often enough to notice the end of a short run, rarely enough not to load the API
            # server during a long one. "pending" is a run that is still going, and an empty file a status that is
            # still being written.
            while :; do
                if rc="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.rc 2> "$POSIX_WORK/poll-$pod.err")"; then
                    last_ok=$SECONDS
                    [[ "$rc" =~ ^[0-9]+$ ]] && break
                else
                    # timeout exits with 124 when it cuts the exec off.
                    if (( $? == 124 )); then
                        echo "kubectl exec did not return within 60 s" >> "$POSIX_WORK/poll-$pod.err"
                    fi
                    if (( SECONDS - last_ok >= 300 )); then
                        rc=unreachable
                        break
                    fi
                fi
                if (( SECONDS >= deadline )); then
                    rc=timeout
                    break
                fi
                sleep 15
            done
            if [[ "$rc" != 0 ]]; then
                if [[ "$rc" == timeout || "$rc" == unreachable ]]; then
                    # The negative pid is the process group started by setsid. The exec prints whether the group was
                    # still there, and nothing if the pod cannot be reached.
                    state="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'pid="$(cat /tmp/posix-run.pid)"
                        if kill -0 -"$pid" 2> /dev/null; then kill -- -"$pid"; echo running; else echo gone; fi' 2> /dev/null)" || true
                fi
                if [[ "$rc" == unreachable ]]; then
                    fail "$pod: no check could read the status of the run for $((SECONDS - last_ok)) s; the last one failed with: $(redact_log < "$POSIX_WORK/poll-$pod.err" | tail -n 5)"
                fi
                { timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.log 2>&1 || true; } | redact_log >&2
                if [[ "$rc" == timeout ]]; then
                    case "$state" in
                        running) fail "$pod: the script was still running at its limit of $limit s" ;;
                        gone) fail "$pod: the script was no longer running at its limit of $limit s but had not written its exit status" ;;
                        *) fail "$pod: the script had not written its exit status by its limit of $limit s" ;;
                    esac
                fi
                fail "$pod: script ended with exit status $rc"
            fi
            log="$(pod_cat "$pod" /tmp/posix-run.log)"
            POSIX_RUN_START="$(pod_cat "$pod" /tmp/posix-run.start)"
            POSIX_RUN_END="$(pod_cat "$pod" /tmp/posix-run.end)"
            [[ "$POSIX_RUN_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ && "$POSIX_RUN_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
                fail "$pod: the pod-side times are not UTC timestamps: $POSIX_RUN_START $POSIX_RUN_END"
            redact_log <<< "$log"
        }

        # Copies stdin to stdout through the step's redact function, if it has one.
        redact_log() {
            if declare -F redact > /dev/null; then redact; else cat; fi
        }

        # Prints one file of a pod. A failed exec prints an error text instead of the file, so only the output
        # of a successful one counts; a few attempts cover a dropped stream.
        # Usage: pod_cat <pod> <file>
        pod_cat() {
            local out attempt
            for attempt in 1 2 3 4 5; do
                if out="$(timeout 60 kubectl exec -n "$POSIX_NS" "$1" -- cat "$2" 2> /dev/null)"; then
                    printf '%s\n' "$out"
                    return 0
                fi
                sleep 5
            done
            fail "$1: could not fetch $2"
        }

        # Prints "<name><TAB><address>" for each Ready elbencho service pod, sorted by name, from one listing,
        # and fails unless there are exactly 5: a missing service would silently shrink the
        # load. client_pods and client_ips print one column of it.
        client_list() {
            local pods list count
            pods="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o json)" ||
                fail "could not list the elbencho service pods"
            list="$(jq -r '[.items | sort_by(.metadata.name)[] |
                select(.status.phase == "Running" and
                    any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
                [.metadata.name, .status.podIP] | select(.[1] != null and .[1] != "")] | .[] | @tsv' <<< "$pods")"
            count="$(grep -c . <<< "$list" || true)"
            [[ "$count" == 5 ]] ||
                fail "expected 5 ready elbencho service pods, found $count"
            echo "$list"
        }
        client_pods() {
            client_list | cut -f1
        }
        client_ips() {
            client_list | cut -f2
        }

        POSIX_MASTER_SCRIPT='hosts="$1"
        shift
        elbencho --hosts "$hosts" --nolive "$@"'
        POSIX_LOCAL_SCRIPT='elbencho "$@"'

        # A result file must hold elbencho's result table, whose header line starts with OPERATION.
        eb_check_result() {
            grep -q OPERATION "$1" || fail "$2: no elbencho result table in $1"
        }

        # Index lines carry the group of the run ("group") when POSIX_GROUP is set, so the summary can tell the
        # single runs of the hot group from the one entry that spans them all.
        POSIX_GROUP="${POSIX_GROUP:-}"
        # The jq object that is appended to the index file; a rep is a number, or a word such as "all" for an
        # entry that spans several runs. label and end are jq keywords: jq 1.6 accepts them only as quoted keys and
        # not as variable names, hence $name and $finish.
        POSIX_INDEX_LINE='{"label": $name, side: $side, scenario: $scenario, rep: ($rep | if test("^[0-9]+$") then tonumber else . end), start: $start, "end": $finish}
            + (if $pod == "" then {} else {pod: $pod} end) + (if $group == "" then {} else {group: $group} end)'

        # Runs elbencho from the first service pod against all of them and records the result. The index line
        # lets the summary find the run and place it in time for the counter and egress windows; its times are
        # the pod's own, taken right around the elbencho command. limit is the run's pod_run limit.
        # Usage: eb_run <label> <side> <scenario> <rep> <limit seconds> <elbencho args...>
        eb_run() {
            local label="$1" side="$2" scenario="$3" rep="$4" limit="$5" list first hosts
            shift 5
            list="$(client_list)"
            first="$(head -n 1 <<< "$list" | cut -f1)"
            hosts="$(cut -f2 <<< "$list" | paste -sd, -)"
            [[ -n "$first" && -n "$hosts" ]] || fail "eb_run $label: no service pods"
            pod_run "$first" "$limit" "$POSIX_MASTER_SCRIPT" "$hosts" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_run $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs elbencho in one service pod against its own mount only and records it like eb_run, with the pod
        # name in "pod" (the re-read scenario: the same node reads the file twice).
        # Usage: eb_local <label> <side> <scenario> <rep> <pod> <limit seconds> <elbencho args...>
        eb_local() {
            local label="$1" side="$2" scenario="$3" rep="$4" pod="$5" limit="$6"
            shift 6
            pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_local $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs the same local elbencho command in every service pod at the same time (the concurrent-readers
        # scenario) and stores one result and one index line per pod, with the pod name in "pod". The scenario
        # is always 23-24. path is the file all pods read; limit is the pod_run limit of each pod's run.
        # Usage: eb_local_all <label> <side> <rep> <limit seconds> <path> <elbencho args...>
        eb_local_all() {
            local label="$1" side="$2" rep="$3" limit="$4" path="$5" pod pids=() failed=0 pods
            shift 5
            pods="$(client_pods)"
            for pod in $pods; do
                (
                    pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" "$path" > "$POSIX_RESULT/$label-$pod.txt"
                    eb_check_result "$POSIX_RESULT/$label-$pod.txt" "eb_local_all $label ($pod)"
                    jq -nc --arg name "$label-$pod" --arg side "$side" --arg scenario 23-24 --arg rep "$rep" \
                        --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                        "$POSIX_INDEX_LINE" > "$POSIX_WORK/index-$label-$pod.json"
                ) &
                pids+=($!)
            done
            for pid in "${pids[@]}"; do
                wait "$pid" || failed=1
            done
            (( failed == 0 )) || fail "eb_local_all $label: a pod failed"
            for pod in $pods; do
                cat "$POSIX_WORK/index-$label-$pod.json" >> "$POSIX_RESULT/index.jsonl"
            done
        }

        # The metrics text of every pod of one kind, each preceded by a comment line with the pod name. A pod
        # listing that fails is an error. No pods at all means the kind is not deployed in this phase; any other
        # number than 5 means a pod is missing or restarting.
        # Usage: metrics_of <namespace> <pod name prefix> <port> <path>
        metrics_of() {
            local list pods pod count
            list="$(kubectl get pods -n "$1" -o name)" || fail "could not list the pods in $1"
            pods="$(sed 's|^pod/||' <<< "$list" | grep "^$2" || true)"
            count="$(grep -c . <<< "$pods" || true)"
            [[ "$count" == 0 || "$count" == 5 ]] ||
                fail "expected 5 $2 pods in $1, found $count"
            for pod in $pods; do
                echo "# pod $pod"
                kubectl get --raw "/api/v1/namespaces/$1/pods/$pod:$3/proxy/$4" || fail "could not read the metrics of $1/$pod"
            done
        }
        # 30000 is the Alluxio worker metrics port and 9096 the DACS server's.
        alluxio_metrics() {
            metrics_of "$POSIX_NS" alluxio-worker- 30000 metrics/
        }
        dacs_metrics() {
            metrics_of dacs-cache-system bench-cache- 9096 metrics
        }
        count_pods() {
            grep -c '^# pod ' <<< "$1" || true
        }

        # Saves the raw metrics of all Alluxio workers and all DACS servers to counters-<tag>.prom, whose first
        # line records how many pods of each kind were read. A kind that is not deployed in this phase
        # contributes nothing.
        # Usage: snap_counters <tag>
        snap_counters() {
            local alluxio dacs
            alluxio="$(alluxio_metrics)" || fail "could not read the Alluxio worker metrics"
            dacs="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            {
                echo "# pods alluxio-worker-=$(count_pods "$alluxio") bench-cache-=$(count_pods "$dacs")"
                echo "$alluxio"
                echo "$dacs"
            } > "$POSIX_RESULT/counters-$1.prom"
        }

        # Runs a privileged pod on one node that flushes and drops the page cache, so the next read has to
        # come from the cache layer rather than from the node's memory.
        # Usage: drop_page_cache <node>
        drop_page_cache() {
            local node="$1" name="drop-cache-$1"
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
            kubectl create -n "$POSIX_NS" -f - << MANIFEST || fail "could not create $name"
        apiVersion: v1
        kind: Pod
        metadata:
          name: $name
        spec:
          nodeName: $node
          restartPolicy: Never
          tolerations:
            - operator: Exists
          containers:
            - name: drop
              image: mcr.microsoft.com/azurelinux/base/core:3.0
              securityContext:
                privileged: true
              command: ["sh", "-c", "sync; echo 3 > /proc/sys/vm/drop_caches"]
        MANIFEST
            # 180 s covers pulling the image on a fresh node and running two commands.
            kubectl wait -n "$POSIX_NS" --for=jsonpath='{.status.phase}'=Succeeded "pod/$name" --timeout=180s ||
                { kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null; fail "dropping the page cache on $node failed"; }
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
        }

        # The DACS servers' successful Upload requests, summed. Uploads are the asynchronous writes of freshly
        # generated data to the cache. Every one of the 5 servers must be read and must report the
        # metric: a missing server or metric would look like "no uploads" and end the wait too early.
        dacs_uploads() {
            local out total servers seen
            out="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            read -r total servers seen < <(awk '
                /^# pod / { pods++; next }
                /^cache_server_request_counter[{]/ && /request_type="Upload"/ && /status="Success"/ {
                    sum += $NF
                    if (!(pods in has)) { has[pods] = 1; seen_n++ }
                }
                END { printf "%d %d %d\n", sum, pods, seen_n }' <<< "$out")
            [[ "$servers" == 5 ]] || fail "expected 5 DACS servers, found $servers"
            [[ "$seen" == "$servers" ]] || fail "$((servers - seen)) of $servers DACS servers report no Upload request metric"
            echo "$total"
        }

        # Waits until the DACS Upload counter has not moved for two checks 20 seconds apart. Gives up after 10
        # minutes, because a cache that is still absorbing data would distort the next measurement.
        dacs_settle() {
            local previous current stable=0 deadline=$((SECONDS + 600))
            previous="$(dacs_uploads)"
            while (( stable < 2 )); do
                (( SECONDS < deadline )) || fail "DACS uploads still changing after 10 minutes"
                sleep 20
                current="$(dacs_uploads)"
                if [[ "$current" == "$previous" ]]; then
                    stable=$((stable + 1))
                else
                    stable=0
                fi
                previous="$current"
            done
        }

        # Waits until every elbencho service pod lists exactly 480 hot files (p*) in /data, for up to
        # 300 s. The Blob CSI driver mounts BlobFuse2 with --cancel-list-on-mount-seconds=10, so a listing in the
        # first 10 s after a mount is empty: the first check waits 15 s. The pod list is an assignment, so a missing or
        # NotReady pod fails here instead of leaving the loop with no pod checked.
        wait_hot_listing() {
            local deadline pods pod listing seen behind
            sleep 15
            deadline=$((SECONDS + 300))
            while :; do
                behind=0
                pods="$(client_pods)"
                for pod in $pods; do
                    if listing="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- ls -1 /data 2> /dev/null)"; then
                        seen="$(grep -c '^p' <<< "$listing" || true)"
                    else
                        seen=unreadable
                    fi
                    if [[ "$seen" != 480 ]]; then
                        behind=1
                        echo "$pod lists $seen hot files, expecting 480"
                    fi
                done
                (( behind == 0 )) && return 0
                (( SECONDS < deadline )) || fail "not every client lists 480 hot files after 300 seconds"
                sleep 10
            done
        }

        # Replaces the Blob volume and the elbencho service pods: deletes the pods, the PVC and the PV posix-data
        # (waiting until they are gone), creates them again from blob-volume.yaml and clients-volume.yaml in the
        # manifest directory with the given BlobFuse2 mount options, and waits for exactly 5 Ready
        # pods that list the hot files. The Secret posix-sas (read-only SAS) stays in place. options is a JSON list
        # with one option per item: the Blob CSI driver recognizes some options only as separate items.
        # Every mount gets a new volumeHandle, which names the node's staging mount, so a node cannot keep a staging
        # mount of the previous volume with the previous options.
        # Usage: mount_posix_volume <manifest dir> <container> <elbencho image> <tag> <options as a JSON list>
        mount_posix_volume() {
            local dir="$1" container="$2" image="$3" tag="$4" options="$5" handle index left
            handle="posix-data-$tag-$(date -u +%Y%m%d%H%M%S)"
            # 300 s bounds each deletion: a pod waits for its BlobFuse2 unmount, the PVC and PV for their finalizers.
            kubectl delete pod -n "$POSIX_NS" -l app=posix-client --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the elbencho service pods within 300 s"
            kubectl delete pvc posix-data -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PVC posix-data within 300 s"
            kubectl delete pv posix-data --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PV posix-data within 300 s"
            left="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o name)" || fail "could not list the elbencho service pods"
            [[ -z "$left" ]] || fail "elbencho service pods still exist after their deletion: $left"
            ! kubectl get pv posix-data > /dev/null 2>&1 || fail "the PV posix-data still exists after its deletion"
            sed -e "s|CONTAINER_NAME|$container|" \
                -e "s|volumeHandle: posix-data|volumeHandle: $handle|" \
                -e "s|mountOptions: \[\]|mountOptions: $options|" \
                "$dir/blob-volume.yaml" > "$POSIX_WORK/volume-$tag.yaml"
            grep -qF "mountOptions: $options" "$POSIX_WORK/volume-$tag.yaml" || fail "blob-volume.yaml has no empty mountOptions to fill"
            kubectl create -f "$POSIX_WORK/volume-$tag.yaml" > /dev/null
            for index in $(seq 1 5); do
                sed -e "s|ELBENCHO_IMAGE|$image|" -e "s|name: posix-client|name: posix-client-$index|" \
                    "$dir/clients-volume.yaml" > "$POSIX_WORK/client-$index.yaml"
                kubectl create -f "$POSIX_WORK/client-$index.yaml" > /dev/null
            done
            kubectl wait -n "$POSIX_NS" --for=condition=Ready pod -l app=posix-client --timeout=600s > /dev/null
            wait_hot_listing
        }
        create_account() {
            local account="$1" location="$2"
            az storage account create \
                --name "$account" \
                --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
                --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
                --location "$location" \
                --kind StorageV2 \
                --sku Standard_LRS \
                --https-only true \
                --min-tls-version TLS1_2 \
                --allow-blob-public-access false \
                --hns false > /dev/null
            export AZURE_STORAGE_ACCOUNT="$account"
            AZURE_STORAGE_KEY="$(private_command az storage account keys list \
                --account-name "$account" \
                --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
                --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" | jq -er '.[0].value')"
            export AZURE_STORAGE_KEY
        }

        # Renders a manifest of the checks directory into the work directory with the given sed expressions and
        # creates it. A manifest is created, never applied, so no secret or annotation is stored with it.
        # Usage: create_manifest <manifest file name> <output name> <sed expression>...
        create_manifest() {
            local source="$1" output="$POSIX_WORK/$2"
            shift 2
            sed "$@" "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/$source" > "$output"
            kubectl create -f "$output" > /dev/null
        }

        # 0. A retry starts clean. A failed attempt leaves the writer pod, the client pods, their volumes and the Secrets
        # behind, and creating them again would fail. Pods go first (each waits for its BlobFuse2 unmount), then the
        # PVCs and PVs (their finalizers), then the Secrets; 300 s bounds each deletion.
        kubectl delete pod posix-gen-1 -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
            fail "could not delete the leftover writer pod posix-gen-1 within 300 s"
        kubectl delete pod -n "$POSIX_NS" -l app=posix-client --ignore-not-found --wait=true --timeout=300s > /dev/null ||
            fail "could not delete the leftover elbencho service pods within 300 s"
        for name in posix-gen posix-data; do
            kubectl delete pvc "$name" -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the leftover PVC $name within 300 s"
        done
        for name in posix-gen posix-data; do
            kubectl delete pv "$name" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the leftover PV $name within 300 s"
        done
        for name in posix-gen-sas posix-sas; do
            kubectl delete secret "$name" -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the leftover Secret $name within 300 s"
        done
        # Every volume gets a new volumeHandle, which names the node's staging mount, so a node cannot keep a staging
        # mount of an earlier attempt (with that attempt's SAS).
        handle_stamp="$(date -u +%Y%m%d%H%M%S)"

        # On an account and container that exist from an earlier attempt, both commands succeed without a change:
        # account create updates the account in place with the same settings, container create reports
        # {"created": false}.
        create_account "alx$(Build.BuildId)p$(System.JobAttempt)" "westeurope"
        az storage container create \
            --name "posix-data" \
            --public-access off > /dev/null
        read_sas="$(make_sas "posix-data" rl 8)" || fail "Could not generate the read SAS; secret-bearing output withheld"
        # racwl: elbencho creates, writes and reads back files through BlobFuse2, which also lists the container.
        write_sas="$(make_sas "posix-data" racwl 4)" || fail "Could not generate the write SAS; secret-bearing output withheld"

        # 1. Read-only volume and the elbencho service pods, mounted before any data exists.
        kubectl create secret generic posix-sas -n "$POSIX_NS" \
            --from-literal=azurestorageaccountname="alx$(Build.BuildId)p$(System.JobAttempt)" \
            --from-file=azurestorageaccountsastoken=<(printf '%s' "$read_sas") \
            > /dev/null 2> >(redact >&2)
        create_manifest blob-volume.yaml volume-ro.yaml \
            -e "s|CONTAINER_NAME|posix-data|" \
            -e "s|volumeHandle: posix-data|volumeHandle: posix-data-gen-$handle_stamp|" \
            -e 's|mountOptions: \[\]|mountOptions: ["--read-only=true", "--allow-other=true"]|'
        for index in $(seq 1 5); do
            create_manifest clients-volume.yaml "client-$index.yaml" \
                -e "s|ELBENCHO_IMAGE|telescope.azurecr.io/elbencho:v3.0-37|" \
                -e "s|name: posix-client|name: posix-client-$index|"
        done
        kubectl wait -n "$POSIX_NS" --for=condition=Ready pod -l app=posix-client --timeout=600s

        # 2. The writer: the same volume and pod templates, renamed, read-write, with a BlobFuse2 block cache of
        # 16 MiB blocks. Its label differs from the clients', so it is not one of the elbencho hosts.
        # The write Secret must not outlive a failed step. This replaces the setup's EXIT trap with its cleanup plus the
        # Secret's deletion.
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"; kubectl delete secret posix-gen-sas -n "$POSIX_NS" --ignore-not-found > /dev/null 2>&1 || true' EXIT
        kubectl create secret generic posix-gen-sas -n "$POSIX_NS" \
            --from-literal=azurestorageaccountname="alx$(Build.BuildId)p$(System.JobAttempt)" \
            --from-file=azurestorageaccountsastoken=<(printf '%s' "$write_sas") \
            > /dev/null 2> >(redact >&2)
        create_manifest blob-volume.yaml volume-rw.yaml \
            -e 's|posix-data|posix-gen|g' \
            -e 's|posix-sas|posix-gen-sas|g' \
            -e 's|ReadOnlyMany|ReadWriteMany|g' \
            -e 's|readOnly: true|readOnly: false|g' \
            -e "s|volumeHandle: posix-gen|volumeHandle: posix-gen-$handle_stamp|" \
            -e "s|CONTAINER_NAME|posix-data|" \
            -e 's|mountOptions: \[\]|mountOptions: ["--allow-other=true", "--block-cache", "--block-cache-block-size=16"]|'
        create_manifest clients-volume.yaml writer.yaml \
            -e "s|ELBENCHO_IMAGE|telescope.azurecr.io/elbencho:v3.0-37|" \
            -e 's|name: posix-client|name: posix-gen-1|' \
            -e 's|app: posix-client|app: posix-gen|g' \
            -e 's|posix-data|posix-gen|g' \
            -e 's|readOnly: true|readOnly: false|g'
        kubectl wait -n "$POSIX_NS" --for=condition=Ready pod/posix-gen-1 --timeout=600s
        # The planned files, name and size; checks.jq is the one owner of the plan for the writer and the verification.
        jq -n -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --argjson sides '{"cold": ["alluxio", "bf2", "dacs"], "concurrent": ["alluxio", "bf2", "dacs"], "reread": ["alluxio", "bf2"]}' \
            'include "checks"; posix_dataset(480; 512; 25; 8; 2; 8; $sides)' > "$POSIX_WORK/dataset-plan.json"
        # The writer keeps at most 8 files open: 8 lanes, each writing one file at a time with its own elbencho run of
        # one thread over one explicit path (no -d, so no directory is created). elbencho shares every file of a run
        # among all its threads, so one run over a whole size group held all of its files open at once, and BlobFuse2's
        # block cache ran out of memory on their dirty blocks: the writes stalled with nothing committed. A lane's
        # elbencho run ends with the file closed, which commits it to Blob, before the lane opens its next file.
        # The lanes get the files largest first, each to the lane with the fewest bytes so far, so they end together.
        # Lines: <lane>:<bytes>:<path>.
        jq -r --argjson lanes 8 '([$lanes, length] | min) as $count
            | reduce sort_by(-.bytes, .name)[] as $file ({totals: [range(0; $count) | 0], lines: []};
                (.totals | index(min)) as $lane
                | .totals[$lane] += $file.bytes
                | .lines += ["\($lane + 1):\($file.bytes):/data/\($file.name)"])
            | .lines[]' "$POSIX_WORK/dataset-plan.json" > "$POSIX_WORK/dataset-lanes.txt"
        lanes="$(cut -d: -f1 "$POSIX_WORK/dataset-lanes.txt" | sort -u | wc -l | tr -d ' ')"
        file_count="$(jq length "$POSIX_WORK/dataset-plan.json")"
        [[ "$(wc -l < "$POSIX_WORK/dataset-lanes.txt" | tr -d ' ')" == "$file_count" && "$lanes" -ge 1 ]] ||
            fail "the writer's lane plan does not cover the $file_count planned files"
        writes=()
        while IFS= read -r line; do writes+=("$line"); done < "$POSIX_WORK/dataset-lanes.txt"
        # The script in the writer pod (sh): starts the lanes, waits for all of them and prints each lane's log after
        # a line "POSIX-WRITE-LANE <lane>". A lane stops at the first elbencho run that fails, and the other lanes stop
        # after their current file, so the script fails closed without writing the rest.
        # Usage: <lane count> <lane>:<bytes>:<path>...
        POSIX_WRITE_SCRIPT='lanes="$1"
        shift
        dir=/tmp/posix-write
        rm -rf "$dir"
        mkdir -p "$dir"
        lane=1
        pids=""
        while [ "$lane" -le "$lanes" ]; do
            (
                for entry in "$@"; do
                    [ "${entry%%:*}" = "$lane" ] || continue
                    rest="${entry#*:}"
                    bytes="${rest%%:*}"
                    path="${rest#*:}"
                    if [ -e "$dir/failed" ]; then
                        echo "lane $lane: stopped before $path because another lane failed"
                        exit 1
                    fi
                    echo "lane $lane: writing $path, $bytes bytes"
                    elbencho -w -t 1 -b 16M -s "$bytes" "$path"
                    status=$?
                    if [ "$status" -ne 0 ]; then
                        touch "$dir/failed"
                        echo "ALLUXIO POSIX READ FAILED: lane $lane: elbencho exited with status $status writing $path"
                        exit 1
                    fi
                done
            ) > "$dir/lane-$lane.log" 2>&1 &
            pids="$pids $!"
            lane=$((lane + 1))
        done
        failed=0
        for pid in $pids; do
            wait "$pid" || failed=1
        done
        lane=1
        while [ "$lane" -le "$lanes" ]; do
            echo "POSIX-WRITE-LANE $lane"
            cat "$dir/lane-$lane.log"
            lane=$((lane + 1))
        done
        exit $failed'
        # One detached run for the whole data set: about 850 GiB at full scale, which a full run wrote in about 15 minutes
        # (the whole step took 17). The 1800 s limit is twice that. The waits before and after the write add up to more
        # than the rest of the hour in the worst case, so the step's own limit (POSIX_STEP_TIMEOUT_MINUTES) is what keeps
        # its kubectl calls inside the Entra ID sign-in.
        pod_run posix-gen-1 1800 "$POSIX_WRITE_SCRIPT" "$lanes" "${writes[@]}" > "$POSIX_WORK/dataset-write.log"
        # One result file per lane, dataset-write-<lane>.txt, with the result table of every file the lane wrote.
        awk -v dir="$POSIX_RESULT" '/^POSIX-WRITE-LANE [0-9]+$/ { file = dir "/dataset-write-" $2 ".txt"; printf "" > file; next }
            file != "" { print > file }' "$POSIX_WORK/dataset-write.log"
        for lane in $(seq 1 "$lanes"); do
            eb_check_result "$POSIX_RESULT/dataset-write-$lane.txt" "dataset write lane $lane"
        done
        tables="$(cat "$POSIX_RESULT"/dataset-write-*.txt | grep -c '^OPERATION' || true)"
        [[ "$tables" == "$file_count" ]] || fail "the writer's lanes hold $tables elbencho result tables, expected one for each of the $file_count files"

        # 3. Remove the writer. Deleting the pod waits for the unmount, which flushes BlobFuse2's cache to Blob; 300 s
        # bounds each deletion.
        kubectl delete pod posix-gen-1 -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
            fail "could not delete the writer pod posix-gen-1 within 300 s"
        kubectl delete pvc posix-gen -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
            fail "could not delete the PVC posix-gen within 300 s"
        kubectl delete pv posix-gen --ignore-not-found --wait=true --timeout=300s > /dev/null ||
            fail "could not delete the PV posix-gen within 300 s"
        kubectl delete secret posix-gen-sas -n "$POSIX_NS" --ignore-not-found > /dev/null
        unset write_sas

        # 4. The container holds exactly the planned files. --include m exposes metadata.hdi_isfolder; --num-results
        # is explicit so a truncated listing cannot pass.
        az storage blob list \
            --container-name "posix-data" \
            --include m \
            --num-results 5000 |
            jq -e -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --argjson sides '{"cold": ["alluxio", "bf2", "dacs"], "concurrent": ["alluxio", "bf2", "dacs"], "reread": ["alluxio", "bf2"]}' \
                'include "checks"; validate_posix_dataset(480; 512; 25; 8; 2; 8; $sides)' > /dev/null ||
            fail "the Blob container does not hold exactly the planned data set"
        unset AZURE_STORAGE_KEY

        # 5. BlobFuse2 caches a failed lookup for 120 s, so a client that mounted the empty container may not see
        # the new files yet. Wait, up to 300 s, until every client lists all the hot files.
        deadline=$((SECONDS + 300))
        while :; do
            behind=0
            # An assignment keeps a failure of client_pods (a missing or NotReady pod); a command substitution in the
            # for-list would swallow it and let the loop pass with no pod checked.
            pods="$(client_pods)"
            for pod in $pods; do
                if listing="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- ls -1 /data 2> /dev/null)"; then
                    seen="$(grep -c '^p' <<< "$listing" || true)"
                else
                    seen=unreadable
                fi
                if [[ "$seen" != 480 ]]; then
                    behind=1
                    echo "$pod lists $seen hot files, expecting 480"
                fi
            done
            (( behind == 0 )) && break
            (( SECONDS < deadline )) || fail "not every client lists 480 hot files after 300 seconds"
            sleep 10
        done

        publish_secret POSIX_READ_SAS "$read_sas"
        unset read_sas
        jq -n \
            --arg account "alx$(Build.BuildId)p$(System.JobAttempt)" --arg container "posix-data" --arg location "westeurope" \
            --argjson sides '{"cold": ["alluxio", "bf2", "dacs"], "concurrent": ["alluxio", "bf2", "dacs"], "reread": ["alluxio", "bf2"]}' \
            '$ARGS.named + {hot_files: 480, hot_file_mib: 512, cold_files_per_pass: 25, cc_files_per_pass: 8, big_file_gib: 2, reread_file_gib: 8}' \
            > "$(Build.ArtifactStagingDirectory)/alluxio-posix-read/dataset.json"
    displayName: Create the Blob data set for the POSIX reads
    name: posix_dataset
    timeoutInMinutes: 55
  - bash: |
      set -exo pipefail
      TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
      echo "BENCHMARK_START_TIME: $TIMESTAMP"
      echo "##vso[task.setvariable variable=BENCHMARK_START_TIME]$TIMESTAMP"
    displayName: Record current time as BENCHMARK_START_TIME
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        POSIX_WORK="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        POSIX_RESULT="$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        POSIX_NS="alx-ns"
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        if [[ -e "$POSIX_RESULT/index.jsonl" ]]; then
            jq -c --arg side bf2 'select(.side != $side)' "$POSIX_RESULT/index.jsonl" > "$POSIX_WORK/index.jsonl"
            mv -- "$POSIX_WORK/index.jsonl" "$POSIX_RESULT/index.jsonl"
        fi
        # Runs a script in a pod, detached. A kubectl exec stream can drop during a long run and still return 0
        # while the work keeps going in the pod. So one short exec writes the script, sets its status file to
        # "pending" and starts it with setsid, stdio not tied to the exec, and later short execs poll the status
        # file until it holds the exit status. The starter script also records the pod's own clock right before
        # and after the script, and the process group id so a run can be killed. Every short exec is cut off after
        # 60 s, so a stalled stream cannot hang the step. A poll whose exec fails or is cut off is tried again, but
        # when no poll has read the status for POSIX_POLL_LOST_SECONDS, the pod is gone or kubectl can no longer reach
        # it, for example because the step's sign-in has lapsed: the run then fails with the last error. A run whose
        # status is still "pending" at its limit fails too, and the message tells whether the script was still running
        # or had stopped without writing its status. In both cases its process group is killed, if the pod can still
        # be reached. After a successful run the log and the two times are fetched again and again until they
        # arrive, never from a failed exec's error text. The log goes to stdout (or to stderr when the script
        # fails), through redact when the step defines it, as do the poll errors; POSIX_RUN_START and POSIX_RUN_END
        # hold the pod-side UTC times.
        # Usage: pod_run <pod> <limit seconds> <script text> [args...]
        pod_run() {
            local pod="$1" limit="$2" script="$3" rc="" deadline last_ok log state=""
            shift 3
            [[ "$limit" =~ ^[0-9]+$ ]] || fail "pod_run: the limit must be a number of seconds, got $limit"
            timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'printf "%s\n" "$1" > /tmp/posix-run.sh
                printf "%s\n" "$2" > /tmp/posix-start.sh
                shift 2
                rm -f /tmp/posix-run.rc /tmp/posix-run.log /tmp/posix-run.start /tmp/posix-run.end /tmp/posix-run.pid
                echo pending > /tmp/posix-run.rc
                setsid sh /tmp/posix-start.sh "$@" < /dev/null > /dev/null 2>&1 &
                echo $! > /tmp/posix-run.pid' sh "$script" 'date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.start
        sh /tmp/posix-run.sh "$@" > /tmp/posix-run.log 2>&1
        status=$?
        date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.end
        echo $status > /tmp/posix-run.rc' "$@" || fail "$pod: could not start the script"
            deadline=$((SECONDS + limit))
            last_ok=$SECONDS
            # Poll every 15 s: often enough to notice the end of a short run, rarely enough not to load the API
            # server during a long one. "pending" is a run that is still going, and an empty file a status that is
            # still being written.
            while :; do
                if rc="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.rc 2> "$POSIX_WORK/poll-$pod.err")"; then
                    last_ok=$SECONDS
                    [[ "$rc" =~ ^[0-9]+$ ]] && break
                else
                    # timeout exits with 124 when it cuts the exec off.
                    if (( $? == 124 )); then
                        echo "kubectl exec did not return within 60 s" >> "$POSIX_WORK/poll-$pod.err"
                    fi
                    if (( SECONDS - last_ok >= 300 )); then
                        rc=unreachable
                        break
                    fi
                fi
                if (( SECONDS >= deadline )); then
                    rc=timeout
                    break
                fi
                sleep 15
            done
            if [[ "$rc" != 0 ]]; then
                if [[ "$rc" == timeout || "$rc" == unreachable ]]; then
                    # The negative pid is the process group started by setsid. The exec prints whether the group was
                    # still there, and nothing if the pod cannot be reached.
                    state="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'pid="$(cat /tmp/posix-run.pid)"
                        if kill -0 -"$pid" 2> /dev/null; then kill -- -"$pid"; echo running; else echo gone; fi' 2> /dev/null)" || true
                fi
                if [[ "$rc" == unreachable ]]; then
                    fail "$pod: no check could read the status of the run for $((SECONDS - last_ok)) s; the last one failed with: $(redact_log < "$POSIX_WORK/poll-$pod.err" | tail -n 5)"
                fi
                { timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.log 2>&1 || true; } | redact_log >&2
                if [[ "$rc" == timeout ]]; then
                    case "$state" in
                        running) fail "$pod: the script was still running at its limit of $limit s" ;;
                        gone) fail "$pod: the script was no longer running at its limit of $limit s but had not written its exit status" ;;
                        *) fail "$pod: the script had not written its exit status by its limit of $limit s" ;;
                    esac
                fi
                fail "$pod: script ended with exit status $rc"
            fi
            log="$(pod_cat "$pod" /tmp/posix-run.log)"
            POSIX_RUN_START="$(pod_cat "$pod" /tmp/posix-run.start)"
            POSIX_RUN_END="$(pod_cat "$pod" /tmp/posix-run.end)"
            [[ "$POSIX_RUN_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ && "$POSIX_RUN_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
                fail "$pod: the pod-side times are not UTC timestamps: $POSIX_RUN_START $POSIX_RUN_END"
            redact_log <<< "$log"
        }

        # Copies stdin to stdout through the step's redact function, if it has one.
        redact_log() {
            if declare -F redact > /dev/null; then redact; else cat; fi
        }

        # Prints one file of a pod. A failed exec prints an error text instead of the file, so only the output
        # of a successful one counts; a few attempts cover a dropped stream.
        # Usage: pod_cat <pod> <file>
        pod_cat() {
            local out attempt
            for attempt in 1 2 3 4 5; do
                if out="$(timeout 60 kubectl exec -n "$POSIX_NS" "$1" -- cat "$2" 2> /dev/null)"; then
                    printf '%s\n' "$out"
                    return 0
                fi
                sleep 5
            done
            fail "$1: could not fetch $2"
        }

        # Prints "<name><TAB><address>" for each Ready elbencho service pod, sorted by name, from one listing,
        # and fails unless there are exactly 5: a missing service would silently shrink the
        # load. client_pods and client_ips print one column of it.
        client_list() {
            local pods list count
            pods="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o json)" ||
                fail "could not list the elbencho service pods"
            list="$(jq -r '[.items | sort_by(.metadata.name)[] |
                select(.status.phase == "Running" and
                    any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
                [.metadata.name, .status.podIP] | select(.[1] != null and .[1] != "")] | .[] | @tsv' <<< "$pods")"
            count="$(grep -c . <<< "$list" || true)"
            [[ "$count" == 5 ]] ||
                fail "expected 5 ready elbencho service pods, found $count"
            echo "$list"
        }
        client_pods() {
            client_list | cut -f1
        }
        client_ips() {
            client_list | cut -f2
        }

        POSIX_MASTER_SCRIPT='hosts="$1"
        shift
        elbencho --hosts "$hosts" --nolive "$@"'
        POSIX_LOCAL_SCRIPT='elbencho "$@"'

        # A result file must hold elbencho's result table, whose header line starts with OPERATION.
        eb_check_result() {
            grep -q OPERATION "$1" || fail "$2: no elbencho result table in $1"
        }

        # Index lines carry the group of the run ("group") when POSIX_GROUP is set, so the summary can tell the
        # single runs of the hot group from the one entry that spans them all.
        POSIX_GROUP="${POSIX_GROUP:-}"
        # The jq object that is appended to the index file; a rep is a number, or a word such as "all" for an
        # entry that spans several runs. label and end are jq keywords: jq 1.6 accepts them only as quoted keys and
        # not as variable names, hence $name and $finish.
        POSIX_INDEX_LINE='{"label": $name, side: $side, scenario: $scenario, rep: ($rep | if test("^[0-9]+$") then tonumber else . end), start: $start, "end": $finish}
            + (if $pod == "" then {} else {pod: $pod} end) + (if $group == "" then {} else {group: $group} end)'

        # Runs elbencho from the first service pod against all of them and records the result. The index line
        # lets the summary find the run and place it in time for the counter and egress windows; its times are
        # the pod's own, taken right around the elbencho command. limit is the run's pod_run limit.
        # Usage: eb_run <label> <side> <scenario> <rep> <limit seconds> <elbencho args...>
        eb_run() {
            local label="$1" side="$2" scenario="$3" rep="$4" limit="$5" list first hosts
            shift 5
            list="$(client_list)"
            first="$(head -n 1 <<< "$list" | cut -f1)"
            hosts="$(cut -f2 <<< "$list" | paste -sd, -)"
            [[ -n "$first" && -n "$hosts" ]] || fail "eb_run $label: no service pods"
            pod_run "$first" "$limit" "$POSIX_MASTER_SCRIPT" "$hosts" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_run $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs elbencho in one service pod against its own mount only and records it like eb_run, with the pod
        # name in "pod" (the re-read scenario: the same node reads the file twice).
        # Usage: eb_local <label> <side> <scenario> <rep> <pod> <limit seconds> <elbencho args...>
        eb_local() {
            local label="$1" side="$2" scenario="$3" rep="$4" pod="$5" limit="$6"
            shift 6
            pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_local $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs the same local elbencho command in every service pod at the same time (the concurrent-readers
        # scenario) and stores one result and one index line per pod, with the pod name in "pod". The scenario
        # is always 23-24. path is the file all pods read; limit is the pod_run limit of each pod's run.
        # Usage: eb_local_all <label> <side> <rep> <limit seconds> <path> <elbencho args...>
        eb_local_all() {
            local label="$1" side="$2" rep="$3" limit="$4" path="$5" pod pids=() failed=0 pods
            shift 5
            pods="$(client_pods)"
            for pod in $pods; do
                (
                    pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" "$path" > "$POSIX_RESULT/$label-$pod.txt"
                    eb_check_result "$POSIX_RESULT/$label-$pod.txt" "eb_local_all $label ($pod)"
                    jq -nc --arg name "$label-$pod" --arg side "$side" --arg scenario 23-24 --arg rep "$rep" \
                        --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                        "$POSIX_INDEX_LINE" > "$POSIX_WORK/index-$label-$pod.json"
                ) &
                pids+=($!)
            done
            for pid in "${pids[@]}"; do
                wait "$pid" || failed=1
            done
            (( failed == 0 )) || fail "eb_local_all $label: a pod failed"
            for pod in $pods; do
                cat "$POSIX_WORK/index-$label-$pod.json" >> "$POSIX_RESULT/index.jsonl"
            done
        }

        # The metrics text of every pod of one kind, each preceded by a comment line with the pod name. A pod
        # listing that fails is an error. No pods at all means the kind is not deployed in this phase; any other
        # number than 5 means a pod is missing or restarting.
        # Usage: metrics_of <namespace> <pod name prefix> <port> <path>
        metrics_of() {
            local list pods pod count
            list="$(kubectl get pods -n "$1" -o name)" || fail "could not list the pods in $1"
            pods="$(sed 's|^pod/||' <<< "$list" | grep "^$2" || true)"
            count="$(grep -c . <<< "$pods" || true)"
            [[ "$count" == 0 || "$count" == 5 ]] ||
                fail "expected 5 $2 pods in $1, found $count"
            for pod in $pods; do
                echo "# pod $pod"
                kubectl get --raw "/api/v1/namespaces/$1/pods/$pod:$3/proxy/$4" || fail "could not read the metrics of $1/$pod"
            done
        }
        # 30000 is the Alluxio worker metrics port and 9096 the DACS server's.
        alluxio_metrics() {
            metrics_of "$POSIX_NS" alluxio-worker- 30000 metrics/
        }
        dacs_metrics() {
            metrics_of dacs-cache-system bench-cache- 9096 metrics
        }
        count_pods() {
            grep -c '^# pod ' <<< "$1" || true
        }

        # Saves the raw metrics of all Alluxio workers and all DACS servers to counters-<tag>.prom, whose first
        # line records how many pods of each kind were read. A kind that is not deployed in this phase
        # contributes nothing.
        # Usage: snap_counters <tag>
        snap_counters() {
            local alluxio dacs
            alluxio="$(alluxio_metrics)" || fail "could not read the Alluxio worker metrics"
            dacs="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            {
                echo "# pods alluxio-worker-=$(count_pods "$alluxio") bench-cache-=$(count_pods "$dacs")"
                echo "$alluxio"
                echo "$dacs"
            } > "$POSIX_RESULT/counters-$1.prom"
        }

        # Runs a privileged pod on one node that flushes and drops the page cache, so the next read has to
        # come from the cache layer rather than from the node's memory.
        # Usage: drop_page_cache <node>
        drop_page_cache() {
            local node="$1" name="drop-cache-$1"
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
            kubectl create -n "$POSIX_NS" -f - << MANIFEST || fail "could not create $name"
        apiVersion: v1
        kind: Pod
        metadata:
          name: $name
        spec:
          nodeName: $node
          restartPolicy: Never
          tolerations:
            - operator: Exists
          containers:
            - name: drop
              image: mcr.microsoft.com/azurelinux/base/core:3.0
              securityContext:
                privileged: true
              command: ["sh", "-c", "sync; echo 3 > /proc/sys/vm/drop_caches"]
        MANIFEST
            # 180 s covers pulling the image on a fresh node and running two commands.
            kubectl wait -n "$POSIX_NS" --for=jsonpath='{.status.phase}'=Succeeded "pod/$name" --timeout=180s ||
                { kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null; fail "dropping the page cache on $node failed"; }
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
        }

        # The DACS servers' successful Upload requests, summed. Uploads are the asynchronous writes of freshly
        # generated data to the cache. Every one of the 5 servers must be read and must report the
        # metric: a missing server or metric would look like "no uploads" and end the wait too early.
        dacs_uploads() {
            local out total servers seen
            out="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            read -r total servers seen < <(awk '
                /^# pod / { pods++; next }
                /^cache_server_request_counter[{]/ && /request_type="Upload"/ && /status="Success"/ {
                    sum += $NF
                    if (!(pods in has)) { has[pods] = 1; seen_n++ }
                }
                END { printf "%d %d %d\n", sum, pods, seen_n }' <<< "$out")
            [[ "$servers" == 5 ]] || fail "expected 5 DACS servers, found $servers"
            [[ "$seen" == "$servers" ]] || fail "$((servers - seen)) of $servers DACS servers report no Upload request metric"
            echo "$total"
        }

        # Waits until the DACS Upload counter has not moved for two checks 20 seconds apart. Gives up after 10
        # minutes, because a cache that is still absorbing data would distort the next measurement.
        dacs_settle() {
            local previous current stable=0 deadline=$((SECONDS + 600))
            previous="$(dacs_uploads)"
            while (( stable < 2 )); do
                (( SECONDS < deadline )) || fail "DACS uploads still changing after 10 minutes"
                sleep 20
                current="$(dacs_uploads)"
                if [[ "$current" == "$previous" ]]; then
                    stable=$((stable + 1))
                else
                    stable=0
                fi
                previous="$current"
            done
        }

        # Waits until every elbencho service pod lists exactly 480 hot files (p*) in /data, for up to
        # 300 s. The Blob CSI driver mounts BlobFuse2 with --cancel-list-on-mount-seconds=10, so a listing in the
        # first 10 s after a mount is empty: the first check waits 15 s. The pod list is an assignment, so a missing or
        # NotReady pod fails here instead of leaving the loop with no pod checked.
        wait_hot_listing() {
            local deadline pods pod listing seen behind
            sleep 15
            deadline=$((SECONDS + 300))
            while :; do
                behind=0
                pods="$(client_pods)"
                for pod in $pods; do
                    if listing="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- ls -1 /data 2> /dev/null)"; then
                        seen="$(grep -c '^p' <<< "$listing" || true)"
                    else
                        seen=unreadable
                    fi
                    if [[ "$seen" != 480 ]]; then
                        behind=1
                        echo "$pod lists $seen hot files, expecting 480"
                    fi
                done
                (( behind == 0 )) && return 0
                (( SECONDS < deadline )) || fail "not every client lists 480 hot files after 300 seconds"
                sleep 10
            done
        }

        # Replaces the Blob volume and the elbencho service pods: deletes the pods, the PVC and the PV posix-data
        # (waiting until they are gone), creates them again from blob-volume.yaml and clients-volume.yaml in the
        # manifest directory with the given BlobFuse2 mount options, and waits for exactly 5 Ready
        # pods that list the hot files. The Secret posix-sas (read-only SAS) stays in place. options is a JSON list
        # with one option per item: the Blob CSI driver recognizes some options only as separate items.
        # Every mount gets a new volumeHandle, which names the node's staging mount, so a node cannot keep a staging
        # mount of the previous volume with the previous options.
        # Usage: mount_posix_volume <manifest dir> <container> <elbencho image> <tag> <options as a JSON list>
        mount_posix_volume() {
            local dir="$1" container="$2" image="$3" tag="$4" options="$5" handle index left
            handle="posix-data-$tag-$(date -u +%Y%m%d%H%M%S)"
            # 300 s bounds each deletion: a pod waits for its BlobFuse2 unmount, the PVC and PV for their finalizers.
            kubectl delete pod -n "$POSIX_NS" -l app=posix-client --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the elbencho service pods within 300 s"
            kubectl delete pvc posix-data -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PVC posix-data within 300 s"
            kubectl delete pv posix-data --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PV posix-data within 300 s"
            left="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o name)" || fail "could not list the elbencho service pods"
            [[ -z "$left" ]] || fail "elbencho service pods still exist after their deletion: $left"
            ! kubectl get pv posix-data > /dev/null 2>&1 || fail "the PV posix-data still exists after its deletion"
            sed -e "s|CONTAINER_NAME|$container|" \
                -e "s|volumeHandle: posix-data|volumeHandle: $handle|" \
                -e "s|mountOptions: \[\]|mountOptions: $options|" \
                "$dir/blob-volume.yaml" > "$POSIX_WORK/volume-$tag.yaml"
            grep -qF "mountOptions: $options" "$POSIX_WORK/volume-$tag.yaml" || fail "blob-volume.yaml has no empty mountOptions to fill"
            kubectl create -f "$POSIX_WORK/volume-$tag.yaml" > /dev/null
            for index in $(seq 1 5); do
                sed -e "s|ELBENCHO_IMAGE|$image|" -e "s|name: posix-client|name: posix-client-$index|" \
                    "$dir/clients-volume.yaml" > "$POSIX_WORK/client-$index.yaml"
                kubectl create -f "$POSIX_WORK/client-$index.yaml" > /dev/null
            done
            kubectl wait -n "$POSIX_NS" --for=condition=Ready pod -l app=posix-client --timeout=600s > /dev/null
            wait_hot_listing
        }
        # The data set's file paths whose names start with a prefix, space-separated (names have no spaces), failing
        # unless there are exactly <count>. checks.jq posix_dataset owns the names.
        # Usage: files_of <prefix> <count>
        files_of() {
            local files
            files="$(jq -nr -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg prefix "$1" \
                --argjson sides '{"cold": ["alluxio", "bf2", "dacs"], "concurrent": ["alluxio", "bf2", "dacs"], "reread": ["alluxio", "bf2"]}' \
                'include "checks"; posix_dataset(480; 512; 25; 8; 2; 8; $sides)[] | select(.name | startswith($prefix)) | "/data/" + .name' |
                paste -sd' ' -)"
            [[ "$(wc -w <<< "$files" | tr -d ' ')" == "$2" ]] || fail "expected $2 data set files named $1*, found: $files"
            echo "$files"
        }
        # Validates one elbencho result for its group and prints the parsed result.
        # Usage: eb_result <group> <result file>
        eb_result() {
            jq -Rse -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg group "$1" \
                'include "checks"; validate_elbencho_run($group; 60)' "$2" ||
                fail "$2 is not a valid result of a $1 run"
        }
        # Validates the run with this label and appends its index line plus the parsed result to runs-bf2.jsonl.
        # Usage: record_run <group> <label>
        record_run() {
            local result line
            result="$(eb_result "$1" "$POSIX_RESULT/$2.txt")"
            line="$(jq -cs --arg name "$2" --argjson result "$result" \
                'map(select(.label == $name)) | if length == 1 then .[0] + {result: $result} else error("ALLUXIO POSIX READ FAILED: not exactly one index line labelled " + $name) end' \
                "$POSIX_RESULT/index.jsonl")" || fail "could not record run $2"
            echo "$line" >> "$POSIX_RESULT/runs-bf2.jsonl"
        }
        # Runs a checks.jq filter over the counter snapshots <tag>-before and <tag>-after, given as $before and $after,
        # with $hot_bytes the size of the hot data set (hot files x file size). Extra jq arguments follow the filter.
        # Usage: counters_jq <tag> <filter> [jq args...]
        counters_jq() {
            local tag="$1" filter="$2"
            shift 2
            jq -nc -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." \
                --rawfile before "$POSIX_RESULT/counters-$tag-before.prom" --rawfile after "$POSIX_RESULT/counters-$tag-after.prom" \
                --argjson hot_bytes 257698037760 "$@" "include \"checks\"; $filter"
        }
        # One hot rep: random reads over all hot files for 60 s. --randamount 2G is the amount of one pass
        # of the whole job (all hosts together, in file mode); --infloop repeats passes until --timelimit ends the rep,
        # so every rep measures the same length of time whatever the speed.
        # Usage: hot_run <scenario> <rep> <block size> <threads>
        hot_run() {
            local label="bf2-$1-r$2"
            eb_run "$label" bf2 "$1" "$2" 360 -r --rand --randamount 2G -b "$3" -t "$4" -s 536870912 \
                --timelimit 60 --infloop --lat --latpercent $hot_files
            record_run hot "$label"
        }

        : > "$POSIX_RESULT/runs-bf2.jsonl"
        hot_files="$(files_of p 480)"
        # 2. Hot.
        POSIX_GROUP=hot
        mount_posix_volume "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" "posix-data" "telescope.azurecr.io/elbencho:v3.0-37" bf2-1 '["--read-only=true", "--allow-other=true", "--disable-kernel-cache=true", "--block-cache", "--block-cache-block-size=1", "--block-cache-prefetch=128", "--block-cache-parallelism=128"]'
        for rep in $(seq 1 3); do
            hot_run 13-16a "$rep" 4K 8
            hot_run 13-16b "$rep" 64K 8
            hot_run 17 "$rep" 1M 8
        done
        mount_posix_volume "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" "posix-data" "telescope.azurecr.io/elbencho:v3.0-37" bf2-4 '["--read-only=true", "--allow-other=true", "--disable-kernel-cache=true", "--block-cache", "--block-cache-block-size=4", "--block-cache-prefetch=128", "--block-cache-parallelism=128"]'
        for rep in $(seq 1 3); do
            hot_run 18-t8 "$rep" 4M 8
            hot_run 18-t32 "$rep" 4M 32
        done
        mount_posix_volume "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" "posix-data" "telescope.azurecr.io/elbencho:v3.0-37" bf2-1 '["--read-only=true", "--allow-other=true", "--disable-kernel-cache=true", "--block-cache", "--block-cache-block-size=1", "--block-cache-prefetch=128", "--block-cache-parallelism=128"]'
        for rep in $(seq 1 3); do
            hot_run 19-t1 "$rep" 64K 1
            hot_run 19-t4 "$rep" 64K 4
            hot_run 20-t16 "$rep" 64K 16
            hot_run 20-t64 "$rep" 64K 64
        done
        # The one hot entry of this side for the Blob egress attribution, from the first hot start to the last hot end.
        hot_span="$(jq -cs --arg side bf2 \
            'map(select(.side == $side and .group == "hot" and .rep != "all")) |
            if length == 0 then error("ALLUXIO POSIX READ FAILED: no hot run in the index") else
            {"label": ($side + "-hot"), side: $side, scenario: "hot", rep: "all", start: (map(.start) | min), "end": (map(.end) | max), group: "hot"} end' \
            "$POSIX_RESULT/index.jsonl")"
        echo "$hot_span" >> "$POSIX_RESULT/index.jsonl"
    displayName: Run the POSIX warm-up and hot reads on BlobFuse2
    name: posix_bf2_hot
    timeoutInMinutes: 55
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        POSIX_WORK="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        POSIX_RESULT="$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        POSIX_NS="alx-ns"
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        # Runs a script in a pod, detached. A kubectl exec stream can drop during a long run and still return 0
        # while the work keeps going in the pod. So one short exec writes the script, sets its status file to
        # "pending" and starts it with setsid, stdio not tied to the exec, and later short execs poll the status
        # file until it holds the exit status. The starter script also records the pod's own clock right before
        # and after the script, and the process group id so a run can be killed. Every short exec is cut off after
        # 60 s, so a stalled stream cannot hang the step. A poll whose exec fails or is cut off is tried again, but
        # when no poll has read the status for POSIX_POLL_LOST_SECONDS, the pod is gone or kubectl can no longer reach
        # it, for example because the step's sign-in has lapsed: the run then fails with the last error. A run whose
        # status is still "pending" at its limit fails too, and the message tells whether the script was still running
        # or had stopped without writing its status. In both cases its process group is killed, if the pod can still
        # be reached. After a successful run the log and the two times are fetched again and again until they
        # arrive, never from a failed exec's error text. The log goes to stdout (or to stderr when the script
        # fails), through redact when the step defines it, as do the poll errors; POSIX_RUN_START and POSIX_RUN_END
        # hold the pod-side UTC times.
        # Usage: pod_run <pod> <limit seconds> <script text> [args...]
        pod_run() {
            local pod="$1" limit="$2" script="$3" rc="" deadline last_ok log state=""
            shift 3
            [[ "$limit" =~ ^[0-9]+$ ]] || fail "pod_run: the limit must be a number of seconds, got $limit"
            timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'printf "%s\n" "$1" > /tmp/posix-run.sh
                printf "%s\n" "$2" > /tmp/posix-start.sh
                shift 2
                rm -f /tmp/posix-run.rc /tmp/posix-run.log /tmp/posix-run.start /tmp/posix-run.end /tmp/posix-run.pid
                echo pending > /tmp/posix-run.rc
                setsid sh /tmp/posix-start.sh "$@" < /dev/null > /dev/null 2>&1 &
                echo $! > /tmp/posix-run.pid' sh "$script" 'date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.start
        sh /tmp/posix-run.sh "$@" > /tmp/posix-run.log 2>&1
        status=$?
        date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.end
        echo $status > /tmp/posix-run.rc' "$@" || fail "$pod: could not start the script"
            deadline=$((SECONDS + limit))
            last_ok=$SECONDS
            # Poll every 15 s: often enough to notice the end of a short run, rarely enough not to load the API
            # server during a long one. "pending" is a run that is still going, and an empty file a status that is
            # still being written.
            while :; do
                if rc="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.rc 2> "$POSIX_WORK/poll-$pod.err")"; then
                    last_ok=$SECONDS
                    [[ "$rc" =~ ^[0-9]+$ ]] && break
                else
                    # timeout exits with 124 when it cuts the exec off.
                    if (( $? == 124 )); then
                        echo "kubectl exec did not return within 60 s" >> "$POSIX_WORK/poll-$pod.err"
                    fi
                    if (( SECONDS - last_ok >= 300 )); then
                        rc=unreachable
                        break
                    fi
                fi
                if (( SECONDS >= deadline )); then
                    rc=timeout
                    break
                fi
                sleep 15
            done
            if [[ "$rc" != 0 ]]; then
                if [[ "$rc" == timeout || "$rc" == unreachable ]]; then
                    # The negative pid is the process group started by setsid. The exec prints whether the group was
                    # still there, and nothing if the pod cannot be reached.
                    state="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'pid="$(cat /tmp/posix-run.pid)"
                        if kill -0 -"$pid" 2> /dev/null; then kill -- -"$pid"; echo running; else echo gone; fi' 2> /dev/null)" || true
                fi
                if [[ "$rc" == unreachable ]]; then
                    fail "$pod: no check could read the status of the run for $((SECONDS - last_ok)) s; the last one failed with: $(redact_log < "$POSIX_WORK/poll-$pod.err" | tail -n 5)"
                fi
                { timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.log 2>&1 || true; } | redact_log >&2
                if [[ "$rc" == timeout ]]; then
                    case "$state" in
                        running) fail "$pod: the script was still running at its limit of $limit s" ;;
                        gone) fail "$pod: the script was no longer running at its limit of $limit s but had not written its exit status" ;;
                        *) fail "$pod: the script had not written its exit status by its limit of $limit s" ;;
                    esac
                fi
                fail "$pod: script ended with exit status $rc"
            fi
            log="$(pod_cat "$pod" /tmp/posix-run.log)"
            POSIX_RUN_START="$(pod_cat "$pod" /tmp/posix-run.start)"
            POSIX_RUN_END="$(pod_cat "$pod" /tmp/posix-run.end)"
            [[ "$POSIX_RUN_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ && "$POSIX_RUN_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
                fail "$pod: the pod-side times are not UTC timestamps: $POSIX_RUN_START $POSIX_RUN_END"
            redact_log <<< "$log"
        }

        # Copies stdin to stdout through the step's redact function, if it has one.
        redact_log() {
            if declare -F redact > /dev/null; then redact; else cat; fi
        }

        # Prints one file of a pod. A failed exec prints an error text instead of the file, so only the output
        # of a successful one counts; a few attempts cover a dropped stream.
        # Usage: pod_cat <pod> <file>
        pod_cat() {
            local out attempt
            for attempt in 1 2 3 4 5; do
                if out="$(timeout 60 kubectl exec -n "$POSIX_NS" "$1" -- cat "$2" 2> /dev/null)"; then
                    printf '%s\n' "$out"
                    return 0
                fi
                sleep 5
            done
            fail "$1: could not fetch $2"
        }

        # Prints "<name><TAB><address>" for each Ready elbencho service pod, sorted by name, from one listing,
        # and fails unless there are exactly 5: a missing service would silently shrink the
        # load. client_pods and client_ips print one column of it.
        client_list() {
            local pods list count
            pods="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o json)" ||
                fail "could not list the elbencho service pods"
            list="$(jq -r '[.items | sort_by(.metadata.name)[] |
                select(.status.phase == "Running" and
                    any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
                [.metadata.name, .status.podIP] | select(.[1] != null and .[1] != "")] | .[] | @tsv' <<< "$pods")"
            count="$(grep -c . <<< "$list" || true)"
            [[ "$count" == 5 ]] ||
                fail "expected 5 ready elbencho service pods, found $count"
            echo "$list"
        }
        client_pods() {
            client_list | cut -f1
        }
        client_ips() {
            client_list | cut -f2
        }

        POSIX_MASTER_SCRIPT='hosts="$1"
        shift
        elbencho --hosts "$hosts" --nolive "$@"'
        POSIX_LOCAL_SCRIPT='elbencho "$@"'

        # A result file must hold elbencho's result table, whose header line starts with OPERATION.
        eb_check_result() {
            grep -q OPERATION "$1" || fail "$2: no elbencho result table in $1"
        }

        # Index lines carry the group of the run ("group") when POSIX_GROUP is set, so the summary can tell the
        # single runs of the hot group from the one entry that spans them all.
        POSIX_GROUP="${POSIX_GROUP:-}"
        # The jq object that is appended to the index file; a rep is a number, or a word such as "all" for an
        # entry that spans several runs. label and end are jq keywords: jq 1.6 accepts them only as quoted keys and
        # not as variable names, hence $name and $finish.
        POSIX_INDEX_LINE='{"label": $name, side: $side, scenario: $scenario, rep: ($rep | if test("^[0-9]+$") then tonumber else . end), start: $start, "end": $finish}
            + (if $pod == "" then {} else {pod: $pod} end) + (if $group == "" then {} else {group: $group} end)'

        # Runs elbencho from the first service pod against all of them and records the result. The index line
        # lets the summary find the run and place it in time for the counter and egress windows; its times are
        # the pod's own, taken right around the elbencho command. limit is the run's pod_run limit.
        # Usage: eb_run <label> <side> <scenario> <rep> <limit seconds> <elbencho args...>
        eb_run() {
            local label="$1" side="$2" scenario="$3" rep="$4" limit="$5" list first hosts
            shift 5
            list="$(client_list)"
            first="$(head -n 1 <<< "$list" | cut -f1)"
            hosts="$(cut -f2 <<< "$list" | paste -sd, -)"
            [[ -n "$first" && -n "$hosts" ]] || fail "eb_run $label: no service pods"
            pod_run "$first" "$limit" "$POSIX_MASTER_SCRIPT" "$hosts" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_run $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs elbencho in one service pod against its own mount only and records it like eb_run, with the pod
        # name in "pod" (the re-read scenario: the same node reads the file twice).
        # Usage: eb_local <label> <side> <scenario> <rep> <pod> <limit seconds> <elbencho args...>
        eb_local() {
            local label="$1" side="$2" scenario="$3" rep="$4" pod="$5" limit="$6"
            shift 6
            pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_local $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs the same local elbencho command in every service pod at the same time (the concurrent-readers
        # scenario) and stores one result and one index line per pod, with the pod name in "pod". The scenario
        # is always 23-24. path is the file all pods read; limit is the pod_run limit of each pod's run.
        # Usage: eb_local_all <label> <side> <rep> <limit seconds> <path> <elbencho args...>
        eb_local_all() {
            local label="$1" side="$2" rep="$3" limit="$4" path="$5" pod pids=() failed=0 pods
            shift 5
            pods="$(client_pods)"
            for pod in $pods; do
                (
                    pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" "$path" > "$POSIX_RESULT/$label-$pod.txt"
                    eb_check_result "$POSIX_RESULT/$label-$pod.txt" "eb_local_all $label ($pod)"
                    jq -nc --arg name "$label-$pod" --arg side "$side" --arg scenario 23-24 --arg rep "$rep" \
                        --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                        "$POSIX_INDEX_LINE" > "$POSIX_WORK/index-$label-$pod.json"
                ) &
                pids+=($!)
            done
            for pid in "${pids[@]}"; do
                wait "$pid" || failed=1
            done
            (( failed == 0 )) || fail "eb_local_all $label: a pod failed"
            for pod in $pods; do
                cat "$POSIX_WORK/index-$label-$pod.json" >> "$POSIX_RESULT/index.jsonl"
            done
        }

        # The metrics text of every pod of one kind, each preceded by a comment line with the pod name. A pod
        # listing that fails is an error. No pods at all means the kind is not deployed in this phase; any other
        # number than 5 means a pod is missing or restarting.
        # Usage: metrics_of <namespace> <pod name prefix> <port> <path>
        metrics_of() {
            local list pods pod count
            list="$(kubectl get pods -n "$1" -o name)" || fail "could not list the pods in $1"
            pods="$(sed 's|^pod/||' <<< "$list" | grep "^$2" || true)"
            count="$(grep -c . <<< "$pods" || true)"
            [[ "$count" == 0 || "$count" == 5 ]] ||
                fail "expected 5 $2 pods in $1, found $count"
            for pod in $pods; do
                echo "# pod $pod"
                kubectl get --raw "/api/v1/namespaces/$1/pods/$pod:$3/proxy/$4" || fail "could not read the metrics of $1/$pod"
            done
        }
        # 30000 is the Alluxio worker metrics port and 9096 the DACS server's.
        alluxio_metrics() {
            metrics_of "$POSIX_NS" alluxio-worker- 30000 metrics/
        }
        dacs_metrics() {
            metrics_of dacs-cache-system bench-cache- 9096 metrics
        }
        count_pods() {
            grep -c '^# pod ' <<< "$1" || true
        }

        # Saves the raw metrics of all Alluxio workers and all DACS servers to counters-<tag>.prom, whose first
        # line records how many pods of each kind were read. A kind that is not deployed in this phase
        # contributes nothing.
        # Usage: snap_counters <tag>
        snap_counters() {
            local alluxio dacs
            alluxio="$(alluxio_metrics)" || fail "could not read the Alluxio worker metrics"
            dacs="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            {
                echo "# pods alluxio-worker-=$(count_pods "$alluxio") bench-cache-=$(count_pods "$dacs")"
                echo "$alluxio"
                echo "$dacs"
            } > "$POSIX_RESULT/counters-$1.prom"
        }

        # Runs a privileged pod on one node that flushes and drops the page cache, so the next read has to
        # come from the cache layer rather than from the node's memory.
        # Usage: drop_page_cache <node>
        drop_page_cache() {
            local node="$1" name="drop-cache-$1"
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
            kubectl create -n "$POSIX_NS" -f - << MANIFEST || fail "could not create $name"
        apiVersion: v1
        kind: Pod
        metadata:
          name: $name
        spec:
          nodeName: $node
          restartPolicy: Never
          tolerations:
            - operator: Exists
          containers:
            - name: drop
              image: mcr.microsoft.com/azurelinux/base/core:3.0
              securityContext:
                privileged: true
              command: ["sh", "-c", "sync; echo 3 > /proc/sys/vm/drop_caches"]
        MANIFEST
            # 180 s covers pulling the image on a fresh node and running two commands.
            kubectl wait -n "$POSIX_NS" --for=jsonpath='{.status.phase}'=Succeeded "pod/$name" --timeout=180s ||
                { kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null; fail "dropping the page cache on $node failed"; }
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
        }

        # The DACS servers' successful Upload requests, summed. Uploads are the asynchronous writes of freshly
        # generated data to the cache. Every one of the 5 servers must be read and must report the
        # metric: a missing server or metric would look like "no uploads" and end the wait too early.
        dacs_uploads() {
            local out total servers seen
            out="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            read -r total servers seen < <(awk '
                /^# pod / { pods++; next }
                /^cache_server_request_counter[{]/ && /request_type="Upload"/ && /status="Success"/ {
                    sum += $NF
                    if (!(pods in has)) { has[pods] = 1; seen_n++ }
                }
                END { printf "%d %d %d\n", sum, pods, seen_n }' <<< "$out")
            [[ "$servers" == 5 ]] || fail "expected 5 DACS servers, found $servers"
            [[ "$seen" == "$servers" ]] || fail "$((servers - seen)) of $servers DACS servers report no Upload request metric"
            echo "$total"
        }

        # Waits until the DACS Upload counter has not moved for two checks 20 seconds apart. Gives up after 10
        # minutes, because a cache that is still absorbing data would distort the next measurement.
        dacs_settle() {
            local previous current stable=0 deadline=$((SECONDS + 600))
            previous="$(dacs_uploads)"
            while (( stable < 2 )); do
                (( SECONDS < deadline )) || fail "DACS uploads still changing after 10 minutes"
                sleep 20
                current="$(dacs_uploads)"
                if [[ "$current" == "$previous" ]]; then
                    stable=$((stable + 1))
                else
                    stable=0
                fi
                previous="$current"
            done
        }

        # Waits until every elbencho service pod lists exactly 480 hot files (p*) in /data, for up to
        # 300 s. The Blob CSI driver mounts BlobFuse2 with --cancel-list-on-mount-seconds=10, so a listing in the
        # first 10 s after a mount is empty: the first check waits 15 s. The pod list is an assignment, so a missing or
        # NotReady pod fails here instead of leaving the loop with no pod checked.
        wait_hot_listing() {
            local deadline pods pod listing seen behind
            sleep 15
            deadline=$((SECONDS + 300))
            while :; do
                behind=0
                pods="$(client_pods)"
                for pod in $pods; do
                    if listing="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- ls -1 /data 2> /dev/null)"; then
                        seen="$(grep -c '^p' <<< "$listing" || true)"
                    else
                        seen=unreadable
                    fi
                    if [[ "$seen" != 480 ]]; then
                        behind=1
                        echo "$pod lists $seen hot files, expecting 480"
                    fi
                done
                (( behind == 0 )) && return 0
                (( SECONDS < deadline )) || fail "not every client lists 480 hot files after 300 seconds"
                sleep 10
            done
        }

        # Replaces the Blob volume and the elbencho service pods: deletes the pods, the PVC and the PV posix-data
        # (waiting until they are gone), creates them again from blob-volume.yaml and clients-volume.yaml in the
        # manifest directory with the given BlobFuse2 mount options, and waits for exactly 5 Ready
        # pods that list the hot files. The Secret posix-sas (read-only SAS) stays in place. options is a JSON list
        # with one option per item: the Blob CSI driver recognizes some options only as separate items.
        # Every mount gets a new volumeHandle, which names the node's staging mount, so a node cannot keep a staging
        # mount of the previous volume with the previous options.
        # Usage: mount_posix_volume <manifest dir> <container> <elbencho image> <tag> <options as a JSON list>
        mount_posix_volume() {
            local dir="$1" container="$2" image="$3" tag="$4" options="$5" handle index left
            handle="posix-data-$tag-$(date -u +%Y%m%d%H%M%S)"
            # 300 s bounds each deletion: a pod waits for its BlobFuse2 unmount, the PVC and PV for their finalizers.
            kubectl delete pod -n "$POSIX_NS" -l app=posix-client --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the elbencho service pods within 300 s"
            kubectl delete pvc posix-data -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PVC posix-data within 300 s"
            kubectl delete pv posix-data --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PV posix-data within 300 s"
            left="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o name)" || fail "could not list the elbencho service pods"
            [[ -z "$left" ]] || fail "elbencho service pods still exist after their deletion: $left"
            ! kubectl get pv posix-data > /dev/null 2>&1 || fail "the PV posix-data still exists after its deletion"
            sed -e "s|CONTAINER_NAME|$container|" \
                -e "s|volumeHandle: posix-data|volumeHandle: $handle|" \
                -e "s|mountOptions: \[\]|mountOptions: $options|" \
                "$dir/blob-volume.yaml" > "$POSIX_WORK/volume-$tag.yaml"
            grep -qF "mountOptions: $options" "$POSIX_WORK/volume-$tag.yaml" || fail "blob-volume.yaml has no empty mountOptions to fill"
            kubectl create -f "$POSIX_WORK/volume-$tag.yaml" > /dev/null
            for index in $(seq 1 5); do
                sed -e "s|ELBENCHO_IMAGE|$image|" -e "s|name: posix-client|name: posix-client-$index|" \
                    "$dir/clients-volume.yaml" > "$POSIX_WORK/client-$index.yaml"
                kubectl create -f "$POSIX_WORK/client-$index.yaml" > /dev/null
            done
            kubectl wait -n "$POSIX_NS" --for=condition=Ready pod -l app=posix-client --timeout=600s > /dev/null
            wait_hot_listing
        }
        # The data set's file paths whose names start with a prefix, space-separated (names have no spaces), failing
        # unless there are exactly <count>. checks.jq posix_dataset owns the names.
        # Usage: files_of <prefix> <count>
        files_of() {
            local files
            files="$(jq -nr -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg prefix "$1" \
                --argjson sides '{"cold": ["alluxio", "bf2", "dacs"], "concurrent": ["alluxio", "bf2", "dacs"], "reread": ["alluxio", "bf2"]}' \
                'include "checks"; posix_dataset(480; 512; 25; 8; 2; 8; $sides)[] | select(.name | startswith($prefix)) | "/data/" + .name' |
                paste -sd' ' -)"
            [[ "$(wc -w <<< "$files" | tr -d ' ')" == "$2" ]] || fail "expected $2 data set files named $1*, found: $files"
            echo "$files"
        }
        # Validates one elbencho result for its group and prints the parsed result.
        # Usage: eb_result <group> <result file>
        eb_result() {
            jq -Rse -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg group "$1" \
                'include "checks"; validate_elbencho_run($group; 60)' "$2" ||
                fail "$2 is not a valid result of a $1 run"
        }
        # Validates the run with this label and appends its index line plus the parsed result to runs-bf2.jsonl.
        # Usage: record_run <group> <label>
        record_run() {
            local result line
            result="$(eb_result "$1" "$POSIX_RESULT/$2.txt")"
            line="$(jq -cs --arg name "$2" --argjson result "$result" \
                'map(select(.label == $name)) | if length == 1 then .[0] + {result: $result} else error("ALLUXIO POSIX READ FAILED: not exactly one index line labelled " + $name) end' \
                "$POSIX_RESULT/index.jsonl")" || fail "could not record run $2"
            echo "$line" >> "$POSIX_RESULT/runs-bf2.jsonl"
        }
        # Runs a checks.jq filter over the counter snapshots <tag>-before and <tag>-after, given as $before and $after,
        # with $hot_bytes the size of the hot data set (hot files x file size). Extra jq arguments follow the filter.
        # Usage: counters_jq <tag> <filter> [jq args...]
        counters_jq() {
            local tag="$1" filter="$2"
            shift 2
            jq -nc -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." \
                --rawfile before "$POSIX_RESULT/counters-$tag-before.prom" --rawfile after "$POSIX_RESULT/counters-$tag-after.prom" \
                --argjson hot_bytes 257698037760 "$@" "include \"checks\"; $filter"
        }
        # One hot rep: random reads over all hot files for 60 s. --randamount 2G is the amount of one pass
        # of the whole job (all hosts together, in file mode); --infloop repeats passes until --timelimit ends the rep,
        # so every rep measures the same length of time whatever the speed.
        # Usage: hot_run <scenario> <rep> <block size> <threads>
        hot_run() {
            local label="bf2-$1-r$2"
            eb_run "$label" bf2 "$1" "$2" 360 -r --rand --randamount 2G -b "$3" -t "$4" -s 536870912 \
                --timelimit 60 --infloop --lat --latpercent $hot_files
            record_run hot "$label"
        }

        [[ -s "$POSIX_RESULT/runs-bf2.jsonl" && -s "$POSIX_RESULT/index.jsonl" ]] ||
            fail "the hot reads of bf2 have not run: runs-bf2.jsonl or index.jsonl is missing or empty"
        mount_options="$(kubectl get pv posix-data -o json | jq -c '.spec.mountOptions')" ||
            fail "could not read the mount options of the volume posix-data"
        jq -en --argjson got "$mount_options" --argjson want '["--read-only=true", "--allow-other=true", "--disable-kernel-cache=true", "--block-cache", "--block-cache-block-size=1", "--block-cache-prefetch=128", "--block-cache-parallelism=128"]' '$got == $want' > /dev/null ||
            fail "the volume posix-data is mounted with $mount_options, not with the options of the bf2 cold and concurrent reads; run the hot step of bf2 again first"
        jq -c --arg side bf2 'select(.side != $side or .group == "warmup" or .group == "hot")' "$POSIX_RESULT/index.jsonl" > "$POSIX_WORK/index.jsonl"
        mv -- "$POSIX_WORK/index.jsonl" "$POSIX_RESULT/index.jsonl"
        jq -c 'select(.group == "hot")' "$POSIX_RESULT/runs-bf2.jsonl" > "$POSIX_WORK/runs.jsonl"
        mv -- "$POSIX_WORK/runs.jsonl" "$POSIX_RESULT/runs-bf2.jsonl"
        hot_runs="$(jq -cs 'map(.group) | group_by(.) | map({(.[0]): length}) | add // {}' "$POSIX_RESULT/runs-bf2.jsonl")" ||
            fail "could not read runs-bf2.jsonl"
        jq -en --argjson got "$hot_runs" --argjson want '{"hot": 27}' '$got == $want' > /dev/null ||
            fail "runs-bf2.jsonl holds the groups $hot_runs, not exactly the hot runs {"hot": 27}"
        hot_index="$(jq -cs --arg side bf2 'map(select(.side == $side) | if .rep == "all" then .scenario + "-all" else .group end) | group_by(.) | map({(.[0]): length}) | add // {}' "$POSIX_RESULT/index.jsonl")" ||
            fail "could not read index.jsonl"
        jq -en --argjson got "$hot_index" --argjson want '{"hot-all": 1, "hot": 27}' '$got == $want' > /dev/null ||
            fail "index.jsonl holds the bf2 entries $hot_index, not exactly {"hot-all": 1, "hot": 27}"
        # 3. Cold: every rep reads a set of this side that nothing has read before. Three minutes of quiet before the
        # first rep.
        POSIX_GROUP=cold
        sleep 180
        for rep in $(seq 1 3); do
            (( rep == 1 )) || sleep 70
            cold_files="$(files_of "bf2-cold-r$rep-" 25)"
            # The whole job reads 1536 MiB at random offsets of the set and then ends (no --infloop); --timelimit 120
            # stops a rep that is slower than that, which the summary then compares by IOPS and marks as timed out.
            eb_run bf2-21-22-r$rep bf2 21-22 "$rep" 420 -r --rand --randamount 1536M -b 64K -t 8 -s 2147483648 \
                --timelimit 120 --lat --latpercent $cold_files
            record_run cold bf2-21-22-r$rep
        done

        # 4. Concurrent: every client reads the whole set bf2-cc-r<rep> at the same time (eb_local_all).
        POSIX_GROUP=concurrent
        sleep 70
        cc_run() {
            local rep="$1" files path pods pod
            files="$(files_of "bf2-cc-r$rep-" 8)"
            # $files is split on purpose: the first file is eb_local_all's path, the others follow the options.
            set -- $files
            path="$1"
            shift
            eb_local_all bf2-23-24-r$rep bf2 "$rep" 463 "$path" -r -b 16M -t 8 -s 2147483648 "$@"
            pods="$(client_pods)"
            for pod in $pods; do
                record_run concurrent bf2-23-24-r$rep-$pod
            done
        }
        for rep in $(seq 1 3); do
            (( rep == 1 )) || sleep 70
            cc_run "$rep"
        done
        # 5. Re-read: the same node reads bf2-m8 twice, on a mount that keeps the kernel page cache; the node's page cache
        # is dropped before the first read.
        mount_posix_volume "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" "posix-data" "telescope.azurecr.io/elbencho:v3.0-37" bf2-0 '["--read-only=true", "--allow-other=true"]'
        POSIX_GROUP=reread
        sleep 70
        pods="$(client_pods)"
        reread_pod="$(head -n 1 <<< "$pods")"
        reread_node="$(kubectl get pod "$reread_pod" -n "$POSIX_NS" -o jsonpath='{.spec.nodeName}')"
        [[ -n "$reread_node" ]] || fail "could not find the node of $reread_pod"
        reread_file="$(files_of bf2-m8 1)"
        reread_run() {
            eb_local bf2-29-r$1 bf2 29 "$1" "$reread_pod" 381 -r -b 16M -t 1 -s 8589934592 $reread_file
            record_run reread bf2-29-r$1
        }
        drop_page_cache "$reread_node"
        reread_run 1
        sleep 70
        reread_run 2
    displayName: Run the POSIX cold, concurrent and re-read scenarios on BlobFuse2
    name: posix_bf2_rest
    timeoutInMinutes: 55
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        create_node_pool \
          --cluster-name "alluxio-posix-read" \
          --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --name "dacspool" \
          --node-count 5 \
          --node-vm-size "Standard_D16ds_v6" \
          --mode User \
          --labels "dacs.azure.com/processing-unit=cpu" \
          --node-osdisk-type Managed
    displayName: Create node pool dacspool
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        POSIX_WORK="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        POSIX_RESULT="$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        POSIX_NS="alx-ns"
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        wait_until() {
            local timeout="$1" what="$2" deadline
            shift 2
            deadline=$((SECONDS + timeout))
            until "$@"; do
                (( SECONDS < deadline )) || fail "timed out after $timeout s waiting for $what"
                sleep 15
            done
        }
        dacs_prereq_ready() {
            local ds
            ds="$(kubectl get daemonset dacs-prereq -n kube-system -o json)" || return 1
            jq -e --argjson want 5 \
                '.status.desiredNumberScheduled == $want and .status.numberReady == $want' <<< "$ds" > /dev/null
        }
        dacs_servers_ready() {
            local pods
            pods="$(kubectl get pods -n dacs-cache-system -o json)" || return 1
            jq -e --argjson want 5 \
                '[.items[] | select(.metadata.name | startswith("bench-cache-"))] as $p |
                ($p | length) == $want and
                all($p[]; .status.phase == "Running" and any(.status.conditions[]?; .type == "Ready" and .status == "True"))' \
                <<< "$pods" > /dev/null
        }

        # The extensions go into a directory of this step only, so no other step of the job, and no other job on the
        # agent, runs az with them (aks-preview replaces commands such as az aks nodepool). The directory starts empty,
        # so the pinned versions are the ones that run.
        export AZURE_EXTENSION_DIR="$POSIX_WORK/dacs-az-extensions"
        rm -rf -- "$AZURE_EXTENSION_DIR"
        az extension add \
            --name aks-preview \
            --version "22.0.0b16" \
            --yes
        az extension add \
            --name k8s-extension \
            --version "1.9.5" \
            --yes
        az aks update \
            --name "alluxio-posix-read" \
            --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --enable-azure-container-storage distributedAccelerator \
            --yes
        az extension show \
            --name aks-preview \
            --query version \
            --output tsv > "$POSIX_RESULT/dacs-aks-preview-version.txt"
        az extension show \
            --name k8s-extension \
            --query version \
            --output tsv > "$POSIX_RESULT/dacs-k8s-extension-version.txt"
        az aks show \
            --name "alluxio-posix-read" \
            --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --query storageProfile \
            --output json > "$POSIX_RESULT/dacs-storage-profile.json"

        # Idempotent: nodes that already carry the label from node pool creation are left as they are.
        kubectl label nodes \
            --selector agentpool=dacspool \
            --overwrite \
            dacs.azure.com/processing-unit=cpu
        labelled="$(kubectl get nodes --selector dacs.azure.com/processing-unit=cpu --no-headers | grep -c . || true)"
        [[ "$labelled" == 5 ]] || fail "expected 5 nodes labelled dacs.azure.com/processing-unit=cpu, found $labelled"

        kubectl get namespace dacs-cache-system > /dev/null 2>&1 || kubectl create namespace dacs-cache-system

        # The NVMe preparation DaemonSet must be ready on every cache node before the Cache is created. 900 s covers
        # pulling its image on fresh nodes and building the RAID0 volume.
        wait_until 900 "the dacs-prereq DaemonSet to be ready on 5 nodes" dacs_prereq_ready

        sed "s|POSIX_CACHE_COUNT|5|" "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/dacs-cache.yaml" > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/dacs-cache.yaml"
        kubectl create -f "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/dacs-cache.yaml"
        # 900 s covers pulling the server image on fresh nodes.
        wait_until 900 "exactly 5 bench-cache- servers to be Ready" dacs_servers_ready
    displayName: Enable DACS and create the cache
    timeoutInMinutes: 55
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        POSIX_WORK="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        POSIX_RESULT="$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        POSIX_NS="alx-ns"
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        if [[ -e "$POSIX_RESULT/index.jsonl" ]]; then
            jq -c --arg side dacs 'select(.side != $side)' "$POSIX_RESULT/index.jsonl" > "$POSIX_WORK/index.jsonl"
            mv -- "$POSIX_WORK/index.jsonl" "$POSIX_RESULT/index.jsonl"
        fi
        # Runs a script in a pod, detached. A kubectl exec stream can drop during a long run and still return 0
        # while the work keeps going in the pod. So one short exec writes the script, sets its status file to
        # "pending" and starts it with setsid, stdio not tied to the exec, and later short execs poll the status
        # file until it holds the exit status. The starter script also records the pod's own clock right before
        # and after the script, and the process group id so a run can be killed. Every short exec is cut off after
        # 60 s, so a stalled stream cannot hang the step. A poll whose exec fails or is cut off is tried again, but
        # when no poll has read the status for POSIX_POLL_LOST_SECONDS, the pod is gone or kubectl can no longer reach
        # it, for example because the step's sign-in has lapsed: the run then fails with the last error. A run whose
        # status is still "pending" at its limit fails too, and the message tells whether the script was still running
        # or had stopped without writing its status. In both cases its process group is killed, if the pod can still
        # be reached. After a successful run the log and the two times are fetched again and again until they
        # arrive, never from a failed exec's error text. The log goes to stdout (or to stderr when the script
        # fails), through redact when the step defines it, as do the poll errors; POSIX_RUN_START and POSIX_RUN_END
        # hold the pod-side UTC times.
        # Usage: pod_run <pod> <limit seconds> <script text> [args...]
        pod_run() {
            local pod="$1" limit="$2" script="$3" rc="" deadline last_ok log state=""
            shift 3
            [[ "$limit" =~ ^[0-9]+$ ]] || fail "pod_run: the limit must be a number of seconds, got $limit"
            timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'printf "%s\n" "$1" > /tmp/posix-run.sh
                printf "%s\n" "$2" > /tmp/posix-start.sh
                shift 2
                rm -f /tmp/posix-run.rc /tmp/posix-run.log /tmp/posix-run.start /tmp/posix-run.end /tmp/posix-run.pid
                echo pending > /tmp/posix-run.rc
                setsid sh /tmp/posix-start.sh "$@" < /dev/null > /dev/null 2>&1 &
                echo $! > /tmp/posix-run.pid' sh "$script" 'date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.start
        sh /tmp/posix-run.sh "$@" > /tmp/posix-run.log 2>&1
        status=$?
        date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.end
        echo $status > /tmp/posix-run.rc' "$@" || fail "$pod: could not start the script"
            deadline=$((SECONDS + limit))
            last_ok=$SECONDS
            # Poll every 15 s: often enough to notice the end of a short run, rarely enough not to load the API
            # server during a long one. "pending" is a run that is still going, and an empty file a status that is
            # still being written.
            while :; do
                if rc="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.rc 2> "$POSIX_WORK/poll-$pod.err")"; then
                    last_ok=$SECONDS
                    [[ "$rc" =~ ^[0-9]+$ ]] && break
                else
                    # timeout exits with 124 when it cuts the exec off.
                    if (( $? == 124 )); then
                        echo "kubectl exec did not return within 60 s" >> "$POSIX_WORK/poll-$pod.err"
                    fi
                    if (( SECONDS - last_ok >= 300 )); then
                        rc=unreachable
                        break
                    fi
                fi
                if (( SECONDS >= deadline )); then
                    rc=timeout
                    break
                fi
                sleep 15
            done
            if [[ "$rc" != 0 ]]; then
                if [[ "$rc" == timeout || "$rc" == unreachable ]]; then
                    # The negative pid is the process group started by setsid. The exec prints whether the group was
                    # still there, and nothing if the pod cannot be reached.
                    state="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'pid="$(cat /tmp/posix-run.pid)"
                        if kill -0 -"$pid" 2> /dev/null; then kill -- -"$pid"; echo running; else echo gone; fi' 2> /dev/null)" || true
                fi
                if [[ "$rc" == unreachable ]]; then
                    fail "$pod: no check could read the status of the run for $((SECONDS - last_ok)) s; the last one failed with: $(redact_log < "$POSIX_WORK/poll-$pod.err" | tail -n 5)"
                fi
                { timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.log 2>&1 || true; } | redact_log >&2
                if [[ "$rc" == timeout ]]; then
                    case "$state" in
                        running) fail "$pod: the script was still running at its limit of $limit s" ;;
                        gone) fail "$pod: the script was no longer running at its limit of $limit s but had not written its exit status" ;;
                        *) fail "$pod: the script had not written its exit status by its limit of $limit s" ;;
                    esac
                fi
                fail "$pod: script ended with exit status $rc"
            fi
            log="$(pod_cat "$pod" /tmp/posix-run.log)"
            POSIX_RUN_START="$(pod_cat "$pod" /tmp/posix-run.start)"
            POSIX_RUN_END="$(pod_cat "$pod" /tmp/posix-run.end)"
            [[ "$POSIX_RUN_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ && "$POSIX_RUN_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
                fail "$pod: the pod-side times are not UTC timestamps: $POSIX_RUN_START $POSIX_RUN_END"
            redact_log <<< "$log"
        }

        # Copies stdin to stdout through the step's redact function, if it has one.
        redact_log() {
            if declare -F redact > /dev/null; then redact; else cat; fi
        }

        # Prints one file of a pod. A failed exec prints an error text instead of the file, so only the output
        # of a successful one counts; a few attempts cover a dropped stream.
        # Usage: pod_cat <pod> <file>
        pod_cat() {
            local out attempt
            for attempt in 1 2 3 4 5; do
                if out="$(timeout 60 kubectl exec -n "$POSIX_NS" "$1" -- cat "$2" 2> /dev/null)"; then
                    printf '%s\n' "$out"
                    return 0
                fi
                sleep 5
            done
            fail "$1: could not fetch $2"
        }

        # Prints "<name><TAB><address>" for each Ready elbencho service pod, sorted by name, from one listing,
        # and fails unless there are exactly 5: a missing service would silently shrink the
        # load. client_pods and client_ips print one column of it.
        client_list() {
            local pods list count
            pods="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o json)" ||
                fail "could not list the elbencho service pods"
            list="$(jq -r '[.items | sort_by(.metadata.name)[] |
                select(.status.phase == "Running" and
                    any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
                [.metadata.name, .status.podIP] | select(.[1] != null and .[1] != "")] | .[] | @tsv' <<< "$pods")"
            count="$(grep -c . <<< "$list" || true)"
            [[ "$count" == 5 ]] ||
                fail "expected 5 ready elbencho service pods, found $count"
            echo "$list"
        }
        client_pods() {
            client_list | cut -f1
        }
        client_ips() {
            client_list | cut -f2
        }

        POSIX_MASTER_SCRIPT='hosts="$1"
        shift
        elbencho --hosts "$hosts" --nolive "$@"'
        POSIX_LOCAL_SCRIPT='elbencho "$@"'

        # A result file must hold elbencho's result table, whose header line starts with OPERATION.
        eb_check_result() {
            grep -q OPERATION "$1" || fail "$2: no elbencho result table in $1"
        }

        # Index lines carry the group of the run ("group") when POSIX_GROUP is set, so the summary can tell the
        # single runs of the hot group from the one entry that spans them all.
        POSIX_GROUP="${POSIX_GROUP:-}"
        # The jq object that is appended to the index file; a rep is a number, or a word such as "all" for an
        # entry that spans several runs. label and end are jq keywords: jq 1.6 accepts them only as quoted keys and
        # not as variable names, hence $name and $finish.
        POSIX_INDEX_LINE='{"label": $name, side: $side, scenario: $scenario, rep: ($rep | if test("^[0-9]+$") then tonumber else . end), start: $start, "end": $finish}
            + (if $pod == "" then {} else {pod: $pod} end) + (if $group == "" then {} else {group: $group} end)'

        # Runs elbencho from the first service pod against all of them and records the result. The index line
        # lets the summary find the run and place it in time for the counter and egress windows; its times are
        # the pod's own, taken right around the elbencho command. limit is the run's pod_run limit.
        # Usage: eb_run <label> <side> <scenario> <rep> <limit seconds> <elbencho args...>
        eb_run() {
            local label="$1" side="$2" scenario="$3" rep="$4" limit="$5" list first hosts
            shift 5
            list="$(client_list)"
            first="$(head -n 1 <<< "$list" | cut -f1)"
            hosts="$(cut -f2 <<< "$list" | paste -sd, -)"
            [[ -n "$first" && -n "$hosts" ]] || fail "eb_run $label: no service pods"
            pod_run "$first" "$limit" "$POSIX_MASTER_SCRIPT" "$hosts" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_run $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs elbencho in one service pod against its own mount only and records it like eb_run, with the pod
        # name in "pod" (the re-read scenario: the same node reads the file twice).
        # Usage: eb_local <label> <side> <scenario> <rep> <pod> <limit seconds> <elbencho args...>
        eb_local() {
            local label="$1" side="$2" scenario="$3" rep="$4" pod="$5" limit="$6"
            shift 6
            pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_local $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs the same local elbencho command in every service pod at the same time (the concurrent-readers
        # scenario) and stores one result and one index line per pod, with the pod name in "pod". The scenario
        # is always 23-24. path is the file all pods read; limit is the pod_run limit of each pod's run.
        # Usage: eb_local_all <label> <side> <rep> <limit seconds> <path> <elbencho args...>
        eb_local_all() {
            local label="$1" side="$2" rep="$3" limit="$4" path="$5" pod pids=() failed=0 pods
            shift 5
            pods="$(client_pods)"
            for pod in $pods; do
                (
                    pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" "$path" > "$POSIX_RESULT/$label-$pod.txt"
                    eb_check_result "$POSIX_RESULT/$label-$pod.txt" "eb_local_all $label ($pod)"
                    jq -nc --arg name "$label-$pod" --arg side "$side" --arg scenario 23-24 --arg rep "$rep" \
                        --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                        "$POSIX_INDEX_LINE" > "$POSIX_WORK/index-$label-$pod.json"
                ) &
                pids+=($!)
            done
            for pid in "${pids[@]}"; do
                wait "$pid" || failed=1
            done
            (( failed == 0 )) || fail "eb_local_all $label: a pod failed"
            for pod in $pods; do
                cat "$POSIX_WORK/index-$label-$pod.json" >> "$POSIX_RESULT/index.jsonl"
            done
        }

        # The metrics text of every pod of one kind, each preceded by a comment line with the pod name. A pod
        # listing that fails is an error. No pods at all means the kind is not deployed in this phase; any other
        # number than 5 means a pod is missing or restarting.
        # Usage: metrics_of <namespace> <pod name prefix> <port> <path>
        metrics_of() {
            local list pods pod count
            list="$(kubectl get pods -n "$1" -o name)" || fail "could not list the pods in $1"
            pods="$(sed 's|^pod/||' <<< "$list" | grep "^$2" || true)"
            count="$(grep -c . <<< "$pods" || true)"
            [[ "$count" == 0 || "$count" == 5 ]] ||
                fail "expected 5 $2 pods in $1, found $count"
            for pod in $pods; do
                echo "# pod $pod"
                kubectl get --raw "/api/v1/namespaces/$1/pods/$pod:$3/proxy/$4" || fail "could not read the metrics of $1/$pod"
            done
        }
        # 30000 is the Alluxio worker metrics port and 9096 the DACS server's.
        alluxio_metrics() {
            metrics_of "$POSIX_NS" alluxio-worker- 30000 metrics/
        }
        dacs_metrics() {
            metrics_of dacs-cache-system bench-cache- 9096 metrics
        }
        count_pods() {
            grep -c '^# pod ' <<< "$1" || true
        }

        # Saves the raw metrics of all Alluxio workers and all DACS servers to counters-<tag>.prom, whose first
        # line records how many pods of each kind were read. A kind that is not deployed in this phase
        # contributes nothing.
        # Usage: snap_counters <tag>
        snap_counters() {
            local alluxio dacs
            alluxio="$(alluxio_metrics)" || fail "could not read the Alluxio worker metrics"
            dacs="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            {
                echo "# pods alluxio-worker-=$(count_pods "$alluxio") bench-cache-=$(count_pods "$dacs")"
                echo "$alluxio"
                echo "$dacs"
            } > "$POSIX_RESULT/counters-$1.prom"
        }

        # Runs a privileged pod on one node that flushes and drops the page cache, so the next read has to
        # come from the cache layer rather than from the node's memory.
        # Usage: drop_page_cache <node>
        drop_page_cache() {
            local node="$1" name="drop-cache-$1"
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
            kubectl create -n "$POSIX_NS" -f - << MANIFEST || fail "could not create $name"
        apiVersion: v1
        kind: Pod
        metadata:
          name: $name
        spec:
          nodeName: $node
          restartPolicy: Never
          tolerations:
            - operator: Exists
          containers:
            - name: drop
              image: mcr.microsoft.com/azurelinux/base/core:3.0
              securityContext:
                privileged: true
              command: ["sh", "-c", "sync; echo 3 > /proc/sys/vm/drop_caches"]
        MANIFEST
            # 180 s covers pulling the image on a fresh node and running two commands.
            kubectl wait -n "$POSIX_NS" --for=jsonpath='{.status.phase}'=Succeeded "pod/$name" --timeout=180s ||
                { kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null; fail "dropping the page cache on $node failed"; }
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
        }

        # The DACS servers' successful Upload requests, summed. Uploads are the asynchronous writes of freshly
        # generated data to the cache. Every one of the 5 servers must be read and must report the
        # metric: a missing server or metric would look like "no uploads" and end the wait too early.
        dacs_uploads() {
            local out total servers seen
            out="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            read -r total servers seen < <(awk '
                /^# pod / { pods++; next }
                /^cache_server_request_counter[{]/ && /request_type="Upload"/ && /status="Success"/ {
                    sum += $NF
                    if (!(pods in has)) { has[pods] = 1; seen_n++ }
                }
                END { printf "%d %d %d\n", sum, pods, seen_n }' <<< "$out")
            [[ "$servers" == 5 ]] || fail "expected 5 DACS servers, found $servers"
            [[ "$seen" == "$servers" ]] || fail "$((servers - seen)) of $servers DACS servers report no Upload request metric"
            echo "$total"
        }

        # Waits until the DACS Upload counter has not moved for two checks 20 seconds apart. Gives up after 10
        # minutes, because a cache that is still absorbing data would distort the next measurement.
        dacs_settle() {
            local previous current stable=0 deadline=$((SECONDS + 600))
            previous="$(dacs_uploads)"
            while (( stable < 2 )); do
                (( SECONDS < deadline )) || fail "DACS uploads still changing after 10 minutes"
                sleep 20
                current="$(dacs_uploads)"
                if [[ "$current" == "$previous" ]]; then
                    stable=$((stable + 1))
                else
                    stable=0
                fi
                previous="$current"
            done
        }

        # Waits until every elbencho service pod lists exactly 480 hot files (p*) in /data, for up to
        # 300 s. The Blob CSI driver mounts BlobFuse2 with --cancel-list-on-mount-seconds=10, so a listing in the
        # first 10 s after a mount is empty: the first check waits 15 s. The pod list is an assignment, so a missing or
        # NotReady pod fails here instead of leaving the loop with no pod checked.
        wait_hot_listing() {
            local deadline pods pod listing seen behind
            sleep 15
            deadline=$((SECONDS + 300))
            while :; do
                behind=0
                pods="$(client_pods)"
                for pod in $pods; do
                    if listing="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- ls -1 /data 2> /dev/null)"; then
                        seen="$(grep -c '^p' <<< "$listing" || true)"
                    else
                        seen=unreadable
                    fi
                    if [[ "$seen" != 480 ]]; then
                        behind=1
                        echo "$pod lists $seen hot files, expecting 480"
                    fi
                done
                (( behind == 0 )) && return 0
                (( SECONDS < deadline )) || fail "not every client lists 480 hot files after 300 seconds"
                sleep 10
            done
        }

        # Replaces the Blob volume and the elbencho service pods: deletes the pods, the PVC and the PV posix-data
        # (waiting until they are gone), creates them again from blob-volume.yaml and clients-volume.yaml in the
        # manifest directory with the given BlobFuse2 mount options, and waits for exactly 5 Ready
        # pods that list the hot files. The Secret posix-sas (read-only SAS) stays in place. options is a JSON list
        # with one option per item: the Blob CSI driver recognizes some options only as separate items.
        # Every mount gets a new volumeHandle, which names the node's staging mount, so a node cannot keep a staging
        # mount of the previous volume with the previous options.
        # Usage: mount_posix_volume <manifest dir> <container> <elbencho image> <tag> <options as a JSON list>
        mount_posix_volume() {
            local dir="$1" container="$2" image="$3" tag="$4" options="$5" handle index left
            handle="posix-data-$tag-$(date -u +%Y%m%d%H%M%S)"
            # 300 s bounds each deletion: a pod waits for its BlobFuse2 unmount, the PVC and PV for their finalizers.
            kubectl delete pod -n "$POSIX_NS" -l app=posix-client --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the elbencho service pods within 300 s"
            kubectl delete pvc posix-data -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PVC posix-data within 300 s"
            kubectl delete pv posix-data --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PV posix-data within 300 s"
            left="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o name)" || fail "could not list the elbencho service pods"
            [[ -z "$left" ]] || fail "elbencho service pods still exist after their deletion: $left"
            ! kubectl get pv posix-data > /dev/null 2>&1 || fail "the PV posix-data still exists after its deletion"
            sed -e "s|CONTAINER_NAME|$container|" \
                -e "s|volumeHandle: posix-data|volumeHandle: $handle|" \
                -e "s|mountOptions: \[\]|mountOptions: $options|" \
                "$dir/blob-volume.yaml" > "$POSIX_WORK/volume-$tag.yaml"
            grep -qF "mountOptions: $options" "$POSIX_WORK/volume-$tag.yaml" || fail "blob-volume.yaml has no empty mountOptions to fill"
            kubectl create -f "$POSIX_WORK/volume-$tag.yaml" > /dev/null
            for index in $(seq 1 5); do
                sed -e "s|ELBENCHO_IMAGE|$image|" -e "s|name: posix-client|name: posix-client-$index|" \
                    "$dir/clients-volume.yaml" > "$POSIX_WORK/client-$index.yaml"
                kubectl create -f "$POSIX_WORK/client-$index.yaml" > /dev/null
            done
            kubectl wait -n "$POSIX_NS" --for=condition=Ready pod -l app=posix-client --timeout=600s > /dev/null
            wait_hot_listing
        }
        # The data set's file paths whose names start with a prefix, space-separated (names have no spaces), failing
        # unless there are exactly <count>. checks.jq posix_dataset owns the names.
        # Usage: files_of <prefix> <count>
        files_of() {
            local files
            files="$(jq -nr -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg prefix "$1" \
                --argjson sides '{"cold": ["alluxio", "bf2", "dacs"], "concurrent": ["alluxio", "bf2", "dacs"], "reread": ["alluxio", "bf2"]}' \
                'include "checks"; posix_dataset(480; 512; 25; 8; 2; 8; $sides)[] | select(.name | startswith($prefix)) | "/data/" + .name' |
                paste -sd' ' -)"
            [[ "$(wc -w <<< "$files" | tr -d ' ')" == "$2" ]] || fail "expected $2 data set files named $1*, found: $files"
            echo "$files"
        }
        # Validates one elbencho result for its group and prints the parsed result.
        # Usage: eb_result <group> <result file>
        eb_result() {
            jq -Rse -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg group "$1" \
                'include "checks"; validate_elbencho_run($group; 60)' "$2" ||
                fail "$2 is not a valid result of a $1 run"
        }
        # Validates the run with this label and appends its index line plus the parsed result to runs-dacs.jsonl.
        # Usage: record_run <group> <label>
        record_run() {
            local result line
            result="$(eb_result "$1" "$POSIX_RESULT/$2.txt")"
            line="$(jq -cs --arg name "$2" --argjson result "$result" \
                'map(select(.label == $name)) | if length == 1 then .[0] + {result: $result} else error("ALLUXIO POSIX READ FAILED: not exactly one index line labelled " + $name) end' \
                "$POSIX_RESULT/index.jsonl")" || fail "could not record run $2"
            echo "$line" >> "$POSIX_RESULT/runs-dacs.jsonl"
        }
        # Runs a checks.jq filter over the counter snapshots <tag>-before and <tag>-after, given as $before and $after,
        # with $hot_bytes the size of the hot data set (hot files x file size). Extra jq arguments follow the filter.
        # Usage: counters_jq <tag> <filter> [jq args...]
        counters_jq() {
            local tag="$1" filter="$2"
            shift 2
            jq -nc -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." \
                --rawfile before "$POSIX_RESULT/counters-$tag-before.prom" --rawfile after "$POSIX_RESULT/counters-$tag-after.prom" \
                --argjson hot_bytes 257698037760 "$@" "include \"checks\"; $filter"
        }
        # One hot rep: random reads over all hot files for 60 s. --randamount 2G is the amount of one pass
        # of the whole job (all hosts together, in file mode); --infloop repeats passes until --timelimit ends the rep,
        # so every rep measures the same length of time whatever the speed.
        # Usage: hot_run <scenario> <rep> <block size> <threads>
        hot_run() {
            local label="dacs-$1-r$2"
            eb_run "$label" dacs "$1" "$2" 360 -r --rand --randamount 2G -b "$3" -t "$4" -s 536870912 \
                --timelimit 60 --infloop --lat --latpercent $hot_files
            record_run hot "$label"
        }

        : > "$POSIX_RESULT/runs-dacs.jsonl"
        hot_files="$(files_of p 480)"
        mount_posix_volume "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" "posix-data" "telescope.azurecr.io/elbencho:v3.0-37" dacs-1 '["--read-only=true", "--allow-other=true", "--disable-kernel-cache=true", "--block-cache=false", "--streaming=false", "--preload=false", "--distributed-cache-discovery-endpoint=bench-cache-discovery.dacs-cache-system.svc.cluster.local:9065", "--distributed-cache-block-size=1", "--distributed-cache-prefetch=128", "--distributed-cache-parallelism=128"]'
        # 1. Warm-up.
        POSIX_GROUP=warmup
        snap_counters dacs-warmup-before
        eb_run dacs-warmup dacs warmup all 791 -r -b 16M -t 8 -s 536870912 $hot_files
        eb_result warmup "$POSIX_RESULT/dacs-warmup.txt" > /dev/null
        dacs_settle
        # The cache's own count can trail the reads by a few seconds, so the check is repeated for up to 120 s.
        warm_deadline=$((SECONDS + 120))
        until snap_counters dacs-warmup-after &&
            counters_jq dacs-warmup '(counter_total($after | prometheus_samples; "cache_server_request_counter"; ["request_type=\"Upload\"", "status=\"Success\""])) as $blocks
        | if $blocks == null then failed("the warm-up check needs the DACS Upload counter of the servers")
          else ($blocks * 1048576) as $cached
          | if $cached * 100 >= $hot_bytes * 99 then {cached_bytes: $cached, hot_bytes: $hot_bytes, fraction: ($cached / $hot_bytes)}
            else failed("the warm-up uploaded " + ($cached | tostring) + " bytes to DACS in total, less than 99% of the " + ($hot_bytes | tostring) + " byte hot data set")
            end
          end' > "$POSIX_RESULT/warmup-dacs.json" 2> "$POSIX_WORK/warmup-check.err"; do
            if (( SECONDS >= warm_deadline )); then
                cat "$POSIX_WORK/warmup-check.err" >&2
                fail "the dacs cache does not hold the hot data set 120 s after the warm-up"
            fi
            sleep 10
        done
        sleep 120
        # 2. Hot.
        snap_counters dacs-hot-before
        POSIX_GROUP=hot
        for rep in $(seq 1 3); do
            hot_run 13-16a "$rep" 4K 8
            hot_run 13-16b "$rep" 64K 8
            hot_run 17 "$rep" 1M 8
        done
        for rep in $(seq 1 3); do
            hot_run 18-t8 "$rep" 4M 8
            hot_run 18-t32 "$rep" 4M 32
        done
        for rep in $(seq 1 3); do
            hot_run 19-t1 "$rep" 64K 1
            hot_run 19-t4 "$rep" 64K 4
            hot_run 20-t16 "$rep" 64K 16
            hot_run 20-t64 "$rep" 64K 64
        done
        snap_counters dacs-hot-after
        # The one hot entry of this side for the Blob egress attribution, from the first hot start to the last hot end.
        hot_span="$(jq -cs --arg side dacs \
            'map(select(.side == $side and .group == "hot" and .rep != "all")) |
            if length == 0 then error("ALLUXIO POSIX READ FAILED: no hot run in the index") else
            {"label": ($side + "-hot"), side: $side, scenario: "hot", rep: "all", start: (map(.start) | min), "end": (map(.end) | max), group: "hot"} end' \
            "$POSIX_RESULT/index.jsonl")"
        echo "$hot_span" >> "$POSIX_RESULT/index.jsonl"
        counters_jq dacs-hot '{before: $before, after: $after} | counter_delta | . + {hot_bytes: $hot_bytes} | validate_cache_hits("dacs")' \
            > "$POSIX_RESULT/hot-counters-dacs.json" || fail "the dacs hot reads are not proven to come from the cache"
    displayName: Run the POSIX warm-up and hot reads on BlobFuse2 with DACS
    name: posix_dacs_hot
    timeoutInMinutes: 55
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        POSIX_WORK="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        POSIX_RESULT="$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        POSIX_NS="alx-ns"
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        # Runs a script in a pod, detached. A kubectl exec stream can drop during a long run and still return 0
        # while the work keeps going in the pod. So one short exec writes the script, sets its status file to
        # "pending" and starts it with setsid, stdio not tied to the exec, and later short execs poll the status
        # file until it holds the exit status. The starter script also records the pod's own clock right before
        # and after the script, and the process group id so a run can be killed. Every short exec is cut off after
        # 60 s, so a stalled stream cannot hang the step. A poll whose exec fails or is cut off is tried again, but
        # when no poll has read the status for POSIX_POLL_LOST_SECONDS, the pod is gone or kubectl can no longer reach
        # it, for example because the step's sign-in has lapsed: the run then fails with the last error. A run whose
        # status is still "pending" at its limit fails too, and the message tells whether the script was still running
        # or had stopped without writing its status. In both cases its process group is killed, if the pod can still
        # be reached. After a successful run the log and the two times are fetched again and again until they
        # arrive, never from a failed exec's error text. The log goes to stdout (or to stderr when the script
        # fails), through redact when the step defines it, as do the poll errors; POSIX_RUN_START and POSIX_RUN_END
        # hold the pod-side UTC times.
        # Usage: pod_run <pod> <limit seconds> <script text> [args...]
        pod_run() {
            local pod="$1" limit="$2" script="$3" rc="" deadline last_ok log state=""
            shift 3
            [[ "$limit" =~ ^[0-9]+$ ]] || fail "pod_run: the limit must be a number of seconds, got $limit"
            timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'printf "%s\n" "$1" > /tmp/posix-run.sh
                printf "%s\n" "$2" > /tmp/posix-start.sh
                shift 2
                rm -f /tmp/posix-run.rc /tmp/posix-run.log /tmp/posix-run.start /tmp/posix-run.end /tmp/posix-run.pid
                echo pending > /tmp/posix-run.rc
                setsid sh /tmp/posix-start.sh "$@" < /dev/null > /dev/null 2>&1 &
                echo $! > /tmp/posix-run.pid' sh "$script" 'date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.start
        sh /tmp/posix-run.sh "$@" > /tmp/posix-run.log 2>&1
        status=$?
        date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/posix-run.end
        echo $status > /tmp/posix-run.rc' "$@" || fail "$pod: could not start the script"
            deadline=$((SECONDS + limit))
            last_ok=$SECONDS
            # Poll every 15 s: often enough to notice the end of a short run, rarely enough not to load the API
            # server during a long one. "pending" is a run that is still going, and an empty file a status that is
            # still being written.
            while :; do
                if rc="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.rc 2> "$POSIX_WORK/poll-$pod.err")"; then
                    last_ok=$SECONDS
                    [[ "$rc" =~ ^[0-9]+$ ]] && break
                else
                    # timeout exits with 124 when it cuts the exec off.
                    if (( $? == 124 )); then
                        echo "kubectl exec did not return within 60 s" >> "$POSIX_WORK/poll-$pod.err"
                    fi
                    if (( SECONDS - last_ok >= 300 )); then
                        rc=unreachable
                        break
                    fi
                fi
                if (( SECONDS >= deadline )); then
                    rc=timeout
                    break
                fi
                sleep 15
            done
            if [[ "$rc" != 0 ]]; then
                if [[ "$rc" == timeout || "$rc" == unreachable ]]; then
                    # The negative pid is the process group started by setsid. The exec prints whether the group was
                    # still there, and nothing if the pod cannot be reached.
                    state="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- sh -c 'pid="$(cat /tmp/posix-run.pid)"
                        if kill -0 -"$pid" 2> /dev/null; then kill -- -"$pid"; echo running; else echo gone; fi' 2> /dev/null)" || true
                fi
                if [[ "$rc" == unreachable ]]; then
                    fail "$pod: no check could read the status of the run for $((SECONDS - last_ok)) s; the last one failed with: $(redact_log < "$POSIX_WORK/poll-$pod.err" | tail -n 5)"
                fi
                { timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- cat /tmp/posix-run.log 2>&1 || true; } | redact_log >&2
                if [[ "$rc" == timeout ]]; then
                    case "$state" in
                        running) fail "$pod: the script was still running at its limit of $limit s" ;;
                        gone) fail "$pod: the script was no longer running at its limit of $limit s but had not written its exit status" ;;
                        *) fail "$pod: the script had not written its exit status by its limit of $limit s" ;;
                    esac
                fi
                fail "$pod: script ended with exit status $rc"
            fi
            log="$(pod_cat "$pod" /tmp/posix-run.log)"
            POSIX_RUN_START="$(pod_cat "$pod" /tmp/posix-run.start)"
            POSIX_RUN_END="$(pod_cat "$pod" /tmp/posix-run.end)"
            [[ "$POSIX_RUN_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ && "$POSIX_RUN_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
                fail "$pod: the pod-side times are not UTC timestamps: $POSIX_RUN_START $POSIX_RUN_END"
            redact_log <<< "$log"
        }

        # Copies stdin to stdout through the step's redact function, if it has one.
        redact_log() {
            if declare -F redact > /dev/null; then redact; else cat; fi
        }

        # Prints one file of a pod. A failed exec prints an error text instead of the file, so only the output
        # of a successful one counts; a few attempts cover a dropped stream.
        # Usage: pod_cat <pod> <file>
        pod_cat() {
            local out attempt
            for attempt in 1 2 3 4 5; do
                if out="$(timeout 60 kubectl exec -n "$POSIX_NS" "$1" -- cat "$2" 2> /dev/null)"; then
                    printf '%s\n' "$out"
                    return 0
                fi
                sleep 5
            done
            fail "$1: could not fetch $2"
        }

        # Prints "<name><TAB><address>" for each Ready elbencho service pod, sorted by name, from one listing,
        # and fails unless there are exactly 5: a missing service would silently shrink the
        # load. client_pods and client_ips print one column of it.
        client_list() {
            local pods list count
            pods="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o json)" ||
                fail "could not list the elbencho service pods"
            list="$(jq -r '[.items | sort_by(.metadata.name)[] |
                select(.status.phase == "Running" and
                    any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
                [.metadata.name, .status.podIP] | select(.[1] != null and .[1] != "")] | .[] | @tsv' <<< "$pods")"
            count="$(grep -c . <<< "$list" || true)"
            [[ "$count" == 5 ]] ||
                fail "expected 5 ready elbencho service pods, found $count"
            echo "$list"
        }
        client_pods() {
            client_list | cut -f1
        }
        client_ips() {
            client_list | cut -f2
        }

        POSIX_MASTER_SCRIPT='hosts="$1"
        shift
        elbencho --hosts "$hosts" --nolive "$@"'
        POSIX_LOCAL_SCRIPT='elbencho "$@"'

        # A result file must hold elbencho's result table, whose header line starts with OPERATION.
        eb_check_result() {
            grep -q OPERATION "$1" || fail "$2: no elbencho result table in $1"
        }

        # Index lines carry the group of the run ("group") when POSIX_GROUP is set, so the summary can tell the
        # single runs of the hot group from the one entry that spans them all.
        POSIX_GROUP="${POSIX_GROUP:-}"
        # The jq object that is appended to the index file; a rep is a number, or a word such as "all" for an
        # entry that spans several runs. label and end are jq keywords: jq 1.6 accepts them only as quoted keys and
        # not as variable names, hence $name and $finish.
        POSIX_INDEX_LINE='{"label": $name, side: $side, scenario: $scenario, rep: ($rep | if test("^[0-9]+$") then tonumber else . end), start: $start, "end": $finish}
            + (if $pod == "" then {} else {pod: $pod} end) + (if $group == "" then {} else {group: $group} end)'

        # Runs elbencho from the first service pod against all of them and records the result. The index line
        # lets the summary find the run and place it in time for the counter and egress windows; its times are
        # the pod's own, taken right around the elbencho command. limit is the run's pod_run limit.
        # Usage: eb_run <label> <side> <scenario> <rep> <limit seconds> <elbencho args...>
        eb_run() {
            local label="$1" side="$2" scenario="$3" rep="$4" limit="$5" list first hosts
            shift 5
            list="$(client_list)"
            first="$(head -n 1 <<< "$list" | cut -f1)"
            hosts="$(cut -f2 <<< "$list" | paste -sd, -)"
            [[ -n "$first" && -n "$hosts" ]] || fail "eb_run $label: no service pods"
            pod_run "$first" "$limit" "$POSIX_MASTER_SCRIPT" "$hosts" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_run $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs elbencho in one service pod against its own mount only and records it like eb_run, with the pod
        # name in "pod" (the re-read scenario: the same node reads the file twice).
        # Usage: eb_local <label> <side> <scenario> <rep> <pod> <limit seconds> <elbencho args...>
        eb_local() {
            local label="$1" side="$2" scenario="$3" rep="$4" pod="$5" limit="$6"
            shift 6
            pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_local $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs the same local elbencho command in every service pod at the same time (the concurrent-readers
        # scenario) and stores one result and one index line per pod, with the pod name in "pod". The scenario
        # is always 23-24. path is the file all pods read; limit is the pod_run limit of each pod's run.
        # Usage: eb_local_all <label> <side> <rep> <limit seconds> <path> <elbencho args...>
        eb_local_all() {
            local label="$1" side="$2" rep="$3" limit="$4" path="$5" pod pids=() failed=0 pods
            shift 5
            pods="$(client_pods)"
            for pod in $pods; do
                (
                    pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" "$path" > "$POSIX_RESULT/$label-$pod.txt"
                    eb_check_result "$POSIX_RESULT/$label-$pod.txt" "eb_local_all $label ($pod)"
                    jq -nc --arg name "$label-$pod" --arg side "$side" --arg scenario 23-24 --arg rep "$rep" \
                        --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                        "$POSIX_INDEX_LINE" > "$POSIX_WORK/index-$label-$pod.json"
                ) &
                pids+=($!)
            done
            for pid in "${pids[@]}"; do
                wait "$pid" || failed=1
            done
            (( failed == 0 )) || fail "eb_local_all $label: a pod failed"
            for pod in $pods; do
                cat "$POSIX_WORK/index-$label-$pod.json" >> "$POSIX_RESULT/index.jsonl"
            done
        }

        # The metrics text of every pod of one kind, each preceded by a comment line with the pod name. A pod
        # listing that fails is an error. No pods at all means the kind is not deployed in this phase; any other
        # number than 5 means a pod is missing or restarting.
        # Usage: metrics_of <namespace> <pod name prefix> <port> <path>
        metrics_of() {
            local list pods pod count
            list="$(kubectl get pods -n "$1" -o name)" || fail "could not list the pods in $1"
            pods="$(sed 's|^pod/||' <<< "$list" | grep "^$2" || true)"
            count="$(grep -c . <<< "$pods" || true)"
            [[ "$count" == 0 || "$count" == 5 ]] ||
                fail "expected 5 $2 pods in $1, found $count"
            for pod in $pods; do
                echo "# pod $pod"
                kubectl get --raw "/api/v1/namespaces/$1/pods/$pod:$3/proxy/$4" || fail "could not read the metrics of $1/$pod"
            done
        }
        # 30000 is the Alluxio worker metrics port and 9096 the DACS server's.
        alluxio_metrics() {
            metrics_of "$POSIX_NS" alluxio-worker- 30000 metrics/
        }
        dacs_metrics() {
            metrics_of dacs-cache-system bench-cache- 9096 metrics
        }
        count_pods() {
            grep -c '^# pod ' <<< "$1" || true
        }

        # Saves the raw metrics of all Alluxio workers and all DACS servers to counters-<tag>.prom, whose first
        # line records how many pods of each kind were read. A kind that is not deployed in this phase
        # contributes nothing.
        # Usage: snap_counters <tag>
        snap_counters() {
            local alluxio dacs
            alluxio="$(alluxio_metrics)" || fail "could not read the Alluxio worker metrics"
            dacs="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            {
                echo "# pods alluxio-worker-=$(count_pods "$alluxio") bench-cache-=$(count_pods "$dacs")"
                echo "$alluxio"
                echo "$dacs"
            } > "$POSIX_RESULT/counters-$1.prom"
        }

        # Runs a privileged pod on one node that flushes and drops the page cache, so the next read has to
        # come from the cache layer rather than from the node's memory.
        # Usage: drop_page_cache <node>
        drop_page_cache() {
            local node="$1" name="drop-cache-$1"
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
            kubectl create -n "$POSIX_NS" -f - << MANIFEST || fail "could not create $name"
        apiVersion: v1
        kind: Pod
        metadata:
          name: $name
        spec:
          nodeName: $node
          restartPolicy: Never
          tolerations:
            - operator: Exists
          containers:
            - name: drop
              image: mcr.microsoft.com/azurelinux/base/core:3.0
              securityContext:
                privileged: true
              command: ["sh", "-c", "sync; echo 3 > /proc/sys/vm/drop_caches"]
        MANIFEST
            # 180 s covers pulling the image on a fresh node and running two commands.
            kubectl wait -n "$POSIX_NS" --for=jsonpath='{.status.phase}'=Succeeded "pod/$name" --timeout=180s ||
                { kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null; fail "dropping the page cache on $node failed"; }
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
        }

        # The DACS servers' successful Upload requests, summed. Uploads are the asynchronous writes of freshly
        # generated data to the cache. Every one of the 5 servers must be read and must report the
        # metric: a missing server or metric would look like "no uploads" and end the wait too early.
        dacs_uploads() {
            local out total servers seen
            out="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            read -r total servers seen < <(awk '
                /^# pod / { pods++; next }
                /^cache_server_request_counter[{]/ && /request_type="Upload"/ && /status="Success"/ {
                    sum += $NF
                    if (!(pods in has)) { has[pods] = 1; seen_n++ }
                }
                END { printf "%d %d %d\n", sum, pods, seen_n }' <<< "$out")
            [[ "$servers" == 5 ]] || fail "expected 5 DACS servers, found $servers"
            [[ "$seen" == "$servers" ]] || fail "$((servers - seen)) of $servers DACS servers report no Upload request metric"
            echo "$total"
        }

        # Waits until the DACS Upload counter has not moved for two checks 20 seconds apart. Gives up after 10
        # minutes, because a cache that is still absorbing data would distort the next measurement.
        dacs_settle() {
            local previous current stable=0 deadline=$((SECONDS + 600))
            previous="$(dacs_uploads)"
            while (( stable < 2 )); do
                (( SECONDS < deadline )) || fail "DACS uploads still changing after 10 minutes"
                sleep 20
                current="$(dacs_uploads)"
                if [[ "$current" == "$previous" ]]; then
                    stable=$((stable + 1))
                else
                    stable=0
                fi
                previous="$current"
            done
        }

        # Waits until every elbencho service pod lists exactly 480 hot files (p*) in /data, for up to
        # 300 s. The Blob CSI driver mounts BlobFuse2 with --cancel-list-on-mount-seconds=10, so a listing in the
        # first 10 s after a mount is empty: the first check waits 15 s. The pod list is an assignment, so a missing or
        # NotReady pod fails here instead of leaving the loop with no pod checked.
        wait_hot_listing() {
            local deadline pods pod listing seen behind
            sleep 15
            deadline=$((SECONDS + 300))
            while :; do
                behind=0
                pods="$(client_pods)"
                for pod in $pods; do
                    if listing="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- ls -1 /data 2> /dev/null)"; then
                        seen="$(grep -c '^p' <<< "$listing" || true)"
                    else
                        seen=unreadable
                    fi
                    if [[ "$seen" != 480 ]]; then
                        behind=1
                        echo "$pod lists $seen hot files, expecting 480"
                    fi
                done
                (( behind == 0 )) && return 0
                (( SECONDS < deadline )) || fail "not every client lists 480 hot files after 300 seconds"
                sleep 10
            done
        }

        # Replaces the Blob volume and the elbencho service pods: deletes the pods, the PVC and the PV posix-data
        # (waiting until they are gone), creates them again from blob-volume.yaml and clients-volume.yaml in the
        # manifest directory with the given BlobFuse2 mount options, and waits for exactly 5 Ready
        # pods that list the hot files. The Secret posix-sas (read-only SAS) stays in place. options is a JSON list
        # with one option per item: the Blob CSI driver recognizes some options only as separate items.
        # Every mount gets a new volumeHandle, which names the node's staging mount, so a node cannot keep a staging
        # mount of the previous volume with the previous options.
        # Usage: mount_posix_volume <manifest dir> <container> <elbencho image> <tag> <options as a JSON list>
        mount_posix_volume() {
            local dir="$1" container="$2" image="$3" tag="$4" options="$5" handle index left
            handle="posix-data-$tag-$(date -u +%Y%m%d%H%M%S)"
            # 300 s bounds each deletion: a pod waits for its BlobFuse2 unmount, the PVC and PV for their finalizers.
            kubectl delete pod -n "$POSIX_NS" -l app=posix-client --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the elbencho service pods within 300 s"
            kubectl delete pvc posix-data -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PVC posix-data within 300 s"
            kubectl delete pv posix-data --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PV posix-data within 300 s"
            left="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o name)" || fail "could not list the elbencho service pods"
            [[ -z "$left" ]] || fail "elbencho service pods still exist after their deletion: $left"
            ! kubectl get pv posix-data > /dev/null 2>&1 || fail "the PV posix-data still exists after its deletion"
            sed -e "s|CONTAINER_NAME|$container|" \
                -e "s|volumeHandle: posix-data|volumeHandle: $handle|" \
                -e "s|mountOptions: \[\]|mountOptions: $options|" \
                "$dir/blob-volume.yaml" > "$POSIX_WORK/volume-$tag.yaml"
            grep -qF "mountOptions: $options" "$POSIX_WORK/volume-$tag.yaml" || fail "blob-volume.yaml has no empty mountOptions to fill"
            kubectl create -f "$POSIX_WORK/volume-$tag.yaml" > /dev/null
            for index in $(seq 1 5); do
                sed -e "s|ELBENCHO_IMAGE|$image|" -e "s|name: posix-client|name: posix-client-$index|" \
                    "$dir/clients-volume.yaml" > "$POSIX_WORK/client-$index.yaml"
                kubectl create -f "$POSIX_WORK/client-$index.yaml" > /dev/null
            done
            kubectl wait -n "$POSIX_NS" --for=condition=Ready pod -l app=posix-client --timeout=600s > /dev/null
            wait_hot_listing
        }
        # The data set's file paths whose names start with a prefix, space-separated (names have no spaces), failing
        # unless there are exactly <count>. checks.jq posix_dataset owns the names.
        # Usage: files_of <prefix> <count>
        files_of() {
            local files
            files="$(jq -nr -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg prefix "$1" \
                --argjson sides '{"cold": ["alluxio", "bf2", "dacs"], "concurrent": ["alluxio", "bf2", "dacs"], "reread": ["alluxio", "bf2"]}' \
                'include "checks"; posix_dataset(480; 512; 25; 8; 2; 8; $sides)[] | select(.name | startswith($prefix)) | "/data/" + .name' |
                paste -sd' ' -)"
            [[ "$(wc -w <<< "$files" | tr -d ' ')" == "$2" ]] || fail "expected $2 data set files named $1*, found: $files"
            echo "$files"
        }
        # Validates one elbencho result for its group and prints the parsed result.
        # Usage: eb_result <group> <result file>
        eb_result() {
            jq -Rse -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg group "$1" \
                'include "checks"; validate_elbencho_run($group; 60)' "$2" ||
                fail "$2 is not a valid result of a $1 run"
        }
        # Validates the run with this label and appends its index line plus the parsed result to runs-dacs.jsonl.
        # Usage: record_run <group> <label>
        record_run() {
            local result line
            result="$(eb_result "$1" "$POSIX_RESULT/$2.txt")"
            line="$(jq -cs --arg name "$2" --argjson result "$result" \
                'map(select(.label == $name)) | if length == 1 then .[0] + {result: $result} else error("ALLUXIO POSIX READ FAILED: not exactly one index line labelled " + $name) end' \
                "$POSIX_RESULT/index.jsonl")" || fail "could not record run $2"
            echo "$line" >> "$POSIX_RESULT/runs-dacs.jsonl"
        }
        # Runs a checks.jq filter over the counter snapshots <tag>-before and <tag>-after, given as $before and $after,
        # with $hot_bytes the size of the hot data set (hot files x file size). Extra jq arguments follow the filter.
        # Usage: counters_jq <tag> <filter> [jq args...]
        counters_jq() {
            local tag="$1" filter="$2"
            shift 2
            jq -nc -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." \
                --rawfile before "$POSIX_RESULT/counters-$tag-before.prom" --rawfile after "$POSIX_RESULT/counters-$tag-after.prom" \
                --argjson hot_bytes 257698037760 "$@" "include \"checks\"; $filter"
        }
        # One hot rep: random reads over all hot files for 60 s. --randamount 2G is the amount of one pass
        # of the whole job (all hosts together, in file mode); --infloop repeats passes until --timelimit ends the rep,
        # so every rep measures the same length of time whatever the speed.
        # Usage: hot_run <scenario> <rep> <block size> <threads>
        hot_run() {
            local label="dacs-$1-r$2"
            eb_run "$label" dacs "$1" "$2" 360 -r --rand --randamount 2G -b "$3" -t "$4" -s 536870912 \
                --timelimit 60 --infloop --lat --latpercent $hot_files
            record_run hot "$label"
        }

        [[ -s "$POSIX_RESULT/runs-dacs.jsonl" && -s "$POSIX_RESULT/index.jsonl" ]] ||
            fail "the hot reads of dacs have not run: runs-dacs.jsonl or index.jsonl is missing or empty"
        mount_options="$(kubectl get pv posix-data -o json | jq -c '.spec.mountOptions')" ||
            fail "could not read the mount options of the volume posix-data"
        jq -en --argjson got "$mount_options" --argjson want '["--read-only=true", "--allow-other=true", "--disable-kernel-cache=true", "--block-cache=false", "--streaming=false", "--preload=false", "--distributed-cache-discovery-endpoint=bench-cache-discovery.dacs-cache-system.svc.cluster.local:9065", "--distributed-cache-block-size=1", "--distributed-cache-prefetch=128", "--distributed-cache-parallelism=128"]' '$got == $want' > /dev/null ||
            fail "the volume posix-data is mounted with $mount_options, not with the options of the dacs cold and concurrent reads; run the hot step of dacs again first"
        jq -c --arg side dacs 'select(.side != $side or .group == "warmup" or .group == "hot")' "$POSIX_RESULT/index.jsonl" > "$POSIX_WORK/index.jsonl"
        mv -- "$POSIX_WORK/index.jsonl" "$POSIX_RESULT/index.jsonl"
        jq -c 'select(.group == "hot")' "$POSIX_RESULT/runs-dacs.jsonl" > "$POSIX_WORK/runs.jsonl"
        mv -- "$POSIX_WORK/runs.jsonl" "$POSIX_RESULT/runs-dacs.jsonl"
        hot_runs="$(jq -cs 'map(.group) | group_by(.) | map({(.[0]): length}) | add // {}' "$POSIX_RESULT/runs-dacs.jsonl")" ||
            fail "could not read runs-dacs.jsonl"
        jq -en --argjson got "$hot_runs" --argjson want '{"hot": 27}' '$got == $want' > /dev/null ||
            fail "runs-dacs.jsonl holds the groups $hot_runs, not exactly the hot runs {"hot": 27}"
        hot_index="$(jq -cs --arg side dacs 'map(select(.side == $side) | if .rep == "all" then .scenario + "-all" else .group end) | group_by(.) | map({(.[0]): length}) | add // {}' "$POSIX_RESULT/index.jsonl")" ||
            fail "could not read index.jsonl"
        jq -en --argjson got "$hot_index" --argjson want '{"warmup-all": 1, "hot-all": 1, "hot": 27}' '$got == $want' > /dev/null ||
            fail "index.jsonl holds the dacs entries $hot_index, not exactly {"warmup-all": 1, "hot-all": 1, "hot": 27}"
        [[ -s "$POSIX_RESULT/warmup-dacs.json" && -s "$POSIX_RESULT/hot-counters-dacs.json" ]] ||
            fail "the warm-up or hot counter proof of dacs is missing"
        : > "$POSIX_RESULT/counters-dacs.jsonl"
        # 3. Cold: every rep reads a set of this side that nothing has read before. Three minutes of quiet before the
        # first rep.
        POSIX_GROUP=cold
        sleep 180
        for rep in $(seq 1 3); do
            (( rep == 1 )) || sleep 70
            cold_files="$(files_of "dacs-cold-r$rep-" 25)"
            # The whole job reads 1536 MiB at random offsets of the set and then ends (no --infloop); --timelimit 120
            # stops a rep that is slower than that, which the summary then compares by IOPS and marks as timed out.
            eb_run dacs-21-22-r$rep dacs 21-22 "$rep" 420 -r --rand --randamount 1536M -b 64K -t 8 -s 2147483648 \
                --timelimit 120 --lat --latpercent $cold_files
            record_run cold dacs-21-22-r$rep
            dacs_settle
        done

        # 4. Concurrent: every client reads the whole set dacs-cc-r<rep> at the same time (eb_local_all).
        POSIX_GROUP=concurrent
        sleep 70
        # Appends the counter differences of concurrent rep <rep> to counters-dacs.jsonl.
        # Usage: record_cc_counters <rep>
        record_cc_counters() {
            counters_jq dacs-23-24-r$1 '{side: "dacs", scenario: "23-24", rep: ($rep | tonumber)} + ({before: $before, after: $after} | counter_delta)' \
                --arg rep "$1" >> "$POSIX_RESULT/counters-dacs.jsonl"
        }
        cc_run() {
            local rep="$1" files path pods pod
            files="$(files_of "dacs-cc-r$rep-" 8)"
            # $files is split on purpose: the first file is eb_local_all's path, the others follow the options.
            set -- $files
            path="$1"
            shift
            snap_counters dacs-23-24-r$rep-before
            eb_local_all dacs-23-24-r$rep dacs "$rep" 463 "$path" -r -b 16M -t 8 -s 2147483648 "$@"
            snap_counters dacs-23-24-r$rep-after
            record_cc_counters "$rep"
            pods="$(client_pods)"
            for pod in $pods; do
                record_run concurrent dacs-23-24-r$rep-$pod
            done
            dacs_settle
        }
        for rep in $(seq 1 3); do
            (( rep == 1 )) || sleep 70
            cc_run "$rep"
        done
    displayName: Run the POSIX cold and concurrent reads on BlobFuse2 with DACS
    name: posix_dacs_rest
