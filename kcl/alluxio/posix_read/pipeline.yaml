                fi
                sleep 5
            done
            fail "$1: could not fetch $2"
        }

        # Prints "<name><TAB><address>" for each Ready elbencho service pod, sorted by name, from one listing,
        # and fails unless there are exactly 5: a missing service would silently shrink the
        # load. client_pods and client_ips print one column of it.
        client_list() {
            local pods list count
            pods="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o json)" ||
                fail "could not list the elbencho service pods"
            list="$(jq -r '[.items | sort_by(.metadata.name)[] |
                select(.status.phase == "Running" and
                    any(.status.conditions[]?; .type == "Ready" and .status == "True")) |
                [.metadata.name, .status.podIP] | select(.[1] != null and .[1] != "")] | .[] | @tsv' <<< "$pods")"
            count="$(grep -c . <<< "$list" || true)"
            [[ "$count" == 5 ]] ||
                fail "expected 5 ready elbencho service pods, found $count"
            echo "$list"
        }
        client_pods() {
            client_list | cut -f1
        }
        client_ips() {
            client_list | cut -f2
        }

        POSIX_MASTER_SCRIPT='hosts="$1"
        shift
        elbencho --hosts "$hosts" --nolive "$@"'
        POSIX_LOCAL_SCRIPT='elbencho "$@"'

        # A result file must hold elbencho's result table, whose header line starts with OPERATION.
        eb_check_result() {
            grep -q OPERATION "$1" || fail "$2: no elbencho result table in $1"
        }

        # Index lines carry the group of the run ("group") when POSIX_GROUP is set, so the summary can tell the
        # single runs of the hot group from the one entry that spans them all.
        POSIX_GROUP="${POSIX_GROUP:-}"
        # The jq object that is appended to the index file; a rep is a number, or a word such as "all" for an
        # entry that spans several runs. label and end are jq keywords: jq 1.6 accepts them only as quoted keys and
        # not as variable names, hence $name and $finish.
        POSIX_INDEX_LINE='{"label": $name, side: $side, scenario: $scenario, rep: ($rep | if test("^[0-9]+$") then tonumber else . end), start: $start, "end": $finish}
            + (if $pod == "" then {} else {pod: $pod} end) + (if $group == "" then {} else {group: $group} end)'

        # Runs elbencho from the first service pod against all of them and records the result. The index line
        # lets the summary find the run and place it in time for the counter and egress windows; its times are
        # the pod's own, taken right around the elbencho command. limit is the run's pod_run limit.
        # Usage: eb_run <label> <side> <scenario> <rep> <limit seconds> <elbencho args...>
        eb_run() {
            local label="$1" side="$2" scenario="$3" rep="$4" limit="$5" list first hosts
            shift 5
            list="$(client_list)"
            first="$(head -n 1 <<< "$list" | cut -f1)"
            hosts="$(cut -f2 <<< "$list" | paste -sd, -)"
            [[ -n "$first" && -n "$hosts" ]] || fail "eb_run $label: no service pods"
            pod_run "$first" "$limit" "$POSIX_MASTER_SCRIPT" "$hosts" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_run $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs elbencho in one service pod against its own mount only and records it like eb_run, with the pod
        # name in "pod" (the re-read scenario: the same node reads the file twice).
        # Usage: eb_local <label> <side> <scenario> <rep> <pod> <limit seconds> <elbencho args...>
        eb_local() {
            local label="$1" side="$2" scenario="$3" rep="$4" pod="$5" limit="$6"
            shift 6
            pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" > "$POSIX_RESULT/$label.txt"
            eb_check_result "$POSIX_RESULT/$label.txt" "eb_local $label"
            jq -nc --arg name "$label" --arg side "$side" --arg scenario "$scenario" --arg rep "$rep" \
                --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                "$POSIX_INDEX_LINE" >> "$POSIX_RESULT/index.jsonl"
        }

        # Runs the same local elbencho command in every service pod at the same time (the concurrent-readers
        # scenario) and stores one result and one index line per pod, with the pod name in "pod". The scenario
        # is always 23-24. path is the file all pods read; limit is the pod_run limit of each pod's run.
        # Usage: eb_local_all <label> <side> <rep> <limit seconds> <path> <elbencho args...>
        eb_local_all() {
            local label="$1" side="$2" rep="$3" limit="$4" path="$5" pod pids=() failed=0 pods
            shift 5
            pods="$(client_pods)"
            for pod in $pods; do
                (
                    pod_run "$pod" "$limit" "$POSIX_LOCAL_SCRIPT" "$@" "$path" > "$POSIX_RESULT/$label-$pod.txt"
                    eb_check_result "$POSIX_RESULT/$label-$pod.txt" "eb_local_all $label ($pod)"
                    jq -nc --arg name "$label-$pod" --arg side "$side" --arg scenario 23-24 --arg rep "$rep" \
                        --arg start "$POSIX_RUN_START" --arg finish "$POSIX_RUN_END" --arg pod "$pod" --arg group "$POSIX_GROUP" \
                        "$POSIX_INDEX_LINE" > "$POSIX_WORK/index-$label-$pod.json"
                ) &
                pids+=($!)
            done
            for pid in "${pids[@]}"; do
                wait "$pid" || failed=1
            done
            (( failed == 0 )) || fail "eb_local_all $label: a pod failed"
            for pod in $pods; do
                cat "$POSIX_WORK/index-$label-$pod.json" >> "$POSIX_RESULT/index.jsonl"
            done
        }

        # The metrics text of every pod of one kind, each preceded by a comment line with the pod name. A pod
        # listing that fails is an error. No pods at all means the kind is not deployed in this phase; any other
        # number than 5 means a pod is missing or restarting.
        # Usage: metrics_of <namespace> <pod name prefix> <port> <path>
        metrics_of() {
            local list pods pod count
            list="$(kubectl get pods -n "$1" -o name)" || fail "could not list the pods in $1"
            pods="$(sed 's|^pod/||' <<< "$list" | grep "^$2" || true)"
            count="$(grep -c . <<< "$pods" || true)"
            [[ "$count" == 0 || "$count" == 5 ]] ||
                fail "expected 5 $2 pods in $1, found $count"
            for pod in $pods; do
                echo "# pod $pod"
                kubectl get --raw "/api/v1/namespaces/$1/pods/$pod:$3/proxy/$4" || fail "could not read the metrics of $1/$pod"
            done
        }
        # 30000 is the Alluxio worker metrics port and 9096 the DACS server's.
        alluxio_metrics() {
            metrics_of "$POSIX_NS" alluxio-worker- 30000 metrics/
        }
        dacs_metrics() {
            metrics_of dacs-cache-system bench-cache- 9096 metrics
        }
        count_pods() {
            grep -c '^# pod ' <<< "$1" || true
        }

        # Saves the raw metrics of all Alluxio workers and all DACS servers to counters-<tag>.prom, whose first
        # line records how many pods of each kind were read. A kind that is not deployed in this phase
        # contributes nothing.
        # Usage: snap_counters <tag>
        snap_counters() {
            local alluxio dacs
            alluxio="$(alluxio_metrics)" || fail "could not read the Alluxio worker metrics"
            dacs="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            {
                echo "# pods alluxio-worker-=$(count_pods "$alluxio") bench-cache-=$(count_pods "$dacs")"
                echo "$alluxio"
                echo "$dacs"
            } > "$POSIX_RESULT/counters-$1.prom"
        }

        # Runs a privileged pod on one node that flushes and drops the page cache, so the next read has to
        # come from the cache layer rather than from the node's memory.
        # Usage: drop_page_cache <node>
        drop_page_cache() {
            local node="$1" name="drop-cache-$1"
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
            kubectl create -n "$POSIX_NS" -f - << MANIFEST || fail "could not create $name"
        apiVersion: v1
        kind: Pod
        metadata:
          name: $name
        spec:
          nodeName: $node
          restartPolicy: Never
          tolerations:
            - operator: Exists
          containers:
            - name: drop
              image: mcr.microsoft.com/azurelinux/base/core:3.0
              securityContext:
                privileged: true
              command: ["sh", "-c", "sync; echo 3 > /proc/sys/vm/drop_caches"]
        MANIFEST
            # 180 s covers pulling the image on a fresh node and running two commands.
            kubectl wait -n "$POSIX_NS" --for=jsonpath='{.status.phase}'=Succeeded "pod/$name" --timeout=180s ||
                { kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null; fail "dropping the page cache on $node failed"; }
            kubectl delete pod "$name" -n "$POSIX_NS" --ignore-not-found > /dev/null
        }

        # The DACS servers' successful Upload requests, summed. Uploads are the asynchronous writes of freshly
        # generated data to the cache. Every one of the 5 servers must be read and must report the
        # metric: a missing server or metric would look like "no uploads" and end the wait too early.
        dacs_uploads() {
            local out total servers seen
            out="$(dacs_metrics)" || fail "could not read the DACS server metrics"
            read -r total servers seen < <(awk '
                /^# pod / { pods++; next }
                /^cache_server_request_counter[{]/ && /request_type="Upload"/ && /status="Success"/ {
                    sum += $NF
                    if (!(pods in has)) { has[pods] = 1; seen_n++ }
                }
                END { printf "%d %d %d\n", sum, pods, seen_n }' <<< "$out")
            [[ "$servers" == 5 ]] || fail "expected 5 DACS servers, found $servers"
            [[ "$seen" == "$servers" ]] || fail "$((servers - seen)) of $servers DACS servers report no Upload request metric"
            echo "$total"
        }

        # Waits until the DACS Upload counter has not moved for two checks 20 seconds apart. Gives up after 10
        # minutes, because a cache that is still absorbing data would distort the next measurement.
        dacs_settle() {
            local previous current stable=0 deadline=$((SECONDS + 600))
            previous="$(dacs_uploads)"
            while (( stable < 2 )); do
                (( SECONDS < deadline )) || fail "DACS uploads still changing after 10 minutes"
                sleep 20
                current="$(dacs_uploads)"
                if [[ "$current" == "$previous" ]]; then
                    stable=$((stable + 1))
                else
                    stable=0
                fi
                previous="$current"
            done
        }

        # Waits until every elbencho service pod lists exactly 480 hot files (p*) in /data, for up to
        # 300 s. The Blob CSI driver mounts BlobFuse2 with --cancel-list-on-mount-seconds=10, so a listing in the
        # first 10 s after a mount is empty: the first check waits 15 s. The pod list is an assignment, so a missing or
        # NotReady pod fails here instead of leaving the loop with no pod checked.
        wait_hot_listing() {
            local deadline pods pod listing seen behind
            sleep 15
            deadline=$((SECONDS + 300))
            while :; do
                behind=0
                pods="$(client_pods)"
                for pod in $pods; do
                    if listing="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- ls -1 /data 2> /dev/null)"; then
                        seen="$(grep -c '^p' <<< "$listing" || true)"
                    else
                        seen=unreadable
                    fi
                    if [[ "$seen" != 480 ]]; then
                        behind=1
                        echo "$pod lists $seen hot files, expecting 480"
                    fi
                done
                (( behind == 0 )) && return 0
                (( SECONDS < deadline )) || fail "not every client lists 480 hot files after 300 seconds"
                sleep 10
            done
        }

        # Replaces the Blob volume and the elbencho service pods: deletes the pods, the PVC and the PV posix-data
        # (waiting until they are gone), creates them again from blob-volume.yaml and clients-volume.yaml in the
        # manifest directory with the given BlobFuse2 mount options, and waits for exactly 5 Ready
        # pods that list the hot files. The Secret posix-sas (read-only SAS) stays in place. options is a JSON list
        # with one option per item: the Blob CSI driver recognizes some options only as separate items.
        # Every mount gets a new volumeHandle, which names the node's staging mount, so a node cannot keep a staging
        # mount of the previous volume with the previous options.
        # Usage: mount_posix_volume <manifest dir> <container> <elbencho image> <tag> <options as a JSON list>
        mount_posix_volume() {
            local dir="$1" container="$2" image="$3" tag="$4" options="$5" handle index left
            handle="posix-data-$tag-$(date -u +%Y%m%d%H%M%S)"
            # 300 s bounds each deletion: a pod waits for its BlobFuse2 unmount, the PVC and PV for their finalizers.
            kubectl delete pod -n "$POSIX_NS" -l app=posix-client --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the elbencho service pods within 300 s"
            kubectl delete pvc posix-data -n "$POSIX_NS" --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PVC posix-data within 300 s"
            kubectl delete pv posix-data --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the PV posix-data within 300 s"
            left="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o name)" || fail "could not list the elbencho service pods"
            [[ -z "$left" ]] || fail "elbencho service pods still exist after their deletion: $left"
            ! kubectl get pv posix-data > /dev/null 2>&1 || fail "the PV posix-data still exists after its deletion"
            sed -e "s|CONTAINER_NAME|$container|" \
                -e "s|volumeHandle: posix-data|volumeHandle: $handle|" \
                -e "s|mountOptions: \[\]|mountOptions: $options|" \
                "$dir/blob-volume.yaml" > "$POSIX_WORK/volume-$tag.yaml"
            grep -qF "mountOptions: $options" "$POSIX_WORK/volume-$tag.yaml" || fail "blob-volume.yaml has no empty mountOptions to fill"
            kubectl create -f "$POSIX_WORK/volume-$tag.yaml" > /dev/null
            for index in $(seq 1 5); do
                sed -e "s|ELBENCHO_IMAGE|$image|" -e "s|name: posix-client|name: posix-client-$index|" \
                    "$dir/clients-volume.yaml" > "$POSIX_WORK/client-$index.yaml"
                kubectl create -f "$POSIX_WORK/client-$index.yaml" > /dev/null
            done
            kubectl wait -n "$POSIX_NS" --for=condition=Ready pod -l app=posix-client --timeout=600s > /dev/null
            wait_hot_listing
        }
        # The data set's file paths whose names start with a prefix, space-separated (names have no spaces), failing
        # unless there are exactly <count>. checks.jq posix_dataset owns the names.
        # Usage: files_of <prefix> <count>
        files_of() {
            local files
            files="$(jq -nr -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg prefix "$1" \
                --argjson sides '{"cold": ["alluxio", "bf2", "dacs"], "concurrent": ["alluxio", "bf2", "dacs"], "reread": ["alluxio", "bf2"]}' \
                'include "checks"; posix_dataset(480; 512; 25; 8; 2; 8; $sides)[] | select(.name | startswith($prefix)) | "/data/" + .name' |
                paste -sd' ' -)"
            [[ "$(wc -w <<< "$files" | tr -d ' ')" == "$2" ]] || fail "expected $2 data set files named $1*, found: $files"
            echo "$files"
        }
        # Validates one elbencho result for its group and prints the parsed result.
        # Usage: eb_result <group> <result file>
        eb_result() {
            jq -Rse -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --arg group "$1" \
                'include "checks"; validate_elbencho_run($group; 60)' "$2" ||
                fail "$2 is not a valid result of a $1 run"
        }
        # Validates the run with this label and appends its index line plus the parsed result to runs-alluxio.jsonl.
        # Usage: record_run <group> <label>
        record_run() {
            local result line
            result="$(eb_result "$1" "$POSIX_RESULT/$2.txt")"
            line="$(jq -cs --arg name "$2" --argjson result "$result" \
                'map(select(.label == $name)) | if length == 1 then .[0] + {result: $result} else error("ALLUXIO POSIX READ FAILED: not exactly one index line labelled " + $name) end' \
                "$POSIX_RESULT/index.jsonl")" || fail "could not record run $2"
            echo "$line" >> "$POSIX_RESULT/runs-alluxio.jsonl"
        }
        # Runs a checks.jq filter over the counter snapshots <tag>-before and <tag>-after, given as $before and $after,
        # with $hot_bytes the size of the hot data set (hot files x file size). Extra jq arguments follow the filter.
        # Usage: counters_jq <tag> <filter> [jq args...]
        counters_jq() {
            local tag="$1" filter="$2"
            shift 2
            jq -nc -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." \
                --rawfile before "$POSIX_RESULT/counters-$tag-before.prom" --rawfile after "$POSIX_RESULT/counters-$tag-after.prom" \
                --argjson hot_bytes 257698037760 "$@" "include \"checks\"; $filter"
        }
        # One hot rep: random reads over all hot files for 60 s. --randamount 2G is the amount of one pass
        # of the whole job (all hosts together, in file mode); --infloop repeats passes until --timelimit ends the rep,
        # so every rep measures the same length of time whatever the speed.
        # Usage: hot_run <scenario> <rep> <block size> <threads>
        hot_run() {
            local label="alluxio-$1-r$2"
            eb_run "$label" alluxio "$1" "$2" 360 -r --rand --randamount 2G -b "$3" -t "$4" -s 536870912 \
                --timelimit 60 --infloop --lat --latpercent $hot_files
            record_run hot "$label"
        }

        [[ -s "$POSIX_RESULT/runs-alluxio.jsonl" && -s "$POSIX_RESULT/index.jsonl" ]] ||
            fail "the hot reads of alluxio have not run: runs-alluxio.jsonl or index.jsonl is missing or empty"
        jq -c --arg side alluxio 'select(.side != $side or .group == "warmup" or .group == "hot")' "$POSIX_RESULT/index.jsonl" > "$POSIX_WORK/index.jsonl"
        mv -- "$POSIX_WORK/index.jsonl" "$POSIX_RESULT/index.jsonl"
        jq -c 'select(.group == "hot")' "$POSIX_RESULT/runs-alluxio.jsonl" > "$POSIX_WORK/runs.jsonl"
        mv -- "$POSIX_WORK/runs.jsonl" "$POSIX_RESULT/runs-alluxio.jsonl"
        hot_runs="$(jq -cs 'map(.group) | group_by(.) | map({(.[0]): length}) | add // {}' "$POSIX_RESULT/runs-alluxio.jsonl")" ||
            fail "could not read runs-alluxio.jsonl"
        jq -en --argjson got "$hot_runs" --argjson want '{"hot": 27}' '$got == $want' > /dev/null ||
            fail "runs-alluxio.jsonl holds the groups $hot_runs, not exactly the hot runs {"hot": 27}"
        hot_index="$(jq -cs --arg side alluxio 'map(select(.side == $side) | if .rep == "all" then .scenario + "-all" else .group end) | group_by(.) | map({(.[0]): length}) | add // {}' "$POSIX_RESULT/index.jsonl")" ||
            fail "could not read index.jsonl"
        jq -en --argjson got "$hot_index" --argjson want '{"warmup-all": 1, "hot-all": 1, "hot": 27}' '$got == $want' > /dev/null ||
            fail "index.jsonl holds the alluxio entries $hot_index, not exactly {"warmup-all": 1, "hot-all": 1, "hot": 27}"
        [[ -s "$POSIX_RESULT/warmup-alluxio.json" && -s "$POSIX_RESULT/hot-counters-alluxio.json" ]] ||
            fail "the warm-up or hot counter proof of alluxio is missing"
        : > "$POSIX_RESULT/counters-alluxio.jsonl"
        # 3. Cold: every rep reads a set of this side that nothing has read before. Three minutes of quiet before the
        # first rep.
        POSIX_GROUP=cold
        sleep 180
        for rep in $(seq 1 3); do
            (( rep == 1 )) || sleep 70
            cold_files="$(files_of "alluxio-cold-r$rep-" 25)"
            # The whole job reads 1536 MiB at random offsets of the set and then ends (no --infloop); --timelimit 120
            # stops a rep that is slower than that, which the summary then compares by IOPS and marks as timed out.
            eb_run alluxio-21-22-r$rep alluxio 21-22 "$rep" 420 -r --rand --randamount 1536M -b 64K -t 8 -s 2147483648 \
                --timelimit 120 --lat --latpercent $cold_files
            record_run cold alluxio-21-22-r$rep
        done

        # 4. Concurrent: every client reads the whole set alluxio-cc-r<rep> at the same time (eb_local_all).
        POSIX_GROUP=concurrent
        sleep 70
        # Appends the counter differences of concurrent rep <rep> to counters-alluxio.jsonl.
        # Usage: record_cc_counters <rep>
        record_cc_counters() {
            counters_jq alluxio-23-24-r$1 '{side: "alluxio", scenario: "23-24", rep: ($rep | tonumber)} + ({before: $before, after: $after} | counter_delta)' \
                --arg rep "$1" >> "$POSIX_RESULT/counters-alluxio.jsonl"
        }
        cc_run() {
            local rep="$1" files path pods pod
            files="$(files_of "alluxio-cc-r$rep-" 8)"
            # $files is split on purpose: the first file is eb_local_all's path, the others follow the options.
            set -- $files
            path="$1"
            shift
            snap_counters alluxio-23-24-r$rep-before
            eb_local_all alluxio-23-24-r$rep alluxio "$rep" 463 "$path" -r -b 16M -t 8 -s 2147483648 "$@"
            snap_counters alluxio-23-24-r$rep-after
            record_cc_counters "$rep"
            pods="$(client_pods)"
            for pod in $pods; do
                record_run concurrent alluxio-23-24-r$rep-$pod
            done
        }
        for rep in $(seq 1 3); do
            (( rep == 1 )) || sleep 70
            cc_run "$rep"
        done
        # 5. Re-read: the same node reads alluxio-m8 twice, on a mount that keeps the kernel page cache; the node's page cache
        # is dropped before the first read.
        wait_until() {
            local timeout="$1" what="$2" deadline
            shift 2
            deadline=$((SECONDS + timeout))
            until "$@"; do
                (( SECONDS < deadline )) || fail "timed out after $timeout s waiting for $what"
                sleep 15
            done
        }
        # Prints the value of the last alluxio.fuse.enforce.direct.io.read line of the properties text on stdin.
        direct_io_value() {
            awk '/^[[:space:]]*alluxio\.fuse\.enforce\.direct\.io\.read[[:space:]]*=/ { value = $0; sub(/^[^=]*=/, "", value); gsub(/[[:space:]]/, "", value) } END { print value }'
        }
        # Prints "<ConfigMap><TAB><container><TAB><mount directory>" for the ConfigMap volume of the pod that holds
        # alluxio-site.properties.
        # Usage: fuse_conf_of <pod>
        fuse_conf_of() {
            local spec names name conf
            spec="$(kubectl get pod "$1" -n "$POSIX_NS" -o json)" || fail "could not read the spec of $1"
            names="$(jq -r '.spec.volumes[]? | .configMap.name // empty' <<< "$spec")"
            for name in $names; do
                if kubectl get configmap "$name" -n "$POSIX_NS" -o json | jq -e '.data["alluxio-site.properties"] != null' > /dev/null; then
                    conf="$(jq -r --arg configmap "$name" '[.spec.volumes[] | select(.configMap.name == $configmap) | .name] as $volumes
                        | [.spec.containers[] | .name as $container | .volumeMounts[]? | select(.name as $volume | any($volumes[]; . == $volume))
                            | [$configmap, $container, .mountPath]] | if length == 0 then empty else .[0] | @tsv end' <<< "$spec")"
                    [[ -n "$conf" ]] || fail "no container of $1 mounts the ConfigMap $name"
                    echo "$conf"
                    return 0
                fi
            done
            fail "no ConfigMap volume of $1 holds alluxio-site.properties"
        }
        # Succeeds when the ConfigMap holds alluxio.fuse.enforce.direct.io.read=<value>.
        # Usage: configmap_has_direct_io <ConfigMap> <value>
        configmap_has_direct_io() {
            local configmap
            configmap="$(kubectl get configmap "$1" -n "$POSIX_NS" -o json)" || return 1
            [[ "$(jq -r '.data["alluxio-site.properties"] // ""' <<< "$configmap" | direct_io_value)" == "$2" ]]
        }
        # Fails unless every FUSE pod has alluxio.fuse.enforce.direct.io.read=<value> in the alluxio-site.properties it
        # mounts, the file its FUSE process read when it started.
        # Usage: require_fuse_direct_io <value>
        require_fuse_direct_io() {
            local pods pod conf configmap container directory value
            pods="$(kubectl get pods -n "$POSIX_NS" -o name)" || fail "could not list the pods in $POSIX_NS"
            pods="$(sed -n 's|^pod/\(alluxio-fuse-.*\)$|\1|p' <<< "$pods")"
            [[ -n "$pods" ]] || fail "no Alluxio FUSE pod to read alluxio.fuse.enforce.direct.io.read from"
            for pod in $pods; do
                conf="$(fuse_conf_of "$pod")"
                IFS=$'\t' read -r configmap container directory <<< "$conf"
                value="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -c "$container" -- cat "$directory/alluxio-site.properties" | direct_io_value)" ||
                    fail "could not read $directory/alluxio-site.properties in $pod"
                [[ "$value" == "$1" ]] || fail "$pod started with alluxio.fuse.enforce.direct.io.read '$value' from the ConfigMap $configmap, not $1"
            done
        }
        # client_list calls fail() (exit) on a wrong count, so it runs in a subshell here.
        clients_ready() {
            (client_list) > /dev/null 2>&1
        }
        # Creates one copy of the manifest (clients-fuse.yaml) per client node, named posix-client-<i>, with ELBENCHO_IMAGE
        # replaced by the image, waits for exactly 5 Ready pods and fails unless /data in each is a
        # FUSE mount that can be listed: a plain directory there would let the test read an empty or wrong location
        # without any error, and a mount whose FUSE process is gone fails every access.
        # Usage: start_fuse_clients <manifest> <elbencho image>
        start_fuse_clients() {
            local i pods pod fstype
            # The anti-affinity rule in the manifest puts each copy on its own node.
            for i in $(seq 1 5); do
                sed -e "s|ELBENCHO_IMAGE|$2|" -e "s|^  name: posix-client$|  name: posix-client-$i|" "$1" |
                    kubectl create -f -
            done
            # 600 s covers pulling the elbencho image on every client node.
            wait_until 600 "exactly 5 elbencho service pods to be Ready" clients_ready
            # An assignment keeps a failure of client_pods; in the for-list it would leave the loop with no pod checked.
            pods="$(client_pods)"
            for pod in $pods; do
                fstype="$(timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- awk '$2 == "/data" { type = $3 } END { print type }' /proc/mounts)"
                [[ "$fstype" == fuse* ]] || fail "$pod: /data is not a FUSE mount (file system type '$fstype')"
                timeout 60 kubectl exec -n "$POSIX_NS" "$pod" -- ls /data > /dev/null || fail "$pod: /data is a FUSE mount that cannot be listed"
            done
        }
        # Replaces the elbencho service pods. A client pod keeps the FUSE mount of the FUSE process that served the host
        # path when the pod started: once that process is gone (a FUSE pod restart), /data in the pod fails with
        # "Transport endpoint is not connected" until the pod is created again. 300 s bounds the deletion.
        # Usage: recreate_fuse_clients <manifest> <elbencho image>
        recreate_fuse_clients() {
            local left
            kubectl delete pod -n "$POSIX_NS" -l app=posix-client --ignore-not-found --wait=true --timeout=300s > /dev/null ||
                fail "could not delete the elbencho service pods within 300 s"
            left="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o name)" || fail "could not list the elbencho service pods"
            [[ -z "$left" ]] || fail "elbencho service pods still exist after their deletion: $left"
            start_fuse_clients "$1" "$2"
        }
        # Succeeds when exactly 5 FUSE pods exist, all Ready, none of them one of the old pods ($1).
        fuse_restarted() {
            local pods
            pods="$(kubectl get pods -n "$POSIX_NS" -o json)" || return 1
            jq -e --argjson old "$1" --argjson want 5 \
                '[.items[] | select(.metadata.name | startswith("alluxio-fuse-"))] as $p |
                ($p | length) == $want and
                all($p[]; (.metadata.uid as $u | ($old | index($u)) == null) and .status.phase == "Running" and
                    any(.status.conditions[]?; .type == "Ready" and .status == "True"))' <<< "$pods" > /dev/null
        }

        fuse_pods="$(kubectl get pods -n "$POSIX_NS" -o json)" || fail "could not list the pods in $POSIX_NS"
        old_uids="$(jq -c '[.items[] | select(.metadata.name | startswith("alluxio-fuse-")) | .metadata.uid]' <<< "$fuse_pods")"
        [[ "$(jq length <<< "$old_uids")" == 5 ]] || fail "expected 5 Alluxio FUSE pods before the restart, found $old_uids"
        first_fuse="$(jq -r '[.items[] | select(.metadata.name | startswith("alluxio-fuse-")) | .metadata.name] | sort | .[0]' <<< "$fuse_pods")"
        fuse_configmap="$(fuse_conf_of "$first_fuse" | cut -f1)"
        kubectl patch alluxiocluster alluxio -n "$POSIX_NS" --type merge \
            --patch '{"spec":{"properties":{"alluxio.fuse.enforce.direct.io.read":"false"}}}'
        [[ "$(kubectl get alluxiocluster alluxio -n "$POSIX_NS" -o jsonpath='{.spec.properties.alluxio\.fuse\.enforce\.direct\.io\.read}')" == false ]] ||
            fail "alluxio.fuse.enforce.direct.io.read was not set to false"
        # The operator renders the change within seconds; 300 s bounds a stuck reconciliation.
        wait_until 300 "the ConfigMap $fuse_configmap to hold alluxio.fuse.enforce.direct.io.read=false" configmap_has_direct_io "$fuse_configmap" false
        kubectl get pods -n "$POSIX_NS" -o name | grep '^pod/alluxio-fuse-' | xargs kubectl delete --ignore-not-found -n "$POSIX_NS" --wait=true --timeout=300s ||
            fail "could not delete the Alluxio FUSE pods within 300 s"
        # A FUSE restart is a pod restart only; 600 s also covers an image pull on a node that lost it.
        wait_until 600 "5 restarted Alluxio FUSE pods to be Ready" fuse_restarted "$old_uids"
        require_fuse_direct_io false
        recreate_fuse_clients "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/clients-fuse.yaml" "telescope.azurecr.io/elbencho:v3.0-37"
        wait_hot_listing
        POSIX_GROUP=reread
        sleep 70
        pods="$(client_pods)"
        reread_pod="$(head -n 1 <<< "$pods")"
        reread_node="$(kubectl get pod "$reread_pod" -n "$POSIX_NS" -o jsonpath='{.spec.nodeName}')"
        [[ -n "$reread_node" ]] || fail "could not find the node of $reread_pod"
        reread_file="$(files_of alluxio-m8 1)"
        reread_run() {
            eb_local alluxio-29-r$1 alluxio 29 "$1" "$reread_pod" 381 -r -b 16M -t 1 -s 8589934592 $reread_file
            record_run reread alluxio-29-r$1
        }
        drop_page_cache "$reread_node"
        snap_counters alluxio-29-before
        reread_run 1
        snap_counters alluxio-29-between
        sleep 70
        reread_run 2
        snap_counters alluxio-29-after
    displayName: Run the POSIX cold, concurrent and re-read scenarios on Alluxio FUSE
    name: posix_alluxio_rest
    timeoutInMinutes: 55
  - bash: |
      set -exo pipefail
      TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
      echo "BENCHMARK_END_TIME: $TIMESTAMP"
      echo "##vso[task.setvariable variable=BENCHMARK_END_TIME]$TIMESTAMP"
    displayName: Record current time as BENCHMARK_END_TIME
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        export KUBECONFIG="$HOME/.kube/config"
        # Avoid WebSocket stream closures during long-running AKS exec commands.
        export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
        fail() {
