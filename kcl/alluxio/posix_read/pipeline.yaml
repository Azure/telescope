        trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
        POSIX_WORK="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        POSIX_RESULT="$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
        POSIX_NS="alx-ns"
        fail() {
            echo "ALLUXIO POSIX READ FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
        jq -c 'select(.group != "hot" or .rep == "all")' "$POSIX_RESULT/index.jsonl" > "$POSIX_WORK/egress-index.jsonl"
        jq -se -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." --argjson sides '["alluxio", "bf2", "dacs"]' 'include "checks"; require_sides($sides)' \
            "$POSIX_WORK/egress-index.jsonl" > /dev/null || fail "the index does not hold the runs of every side"
        first_start="$(jq -sr 'map(.start) | min' "$POSIX_WORK/egress-index.jsonl")"
        last_end="$(jq -sr 'map(.end) | max' "$POSIX_WORK/egress-index.jsonl")"
        resource_id="$(az storage account show \
            --name "alx$(Build.BuildId)p$(System.JobAttempt)" \
            --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --query id \
            --output tsv)"
        [[ -n "$resource_id" ]] || fail "could not resolve the resource ID of alx$(Build.BuildId)p$(System.JobAttempt)"
        # The last group of a side owns the minute after its last end plus 3 trailing minutes (attribute_egress), and
        # Azure Monitor publishes a minute about one minute late: the first query waits until 6 minutes after the last
        # end. Later queries follow every 60 s, for up to 10 more minutes, until every window has data and the bounds
        # of concurrent_summary hold. egress.json ends up as the output of the last query.
        ready_at=$(( $(date -u -d "$last_end" +%s) + 360 ))
        now="$(date -u +%s)"
        (( now >= ready_at )) || sleep $((ready_at - now))
        deadline=$((SECONDS + 600))
        while :; do
            # A failed query (a transient Azure Monitor error) is retried like an incomplete one. Every successful query
            # replaces egress.json in the results, so the metric survives the resource group even if a later check fails.
            if az monitor metrics list \
                --resource "$resource_id" \
                --metric Egress \
                --interval PT1M \
                --aggregation Total \
                --start-time "$first_start" \
                --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$POSIX_WORK/egress.json" 2> "$POSIX_WORK/egress.err"; then
                cp -- "$POSIX_WORK/egress.json" "$POSIX_RESULT/egress.json"
                # Each client of a concurrent rep reads the whole set <side>-cc-r<rep> of its side; hot_bytes is the size
                # of the hot data set.
                if jq -n -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." \
                    --slurpfile index "$POSIX_WORK/egress-index.jsonl" \
                    --slurpfile metrics "$POSIX_RESULT/egress.json" \
                    --slurpfile counters "$POSIX_RESULT/counters-alluxio.jsonl" \
                    --argjson reps 3 \
                    --argjson clients 5 \
                    --argjson client_bytes 17179869184 \
                    --argjson hot_bytes 257698037760 \
                    'include "checks"; {index: $index, metrics: $metrics[0], counters: $counters, hot_bytes: $hot_bytes} | concurrent_summary($reps; $clients; $client_bytes)' \
                    > "$POSIX_WORK/concurrent.json" 2> "$POSIX_WORK/concurrent.err"; then
                    break
                fi
                status="$(tail -n 1 "$POSIX_WORK/concurrent.err")"
            else
                status="the Egress query failed: $(tail -n 1 "$POSIX_WORK/egress.err")"
            fi
            if (( SECONDS >= deadline )); then
                cat "$POSIX_WORK/concurrent.err" "$POSIX_WORK/egress.err" >&2 2> /dev/null || true
                fail "could not attribute Blob egress within 16 minutes of the last run ($status); see egress.json"
            fi
            echo "Blob egress is not complete yet: $status"
            sleep 60
        done

        jq -c 'select(.group == "hot" or .group == "cold")' "$POSIX_RESULT"/runs-*.jsonl > "$POSIX_WORK/summary-runs.jsonl"
        jq -n -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." \
            --slurpfile runs "$POSIX_WORK/summary-runs.jsonl" \
            --slurpfile concurrent "$POSIX_WORK/concurrent.json" \
            --argjson reps 3 \
            --argjson sides '["alluxio", "bf2", "dacs"]' \
            'include "checks"; {runs: ($runs | require_sides($sides)), blob_bytes_by_rep: $concurrent[0].blob_bytes_by_rep} | scenario_summary($reps)' \
            > "$POSIX_WORK/scenarios.json" || fail "could not summarize the hot and cold scenarios"
        # Every hot and cold scenario must be present with exactly the sides that run it.
        jq -e --argjson expected '[{"scenario": "13-16a", "sides": ["alluxio", "bf2", "dacs"]}, {"scenario": "13-16b", "sides": ["alluxio", "bf2", "dacs"]}, {"scenario": "17", "sides": ["alluxio", "bf2", "dacs"]}, {"scenario": "18-t8", "sides": ["alluxio", "bf2", "dacs"]}, {"scenario": "18-t32", "sides": ["alluxio", "bf2", "dacs"]}, {"scenario": "19-t1", "sides": ["alluxio", "bf2", "dacs"]}, {"scenario": "19-t4", "sides": ["alluxio", "bf2", "dacs"]}, {"scenario": "20-t16", "sides": ["alluxio", "bf2", "dacs"]}, {"scenario": "20-t64", "sides": ["alluxio", "bf2", "dacs"]}, {"scenario": "21-22", "sides": ["alluxio", "bf2", "dacs"]}]' \
            '(map({scenario, sides: (.sides | keys)}) | sort_by(.scenario)) == ($expected | sort_by(.scenario))' \
            "$POSIX_WORK/scenarios.json" > /dev/null || fail "the summary does not cover exactly the hot and cold scenarios of every side"

        : > "$POSIX_WORK/reread.jsonl"
        jq -n -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." \
            --slurpfile runs "$POSIX_RESULT/runs-bf2.jsonl" \
            --slurpfile concurrent "$POSIX_WORK/concurrent.json" \
            'include "checks";
            def reread_result($rep):
                [$runs[] | select(.scenario == "29" and .rep == $rep)]
                | if length == 1 then .[0].result else failed("expected one bf2 re-read \($rep), found \(length)") end;
            {side: "bf2", first: reread_result(1), second: reread_result(2), blob_bytes_by_rep: $concurrent[0].blob_bytes_by_rep}
            | {side} + reread_summary' \
            >> "$POSIX_WORK/reread.jsonl" || fail "could not summarize the bf2 re-reads"
        jq -n -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read" -L "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/.." \
            --slurpfile runs "$POSIX_RESULT/runs-alluxio.jsonl" \
            --slurpfile concurrent "$POSIX_WORK/concurrent.json" \
            --rawfile before "$POSIX_RESULT/counters-alluxio-29-before.prom" \
            --rawfile between "$POSIX_RESULT/counters-alluxio-29-between.prom" \
            --rawfile after "$POSIX_RESULT/counters-alluxio-29-after.prom" \
            'include "checks";
            def reread_result($rep):
                [$runs[] | select(.scenario == "29" and .rep == $rep)]
                | if length == 1 then .[0].result else failed("expected one alluxio re-read \($rep), found \(length)") end;
            {side: "alluxio", first: reread_result(1), second: reread_result(2), blob_bytes_by_rep: $concurrent[0].blob_bytes_by_rep} + {counters: {before: $before, between: $between, after: $after}}
            | {side} + reread_summary' \
            >> "$POSIX_WORK/reread.jsonl" || fail "could not summarize the alluxio re-reads"
        # Versions of what ran, read after the egress evidence is saved. Each probe that fails leaves its version null
        # in versions.json and summary.json, which are written either way; then the step fails.
        # BlobFuse2 is installed on the node by the Blob CSI driver, so a pod on a client node runs the node's own binary.
        clients="$(kubectl get pods -n "$POSIX_NS" -l app=posix-client -o json)" || clients='{"items": []}'
        client_pod="$(jq -r '.items | sort_by(.metadata.name) | .[0].metadata.name // empty' <<< "$clients")" || true
        client_node="$(jq -r '.items | sort_by(.metadata.name) | .[0].spec.nodeName // empty' <<< "$clients")" || true
