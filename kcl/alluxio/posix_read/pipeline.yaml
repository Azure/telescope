        sed "s|POSIX_CACHE_COUNT|5|" "$(Build.SourcesDirectory)/kcl/alluxio/posix_read/cluster.yaml" > "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/cluster.yaml"
        ! grep -q POSIX_CACHE_COUNT "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/cluster.yaml" || fail "the POSIX_CACHE_COUNT placeholder is still in the cluster manifest"
        private_command() {
