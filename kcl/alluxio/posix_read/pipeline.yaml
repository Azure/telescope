                kubectl describe pod "$pod" -n "$namespace" 2>&1 | redact_signatures > "$(Build.ArtifactStagingDirectory)/alluxio-posix-read/diagnostics/$namespace-$pod.describe.txt" || true
                # The last 5000 lines of each container cover the end of a failed phase and keep the artifact small.
                kubectl logs "$pod" -n "$namespace" --all-containers=true --prefix=true --tail=5000 2>&1 |
                    redact_signatures > "$(Build.ArtifactStagingDirectory)/alluxio-posix-read/diagnostics/$namespace-$pod.log" || true
            done
        done
    condition: always()
    displayName: Collect safe deployment diagnostics
    name: alluxio_diagnostics
  - bash: |
      set +x
      set -Eeuo pipefail
      umask 077
      mkdir -p -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)" "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"
      chmod 700 "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
      export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
      export KUBECONFIG="$HOME/.kube/config"
      # Avoid WebSocket stream closures during long-running AKS exec commands.
      export KUBECTL_REMOTE_COMMAND_WEBSOCKETS=false
      fail() {
          echo "ALLUXIO POSIX READ FAILED: $*" >&2
          exit 1
      }
      trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
      trap 'rm -f -- "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.out" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/command.err" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/blob.bin" "$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/helm-registry.json"' EXIT
      fail() {
          echo "ALLUXIO POSIX READ FAILED: $*" >&2
          exit 1
      }
      trap 'echo "ALLUXIO POSIX READ FAILED: command at line $LINENO exited with status $?" >&2' ERR
      if grep -rq 'sig=' "$(Build.ArtifactStagingDirectory)/alluxio-posix-read"; then
          find "$(Build.ArtifactStagingDirectory)/alluxio-posix-read" -mindepth 1 -delete
          echo "ALLUXIO POSIX READ FAILED: a SAS signature (sig=) was present in the results; the results were deleted, not published" >&2
          exit 1
      fi
    condition: always()
    displayName: Refuse to publish results that contain a SAS signature
    name: posix_sas_check
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/alluxio-posix-read
      artifact: alluxio-posix-read-$(System.JobAttempt)
    condition: always()
    displayName: Publish POSIX read results and diagnostics
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        for NODE_RG in $(az aks list \
          --resource-group "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --query "[].nodeResourceGroup" \
          --output tsv); do
          echo "Checking VMSS rolling upgrades in node resource group: $NODE_RG"
          for VMSS in $(az vmss list \
            --resource-group "$NODE_RG" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --query "[].name" \
            --output tsv); do
            echo "Attempting to cancel rolling upgrade for VMSS: $VMSS"
            az vmss rolling-upgrade cancel \
              --resource-group "$NODE_RG" \
              --name "$VMSS" \
              --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
              && echo "Cancelled rolling upgrade for $VMSS." \
              || echo "No active rolling upgrade to cancel for $VMSS (or cancel not applicable)."
          done
        done

        az group delete --name "alluxio-posix-read-$(RUN_ID)-$(System.JobAttempt)" --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --yes
    condition: and(always(), eq(variables['SHOULD_CLEAN_UP_RESOURCE_GROUP'], 'true'))
    displayName: Delete resource group (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
