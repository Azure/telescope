name: Alluxio Warp Azure Blob
pool: AKS-Telescope-Airlock
trigger: none
pr: none
jobs:
- job: alluxio_warp
  displayName: Alluxio Warp GET over Azure Blob
  timeoutInMinutes: 180
  cancelTimeoutInMinutes: 30
  steps:
  - bash: |
      set -eo pipefail

      job_id="$(System.JobId)"
      RUN_ID=$(Build.BuildId)-${job_id:0:8}
      echo "Run ID: $RUN_ID"

      echo "##vso[task.setvariable variable=RUN_ID]$RUN_ID"
    displayName: Set Run ID
  - bash: |-
      set -euo pipefail
      if ! command -v helm >/dev/null 2>&1; then
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      fi
      helm version --short
    displayName: Install Helm
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        work_dir="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        result_dir="$(Build.ArtifactStagingDirectory)/alluxio-warp"
        mkdir -p -- "$work_dir" "$result_dir"
        chmod 700 "$work_dir"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$work_dir/command.out" "$work_dir/command.err" "$work_dir/blob.bin" "$work_dir/license.json" "$work_dir/ufs.json" "$work_dir/helm-registry.json"' EXIT
        acr_resource_id="REPLACE_ME_ACR_RESOURCE_ID"
        alluxio_image="REPLACE_ME.azurecr.io/alluxio-enterprise"
        operator_image="REPLACE_ME.azurecr.io/alluxio-operator"
        subscription="b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
        resource_group="alluxio-$(RUN_ID)-$(System.JobAttempt)"
        cluster="alluxio-warp"
        location="westeurope"
        registry="$(timeout 300 az acr show --ids "$acr_resource_id")"
        registry_name="$(jq -er '.name' <<< "$registry")"
        acr_subscription="$(jq -er '.id | split("/")[2]' <<< "$registry")"
        images='{}'
        for image in "$alluxio_image" "$operator_image"; do
            tag="AI-3.8-15.1.28"
            if [[ "$image" == "$operator_image" ]]; then tag="3.7.6"; fi
            digest="$(timeout 300 az acr repository show \
                --name "$registry_name" \
                --subscription "$acr_subscription" \
                --image "${image#*/}:$tag" | jq -er '.digest')"
            images="$(jq --arg image "$image:$tag" --arg digest "$digest" '. + {($image): $digest}' <<< "$images")"
        done
        exists="$(timeout 300 az group exists \
            --name "$resource_group" \
            --subscription "$subscription")"
        [[ "$exists" == false ]] || fail "Resource group already exists or could not be verified; refusing to reuse or delete it"

        storage_account="alx$(printf '%s' "$resource_group" | sha256sum | cut -c1-20)"
        jq -n \
            --arg acr_resource_id "$acr_resource_id" --arg acr_subscription "$acr_subscription" \
            --arg alluxio_image "$alluxio_image" --arg operator_image "$operator_image" \
            --arg resource_group "$resource_group" --arg subscription "$subscription" \
            --arg cluster "$cluster" --arg location "$location" --arg storage_account "$storage_account" \
            '$ARGS.named' > "$work_dir/config.json"
        jq \
            --argjson image_digests "$images" \
            --arg operator_chart "oci://REPLACE_ME.azurecr.io/helm/alluxio-operator" \
            --arg operator_version "3.7.6" --arg warp_version "1.3.1" \
            '. + $ARGS.named + {
                worker_cache: "8Gi", worker_cache_reserved: "1Gi",
                support_nodes: {count: 2, sku: "Standard_D8s_v5"},
                worker_nodes: {count: 1, sku: "Standard_D16s_v5"},
                client_nodes: {count: 1, sku: "Standard_D8s_v5"}
            }' "$work_dir/config.json" > "$result_dir/configuration.json"
        echo '##vso[task.setvariable variable=READY_FOR_PROVISIONING;isOutput=true]true'
    displayName: Prepare run configuration
    name: alluxio_setup
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |+
        set -exo pipefail
        az group create \
          --name "alluxio-$(RUN_ID)-$(System.JobAttempt)" \
          --location "westeurope" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

    displayName: Create resource group in westeurope (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks create \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --resource-group "alluxio-$(RUN_ID)-$(System.JobAttempt)" \
          --name "alluxio-warp" \
          --location "westeurope" \
          --kubernetes-version "1.36" \
          --nodepool-name systempool \
          --node-count 3 \
          --node-vm-size Standard_D8s_v5 \
          --network-plugin azure \
          --network-plugin-mode overlay \
          --enable-managed-identity \
          --no-ssh-key \
          --tier standard \
          --yes
    displayName: Create cluster
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        create_node_pool \
          --cluster-name "alluxio-warp" \
          --resource-group "alluxio-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --name "workerpool" \
          --node-count 1 \
          --node-vm-size "Standard_D16s_v5" \
          --mode User \
          --node-taints alluxio=true:NoSchedule
    displayName: Create node pool workerpool
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        create_node_pool \
          --cluster-name "alluxio-warp" \
          --resource-group "alluxio-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --name "clientpool" \
          --node-count 1 \
          --node-vm-size "Standard_D8s_v5" \
          --mode User \
          --node-taints warp=true:NoSchedule
    displayName: Create node pool clientpool
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks get-credentials \
          --name "alluxio-warp" \
          --resource-group "alluxio-$(RUN_ID)-$(System.JobAttempt)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing \
          -f $(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/kubeconfig
    displayName: Get credentials for alluxio-warp
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        work_dir="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        result_dir="$(Build.ArtifactStagingDirectory)/alluxio-warp"
        mkdir -p -- "$work_dir" "$result_dir"
        chmod 700 "$work_dir"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$work_dir/command.out" "$work_dir/command.err" "$work_dir/blob.bin" "$work_dir/license.json" "$work_dir/ufs.json" "$work_dir/helm-registry.json"' EXIT
        for name in acr_resource_id acr_subscription alluxio_image operator_image \
                    resource_group subscription cluster location storage_account; do
            printf -v "$name" '%s' "$(jq -er --arg name "$name" '.[$name] | select(type == "string" and length > 0)' "$work_dir/config.json")"
            [[ -n "${!name}" ]] || fail "Missing configuration field: $name"
        done
        identity="$(timeout 300 az aks show \
            --name "$cluster" \
            --resource-group "$resource_group" \
            --subscription "$subscription" | jq -er '.identityProfile.kubeletidentity.objectId')"
        role_name="$(cat /proc/sys/kernel/random/uuid)"
        role_id="$acr_resource_id/providers/Microsoft.Authorization/roleAssignments/$role_name"
        # Persist ownership before creation so uncertain CLI receipts remain recoverable.
        jq -n --arg id "$role_id" '{id: $id}' > "$work_dir/role.json"
        timeout 300 az role assignment create \
            --name "$role_name" \
            --assignee-object-id "$identity" \
            --assignee-principal-type ServicePrincipal \
            --role AcrPull \
            --scope "$acr_resource_id" \
            --subscription "$acr_subscription" > /dev/null
    displayName: Grant this cluster image pull access
    name: alluxio_acr_grant
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        work_dir="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        result_dir="$(Build.ArtifactStagingDirectory)/alluxio-warp"
        mkdir -p -- "$work_dir" "$result_dir"
        chmod 700 "$work_dir"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$work_dir/command.out" "$work_dir/command.err" "$work_dir/blob.bin" "$work_dir/license.json" "$work_dir/ufs.json" "$work_dir/helm-registry.json"' EXIT
        for name in acr_resource_id acr_subscription alluxio_image operator_image \
                    resource_group subscription cluster location storage_account; do
            printf -v "$name" '%s' "$(jq -er --arg name "$name" '.[$name] | select(type == "string" and length > 0)' "$work_dir/config.json")"
            [[ -n "${!name}" ]] || fail "Missing configuration field: $name"
        done
        private_command() {
            if "$@" > "$work_dir/command.out" 2> "$work_dir/command.err"; then
                cat "$work_dir/command.out"
            else
                fail "$1 failed; secret-bearing output withheld"
            fi
        }
        require_secret() {
            [[ -n "${!1:-}" && "${!1}" != '$('* ]] || fail "Required secret pipeline variable $1 is missing"
        }
        cluster_info="$(timeout 300 az aks show \
            --name "$cluster" \
            --resource-group "$resource_group" \
            --subscription "$subscription")"
        timeout 300 az storage account create \
            --name "$storage_account" \
            --resource-group "$resource_group" \
            --subscription "$subscription" \
            --location "$location" \
            --kind StorageV2 \
            --sku Standard_LRS \
            --https-only true \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false \
            --hns false > /dev/null
        export AZURE_STORAGE_ACCOUNT="$storage_account"
        AZURE_STORAGE_KEY="$(private_command timeout 300 az storage account keys list \
            --account-name "$storage_account" \
            --resource-group "$resource_group" \
            --subscription "$subscription" | jq -er '.[0].value')"
        export AZURE_STORAGE_KEY
        timeout 300 az storage container create \
            --name warp-data \
            --public-access off > /dev/null
        for ((index = 0; index < 16; index++)); do
            # Fixed per-object keys produce deterministic, nonzero 64 MiB payloads.
            head -c 67108864 /dev/zero |
                openssl enc -aes-256-ctr -K "$(printf '%064x' "$index")" \
                    -iv 00000000000000000000000000000000 > "$work_dir/blob.bin"
            timeout 300 az storage blob upload \
                --container-name warp-data \
                --name "$(printf 'object-%02d.bin' "$index")" \
                --file "$work_dir/blob.bin" \
                --overwrite false > /dev/null
        done
        rm -f -- "$work_dir/blob.bin"
        timeout 300 az storage blob list --container-name warp-data |
            jq -e -L "$(Build.SourcesDirectory)/kcl/alluxio/warp" 'include "checks"; validate_dataset' > /dev/null
        private_command timeout 300 az storage container generate-sas \
            --name warp-data \
            --permissions rl \
            --expiry "$(date -u -d '+4 hours' +%Y-%m-%dT%H:%MZ)" \
            --https-only | jq -er 'select(type == "string" and length > 0)' > "$work_dir/blob-sas"
        unset AZURE_STORAGE_KEY
        jq -n \
            --arg storage_account "$storage_account" --arg container warp-data \
            --arg location "$location" --arg kubernetes_version "$(jq -er '.kubernetesVersion' <<< "$cluster_info")" \
            '$ARGS.named + {object_count: 16, object_bytes: 67108864, total_bytes: 1073741824}' \
            > "$result_dir/dataset.json"
    displayName: Create Blob storage and seed 1 GiB
    name: alluxio_dataset
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +x
        set -Eeuo pipefail
        umask 077
        work_dir="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
        result_dir="$(Build.ArtifactStagingDirectory)/alluxio-warp"
        mkdir -p -- "$work_dir" "$result_dir"
        chmod 700 "$work_dir"
        export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
        fail() {
            echo "ALLUXIO WARP FAILED: $*" >&2
            exit 1
        }
        trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
        trap 'rm -f -- "$work_dir/command.out" "$work_dir/command.err" "$work_dir/blob.bin" "$work_dir/license.json" "$work_dir/ufs.json" "$work_dir/helm-registry.json"' EXIT
        for name in acr_resource_id acr_subscription alluxio_image operator_image \
                    resource_group subscription cluster location storage_account; do
            printf -v "$name" '%s' "$(jq -er --arg name "$name" '.[$name] | select(type == "string" and length > 0)' "$work_dir/config.json")"
            [[ -n "${!name}" ]] || fail "Missing configuration field: $name"
        done
        private_command() {
            if "$@" > "$work_dir/command.out" 2> "$work_dir/command.err"; then
                cat "$work_dir/command.out"
            else
                fail "$1 failed; secret-bearing output withheld"
            fi
        }
        require_secret() {
            [[ -n "${!1:-}" && "${!1}" != '$('* ]] || fail "Required secret pipeline variable $1 is missing"
        }
        export KUBECONFIG="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/kubeconfig"
        registry="$(timeout 300 az acr show --ids "$acr_resource_id")"
        registry_name="$(jq -er '.name' <<< "$registry")"
        login_server="$(jq -er '.loginServer' <<< "$registry")"
        registry_token="$(private_command timeout 300 az acr login \
            --name "$registry_name" \
            --subscription "$acr_subscription" \
            --expose-token --query accessToken --output tsv)"
        printf '%s' "$registry_token" |
            private_command timeout 300 helm registry login "$login_server" \
                --username 00000000-0000-0000-0000-000000000000 \
                --password-stdin --registry-config "$work_dir/helm-registry.json" > /dev/null
        unset registry_token
        timeout 70 kubectl --request-timeout=60s create namespace alx-ns
        jq -n --arg image "$operator_image" --arg tag "3.7.6" \
            '{global: {image: $image, imageTag: $tag}}' > "$work_dir/operator-values.json"
        timeout 960 helm install operator "oci://REPLACE_ME.azurecr.io/helm/alluxio-operator" \
            --version "3.7.6" \
            --registry-config "$work_dir/helm-registry.json" \
            --namespace alluxio-operator \
            --create-namespace \
            --values "$work_dir/operator-values.json" \
            --wait \
            --timeout 15m
        for crd in alluxioclusters licenses underfilesystems; do
            timeout 180 kubectl wait --for=condition=Established \
                "crd/$crd.k8s-operator.alluxio.com" --timeout=120s
        done
    displayName: Install the Alluxio operator
    name: alluxio_operator
  - bash: |
      set +x
      set -Eeuo pipefail
      umask 077
      work_dir="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
      result_dir="$(Build.ArtifactStagingDirectory)/alluxio-warp"
      mkdir -p -- "$work_dir" "$result_dir"
      chmod 700 "$work_dir"
      export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
      fail() {
          echo "ALLUXIO WARP FAILED: $*" >&2
          exit 1
      }
      trap 'echo "ALLUXIO WARP FAILED: command at line $LINENO exited with status $?" >&2' ERR
      trap 'rm -f -- "$work_dir/command.out" "$work_dir/command.err" "$work_dir/blob.bin" "$work_dir/license.json" "$work_dir/ufs.json" "$work_dir/helm-registry.json"' EXIT
      for name in acr_resource_id acr_subscription alluxio_image operator_image \
                  resource_group subscription cluster location storage_account; do
          printf -v "$name" '%s' "$(jq -er --arg name "$name" '.[$name] | select(type == "string" and length > 0)' "$work_dir/config.json")"
          [[ -n "${!name}" ]] || fail "Missing configuration field: $name"
      done
      private_command() {
          if "$@" > "$work_dir/command.out" 2> "$work_dir/command.err"; then
              cat "$work_dir/command.out"
          else
              fail "$1 failed; secret-bearing output withheld"
          fi
      }
      require_secret() {
          [[ -n "${!1:-}" && "${!1}" != '$('* ]] || fail "Required secret pipeline variable $1 is missing"
      }
      create_private_resource() {
          private_command timeout 180 kubectl create --dry-run=server --validate=strict -f "$1" > /dev/null
          private_command timeout 180 kubectl create -f "$1" > /dev/null
      }
      wait_phase() {
          local kind="$1" name="$2" field="$3" expected="$4" phase deadline=$((SECONDS + 900))
          while :; do
              phase="$(timeout 70 kubectl --request-timeout=60s get \
                  "$kind" "$name" -n alx-ns -o "jsonpath={.status.$field}")"
              [[ "$phase" != "$expected" ]] || return 0
              case "$phase" in
                  Failed|Error|Terminated) fail "$kind/$name failed; inspect securely in cluster" ;;
              esac
              (( SECONDS < deadline )) || fail "$kind/$name did not reach $expected before timeout"
              sleep 10
          done
      }
      require_secret ALLUXIO_LICENSE_STRING
      cat > "$work_dir/cluster.yaml" <<EOF
      apiVersion: k8s-operator.alluxio.com/v1
      kind: AlluxioCluster
      metadata:
        name: alluxio
        namespace: alx-ns
      spec:
        image: $alluxio_image
        imageTag: $alluxio_tag
        properties:
          alluxio.worker.s3.api.enabled: "true"
          alluxio.worker.s3.redirect.enabled: "false"
          alluxio.security.authentication.type: SIMPLE
          alluxio.underfs.abfs.sdk.version: "2"
        coordinator:
          nodeSelector: {agentpool: systempool}
          resources:
            requests: {cpu: "4", memory: 12Gi}
            limits: {cpu: "4", memory: 12Gi}
          jvmOptions: ["-Xmx4g", "-Xms4g", "-XX:MaxDirectMemorySize=4g"]
        worker:
          count: 1
          nodeSelector: {agentpool: workerpool}
          tolerations:
            - {key: alluxio, operator: Equal, value: "true", effect: NoSchedule}
          resources:
            requests: {cpu: "8", memory: 24Gi}
            limits: {cpu: "8", memory: 24Gi}
          jvmOptions: ["-Xmx8g", "-Xms8g", "-XX:MaxDirectMemorySize=12g"]
          pagestore: {size: 8Gi, reservedSize: 1Gi}
        # A single etcd replica is sufficient for this disposable, non-HA PoC.
        etcd:
          replicaCount: 1
          nodeSelector: {agentpool: systempool}
          persistence: {storageClass: managed-csi, size: 10Gi}
        prometheus: {enabled: false}
        grafana: {enabled: false}
      EOF
      timeout 180 kubectl create --dry-run=server --validate=strict -f "$work_dir/cluster.yaml" > /dev/null
      timeout 180 kubectl create -f "$work_dir/cluster.yaml" > /dev/null
      jq -n '{
          apiVersion: "k8s-operator.alluxio.com/v1", kind: "License",
          metadata: {name: "alluxio-license", namespace: "alx-ns"},
          spec: {clusters: [{name: "alluxio", namespace: "alx-ns"}],
                 licenseString: env.ALLUXIO_LICENSE_STRING}
      }' > "$work_dir/license.json"
      create_private_resource "$work_dir/license.json"
      wait_phase license alluxio-license phase Completed
      wait_phase alluxiocluster alluxio clusterPhase Ready
      for pod in alluxio-coordinator-0 alluxio-worker-0; do
          timeout 660 kubectl wait -n alx-ns --for=condition=Ready "pod/$pod" --timeout=600s
      done
    displayName: Create Alluxio and apply the deployment license
    env:
      alluxio_tag: AI-3.8-15.1.28
      ALLUXIO_LICENSE_STRING: $(ALLUXIO_LICENSE_STRING)
      WORK_DIR: $(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)
      RESULT_DIR: $(Build.ArtifactStagingDirectory)/alluxio-warp
      KUBECONFIG: $(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)/kubeconfig
    name: alluxio_cluster
  - bash: |
      set +x
      set -Eeuo pipefail
      umask 077
      work_dir="$(Agent.TempDirectory)/alluxio-$(System.JobId)-$(System.JobAttempt)"
      result_dir="$(Build.ArtifactStagingDirectory)/alluxio-warp"
      mkdir -p -- "$work_dir" "$result_dir"
      chmod 700 "$work_dir"
      export AZURE_CORE_ONLY_SHOW_ERRORS=true AZURE_CORE_OUTPUT=json
