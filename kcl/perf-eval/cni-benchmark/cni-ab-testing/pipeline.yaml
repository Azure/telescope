        apiVersion: eksctl.io/v1alpha5
        kind: ClusterConfig
        metadata:
          name: $(RUN_ID)
          region: eu-west-1
          version: "1.33"
        vpc:
          cidr: 10.0.0.0/16
          nat:
            gateway: Single
        managedNodeGroups:
          - name: default
            instanceType: m5.4xlarge
            desiredCapacity: 3
            minSize: 3
            maxSize: 3
            amiFamily: AmazonLinux2023
            privateNetworking: false
          - name: prompool
            instanceType: m5.4xlarge
            desiredCapacity: 1
            minSize: 1
            maxSize: 1
            amiFamily: AmazonLinux2023
            privateNetworking: false
            labels:
              prometheus: "true"
          - name: userpool0
            instanceType: m5.4xlarge
            desiredCapacity: 10
            minSize: 10
            maxSize: 10
            amiFamily: AmazonLinux2023
            privateNetworking: false
            labels:
              cri-resource-consume: "true"
              agentpool: userpool0
            taints:
              - key: cri-resource-consume
