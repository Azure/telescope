          curl -fsSL "https://github.com/eksctl-io/eksctl/releases/download/v${version}/eksctl_Linux_${arch}.tar.gz" |
            tar -xz -C /tmp
          sudo install -m 0755 /tmp/eksctl /usr/local/bin/eksctl
        fi
        eksctl version

