name: AI Inferencing Cost Efficiency Benchmark
pool: AKS-Telescope-Airlock
trigger:
- v2
jobs:
- job: vllm_qwen25_7b
  displayName: vLLM Qwen2.5 7B cost efficiency benchmark
  timeoutInMinutes: 240
  steps:
  - bash: |
      set -eo pipefail

      job_id="$(System.JobId)"
      RUN_ID=$(Build.BuildId)-${job_id:0:8}
      echo "Run ID: $RUN_ID"

      echo "##vso[task.setvariable variable=RUN_ID]$RUN_ID"
    displayName: Set Run ID
  - bash: |-
      set -exo pipefail
      pip3 install --upgrade "pip<24"
      pip3 install -r $(Pipeline.Workspace)/s/modules/python/requirements.txt
    displayName: Install Python dependencies
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az account set --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133"
        az config set defaults.location="australiaeast"
        az account show
    displayName: Login to Azure
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az group create \
          --name "$(RUN_ID)" \
          --location "australiaeast" \
          --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" \
        --tags scenario=vllm-qwen25-7b-cost-efficiency
    displayName: Create resource group in australiaeast (f6e2f77f-9959-42ad-87f0-c30a6abc0133)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az version
        az upgrade --yes --only-show-errors || echo "Azure CLI upgrade failed or is unavailable on this agent; continuing with installed CLI."
        az config set extension.dynamic_install_allow_preview=true
        az extension add --name aks-preview --upgrade --allow-preview true || az extension add --name aks-preview --upgrade || az extension update --name aks-preview || true
        az version

        GPU_NODEPOOL_FLAGS="--gpu-driver Install"
        if az aks nodepool add --help 2>/dev/null | grep -q -- "--enable-managed-gpu"; then
          GPU_NODEPOOL_FLAGS="--enable-managed-gpu=true"
        fi
        echo "Using GPU node pool flags: $GPU_NODEPOOL_FLAGS"

        az aks create \
          --name "ai-inference-cost" \
          --resource-group "$(RUN_ID)" \
          --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" \
          --location "australiaeast" \
          --tier standard \
          --nodepool-name systempool \
          --node-count 3 \
          --node-vm-size "Standard_D8s_v5" \
          --network-plugin azure \
          --network-plugin-mode overlay \
          --pod-cidr 10.64.0.0/10 \
          --service-cidr 10.0.0.0/16 \
          --dns-service-ip 10.0.0.10 \
          --outbound-type managedNATGateway \
          --enable-managed-identity \
          --generate-ssh-keys

        az aks nodepool add \
          --cluster-name "ai-inference-cost" \
          --resource-group "$(RUN_ID)" \
          --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" \
          --name "gpupool" \
          --node-vm-size "Standard_NC40ads_H100_v5" \
          --node-count 0 \
          --node-taints sku=gpu:NoSchedule \
          $GPU_NODEPOOL_FLAGS

        for i in $(seq 1 60); do
          GPU_POOL_STATE=$(az aks nodepool show \
            --cluster-name "ai-inference-cost" \
            --resource-group "$(RUN_ID)" \
            --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" \
            --name "gpupool" \
            --query provisioningState -o tsv)
          CLUSTER_STATE=$(az aks show \
            --name "ai-inference-cost" \
            --resource-group "$(RUN_ID)" \
            --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" \
            --query provisioningState -o tsv)
          echo "Cluster provisioningState: $CLUSTER_STATE; GPU nodepool provisioningState: $GPU_POOL_STATE"
          if [ "$CLUSTER_STATE" = "Succeeded" ] && [ "$GPU_POOL_STATE" = "Succeeded" ]; then
            break
          fi
          sleep 30
        done

        if [ "$CLUSTER_STATE" != "Succeeded" ] || [ "$GPU_POOL_STATE" != "Succeeded" ]; then
          echo "AKS cluster or GPU nodepool did not reach Succeeded before scale-out test."
          az aks nodepool show \
            --cluster-name "ai-inference-cost" \
            --resource-group "$(RUN_ID)" \
            --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" \
            --name "gpupool" -o json
          exit 1
        fi
    displayName: Create AKS GPU benchmark cluster
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks get-credentials \
          --name "ai-inference-cost" \
          --resource-group "$(RUN_ID)" \
          --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" \
          --overwrite-existing
    displayName: Get credentials for ai-inference-cost
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        kubectl create namespace "vllm-benchmark"

        GPU_SCALE_START_SECONDS=$(date +%s)
        SCALE_SUCCEEDED=false
        for i in $(seq 1 20); do
          if az aks nodepool scale \
            --cluster-name "ai-inference-cost" \
            --resource-group "$(RUN_ID)" \
            --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" \
            --name "gpupool" \
            --node-count 1; then
            SCALE_SUCCEEDED=true
            break
          fi
          echo "GPU nodepool scale attempt $i failed, likely due to a transient AKS operation conflict. Retrying in 30s..."
          sleep 30
        done

        if [ "$SCALE_SUCCEEDED" != "true" ]; then
          echo "Failed to scale GPU nodepool after retries."
          az aks nodepool show \
            --cluster-name "ai-inference-cost" \
            --resource-group "$(RUN_ID)" \
            --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" \
            --name "gpupool" -o json
          exit 1
        fi

        wait_for_gpu_allocatable() {
          attempts="$1"
          GPU_ALLOCATABLE=""
          for i in $(seq 1 "$attempts"); do
            GPU_ALLOCATABLE=$(kubectl get nodes -l kubernetes.azure.com/agentpool="gpupool" -o jsonpath='{.items[0].status.allocatable.nvidia\.com/gpu}' 2>/dev/null || true)
            echo "GPU allocatable on gpupool: $GPU_ALLOCATABLE"
            if [ "$GPU_ALLOCATABLE" = "1" ]; then
              GPU_READY_SECONDS=$(($(date +%s) - GPU_SCALE_START_SECONDS))
              return 0
            fi
            sleep 30
          done
          return 1
        }

        if ! wait_for_gpu_allocatable 20; then
          echo "GPU is not allocatable yet; installing the NVIDIA device plugin for self-managed GPU setup."
          kubectl apply -f https://raw.githubusercontent.com/NVIDIA/k8s-device-plugin/v0.17.1/deployments/static/nvidia-device-plugin.yml
          kubectl -n kube-system patch daemonset nvidia-device-plugin-daemonset --type='merge' -p '{"spec":{"template":{"spec":{"nodeSelector":{"kubernetes.azure.com/agentpool":"gpupool"},"tolerations":[{"key":"sku","operator":"Equal","value":"gpu","effect":"NoSchedule"},{"key":"nvidia.com/gpu","operator":"Exists","effect":"NoSchedule"}]}}}}'
          kubectl -n kube-system rollout status daemonset/nvidia-device-plugin-daemonset --timeout=15m
          wait_for_gpu_allocatable 60
        fi

        if [ "$GPU_ALLOCATABLE" != "1" ]; then
          kubectl get nodes -l kubernetes.azure.com/agentpool="gpupool" -o wide
          kubectl describe nodes -l kubernetes.azure.com/agentpool="gpupool"
          kubectl -n kube-system get pods -l name=nvidia-device-plugin-ds -o wide
          kubectl -n kube-system logs daemonset/nvidia-device-plugin-daemonset --all-containers=true --tail=200 || true
          exit 1
        fi

        VLLM_DEPLOY_START_SECONDS=$(date +%s)
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: vllm
          namespace: vllm-benchmark
        spec:
          replicas: 1
          progressDeadlineSeconds: 1800
          selector:
            matchLabels:
              app: vllm
          template:
            metadata:
              labels:
                app: vllm
            spec:
              enableServiceLinks: false
              nodeSelector:
                kubernetes.azure.com/agentpool: gpupool
              tolerations:
              - key: sku
                operator: Equal
                value: gpu
                effect: NoSchedule
              containers:
              - name: vllm
                image: vllm/vllm-openai:latest
                args:
                - --model
                - Qwen/Qwen2.5-7B-Instruct
                - --host
                - 0.0.0.0
                - --port
                - "8000"
                ports:
                - containerPort: 8000
                resources:
                  limits:
                    nvidia.com/gpu: 1
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 60
                  periodSeconds: 15
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: vllm
          namespace: vllm-benchmark
        spec:
          selector:
            app: vllm
          ports:
          - port: 8000
            targetPort: 8000
        EOF

        if ! kubectl rollout status deployment/vllm --namespace="vllm-benchmark" --timeout=35m; then
          kubectl get pods --namespace="vllm-benchmark" -o wide
          kubectl get events --namespace="vllm-benchmark" --sort-by=.lastTimestamp
          kubectl describe deployment/vllm --namespace="vllm-benchmark"
          kubectl describe pods --namespace="vllm-benchmark"
          kubectl logs --namespace="vllm-benchmark" deployment/vllm --all-containers=true --tail=200 || true
          exit 1
        fi
        VLLM_READY_SECONDS=$(($(date +%s) - VLLM_DEPLOY_START_SECONDS))

        VLLM_POD=$(kubectl get pod --namespace="vllm-benchmark" -l app=vllm -o jsonpath='{.items[0].metadata.name}')
        kubectl logs --namespace="vllm-benchmark" "$VLLM_POD" > /tmp/vllm-server.log || true
        MODEL_LOAD_SECONDS=$(python3 - <<'PY'
        import re

        patterns = [
            r"Loading model weights took ([0-9.]+) seconds",
            r"Model loading took ([0-9.]+) seconds",
            r"Loaded model .* in ([0-9.]+) seconds",
            r"init engine .* took ([0-9.]+) s",
        ]

        try:
            text = open("/tmp/vllm-server.log", encoding="utf-8").read()
        except FileNotFoundError:
            text = ""

        for pattern in patterns:
            matches = re.findall(pattern, text, flags=re.IGNORECASE)
            if matches:
                print(matches[-1])
                break
        PY
        )
        echo "GPU ready seconds: $GPU_READY_SECONDS"
        echo "vLLM ready seconds: $VLLM_READY_SECONDS"
        echo "Model load seconds: $MODEL_LOAD_SECONDS"

        START_SECONDS=$(date +%s)

        cat <<EOF | kubectl apply -f -
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: vllm-bench
          namespace: vllm-benchmark
        spec:
          backoffLimit: 0
          template:
            spec:
              enableServiceLinks: false
              restartPolicy: Never
              containers:
              - name: bench
                image: vllm/vllm-openai:latest
                command:
                - bash
                - -lc
                - |
                  set -euo pipefail
                  vllm bench serve \
                    --backend openai-chat \
                    --base-url http://vllm:8000 \
                    --endpoint /v1/chat/completions \
                    --model Qwen/Qwen2.5-7B-Instruct \
                    --dataset-name random \
                    --random-input-len 512 \
                    --random-output-len 128 \
                    --request-rate 10 \
                    --num-prompts 1000 \
                    --save-result \
                    --result-filename /tmp/vllm-bench-result.json
                  test -s /tmp/vllm-bench-result.json
                  echo "__VLLM_RESULT_JSON_BEGIN__"
                  cat /tmp/vllm-bench-result.json
                  printf '\n__VLLM_RESULT_JSON_END__\n'
        EOF

        kubectl wait --for=condition=complete job/vllm-bench --namespace="vllm-benchmark" --timeout=60m

        END_SECONDS=$(date +%s)
        DURATION_SECONDS=$((END_SECONDS - START_SECONDS))

        BENCH_POD=$(kubectl get pod --namespace="vllm-benchmark" -l job-name=vllm-bench -o jsonpath='{.items[0].metadata.name}')
        kubectl logs --namespace="vllm-benchmark" "$BENCH_POD" > /tmp/vllm-bench.log
        sed -n '/__VLLM_RESULT_JSON_BEGIN__/,/__VLLM_RESULT_JSON_END__/p' /tmp/vllm-bench.log \
          | sed '1d;$d' > /tmp/vllm-bench-result.json
        cat /tmp/vllm-bench-result.json

        if [ ! -s /tmp/vllm-bench-result.json ]; then
          echo "Benchmark result JSON was not found in the benchmark pod logs."
          echo "Full benchmark pod logs:"
          cat /tmp/vllm-bench.log
          exit 1
        fi

        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        python3 - <<PY
        import json

        with open("/tmp/vllm-bench-result.json", "r", encoding="utf-8") as f:
            bench = json.load(f)

        duration_seconds = int("$DURATION_SECONDS")
        gpu_ready_seconds = int("$GPU_READY_SECONDS")
        vllm_ready_seconds = int("$VLLM_READY_SECONDS")
        model_load_seconds_raw = "$MODEL_LOAD_SECONDS".strip()
        model_load_seconds = float(model_load_seconds_raw) if model_load_seconds_raw else None
        gpu_node_count = 1
        hourly_cost = float("6.98")
        total_cost = gpu_node_count * hourly_cost * duration_seconds / 3600.0
        total_tokens = 1000 * (512 + 128)

        result = {
            "scenario": "vllm-qwen25-7b-cost-efficiency",
            "region": "australiaeast",
            "cluster": "ai-inference-cost",
            "model": "Qwen/Qwen2.5-7B-Instruct",
            "runtime": "vllm",
            "gpu_vm_size": "Standard_NC40ads_H100_v5",
            "gpu_node_count": gpu_node_count,
            "request_rate": 10,
            "num_prompts": 1000,
            "input_tokens_per_prompt": 512,
            "output_tokens_per_prompt": 128,
            "duration_seconds": duration_seconds,
            "gpu_ready_seconds": gpu_ready_seconds,
            "vllm_ready_seconds": vllm_ready_seconds,
            "model_load_seconds": model_load_seconds,
            "startup_seconds": gpu_ready_seconds + vllm_ready_seconds,
            "estimated_cost_usd": total_cost,
            "estimated_cost_per_1m_tokens_usd": total_cost * 1_000_000 / total_tokens,
            "vllm_benchmark": bench,
        }

        wrapped_result = {
            "timestamp": "$TIMESTAMP",
            "run_id": "$(RUN_ID)",
            "run_url": "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)",
            "pipeline": "$(Build.DefinitionName)",
            "result": result,
        }

        with open("/tmp/run-result.json", "w", encoding="utf-8") as f:
            json.dump(wrapped_result, f)
        PY

        cat /tmp/run-result.json
    displayName: Deploy vLLM and run benchmark
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az storage blob upload \
          --account-name "telescopev2" \
          --subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" \
          --container-name "aks" \
          --name "$(RUN_ID)/run-result.json" \
          --file /tmp/run-result.json \
          --auth-mode key
    displayName: Upload result to storage account
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az group delete --name "$(RUN_ID)" --subscription "f6e2f77f-9959-42ad-87f0-c30a6abc0133" --yes
    condition: always()
    displayName: Delete resource group (f6e2f77f-9959-42ad-87f0-c30a6abc0133)
