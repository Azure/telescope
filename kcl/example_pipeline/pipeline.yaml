name: Example Pipeline
pool: AKS-Telescope-Airlock
trigger:
- v2
jobs:
- job: benchmarking
  displayName: Benchmarking
  timeoutInMinutes: 1440
  steps:
  - bash: |
      set -eo pipefail

      job_id="$(System.JobId)"
      RUN_ID=$(Build.BuildId)-${job_id:0:8}
      echo "Run ID: $RUN_ID"

      echo "##vso[task.setvariable variable=RUN_ID]$RUN_ID"
    displayName: Set Run ID
  - bash: |-
      set -exo pipefail
      pip3 install --upgrade "pip<24"
      pip3 install -r $(Pipeline.Workspace)/s/modules/python/requirements.txt
    displayName: Install Python dependencies
  - task: KubeloginInstaller@0
    inputs:
      kubeloginVersion: latest
    displayName: Install kubelogin
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az account set --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
        az config set defaults.location="westus2"
        az account show
    displayName: Login to Azure
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |+
        set -exo pipefail
        az group create \
          --name "$(RUN_ID)" \
          --location "westus2" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

    displayName: Create resource group in westus2 (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks create \
          --name "example-yaolei" \
          --resource-group "$(RUN_ID)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --location "westus2" \
          --kubernetes-version "1.35.0" \
          --dns-name-prefix "example-yaolei-dns" \
          --tier standard \
          --nodepool-name systempool \
          --node-count 3 \
          --node-vm-size "Standard_D8S_v4" \
          --max-pods 250 \
          --network-plugin azure \
          --network-plugin-mode overlay \
          --pod-cidr 10.64.0.0/10 \
          --service-cidr 10.0.0.0/16 \
          --dns-service-ip 10.0.0.10 \
          --outbound-type managedNATGateway \
          --nat-gateway-managed-outbound-ip-count 10 \
          --enable-managed-identity \
          --enable-aad \
          --enable-azure-rbac \
          --disable-local-accounts \
          --generate-ssh-keys
    displayName: Create cluster
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        create_node_pool \
          --cluster-name "example-yaolei" \
          --resource-group "$(RUN_ID)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --name "cl2pool" \
          --node-count 4 \
          --node-vm-size "Standard_D8S_v4" \
          --mode User \
          --node-taints cl2pool=true:NoSchedule
    displayName: Create node pool cl2pool
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az aks get-credentials \
          --name "example-yaolei" \
          --resource-group "$(RUN_ID)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing
    displayName: Get credentials for example-yaolei
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |-
        set -exo pipefail
        cd modules/python
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        python3 kwok/kwok.py   --action create   --node-count 100   --node-manifest-path $(Pipeline.Workspace)/s/kcl/example_pipeline/kwok-node.yaml
    displayName: Create KWOK Nodes
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |-
        set -exo pipefail
        cd modules/python
        export PYTHONPATH=$PYTHONPATH:$(pwd)
        python3 kwok/kwok.py   --action validate   --node-count 100   --node-manifest-path $(Pipeline.Workspace)/s/kcl/example_pipeline/kwok-node.yaml
    displayName: Validate KWOK Nodes
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        set +eo pipefail
        manifest_path="$(Pipeline.Workspace)/s/kcl/example_pipeline/cl2.yaml"
        job_details="$(kubectl create --dry-run=client --validate=false -f "$manifest_path" -o go-template='{{if eq .kind "Job"}}{{if .metadata.name}}{{.metadata.name}}{{end}} {{if .metadata.namespace}}{{.metadata.namespace}}{{end}}{{"\n"}}{{end}}')" || exit 1
        mapfile -t jobs < <(printf '%s' "$job_details")
        if [ "${#jobs[@]}" -ne 1 ]; then
          echo "Expected exactly one CL2 Job in $manifest_path, found ${#jobs[@]}" >&2
          exit 1
        fi
        read -r job_name namespace <<< "${jobs[0]}"
        if [ -z "$job_name" ] || [ -z "$namespace" ]; then
          echo "CL2 Job must have metadata.name and metadata.namespace" >&2
          exit 1
        fi
        kubectl create namespace "$namespace" || true
        kubectl apply -f "$manifest_path" || exit 1
        # Wait
        consecutive_errors=0
        while true; do
          # Under consistent API server errors, we would want to exit early instead of waiting for the entire timeout duration.
          conditions="$(kubectl get job "$job_name" --namespace="$namespace" -o jsonpath='{range .status.conditions[?(@.status=="True")]}{.type}{"\n"}{end}' 2>/tmp/kubectl_err)"
          kubectl_exit_code=$?
          if [ $kubectl_exit_code -ne 0 ]; then
            consecutive_errors=$((consecutive_errors + 1))
            echo "kubectl get job $job_name failed (exit_code=$kubectl_exit_code, consecutive=$consecutive_errors/20):"
            cat /tmp/kubectl_err
            if [ "$consecutive_errors" -ge "20" ]; then
              echo "Unable to read CL2 Job $job_name for $consecutive_errors consecutive polls; aborting."
              exit 1
            fi
            sleep 30
            continue
          fi
          consecutive_errors=0

          while IFS= read -r condition; do
            case "$condition" in
              Failed)
                echo "CL2 Job $job_name failed"
                kubectl get job "$job_name" --namespace="$namespace" -o yaml || echo "Unable to fetch CL2 Job $job_name failure details."
                set +x
                echo "##vso[task.setvariable variable=cl2JobStatus]failed"
                exit 1
                ;;
              Complete)
                echo "CL2 Job $job_name completed successfully"
                set +x
                echo "##vso[task.setvariable variable=cl2JobStatus]succeeded"
                exit 0
                ;;
            esac
          done <<< "$conditions"

          kubectl get pods --namespace="$namespace" -l "job-name=$job_name" -o wide || echo "Unable to list CL2 pods; retrying on the next poll."
          sleep 30
        done
    displayName: Run cluster loader 2
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        for pod in $(kubectl get pods --namespace="clusterloader2" -l job-name=cl2 -o jsonpath='{.items[*].metadata.name}'); do
          echo "===== Logs for pod: $pod ====="
          kubectl logs --namespace="clusterloader2" "$pod" || true
        done
    condition: succeededOrFailed()
    displayName: Print cl2 pod logs
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        cat > /tmp/run-result.json << EOF
        {
          "timestamp": "${TIMESTAMP}",
          "run_id": "$(RUN_ID)",
          "run_url": "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)",
          "pipeline": "$(Build.DefinitionName)",
          "result": {
            "cl2_status": "$CL2JOBSTATUS",
            "region": "westus2"
          }
        }
        EOF
        cat /tmp/run-result.json
    condition: in(variables['cl2JobStatus'], 'succeeded', 'failed')
    displayName: Write CL2 benchmark result
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az storage blob upload \
          --account-name "telescopev2" \
          --subscription "137f0351-8235-42a6-ac7a-6b46be2d21c7" \
          --container-name "aks" \
          --name "$(RUN_ID)/run-result.json" \
          --file /tmp/run-result.json \
          --auth-mode key
    condition: in(variables['cl2JobStatus'], 'succeeded', 'failed')
    displayName: Upload result to storage account
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        for NODE_RG in $(az aks list \
          --resource-group "$(RUN_ID)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --query "[].nodeResourceGroup" \
          --output tsv); do
          echo "Checking VMSS rolling upgrades in node resource group: $NODE_RG"
          for VMSS in $(az vmss list \
            --resource-group "$NODE_RG" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --query "[].name" \
            --output tsv); do
            echo "Attempting to cancel rolling upgrade for VMSS: $VMSS"
            az vmss rolling-upgrade cancel \
              --resource-group "$NODE_RG" \
              --name "$VMSS" \
              --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
              && echo "Cancelled rolling upgrade for $VMSS." \
              || echo "No active rolling upgrade to cancel for $VMSS (or cancel not applicable)."
          done
        done

        az group delete --name "$(RUN_ID)" --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --yes
    condition: always()
    displayName: Delete resource group (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
