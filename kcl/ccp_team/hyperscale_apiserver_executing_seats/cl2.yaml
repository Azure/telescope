apiVersion: v1
kind: ConfigMap
metadata:
  name: cl2-override
  namespace: clusterloader2
data:
  override.yaml: |
    NODES: 12000
    PODS_PER_NODE: 3
    BIG_GROUP_SIZE: 1
    MEDIUM_GROUP_SIZE: 1
    SMALL_GROUP_SIZE: 1
    SMALL_STATEFUL_SETS_PER_NAMESPACE: 0
    MEDIUM_STATEFUL_SETS_PER_NAMESPACE: 0
    CL2_SMALL_JOBS_PER_NAMESPACE: 0
    CL2_MEDIUM_JOBS_PER_NAMESPACE: 0
    CL2_BIG_JOBS_PER_NAMESPACE: 0
    CL2_RATE_LIMIT_POD_CREATION: false
    CL2_EXIT_AFTER_EXEC: true
    CL2_ENABLE_PVS: false
    CL2_ENABLE_CLUSTER_OOMS_TRACKER: false
    # Reduce the sustained action rate while retaining limited burst capacity.
    CL2_DEFAULT_QPS: 1000
    CL2_RUN_ON_ARM_NODES: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cl2
  namespace: clusterloader2
spec:
  # Driver count and memory are rendered from the tier settings in pipeline.k.
  completions: __CL2_DRIVER_COUNT__
  parallelism: __CL2_DRIVER_COUNT__
  backoffLimit: 0
  template:
    spec:
      containers:
      - args:
        - '--provider=aks'
        - '--run-from-cluster=true'
        - '--v=2'
        - '--testoverrides=/override/override.yaml'
        - '--testconfig=testing/load/config-noservice.yaml'
        - '--k8s-clients-number=500'
        image: ghcr.io/azure/clusterloader2:v20260220
        name: cl2
        resources:
          requests:
            cpu: '6'
            memory: '__CL2_MEMORY_REQUEST__'
        volumeMounts:
        - mountPath: /override
          name: cl2-override
        # Mount a custom config.yaml from the cl2-testconfig ConfigMap. This version
        # removes the service creation part, as service IPs become uncontrollable at
        # large scale with high node and pod counts.
        - mountPath: /root/perf-tests/clusterloader2/testing/load/config-noservice.yaml
          name: cl2-testconfig
          subPath: config.yaml
        # Override only these files; retain the image's other workload modules.
        - mountPath: /root/perf-tests/clusterloader2/testing/load/modules/reconcile-objects.yaml
          name: cl2-testconfig
          subPath: reconcile-objects.yaml
        - mountPath: /root/perf-tests/clusterloader2/testing/load/modules/scheduler-throughput.yaml
          name: cl2-testconfig
          subPath: scheduler-throughput.yaml
      nodeSelector:
        agentpool: cl2pool
      restartPolicy: Never
      serviceAccountName: cl2
      tolerations:
      - effect: NoSchedule
        key: cl2pool
        operator: Exists
      volumes:
      - configMap:
          name: cl2-override
        name: cl2-override
      - configMap:
          name: cl2-testconfig
        name: cl2-testconfig
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cl2
  namespace: clusterloader2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cl2
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cl2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cl2
subjects:
- kind: ServiceAccount
  name: cl2
  namespace: clusterloader2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cl2-testconfig
  namespace: clusterloader2
data:
  # Copied from ghcr.io/azure/clusterloader2:v20260220 with only syncTimeout added.
  # TODO: Remove these copies when the image modules expose a timeout override.
  reconcile-objects.yaml: |
    ## Input params
    # Valid actions: "create", "scale and update", "delete"
    {{$actionName := printf "%s objects" .actionName}}
    {{$namespaces := .namespaces}}
    {{$tuningSet := .tuningSet}}

    # Derivative variables
    {{$is_deleting := (eq .actionName "delete")}}
    {{$randomScaleFactor := DefaultParam .randomScaleFactor 0}}
    {{$minReplicaFactor := SubtractFloat 1 $randomScaleFactor}}
    {{$maxReplicaFactor := AddFloat 1 $randomScaleFactor}}
    {{$testMaxReplicaFactor := AddFloat 1 .testMaxReplicaFactor}}
    {{$operationTimeout := .operationTimeout}}

    # DaemonSets
    {{$daemonSetImage := DefaultParam .daemonSetImage "registry.k8s.io/pause:3.9"}}
    {{$daemonSetReplicas := .daemonSetReplicas}}
    {{$daemonSetEnv := .daemonSetEnv}}

    # Deployments
    {{$deploymentImage := DefaultParam .deploymentImage "registry.k8s.io/pause:3.9"}}
    {{$bigDeploymentSize := .bigDeploymentSize}}
    {{$bigDeploymentsPerNamespace := .bigDeploymentsPerNamespace}}
    {{$mediumDeploymentSize := .mediumDeploymentSize}}
    {{$mediumDeploymentsPerNamespace := .mediumDeploymentsPerNamespace}}
    {{$smallDeploymentSize := .smallDeploymentSize}}
    {{$smallDeploymentsPerNamespace := .smallDeploymentsPerNamespace}}

    # StatefulSets
    {{$statefulSetImage := DefaultParam .statefulSetImage "registry.k8s.io/pause:3.9"}}
    {{$smallStatefulSetSize := .smallStatefulSetSize}}
    {{$smallStatefulSetsPerNamespace := .smallStatefulSetsPerNamespace}}
    {{$mediumStatefulSetSize := .mediumStatefulSetSize}}
    {{$mediumStatefulSetsPerNamespace := .mediumStatefulSetsPerNamespace}}

    # Jobs
    {{$jobImage := DefaultParam .jobImage "registry.k8s.io/pause:3.10"}}
    {{$bigJobSize := .bigJobSize}}
    {{$bigJobsPerNamespace := .bigJobsPerNamespace}}
    {{$mediumJobSize := .mediumJobSize}}
    {{$mediumJobsPerNamespace := .mediumJobsPerNamespace}}
    {{$smallJobSize := .smallJobSize}}
    {{$smallJobsPerNamespace := .smallJobsPerNamespace}}
    {{$completionsFactor := MultiplyFloat 2 $testMaxReplicaFactor}}

    # PV
    {{$pvSmallStatefulSetSize := DefaultParam .pvSmallStatefulSetSize 0}}
    {{$pvMediumStatefulSetSize := DefaultParam .pvMediumStatefulSetSize 0}}

    ## CL2 params
    {{$CHECK_IF_PODS_ARE_UPDATED := DefaultParam .CL2_CHECK_IF_PODS_ARE_UPDATED true}}
    {{$DISABLE_DAEMONSETS := DefaultParam .CL2_DISABLE_DAEMONSETS false}}
    {{$ENABLE_DNSTESTS := DefaultParam .CL2_ENABLE_DNSTESTS false}}
    {{$ENABLE_NETWORKPOLICIES := DefaultParam .CL2_ENABLE_NETWORKPOLICIES false}}
    {{$ENABLE_PVS := DefaultParam .CL2_ENABLE_PVS true}}
    {{$ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST := DefaultParam .CL2_ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST false}}
    {{$NET_POLICY_ENFORCEMENT_LATENCY_TARGET_LABEL_KEY := DefaultParam .CL2_NET_POLICY_ENFORCEMENT_LATENCY_TARGET_LABEL_KEY "net-pol-test"}}
    {{$NET_POLICY_ENFORCEMENT_LATENCY_TARGET_LABEL_VALUE := DefaultParam .CL2_NET_POLICY_ENFORCEMENT_LATENCY_TARGET_LABEL_VALUE "enforcement-latency"}}
    {{$NET_POLICY_SERVER_EVERY_NTH_POD := DefaultParam .CL2_NET_POLICY_SERVER_EVERY_NTH_POD 3}}

    steps:
    - name: Starting measurement for '{{$actionName}}'
      measurements:
      - Method: WaitForControlledPodsRunning
        Instances:
        - Identifier: WaitForRunningDeployments
          Params:
            apiVersion: apps/v1
            kind: Deployment
        - Identifier: WaitForRunningStatefulSets
          Params:
            apiVersion: apps/v1
            kind: StatefulSet
        - Identifier: WaitForRunningDaemonSets
          Params:
            apiVersion: apps/v1
            kind: DaemonSet
        - Identifier: WaitForRunningJobs
          Params:
            apiVersion: batch/v1
            kind: Job
        Params:
          action: start
          checkIfPodsAreUpdated: {{$CHECK_IF_PODS_ARE_UPDATED}}
          labelSelector: group = load
          operationTimeout: {{$operationTimeout}}

    - name: {{$actionName}}
      phases:
    {{if not $DISABLE_DAEMONSETS}}
      - namespaceRange:
          min: 1
          max: 1
        replicasPerNamespace: {{$daemonSetReplicas}}
        tuningSet: {{$tuningSet}}
        objectBundle:
        - basename: daemonset
          objectTemplatePath: daemonset.yaml
          templateFillMap:
            Image: {{$daemonSetImage}}
            Env: {{$daemonSetEnv}}
    {{end}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: {{$bigDeploymentsPerNamespace}}
        tuningSet: {{$tuningSet}}
        objectBundle:
    {{if $ENABLE_NETWORKPOLICIES}}
        - basename: big-deployment
          objectTemplatePath: networkpolicy.yaml
    {{end}}
        - basename: big-deployment
          objectTemplatePath: deployment.yaml
          templateFillMap:
            # DNS Test clients are enabled only in the medium-size deployment.
            EnableDNSTests: false
            ReplicasMin: {{MultiplyInt $bigDeploymentSize $minReplicaFactor}}
            ReplicasMax: {{MultiplyInt $bigDeploymentSize $maxReplicaFactor}}
            SvcName: big-service
            Image: {{$deploymentImage}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: {{$mediumDeploymentsPerNamespace}}
        tuningSet: {{$tuningSet}}
        objectBundle:
    {{if $ENABLE_NETWORKPOLICIES}}
        - basename: medium-deployment
          objectTemplatePath: networkpolicy.yaml
    {{end}}
        - basename: medium-deployment
          objectTemplatePath: deployment.yaml
          templateFillMap:
            EnableDNSTests: {{$ENABLE_DNSTESTS}}
            ReplicasMin: {{MultiplyInt $mediumDeploymentSize $minReplicaFactor}}
            ReplicasMax: {{MultiplyInt $mediumDeploymentSize $maxReplicaFactor}}
            SvcName: medium-service
            Image: {{$deploymentImage}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: {{$smallDeploymentsPerNamespace}}
        tuningSet: {{$tuningSet}}
        objectBundle:
    {{if $ENABLE_NETWORKPOLICIES}}
        - basename: small-deployment
          objectTemplatePath: networkpolicy.yaml
    {{end}}
        - basename: small-deployment
          objectTemplatePath: deployment.yaml
          templateFillMap:
            # DNS Test clients are enabled only in the medium-size deployment.
            EnableDNSTests: false
            ReplicasMin: {{MultiplyInt $smallDeploymentSize $minReplicaFactor}}
            ReplicasMax: {{MultiplyInt $smallDeploymentSize $maxReplicaFactor}}
            SvcName: small-service
            EnableNetworkPolicyEnforcementLatencyTest: {{$ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST}}
            TargetLabelKey: {{$NET_POLICY_ENFORCEMENT_LATENCY_TARGET_LABEL_KEY}}
            TargetLabelValue: {{$NET_POLICY_ENFORCEMENT_LATENCY_TARGET_LABEL_VALUE}}
            NetPolServerOnEveryNthPod: {{$NET_POLICY_SERVER_EVERY_NTH_POD}}
            Image: {{$deploymentImage}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: {{$smallStatefulSetsPerNamespace}}
        tuningSet: {{$tuningSet}}
        objectBundle:
        - basename: small-statefulset
          objectTemplatePath: statefulset_service.yaml
        - basename: small-statefulset
          objectTemplatePath: statefulset.yaml
          templateFillMap:
            ReplicasMin: {{MultiplyInt $smallStatefulSetSize $minReplicaFactor}}
            ReplicasMax: {{MultiplyInt $smallStatefulSetSize $maxReplicaFactor}}
            Image: {{$statefulSetImage}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: {{$mediumStatefulSetsPerNamespace}}
        tuningSet: {{$tuningSet}}
        objectBundle:
        - basename: medium-statefulset
          objectTemplatePath: statefulset_service.yaml
        - basename: medium-statefulset
          objectTemplatePath: statefulset.yaml
          templateFillMap:
            ReplicasMin: {{MultiplyInt $mediumStatefulSetSize $minReplicaFactor}}
            ReplicasMax: {{MultiplyInt $mediumStatefulSetSize $maxReplicaFactor}}
            Image: {{$statefulSetImage}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: {{$smallJobsPerNamespace}}
        tuningSet: {{$tuningSet}}
        objectBundle:
        - basename: small-job
          objectTemplatePath: job.yaml
          templateFillMap:
            Completions: {{MultiplyInt $smallJobSize $completionsFactor}}
            ReplicasMin: {{MultiplyInt $smallJobSize $minReplicaFactor}}
            ReplicasMax: {{MultiplyInt $smallJobSize $maxReplicaFactor}}
            Image: {{$jobImage}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: {{$mediumJobsPerNamespace}}
        tuningSet: {{$tuningSet}}
        objectBundle:
        - basename: medium-job
          objectTemplatePath: job.yaml
          templateFillMap:
            Completions: {{MultiplyInt $mediumJobSize $completionsFactor}}
            ReplicasMin: {{MultiplyInt $mediumJobSize $minReplicaFactor}}
            ReplicasMax: {{MultiplyInt $mediumJobSize $maxReplicaFactor}}
            Image: {{$jobImage}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: {{$bigJobsPerNamespace}}
        tuningSet: {{$tuningSet}}
        objectBundle:
        - basename: big-job
          objectTemplatePath: job.yaml
          templateFillMap:
            Completions: {{MultiplyInt $bigJobSize $completionsFactor}}
            ReplicasMin: {{MultiplyInt $bigJobSize $minReplicaFactor}}
            ReplicasMax: {{MultiplyInt $bigJobSize $maxReplicaFactor}}
            Image: {{$jobImage}}
    {{if and $is_deleting $ENABLE_PVS}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: 0
        tuningSet: {{$tuningSet}}
        objectBundle:
      {{range $ssIndex := Loop $pvSmallStatefulSetSize}}
          - basename: pv-small-statefulset-{{$ssIndex}}
            objectTemplatePath: pvc.yaml
            listUnknownObjectOptions:
              labelSelector:
                matchLabels:
                  name: small-statefulset-{{$ssIndex}}
      {{end}}
      - namespaceRange:
          min: 1
          max: {{$namespaces}}
        replicasPerNamespace: 0
        tuningSet: {{$tuningSet}}
        objectBundle:
      {{range $ssIndex := Loop $pvMediumStatefulSetSize}}
          - basename: pv-medium-statefulset-{{$ssIndex}}
            objectTemplatePath: pvc.yaml
            listUnknownObjectOptions:
              labelSelector:
                matchLabels:
                  name: medium-statefulset-{{$ssIndex}}
      {{end}}
    {{end}}

    - name: Waiting for '{{$actionName}}' to be completed
      measurements:
      - Method: WaitForControlledPodsRunning
        Instances:
        - Identifier: WaitForRunningDeployments
        - Identifier: WaitForRunningStatefulSets
        - Identifier: WaitForRunningDaemonSets
        - Identifier: WaitForRunningJobs
        Params:
          action: gather
          syncTimeout: 10m
    {{if and $is_deleting $ENABLE_PVS}}
      - Identifier: WaitForPVCsToBeDeleted
        Method: WaitForBoundPVCs
        Params:
          desiredPVCCount: 0
          labelSelector: group = load
          timeout: {{$operationTimeout}}
    {{end}}
  scheduler-throughput.yaml: |
    ## Input params
    # Valid actions: "create", "delete"
    {{$action := .action}}
    {{$namespaces := .namespaces}}
    {{$replicasPerNamespace := .replicasPerNamespace}}
    {{$schedulerThroughputNamespaces := .schedulerThroughputNamespaces}}
    {{$schedulerThroughputPodsPerDeployment := .schedulerThroughputPodsPerDeployment}}

    ## Derivative variables
    {{$is_creating := (eq .action "create")}}

    ## CL2 params
    {{$SCHEDULER_THROUGHPUT_THRESHOLD := DefaultParam .CL2_SCHEDULER_THROUGHPUT_THRESHOLD 100}}
    {{$CHECK_IF_PODS_ARE_UPDATED := DefaultParam .CL2_CHECK_IF_PODS_ARE_UPDATED true}}


    {{$deploymentImage := DefaultParam .deploymentImage "registry.k8s.io/pause:3.9"}}

    steps:
    {{if $is_creating}}
    - name: Creating scheduler throughput measurements
      measurements:
      - Identifier: HighThroughputPodStartupLatency
        Method: PodStartupLatency
        Params:
          action: start
          labelSelector: group = scheduler-throughput
          threshold: 1h # TODO(https://github.com/kubernetes/perf-tests/issues/1024): Ideally, this should be 5s
      - Identifier: WaitForSchedulerThroughputDeployments
        Method: WaitForControlledPodsRunning
        Params:
          action: start
          checkIfPodsAreUpdated: {{$CHECK_IF_PODS_ARE_UPDATED}}
          apiVersion: apps/v1
          kind: Deployment
          labelSelector: group = scheduler-throughput
          # The operation timeout shouldn't be less than 20m to make sure that ~10m node
          # failure won't fail the test. See https://github.com/kubernetes/kubernetes/issues/73461#issuecomment-467338711
          operationTimeout: 20m
      - Identifier: SchedulingThroughput
        Method: SchedulingThroughput
        Params:
          action: start
          labelSelector: group = scheduler-throughput
          measurmentInterval: 1s
    {{end}}
    - name: {{$action}} scheduler throughput pods
      phases:
      - namespaceRange:
          min: {{AddInt $namespaces 1}}
          max: {{AddInt $namespaces $schedulerThroughputNamespaces}}
        replicasPerNamespace: {{$replicasPerNamespace}}
        tuningSet: default
        objectBundle:
        - basename: scheduler-throughput-deployment
          objectTemplatePath: simple-deployment.yaml
          templateFillMap:
            Replicas: {{$schedulerThroughputPodsPerDeployment}}
            Group: scheduler-throughput
            Image: {{$deploymentImage}}
    - name: Waiting for scheduler throughput pods to be {{$action}}d
      measurements:
      - Identifier: WaitForSchedulerThroughputDeployments
        Method: WaitForControlledPodsRunning
        Params:
          action: gather
          syncTimeout: 10m
    {{if $is_creating}}
    - name: Collecting scheduler throughput measurements
      measurements:
      - Identifier: HighThroughputPodStartupLatency
        Method: PodStartupLatency
        Params:
          action: gather
      - Identifier: SchedulingThroughput
        Method: SchedulingThroughput
        Params:
          action: gather
          enableViolations: true
          threshold: {{$SCHEDULER_THROUGHPUT_THRESHOLD}}
    {{end}}
  config.yaml: |
    # ASSUMPTIONS:
    # - Underlying cluster should have 100+ nodes.
    # - Number of nodes should be divisible by NODES_PER_NAMESPACE (default 100).
    # - The number of created SVCs is half the number of created Deployments.
    # - Only half of Deployments will be assigned 1-1 to existing SVCs.

    #Constants
    # Cater for the case where the number of nodes is less than nodes per namespace. See https://github.com/kubernetes/perf-tests/issues/887
    {{$NODES_PER_NAMESPACE := MinInt .Nodes (DefaultParam .NODES_PER_NAMESPACE 100)}}
    # See https://github.com/kubernetes/perf-tests/pull/1667#issuecomment-769642266
    {{$IS_SMALL_CLUSTER := lt .Nodes 100}}
    {{$PODS_PER_NODE := DefaultParam .PODS_PER_NODE 30}}
    {{$LOAD_TEST_THROUGHPUT := DefaultParam .CL2_LOAD_TEST_THROUGHPUT 10}}
    {{$DELETE_TEST_THROUGHPUT := DefaultParam .CL2_DELETE_TEST_THROUGHPUT $LOAD_TEST_THROUGHPUT}}
    {{$RATE_LIMIT_POD_CREATION := DefaultParam .CL2_RATE_LIMIT_POD_CREATION true}}
    {{$BIG_GROUP_SIZE := DefaultParam .BIG_GROUP_SIZE 250}}
    {{$MEDIUM_GROUP_SIZE := DefaultParam .MEDIUM_GROUP_SIZE 30}}
    {{$SMALL_GROUP_SIZE := DefaultParam .SMALL_GROUP_SIZE 5}}
    {{$SMALL_STATEFUL_SETS_PER_NAMESPACE := DefaultParam .SMALL_STATEFUL_SETS_PER_NAMESPACE 1}}
    {{$MEDIUM_STATEFUL_SETS_PER_NAMESPACE := DefaultParam .MEDIUM_STATEFUL_SETS_PER_NAMESPACE 1}}
    {{$ENABLE_CHAOSMONKEY := DefaultParam .ENABLE_CHAOSMONKEY false}}
    {{$ENABLE_API_AVAILABILITY_MEASUREMENT := DefaultParam .CL2_ENABLE_API_AVAILABILITY_MEASUREMENT false}}
    {{$ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST := DefaultParam .CL2_ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST false}}
    {{$RANDOM_SCALE_FACTOR := 0.5}}
    #Variables
    {{$namespaces := DivideInt .Nodes $NODES_PER_NAMESPACE}}
    {{$totalPods := MultiplyInt $namespaces $NODES_PER_NAMESPACE $PODS_PER_NODE}}
    {{$podsPerNamespace := DivideInt $totalPods $namespaces}}
    {{$saturationTime := DivideInt $totalPods $LOAD_TEST_THROUGHPUT}}
    {{$deletionTime := DivideInt $totalPods $DELETE_TEST_THROUGHPUT}}
    # bigDeployments - 1/4 of namespace pods should be in big Deployments.
    {{$bigDeploymentsPerNamespace := DivideInt $podsPerNamespace (MultiplyInt 4 $BIG_GROUP_SIZE)}}
    # mediumDeployments - 1/4 of namespace pods should be in medium Deployments.
    {{$mediumDeploymentsPerNamespace := DivideInt $podsPerNamespace (MultiplyInt 4 $MEDIUM_GROUP_SIZE)}}
    # smallDeployments - 1/2 of namespace pods should be in small Deployments.
    {{$smallDeploymentsPerNamespace := DivideInt $podsPerNamespace (MultiplyInt 2 $SMALL_GROUP_SIZE)}}

    # Stateful sets are enabled. Reduce the number of small and medium deployments per namespace
    # See https://github.com/kubernetes/perf-tests/issues/1036#issuecomment-607631768
    # Ensure non zero or negative after subtraction.
    {{$smallDeploymentsPerNamespace := MaxInt 0 (SubtractInt $smallDeploymentsPerNamespace $SMALL_STATEFUL_SETS_PER_NAMESPACE)}}
    {{$mediumDeploymentsPerNamespace := MaxInt 0 (SubtractInt $mediumDeploymentsPerNamespace $MEDIUM_STATEFUL_SETS_PER_NAMESPACE)}}

    # Jobs are enabled. Reduce the number of small, medium, big deployments per namespace.
    # Ensure non zero or negative after subtraction.
    {{$smallDeploymentsPerNamespace := MaxInt 0 (SubtractInt $smallDeploymentsPerNamespace 1)}}
    {{$mediumDeploymentsPerNamespace := MaxInt 0 (SubtractInt $mediumDeploymentsPerNamespace 1)}}
    {{$bigDeploymentsPerNamespace := MaxInt 0 (SubtractInt $bigDeploymentsPerNamespace 1)}}

    # Disable big jobs on small clusters.
    {{$bigJobsPerNamespace := IfThenElse $IS_SMALL_CLUSTER 0 1}}

    # The minimal number of pods to be used to measure various things like
    # pod-startup-latency or scheduler-throughput. The purpose of it is to avoid
    # problems in small clusters where we wouldn't have enough samples (pods) to
    # measure things accurately.
    {{$MIN_PODS_IN_SMALL_CLUSTERS := 500}}

    # BEGIN scheduler-throughput section
    # TODO( https://github.com/kubernetes/perf-tests/issues/1027): Lower the number of "min-pods" once we fix the scheduler throughput measurement.
    {{$totalSchedulerThroughputPods := MaxInt (MultiplyInt 2 $MIN_PODS_IN_SMALL_CLUSTERS) .Nodes}}
    # Determines number of pods per deployment. Should be a divider of $totalSchedulerThroughputPods.
    {{$schedulerThroughputPodsPerDeployment := DefaultParam .CL2_SCHEDULER_THROUGHPUT_PODS_PER_DEPLOYMENT $totalSchedulerThroughputPods}}
    {{$schedulerThroughputNamespaces := DivideInt $totalSchedulerThroughputPods $schedulerThroughputPodsPerDeployment}}

    # Set schedulerThroughputNamespaces to 1 on small clusters otherwise it will result
    # in an unnecessary number of namespaces.
    {{$schedulerThroughputNamespaces := IfThenElse $IS_SMALL_CLUSTER 1 $schedulerThroughputNamespaces}}
    # END scheduler-throughput section

    # Command to be executed
    {{$EXEC_COMMAND := DefaultParam .CL2_EXEC_COMMAND nil}}
    {{$EXIT_AFTER_EXEC := DefaultParam .CL2_EXIT_AFTER_EXEC false}}
    {{$EXEC_TIMEOUT := DefaultParam .CL2_EXEC_TIMEOUT "3600s"}}
    {{$SLEEP_AFTER_EXEC_DURATION := DefaultParam .CL2_SLEEP_AFTER_EXEC_DURATION "0s"}}

    {{$registry := DefaultParam .CL2_LATENCY_POD_REGISTRY "registry.k8s.io"}}
    {{$latencyPodImage := DefaultParam .CL2_LATENCY_POD_IMAGE (Concat $registry "/pause:3.9")}}
    {{$defaultQps := DefaultParam .CL2_DEFAULT_QPS (IfThenElse (le .Nodes 500) 10 100)}}

    {{$ADDITIONAL_MEASUREMENT_MODULES := DefaultParam .CL2_ADDITIONAL_MEASUREMENT_MODULES nil}}
    {{$ADDITIONAL_PHASES_MODULES := DefaultParam .CL2_ADDITIONAL_PHASES_MODULES nil}}

    name: load
    namespace:
      number: {{AddInt $namespaces $schedulerThroughputNamespaces}}
    tuningSets:
    - name: Sequence
      parallelismLimitedLoad:
        parallelismLimit: 1
    # TODO(https://github.com/kubernetes/perf-tests/issues/1024): This TuningSet is used only for pod-startup-latency, get rid of it
    # Uniform5qps: for each running phase, use 5 qps.
    - name: Uniform5qps
      qpsLoad:
        qps: 5
    # default is a tuningset that is meant to be used when we don't have any specific requirements on pace of operations.
    - name: default
      globalQPSLoad:
        qps: {{$defaultQps}}
        # Limit aggregate burst capacity to 600 actions across six drivers.
        burst: 100
    - name: RandomizedSaturationTimeLimited
      RandomizedTimeLimitedLoad:
        timeLimit: {{$saturationTime}}s
    - name: RandomizedScalingTimeLimited
      RandomizedTimeLimitedLoad:
        # The expected number of created/deleted pods is totalPods/4 when scaling,
        # as each RS changes its size from X to a uniform random value in [X/2, 3X/2].
        # To match 10 [pods/s] requirement, we need to divide saturationTime by 4.
        timeLimit: {{DivideInt $saturationTime 4}}s
    - name: RandomizedDeletionTimeLimited
      RandomizedTimeLimitedLoad:
        timeLimit: {{$deletionTime}}s
    {{if $ENABLE_CHAOSMONKEY}}
    chaosMonkey:
      nodeFailure:
        failureRate: 0.01
        interval: 5m
        jitterFactor: 2.0
        simulatedDowntime: 10m
    {{end}}
    steps:
    - module:
        path: /modules/measurements.yaml
        params:
          action: start

    {{if $ADDITIONAL_MEASUREMENT_MODULES}}
    {{range $ADDITIONAL_MEASUREMENT_MODULES}}
    - module:
        path: {{.}}
        params:
          action: start
    {{end}}
    {{end}}

    {{if $ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST}}
    - module:
        path: modules/network-policy/net-policy-enforcement-latency.yaml
        params:
          setup: true
          run: true
          testType: "pod-creation"
    {{end}}

    - name: Creating PriorityClass for DaemonSets
      phases:
      - replicasPerNamespace: 1
        tuningSet: Sequence
        objectBundle:
          - basename: daemonset-priorityclass
            objectTemplatePath: daemonset-priorityclass.yaml

    # Moved from reconcile-objects.yaml to mitigate https://github.com/kubernetes/kubernetes/issues/96635.
    # TODO(https://github.com/kubernetes/perf-tests/issues/1823): Merge back to reconcile-objects.yaml once the k/k bug is fixed.
    - module:
        path: /modules/configmaps-secrets.yaml
        params:
          actionName: create
          tuningSet: default
          namespaces: {{$namespaces}}
          bigDeploymentsPerNamespace: {{$bigDeploymentsPerNamespace}}
          mediumDeploymentsPerNamespace: {{$mediumDeploymentsPerNamespace}}
          smallDeploymentsPerNamespace: {{$smallDeploymentsPerNamespace}}

    - module:
        path: /modules/reconcile-objects.yaml
        params:
          actionName: "create"
          namespaces: {{$namespaces}}
          {{if $RATE_LIMIT_POD_CREATION}}
          tuningSet: RandomizedSaturationTimeLimited
          operationTimeout: 15m
          {{else}}
          tuningSet: default
          operationTimeout: {{AddInt $saturationTime 900}}s
          {{end}}
          testMaxReplicaFactor: {{$RANDOM_SCALE_FACTOR}}
          # We rely on the fact that daemonset is using the same image as the 'pod-startup-latency' module.
          # The goal is to cache the image to all nodes before we start any latency pod,
          # so that when we measure pod startup latency, the image is already present on all nodes.
          # This way, the pod startup latency we measure excludes (or limits impact) of image pulling,
          # whuch matches our SLO definition: https://github.com/kubernetes/community/blob/master/sig-scalability/slos/pod_startup_latency.md.
          daemonSetImage: {{$latencyPodImage}}
          deploymentImage: {{$latencyPodImage}}
          jobImage: {{$latencyPodImage}}
          statefulSetImage: {{$latencyPodImage}}
          daemonSetEnv: "before update"
          daemonSetReplicas: 1
          bigDeploymentSize: {{$BIG_GROUP_SIZE}}
          bigDeploymentsPerNamespace: {{$bigDeploymentsPerNamespace}}
          mediumDeploymentSize: {{$MEDIUM_GROUP_SIZE}}
          mediumDeploymentsPerNamespace: {{$mediumDeploymentsPerNamespace}}
          smallDeploymentSize: {{$SMALL_GROUP_SIZE}}
          smallDeploymentsPerNamespace: {{$smallDeploymentsPerNamespace}}
          smallStatefulSetSize: {{$SMALL_GROUP_SIZE}}
          smallStatefulSetsPerNamespace: {{$SMALL_STATEFUL_SETS_PER_NAMESPACE}}
          mediumStatefulSetSize: {{$MEDIUM_GROUP_SIZE}}
          mediumStatefulSetsPerNamespace: {{$MEDIUM_STATEFUL_SETS_PER_NAMESPACE}}
          bigJobSize: {{$BIG_GROUP_SIZE}}
          bigJobsPerNamespace: {{$bigJobsPerNamespace}}
          mediumJobSize: {{$MEDIUM_GROUP_SIZE}}
          mediumJobsPerNamespace: 1
          smallJobSize: {{$SMALL_GROUP_SIZE}}
          smallJobsPerNamespace: 1

    {{if $ADDITIONAL_PHASES_MODULES}}
    {{range $ADDITIONAL_PHASES_MODULES}}
    - module:
        path: {{.}}
        params:
          action: "create"
    {{end}}
    {{end}}

    {{if not $IS_SMALL_CLUSTER}}
    # BEGIN scheduler throughput
    - module:
        path: modules/scheduler-throughput.yaml
        params:
          action: create
          namespaces: {{$namespaces}}
          replicasPerNamespace: 1
          schedulerThroughputNamespaces: {{$schedulerThroughputNamespaces}}
          schedulerThroughputPodsPerDeployment: {{$schedulerThroughputPodsPerDeployment}}
          deploymentImage: {{$latencyPodImage}}
    {{end}}

    - module:
        path: modules/dns-k8s-hostnames.yaml

    {{if $EXEC_COMMAND}}

    {{if $ENABLE_API_AVAILABILITY_MEASUREMENT}}
    - name: Pausing APIAvailability measurement
      measurements:
      - Identifier: APIAvailability
        Method: APIAvailability
        Params:
          action: pause
    {{end}}

    - name: Exec command
      measurements:
      - Identifier: ExecCommand
        Method: Exec
        Params:
          timeout: {{$EXEC_TIMEOUT}}
          command:
          {{range $EXEC_COMMAND}}
          - {{.}}
          {{end}}

    {{if $ENABLE_API_AVAILABILITY_MEASUREMENT}}
    - name: Unpausing APIAvailability measurement
      measurements:
      - Identifier: APIAvailability
        Method: APIAvailability
        Params:
          action: unpause
    {{end}}

    - name: Sleep
      measurements:
      - Identifier: WaitAfterExec
        Method: Sleep
        Params:
          duration: {{$SLEEP_AFTER_EXEC_DURATION}}
    {{end}}

    {{if not $EXIT_AFTER_EXEC}}

    {{if not $IS_SMALL_CLUSTER}}
    - module:
        path: modules/scheduler-throughput.yaml
        params:
          action: delete
          namespaces: {{$namespaces}}
          replicasPerNamespace: 0
          schedulerThroughputNamespaces: {{$schedulerThroughputNamespaces}}
          schedulerThroughputPodsPerDeployment: {{$schedulerThroughputPodsPerDeployment}}
    # END scheduler throughput
    {{end}}

    {{if not $IS_SMALL_CLUSTER}}
    # TODO(kubernetes/perf-tests/issues/1024): We shouldn't have a dedicated module for measuring pod-startup-latency.
    - module:
        path: modules/pod-startup-latency.yaml
        params:
          namespaces: {{$namespaces}}
          minPodsInSmallCluster: {{$MIN_PODS_IN_SMALL_CLUSTERS}}
          image: {{$latencyPodImage}}
    {{end}}

    {{if $ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST}}
    - module:
        path: modules/network-policy/net-policy-metrics.yaml
        params:
          action: gather
          usePolicyCreationMetrics: false

    - module:
        path: modules/network-policy/net-policy-enforcement-latency.yaml
        params:
          complete: true
          testType: "pod-creation"

    - module:
        path: modules/network-policy/net-policy-enforcement-latency.yaml
        params:
          run: true
          testType: "policy-creation"
    {{end}}

    - module:
        path: /modules/reconcile-objects.yaml
        params:
          actionName: "scale and update"
          namespaces: {{$namespaces}}
          {{if $RATE_LIMIT_POD_CREATION}}
          tuningSet: RandomizedScalingTimeLimited
          operationTimeout: 15m
          {{else}}
          tuningSet: default
          operationTimeout: {{AddInt (DivideInt $saturationTime 4) 900}}s
          {{end}}
          randomScaleFactor: {{$RANDOM_SCALE_FACTOR}}
          testMaxReplicaFactor: {{$RANDOM_SCALE_FACTOR}}
          daemonSetImage: {{$latencyPodImage}}
          deploymentImage: {{$latencyPodImage}}
          jobImage: {{$latencyPodImage}}
          statefulSetImage: {{$latencyPodImage}}
          daemonSetEnv: "after update"
          daemonSetReplicas: 1
          bigDeploymentSize: {{$BIG_GROUP_SIZE}}
          bigDeploymentsPerNamespace: {{$bigDeploymentsPerNamespace}}
          mediumDeploymentSize: {{$MEDIUM_GROUP_SIZE}}
          mediumDeploymentsPerNamespace: {{$mediumDeploymentsPerNamespace}}
          smallDeploymentSize: {{$SMALL_GROUP_SIZE}}
          smallDeploymentsPerNamespace: {{$smallDeploymentsPerNamespace}}
          smallStatefulSetSize: {{$SMALL_GROUP_SIZE}}
          smallStatefulSetsPerNamespace: {{$SMALL_STATEFUL_SETS_PER_NAMESPACE}}
          mediumStatefulSetSize: {{$MEDIUM_GROUP_SIZE}}
          mediumStatefulSetsPerNamespace: {{$MEDIUM_STATEFUL_SETS_PER_NAMESPACE}}
          bigJobSize: {{$BIG_GROUP_SIZE}}
          bigJobsPerNamespace: {{$bigJobsPerNamespace}}
          mediumJobSize: {{$MEDIUM_GROUP_SIZE}}
          mediumJobsPerNamespace: 1
          smallJobSize: {{$SMALL_GROUP_SIZE}}
          smallJobsPerNamespace: 1

    {{if $ADDITIONAL_PHASES_MODULES}}
    {{range $ADDITIONAL_PHASES_MODULES}}
    - module:
        path: {{.}}
        params:
          action: "scale and update"
    {{end}}
    {{end}}

    - module:
        path: /modules/reconcile-objects.yaml
        params:
          actionName: "delete"
          namespaces: {{$namespaces}}
          {{if $RATE_LIMIT_POD_CREATION}}
          tuningSet: RandomizedDeletionTimeLimited
          operationTimeout: 15m
          {{else}}
          tuningSet: default
          operationTimeout: {{AddInt $deletionTime 900}}s
          {{end}}
          testMaxReplicaFactor: {{$RANDOM_SCALE_FACTOR}}
          daemonSetImage: {{$latencyPodImage}}
          deploymentImage: {{$latencyPodImage}}
          jobImage: {{$latencyPodImage}}
          statefulSetImage: {{$latencyPodImage}}
          daemonSetReplicas: 0
          bigDeploymentSize: {{$BIG_GROUP_SIZE}}
          bigDeploymentsPerNamespace: 0
          mediumDeploymentSize: {{$MEDIUM_GROUP_SIZE}}
          mediumDeploymentsPerNamespace: 0
          smallDeploymentSize: {{$SMALL_GROUP_SIZE}}
          smallDeploymentsPerNamespace: 0
          smallStatefulSetSize: {{$SMALL_GROUP_SIZE}}
          smallStatefulSetsPerNamespace: 0
          mediumStatefulSetSize: {{$MEDIUM_GROUP_SIZE}}
          mediumStatefulSetsPerNamespace: 0
          bigJobSize: {{$BIG_GROUP_SIZE}}
          bigJobsPerNamespace: 0
          mediumJobSize: {{$MEDIUM_GROUP_SIZE}}
          mediumJobsPerNamespace: 0
          smallJobSize: {{$SMALL_GROUP_SIZE}}
          smallJobsPerNamespace: 0
          pvSmallStatefulSetSize: {{$SMALL_STATEFUL_SETS_PER_NAMESPACE}}
          pvMediumStatefulSetSize: {{$MEDIUM_STATEFUL_SETS_PER_NAMESPACE}}

    {{if $ADDITIONAL_PHASES_MODULES}}
    {{range $ADDITIONAL_PHASES_MODULES}}
    - module:
        path: {{.}}
        params:
          action: "delete"
    {{end}}
    {{end}}

    - module:
        path: /modules/configmaps-secrets.yaml
        params:
          actionName: delete
          tuningSet: default
          namespaces: {{$namespaces}}
          bigDeploymentsPerNamespace: 0
          mediumDeploymentsPerNamespace: 0
          smallDeploymentsPerNamespace: 0

    - name: Deleting PriorityClass for DaemonSets
      phases:
        - replicasPerNamespace: 0
          tuningSet: Sequence
          objectBundle:
            - basename: daemonset-priorityclass
              objectTemplatePath: daemonset-priorityclass.yaml

    {{end}} # not EXIT_AFTER_EXEC

    - module:
        path: /modules/measurements.yaml
        params:
          action: gather

    {{if $ADDITIONAL_MEASUREMENT_MODULES}}
    {{range $ADDITIONAL_MEASUREMENT_MODULES}}
    - module:
        path: {{.}}
        params:
          action: gather
    {{end}}
    {{end}}

    {{if $ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST}}
    - module:
        path: modules/network-policy/net-policy-enforcement-latency.yaml
        params:
          complete: true
          testType: "policy-creation"
    {{end}}
