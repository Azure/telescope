name: Large Scale Cluster Creation
pool: AKS-Telescope-Airlock
trigger: none
parameters:
- name: config
  displayName: Configuration (subscription, region, VM size and node count are overridden unless 'custom' is selected)
  type: string
  default: '15k-node cluster'
  values:
  - '15k-node cluster'
  - custom
- name: subscription_id
  displayName: Subscription ID (custom only)
  type: string
  default: '854c9ddb-fe9e-4aea-8d58-99ed88282881'
- name: location
  displayName: Azure region (custom only)
  type: string
  default: canadacentral
- name: user_pool_vm_size
  displayName: User node pool VM size (custom only)
  type: string
  default: Standard_D4ds_v4
- name: user_total_nodes
  displayName: Total user nodes (custom only)
  type: number
  default: 14997
- name: network_dataplane
  displayName: Network dataplane (use 'none' to omit --network-dataplane)
  type: string
  default: none
- name: enable_apiserver_vnet_integration
  displayName: Enable API server VNet integration
  type: boolean
  default: false
- name: kms_key_id
  displayName: KMS key ID (versioned Key Vault key URI; 'none' to disable)
  type: string
  default: none
variables:
  subscription_id: $[iif(eq('${{ parameters.config }}', '15k-node cluster'), '854c9ddb-fe9e-4aea-8d58-99ed88282881', '${{ parameters.subscription_id }}')]
  location: $[iif(eq('${{ parameters.config }}', '15k-node cluster'), 'canadacentral', '${{ parameters.location }}')]
  user_pool_vm_size: $[iif(eq('${{ parameters.config }}', '15k-node cluster'), 'Standard_D4ds_v4', '${{ parameters.user_pool_vm_size }}')]
  user_total_nodes: $[iif(eq('${{ parameters.config }}', '15k-node cluster'), '14997', '${{ parameters.user_total_nodes }}')]
jobs:
- job: create_cluster
  displayName: Create Large Scale Cluster
  timeoutInMinutes: 1440
  cancelTimeoutInMinutes: 120
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az account set --subscription "$(subscription_id)"
        az config set defaults.location="$(location)"
        az account show
    displayName: Login to Azure
  - bash: |
      set -eo pipefail

      job_id="$(System.JobId)"
      RUN_ID=$(Build.BuildId)-${job_id:0:8}
      echo "Run ID: $RUN_ID"

      echo "##vso[task.setvariable variable=RUN_ID]$RUN_ID"
    displayName: Set Run ID
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az group create \
          --name "$(RUN_ID)" \
          --location "$(location)" \
          --subscription "$(subscription_id)" \
        --tags SkipAKSCluster=true
    displayName: Create resource group in $(location) ($(subscription_id))
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az identity create \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-identity" \
          --subscription "$(subscription_id)"

        IDENTITY=$(az identity show \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-identity" \
          --subscription "$(subscription_id)")
        echo "##vso[task.setvariable variable=IDENTITY_PRINCIPAL_ID;isOutput=true]$(echo "$IDENTITY" | jq -r '.principalId')"
        echo "##vso[task.setvariable variable=IDENTITY_ID;isOutput=true]$(echo "$IDENTITY" | jq -r '.id')"
    displayName: Create managed identity large-scale-identity
    name: createManagedIdentity
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet create \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-net" \
          --address-prefixes 172.16.0.0/12 \
          --subscription "$(subscription_id)"
        VNET_ID=$(az network vnet show \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-net" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)

        az role assignment create \
          --scope $VNET_ID \
          --role "Network Contributor" \
          --assignee-object-id "$(createManagedIdentity.IDENTITY_PRINCIPAL_ID)" \
          --assignee-principal-type ServicePrincipal \
          --subscription "$(subscription_id)"
    displayName: Create VNet large-scale-net
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet subnet create \
          --resource-group "$(RUN_ID)" \
          --vnet-name "large-scale-net" \
          --name "nodes" \
          --address-prefixes 172.16.0.0/14 \
          --subscription "$(subscription_id)"

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group "$(RUN_ID)" \
          --vnet-name "large-scale-net" \
          --name "nodes" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)
        echo "##vso[task.setvariable variable=NODES_SUBNET_ID;isOutput=true]$SUBNET_ID"
    displayName: Create subnet nodes
    name: createSubnet_nodes
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet subnet create \
          --resource-group "$(RUN_ID)" \
          --vnet-name "large-scale-net" \
          --name "apiserver" \
          --address-prefixes 172.20.0.0/28 \
          --subscription "$(subscription_id)"

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group "$(RUN_ID)" \
          --vnet-name "large-scale-net" \
          --name "apiserver" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)
        echo "##vso[task.setvariable variable=APISERVER_SUBNET_ID;isOutput=true]$SUBNET_ID"
    displayName: Create subnet apiserver
    name: createSubnet_apiserver
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet subnet create \
          --resource-group "$(RUN_ID)" \
          --vnet-name "large-scale-net" \
          --name "AzureFirewallSubnet" \
          --address-prefixes 172.21.0.0/16 \
          --subscription "$(subscription_id)"

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group "$(RUN_ID)" \
          --vnet-name "large-scale-net" \
          --name "AzureFirewallSubnet" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)
        echo "##vso[task.setvariable variable=AZUREFIREWALLSUBNET_SUBNET_ID;isOutput=true]$SUBNET_ID"
    displayName: Create subnet AzureFirewallSubnet
    name: createSubnet_AzureFirewallSubnet
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet subnet create \
          --resource-group "$(RUN_ID)" \
          --vnet-name "large-scale-net" \
          --name "jumpbox" \
          --address-prefixes 172.22.0.0/16 \
          --subscription "$(subscription_id)"

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group "$(RUN_ID)" \
          --vnet-name "large-scale-net" \
          --name "jumpbox" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)
        echo "##vso[task.setvariable variable=JUMPBOX_SUBNET_ID;isOutput=true]$SUBNET_ID"
    displayName: Create subnet jumpbox
    name: createSubnet_jumpbox
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az extension add --name azure-firewall

        az network public-ip create \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-firewall-pip" \
          --sku Standard \
          --location "$(location)" \
          --subscription "$(subscription_id)"

        az network firewall create \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-firewall" \
          --location "$(location)" \
          --enable-dns-proxy true \
          --min-capacity 45 \
          --max-capacity 45 \
          --subscription "$(subscription_id)"

        az network firewall ip-config create \
          --resource-group "$(RUN_ID)" \
          --firewall-name "large-scale-firewall" \
          --name "large-scale-firewall-ipconfig" \
          --public-ip-address "large-scale-firewall-pip" \
          --vnet-name "large-scale-net" \
          --subscription "$(subscription_id)"

        FIREWALL_PRIVATE_IP=$(az network firewall show \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-firewall" \
          --subscription "$(subscription_id)" \
          --query "ipConfigurations[0].privateIPAddress" -o tsv)

        az network route-table create \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-firewall-rt" \
          --location "$(location)" \
          --subscription "$(subscription_id)"

        az network route-table route create \
          --resource-group "$(RUN_ID)" \
          --route-table-name "large-scale-firewall-rt" \
          --name egress \
          --address-prefix 0.0.0.0/0 \
          --next-hop-type VirtualAppliance \
          --next-hop-ip-address "$FIREWALL_PRIVATE_IP" \
          --subscription "$(subscription_id)"

        az network vnet subnet update \
          --resource-group "$(RUN_ID)" \
          --vnet-name "large-scale-net" \
          --name "nodes" \
          --route-table "large-scale-firewall-rt" \
          --subscription "$(subscription_id)"

        # Merge rule collections from the policy file into the current firewall and PUT it back in one call.
        # This handles large rule sets faster than incremental CLI commands (az network firewall policy rule-collection-group)
        # and avoids overwriting other firewall properties (e.g. location, ipConfigurations).
        if [ -n "$(Pipeline.Workspace)/s/kcl/ccp_team/large_scale_cluster_benchmarking/manifests/firewall-policy.json" ]; then
          FW_CURRENT=$(mktemp)
          FW_MERGED=$(mktemp)
          az rest \
            --method get \
            --uri "https://management.azure.com/subscriptions/$(subscription_id)/resourceGroups/$(RUN_ID)/providers/Microsoft.Network/azureFirewalls/large-scale-firewall?api-version=2025-05-01" \
            > "$FW_CURRENT"
          jq -s '
            .[0] as $fw | .[1] as $rules |
            $fw
            | .properties.applicationRuleCollections = ($rules.properties.applicationRuleCollections // [])
            | .properties.networkRuleCollections     = ($rules.properties.networkRuleCollections // [])
            | .properties.natRuleCollections         = ($rules.properties.natRuleCollections // [])
          ' "$FW_CURRENT" "$(Pipeline.Workspace)/s/kcl/ccp_team/large_scale_cluster_benchmarking/manifests/firewall-policy.json" > "$FW_MERGED"
          az rest \
            --method put \
            --uri "https://management.azure.com/subscriptions/$(subscription_id)/resourceGroups/$(RUN_ID)/providers/Microsoft.Network/azureFirewalls/large-scale-firewall?api-version=2025-05-01" \
            --headers "Content-Type=application/json" \
            --body "@$FW_MERGED"
          rm -f "$FW_CURRENT" "$FW_MERGED"
        fi
    displayName: Setup firewall large-scale-firewall for subnet nodes
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        cat > /tmp/cloud-init.yaml << 'CLOUDINIT'
        #cloud-config
        package_update: true
        package_upgrade: true
        packages:
          - git
          - ca-certificates
          - curl
          - apt-transport-https
          - lsb-release
          - gnupg
        runcmd:
          - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          - wget -q https://go.dev/dl/go1.22.2.linux-amd64.tar.gz -O /tmp/go.tar.gz
          - tar -C /usr/local -xzf /tmp/go.tar.gz
          - echo 'export PATH=$PATH:/usr/local/go/bin' >> /etc/profile.d/go.sh
          - rm /tmp/go.tar.gz
          - curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          - rm kubectl
        CLOUDINIT

        az vm create \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-jumpbox" \
          --image Ubuntu2204 \
          --size Standard_D4ds_v5 \
          --vnet-name "large-scale-net" \
          --subnet "jumpbox" \
          --public-ip-address "large-scale-jumpbox-pip" \
          --admin-username "azureuser" \
          --generate-ssh-keys \
          --custom-data /tmp/cloud-init.yaml \
          --subscription "$(subscription_id)"

        JUMPBOX_PRINCIPAL_ID=$(az vm identity assign \
          --resource-group "$(RUN_ID)" \
          --name "large-scale-jumpbox" \
          --subscription "$(subscription_id)" \
          --query systemAssignedIdentity -o tsv)
        az role assignment create \
          --assignee "$JUMPBOX_PRINCIPAL_ID" \
          --role "Azure Kubernetes Service Cluster Admin Role" \
          --scope "$(az group show --name "$(RUN_ID)" --subscription "$(subscription_id)" --query id -o tsv)" \
          --subscription "$(subscription_id)"

        az role assignment create \
          --assignee "$JUMPBOX_PRINCIPAL_ID" \
          --role "Azure Kubernetes Service Contributor Role" \
          --scope "$(az group show --name "$(RUN_ID)" --subscription "$(subscription_id)" --query id -o tsv)" \
          --subscription "$(subscription_id)"
    displayName: Create jumpbox large-scale-jumpbox
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        KEY_ID="${{ parameters.kms_key_id }}"
        if ! [[ "$KEY_ID" =~ ^https://[^/]+/keys/[^/]+/[^/]+$ ]]; then
          echo "Key ID must be a versioned Key Vault key URI; got '$KEY_ID'."
          exit 1
        fi
        HOST="${KEY_ID#https://}"
        VAULT_NAME="${HOST%%.*}"

        KEY_VAULT_RESOURCE_ID=$(az keyvault show \
          --subscription "$(subscription_id)" \
          --name "$VAULT_NAME" \
          --query id -o tsv)

        az role assignment create \
          --role "Key Vault Crypto User" \
          --assignee-object-id "$(createManagedIdentity.IDENTITY_PRINCIPAL_ID)" \
          --assignee-principal-type ServicePrincipal \
          --scope "$KEY_VAULT_RESOURCE_ID"
    condition: ne('${{ parameters.kms_key_id }}', 'none')
    displayName: Grant Key Vault Crypto User for KMS
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az extension add --name aks-preview --allow-preview true --upgrade --yes

        CREATE_ARGS=(
          --subscription "$(subscription_id)"
          --resource-group "$(RUN_ID)"
          --name "large-scale"
          --location "$(location)"
          --kubernetes-version "1.37"
          --dns-name-prefix "large-scale-dns"
          --tier standard
          --assign-identity "$(createManagedIdentity.IDENTITY_ID)"
          --tags SkipAKSCluster=true
          --control-plane-scaling-size H8
          --nodepool-name system
          --node-count 2
          --node-vm-size Standard_D16ds_v5
          --max-pods 60
          --os-sku Ubuntu
          # AKS nodes enable THP by default, but the test VMs have limited memory.
          # Disable THP to avoid excessive node memory usage affecting benchmark results.
          --linux-os-config "$(Pipeline.Workspace)/s/kcl/ccp_team/large_scale_cluster_benchmarking/manifests/linux-os-config.json"
          --vnet-subnet-id "$(createSubnet_nodes.NODES_SUBNET_ID)"
          --network-plugin azure
          --network-plugin-mode overlay
          --pod-cidr 10.0.0.0/8
          --service-cidr 192.168.0.0/16
          --dns-service-ip 192.168.0.10
          --outbound-type userDefinedRouting
          --enable-private-cluster
          --auto-upgrade-channel none
          --node-os-upgrade-channel None
          --generate-ssh-keys
          --yes
        )
        [[ "${{ parameters.network_dataplane }}" != "none" ]] && CREATE_ARGS+=(--network-dataplane "${{ parameters.network_dataplane }}")

        # Azure Pipelines renders boolean parameters as True or False, so compare case-insensitively.
        [[ "${{ parameters.enable_apiserver_vnet_integration }}" == [Tt][Rr][Uu][Ee] ]] && CREATE_ARGS+=(--enable-apiserver-vnet-integration --apiserver-subnet-id "$(createSubnet_apiserver.APISERVER_SUBNET_ID)")

        KEY_ID="${{ parameters.kms_key_id }}"
        # Infrastructure encryption enables KMS v2 Plus.
        if [ "$KEY_ID" != "none" ]; then
        KEY_ID="$KEY_ID"
        if ! [[ "$KEY_ID" =~ ^https://[^/]+/keys/[^/]+/[^/]+$ ]]; then
          echo "Key ID must be a versioned Key Vault key URI; got '$KEY_ID'."
          exit 1
        fi
        HOST="${KEY_ID#https://}"
        VAULT_NAME="${HOST%%.*}"

        KEY_VAULT_RESOURCE_ID=$(az keyvault show \
          --subscription "$(subscription_id)" \
          --name "$VAULT_NAME" \
          --query id -o tsv)

          CREATE_ARGS+=(
            --enable-azure-keyvault-kms
            --azure-keyvault-kms-key-id "$KEY_ID"
            --azure-keyvault-kms-key-vault-resource-id "$KEY_VAULT_RESOURCE_ID"
            --kms-infrastructure-encryption Enabled
          )
        fi

        az aks create "${CREATE_ARGS[@]}"
    displayName: Create AKS cluster
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        create_node_pool \
          --cluster-name "large-scale" \
          --resource-group "$(RUN_ID)" \
          --subscription "$(subscription_id)" \
          --name "cl2" \
          --node-count 1 \
          --node-vm-size "Standard_D48ds_v5" \
          --mode User \
          --node-taints cl2=true:NoSchedule \
          --vnet-subnet-id "$(createSubnet_nodes.NODES_SUBNET_ID)" \
          --os-sku Ubuntu
    displayName: Create node pool cl2
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        create_node_pool() {
          local deadline sleep_between=30 attempt=0 output rc now remaining_retry_seconds
          deadline=$(($(date +%s) + 600))
          while :; do
            attempt=$((attempt + 1))
            if output=$(az aks nodepool add "$@" 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$output"
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                return "$rc"
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep "$sleep_between"
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              return "$rc"
            fi
          done
        }


        TOTAL_NODES="$(user_total_nodes)"
        MAX_NODES_PER_POOL=800
        # AKS allows up to 100 node pools per cluster, including existing pools.
        # https://learn.microsoft.com/en-us/azure/aks/quotas-skus-regions#service-quotas-and-limits
        # This guard does not account for existing pools; AKS enforces the cluster-wide limit.
        MAX_NODE_POOLS=100

        if ! [[ "$TOTAL_NODES" =~ ^[1-9][0-9]*$ ]]; then
          echo "Total user nodes must be a positive integer; got '$TOTAL_NODES'."
          exit 1
        fi
        if [ "$TOTAL_NODES" -gt $((MAX_NODES_PER_POOL * MAX_NODE_POOLS)) ]; then
          echo "Total user nodes cannot exceed $((MAX_NODES_PER_POOL * MAX_NODE_POOLS)); got '$TOTAL_NODES'."
          exit 1
        fi

        remaining=$TOTAL_NODES
        pool_index=0
        while [ "$remaining" -gt 0 ]; do
          node_count=$MAX_NODES_PER_POOL
          if [ "$remaining" -lt "$MAX_NODES_PER_POOL" ]; then
            node_count=$remaining
          fi
          pool_name="workerpool$pool_index"
          echo "Creating node pool $pool_name with $node_count nodes."

          create_node_pool \
            --cluster-name "large-scale" \
            --resource-group "$(RUN_ID)" \
            --subscription "$(subscription_id)" \
            --name "$pool_name" \
            --node-count "$node_count" \
            --node-vm-size "$(user_pool_vm_size)" \
            --mode User \
            --vnet-subnet-id "$(createSubnet_nodes.NODES_SUBNET_ID)" \
              --os-sku Ubuntu \
              --linux-os-config "$(Pipeline.Workspace)/s/kcl/ccp_team/large_scale_cluster_benchmarking/manifests/linux-os-config.json"

          remaining=$((remaining - node_count))
          pool_index=$((pool_index + 1))
        done
    displayName: Create node pools from pipeline parameter
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az group delete --name "$(RUN_ID)" --subscription "$(subscription_id)" --yes
    condition: always()
    displayName: Delete resource group ($(subscription_id))
