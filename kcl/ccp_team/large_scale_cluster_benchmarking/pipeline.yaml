        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          run_script_on_jumpbox() {
            local script_file run_command_output run_command_rc
            script_file=$(mktemp)
            printf 'set -eu\n' > "$script_file"
            cat >> "$script_file"
            printf '\necho "__JUMPBOX_SCRIPT_SUCCEEDED__"\n' >> "$script_file"

            if run_command_output=$(az vm run-command invoke \
              --resource-group "$2" \
              --name "$3" \
              --subscription "$1" \
              --command-id RunShellScript \
              --scripts @"$script_file" \
              --query 'value[0].message' \
              --output tsv); then
              run_command_rc=0
            else
              run_command_rc=$?
            fi
            rm -f "$script_file"

            if [ "$run_command_rc" -ne 0 ]; then
              printf '%s\n' "$run_command_output"
              return "$run_command_rc"
            fi
            if ! grep -q '__JUMPBOX_SCRIPT_SUCCEEDED__' <<< "$run_command_output"; then
              printf '%s\n' "$run_command_output"
              return 1
            fi
            printf '%s\n' "$run_command_output" | sed '/__JUMPBOX_SCRIPT_SUCCEEDED__/d'
          }


          if ! run_command_output=$(run_script_on_jumpbox \
            "854c9ddb-fe9e-4aea-8d58-99ed88282881" \
            "$(RUN_ID)" \
            "large-scale-jumpbox" <<'REMOTE_SCRIPT'
          az login --identity --output none
          az account set --subscription "854c9ddb-fe9e-4aea-8d58-99ed88282881"
          az aks get-credentials \
            --admin \
            --overwrite-existing \
            --file /var/tmp/telescope-kubeconfig \
            --resource-group "$(RUN_ID)" \
            --name "large-scale" \
            --subscription "854c9ddb-fe9e-4aea-8d58-99ed88282881"
          chmod 600 /var/tmp/telescope-kubeconfig
          test -s /var/tmp/telescope-kubeconfig

          REMOTE_SCRIPT
          ); then
            echo "$run_command_output"
            echo "Failed to run script on jumpbox."
            exit 1
          fi
          echo "$run_command_output"
      displayName: Configure kubeconfig on jumpbox large-scale-jumpbox
