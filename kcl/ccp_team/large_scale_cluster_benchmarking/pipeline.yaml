          if ! run_command_output=$(
            {
          cat <<'REMOTE_SCRIPT'
          remote_file="/var/tmp/telescope/$(Build.BuildId)/cl2.yaml"
          mkdir -p "$(dirname "$remote_file")"
          cat > "$remote_file" <<'__TELESCOPE_FILE_CONTENT__'
          REMOTE_SCRIPT

          cat "$local_file"
          printf '
          '

          cat <<'REMOTE_SCRIPT'
          __TELESCOPE_FILE_CONTENT__
          test -s "$remote_file"
          REMOTE_SCRIPT
            } | run_script_on_jumpbox \
              "854c9ddb-fe9e-4aea-8d58-99ed88282881" \
              "$(RUN_ID)" \
              "large-scale-jumpbox"
          ); then
            echo "$run_command_output"
            echo "Failed to upload kcl/ccp_team/large_scale_cluster_benchmarking/manifests/cl2.yaml to /var/tmp/telescope/$(Build.BuildId)/cl2.yaml on jumpbox."
            exit 1
          fi
          echo "$run_command_output"
      displayName: Upload kcl/ccp_team/large_scale_cluster_benchmarking/manifests/cl2.yaml to jumpbox
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          run_script_on_jumpbox() {
            local script_file run_command_output run_command_rc
            script_file=$(mktemp)
            printf 'set -eu\n' > "$script_file"
            cat >> "$script_file"
            printf '\necho "__JUMPBOX_SCRIPT_SUCCEEDED__"\n' >> "$script_file"

            if run_command_output=$(az vm run-command invoke \
              --resource-group "$2" \
              --name "$3" \
              --subscription "$1" \
              --command-id RunShellScript \
              --scripts @"$script_file" \
              --query 'value[0].message' \
              --output tsv); then
              run_command_rc=0
            else
              run_command_rc=$?
            fi
            rm -f "$script_file"

            if [ "$run_command_rc" -ne 0 ]; then
              printf '%s\n' "$run_command_output"
              return "$run_command_rc"
            fi
            if ! grep -q '__JUMPBOX_SCRIPT_SUCCEEDED__' <<< "$run_command_output"; then
              printf '%s\n' "$run_command_output"
              return 1
            fi
            printf '%s\n' "$run_command_output" | sed '/__JUMPBOX_SCRIPT_SUCCEEDED__/d'
          }


          if ! run_command_output=$(run_script_on_jumpbox \
            "854c9ddb-fe9e-4aea-8d58-99ed88282881" \
            "$(RUN_ID)" \
            "large-scale-jumpbox" <<'REMOTE_SCRIPT'
          export KUBECONFIG=/var/tmp/telescope-kubeconfig
          test -s "$KUBECONFIG"
          test -s "/var/tmp/telescope/$(Build.BuildId)/cl2.yaml"
          trap 'rm -f "/var/tmp/telescope/$(Build.BuildId)/cl2.yaml"' EXIT
          kubectl create namespace "clusterloader2" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f "/var/tmp/telescope/$(Build.BuildId)/cl2.yaml"

          REMOTE_SCRIPT
          ); then
            echo "$run_command_output"
            echo "Failed to run script on jumpbox."
            exit 1
          fi
          echo "$run_command_output"
      displayName: Start ClusterLoader2 from jumpbox
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          run_script_on_jumpbox() {
            local script_file run_command_output run_command_rc
            script_file=$(mktemp)
            printf 'set -eu\n' > "$script_file"
            cat >> "$script_file"
            printf '\necho "__JUMPBOX_SCRIPT_SUCCEEDED__"\n' >> "$script_file"

            if run_command_output=$(az vm run-command invoke \
              --resource-group "$2" \
              --name "$3" \
              --subscription "$1" \
              --command-id RunShellScript \
              --scripts @"$script_file" \
              --query 'value[0].message' \
              --output tsv); then
              run_command_rc=0
            else
              run_command_rc=$?
            fi
            rm -f "$script_file"

            if [ "$run_command_rc" -ne 0 ]; then
              printf '%s\n' "$run_command_output"
              return "$run_command_rc"
            fi
            if ! grep -q '__JUMPBOX_SCRIPT_SUCCEEDED__' <<< "$run_command_output"; then
              printf '%s\n' "$run_command_output"
              return 1
            fi
            printf '%s\n' "$run_command_output" | sed '/__JUMPBOX_SCRIPT_SUCCEEDED__/d'
          }


          # Mirror the polling behavior of RunClusterLoader2.
          consecutive_status_errors=0

          # Run each status query through the shared run_script_on_jumpbox helper.
          while true; do
            if status_message=$(run_script_on_jumpbox \
              "854c9ddb-fe9e-4aea-8d58-99ed88282881" \
              "$(RUN_ID)" \
              "large-scale-jumpbox" <<'REMOTE_SCRIPT'
          export KUBECONFIG=/var/tmp/telescope-kubeconfig
          kubectl get pods \
            --namespace="clusterloader2" \
            --output jsonpath='{range .items[*]}{.status.phase}{"\n"}{end}'
          REMOTE_SCRIPT
            ); then
              echo "$status_message"
              consecutive_status_errors=0
              phases=$(printf '%s\n' "$status_message" | tr -d '\r' | grep -E '^(Pending|Running|Succeeded|Failed|Unknown)$' || true)
              total=0
              terminal=0

              if [ -n "$phases" ]; then
                while IFS= read -r phase; do
                  if [ -z "$phase" ]; then
                    continue
                  fi

                  total=$((total + 1))
                  if [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ]; then
                    terminal=$((terminal + 1))
                  fi
                done <<< "$phases"
              fi

              if [ "$total" -gt 0 ] && [ "$terminal" -eq "$total" ]; then
                echo "All cl2 pods reached terminal state (Succeeded or Failed)"
                break
              fi
            else
              echo "$status_message"
              consecutive_status_errors=$((consecutive_status_errors + 1))
              if [ "$consecutive_status_errors" -ge "20" ]; then
                echo "Unable to read ClusterLoader2 status after $consecutive_status_errors/20 consecutive attempts."
                exit 1
              fi
            fi

            sleep 30
          done
      displayName: Wait for ClusterLoader2 completion from jumpbox
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          run_script_on_jumpbox() {
            local script_file run_command_output run_command_rc
            script_file=$(mktemp)
            printf 'set -eu\n' > "$script_file"
            cat >> "$script_file"
            printf '\necho "__JUMPBOX_SCRIPT_SUCCEEDED__"\n' >> "$script_file"

            if run_command_output=$(az vm run-command invoke \
              --resource-group "$2" \
              --name "$3" \
              --subscription "$1" \
              --command-id RunShellScript \
              --scripts @"$script_file" \
              --query 'value[0].message' \
              --output tsv); then
              run_command_rc=0
            else
              run_command_rc=$?
            fi
            rm -f "$script_file"

            if [ "$run_command_rc" -ne 0 ]; then
              printf '%s\n' "$run_command_output"
              return "$run_command_rc"
            fi
            if ! grep -q '__JUMPBOX_SCRIPT_SUCCEEDED__' <<< "$run_command_output"; then
              printf '%s\n' "$run_command_output"
              return 1
            fi
            printf '%s\n' "$run_command_output" | sed '/__JUMPBOX_SCRIPT_SUCCEEDED__/d'
          }


          if ! run_command_output=$(run_script_on_jumpbox \
            "854c9ddb-fe9e-4aea-8d58-99ed88282881" \
            "$(RUN_ID)" \
            "large-scale-jumpbox" <<'REMOTE_SCRIPT'
          export KUBECONFIG=/var/tmp/telescope-kubeconfig
          pods=$(kubectl get pods \
            --namespace="clusterloader2" \
            --selector job-name=cl2 \
            --output jsonpath='{.items[*].metadata.name}')
          test -n "$pods"

          for pod in $pods; do
            echo "===== Results for pod: $pod ====="
            kubectl logs \
          --namespace="clusterloader2" \
          "$pod" \
          --container=cl2-results
          done

          # Collect all results before failing the step for an unsuccessful benchmark.
          for pod in $pods; do
            pod_result=$(kubectl get pod "$pod" \
          --namespace="clusterloader2" \
          --output jsonpath='{.status.phase}:{.status.containerStatuses[?(@.name=="cl2")].state.terminated.exitCode}')
            if [ "$pod_result" != "Succeeded:0" ]; then
          echo "ClusterLoader2 pod $pod failed: phase:exitCode=$pod_result (expected Succeeded:0)"
          exit 1
            fi
          done

          REMOTE_SCRIPT
          ); then
            echo "$run_command_output"
            echo "Failed to run script on jumpbox."
            exit 1
          fi
          echo "$run_command_output"
      displayName: Collect ClusterLoader2 results and check success
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -exo pipefail
          KEY_ID="https://xinwei-15k-key-vault.vault.azure.net/keys/15k-test/38ca388db5e74ffab7b8ac920acf2a5b"
          if ! [[ "$KEY_ID" =~ ^https://[^/]+/keys/[^/]+/[^/]+$ ]]; then
            echo "Key ID must be a versioned Key Vault key URI; got '$KEY_ID'."
            exit 1
          fi
          HOST="${KEY_ID#https://}"
          VAULT_NAME="${HOST%%.*}"

          KEY_VAULT_RESOURCE_ID=$(az keyvault show \
            --subscription "854c9ddb-fe9e-4aea-8d58-99ed88282881" \
            --name "$VAULT_NAME" \
            --query id -o tsv)

          az role assignment delete \
