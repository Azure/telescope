apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: disable-thp
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: disable-thp
  template:
    metadata:
      labels:
        app: disable-thp
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: disable-thp
        image: mcr.microsoft.com/cbl-mariner/busybox:1.35
        securityContext:
          privileged: true
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo never > /host-sys/kernel/mm/transparent_hugepage/enabled
          echo never > /host-sys/kernel/mm/transparent_hugepage/defrag
          # BusyBox does not reliably support "sleep infinity"; keep the pod Ready until the DaemonSet is removed.
          while true; do sleep 86400; done
        volumeMounts:
        - name: host-sys
          mountPath: /host-sys
      volumes:
      - name: host-sys
        hostPath:
          path: /sys
