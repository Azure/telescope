name: '15K Nodes Cluster Creation'
pool: AKS-Telescope-Airlock
trigger: none
parameters:
- name: subscription_id
  displayName: Subscription ID
  type: string
  default: b8ceb4e5-f05b-4562-a9f5-14acb1f24219
- name: location
  displayName: Azure region
  type: string
  default: eastasia
- name: cluster_name
  displayName: AKS cluster name
  type: string
  default: '15k'
- name: user_pool_vm_size
  displayName: User node pool VM size
  type: string
  default: Standard_D4s_v3
- name: user_total_nodes
  displayName: Total user nodes
  type: number
  default: 14997
- name: network_dataplane
  displayName: Network dataplane (use 'none' to omit --network-dataplane)
  type: string
  default: none
- name: apiserver_vnet_integration
  displayName: Enable API server vNet integration (leave empty to disable)
  type: string
  default: 'true'
- name: kms_key_id
  displayName: Azure Key Vault KMS key ID (versioned key URI; use 'none' to disable KMS)
  type: string
  default: none
variables:
  subscription_id: ${{ parameters.subscription_id }}
  location: ${{ parameters.location }}
  cluster_name: ${{ parameters.cluster_name }}
  user_pool_vm_size: ${{ parameters.user_pool_vm_size }}
  user_total_nodes: ${{ parameters.user_total_nodes }}
  network_dataplane: ${{ parameters.network_dataplane }}
  apiserver_vnet_integration: ${{ parameters.apiserver_vnet_integration }}
  kms_key_id: ${{ parameters.kms_key_id }}
jobs:
- job: create_cluster
  displayName: Create 15K Nodes Cluster
  timeoutInMinutes: 2160
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az account set --subscription "$(subscription_id)"
        az config set defaults.location="$(location)"
        az account show
    displayName: Login to Azure
  - bash: |
      set -eo pipefail

      job_id="$(System.JobId)"
      RUN_ID=$(Build.BuildId)-${job_id:0:8}
      echo "Run ID: $RUN_ID"

      echo "##vso[task.setvariable variable=RUN_ID]$RUN_ID"
    displayName: Set Run ID
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az group create \
          --name "$(RUN_ID)" \
          --location "$(location)" \
          --subscription "$(subscription_id)" \
        --tags SkipAKSCluster=true
    displayName: Create resource group in $(location) ($(subscription_id))
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az identity create \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-identity" \
          --subscription "$(subscription_id)"

        IDENTITY=$(az identity show \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-identity" \
          --subscription "$(subscription_id)")
        echo "##vso[task.setvariable variable=IDENTITY_PRINCIPAL_ID;isOutput=true]$(echo "$IDENTITY" | jq -r '.principalId')"
        echo "##vso[task.setvariable variable=IDENTITY_ID;isOutput=true]$(echo "$IDENTITY" | jq -r '.id')"
    displayName: Create managed identity $(cluster_name)-identity
    name: createManagedIdentity
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet create \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-net" \
          --address-prefixes 10.0.0.0/8 \
          --subscription "$(subscription_id)"
        VNET_ID=$(az network vnet show \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-net" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)

        az role assignment create \
          --scope $VNET_ID \
          --role "Network Contributor" \
          --assignee-object-id "$(createManagedIdentity.IDENTITY_PRINCIPAL_ID)" \
          --assignee-principal-type ServicePrincipal \
          --subscription "$(subscription_id)"
    displayName: Create VNet $(cluster_name)-net
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet subnet create \
          --resource-group "$(RUN_ID)" \
          --vnet-name "$(cluster_name)-net" \
          --name "nodes" \
          --address-prefixes 10.1.0.0/18 \
          --subscription "$(subscription_id)"

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group "$(RUN_ID)" \
          --vnet-name "$(cluster_name)-net" \
          --name "nodes" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)

        echo "##vso[task.setvariable variable=NODES_SUBNET_ID;isOutput=true]$SUBNET_ID"
    displayName: Create subnet nodes
    name: createNodesSubnet
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet subnet create \
          --resource-group "$(RUN_ID)" \
          --vnet-name "$(cluster_name)-net" \
          --name "apiserver" \
          --address-prefixes 10.240.0.0/28 \
          --subscription "$(subscription_id)"

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group "$(RUN_ID)" \
          --vnet-name "$(cluster_name)-net" \
          --name "apiserver" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)

        echo "##vso[task.setvariable variable=APISERVER_SUBNET_ID;isOutput=true]$SUBNET_ID"
    displayName: Create subnet apiserver
    name: createApiserverSubnet
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet subnet create \
          --resource-group "$(RUN_ID)" \
          --vnet-name "$(cluster_name)-net" \
          --name "AzureFirewallSubnet" \
          --address-prefixes 10.2.0.0/16 \
          --subscription "$(subscription_id)"

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group "$(RUN_ID)" \
          --vnet-name "$(cluster_name)-net" \
          --name "AzureFirewallSubnet" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)

        echo "##vso[task.setvariable variable=AZUREFIREWALLSUBNET_SUBNET_ID;isOutput=true]$SUBNET_ID"
    displayName: Create subnet AzureFirewallSubnet
    name: createFirewallSubnet
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az network vnet subnet create \
          --resource-group "$(RUN_ID)" \
          --vnet-name "$(cluster_name)-net" \
          --name "jumpbox" \
          --address-prefixes 10.3.0.0/16 \
          --subscription "$(subscription_id)"

        SUBNET_ID=$(az network vnet subnet show \
          --resource-group "$(RUN_ID)" \
          --vnet-name "$(cluster_name)-net" \
          --name "jumpbox" \
          --subscription "$(subscription_id)" \
          --query id -o tsv)

        echo "##vso[task.setvariable variable=JUMPBOX_SUBNET_ID;isOutput=true]$SUBNET_ID"
    displayName: Create subnet jumpbox
    name: createJumpboxSubnet
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az extension add --name azure-firewall

        az network public-ip create \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-firewall-pip" \
          --sku Standard \
          --location "$(location)" \
          --subscription "$(subscription_id)"

        az network firewall create \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-firewall" \
          --location "$(location)" \
          --enable-dns-proxy true \
          --min-capacity 45 \
          --max-capacity 45 \
          --subscription "$(subscription_id)"

        az network firewall ip-config create \
          --resource-group "$(RUN_ID)" \
          --firewall-name "$(cluster_name)-firewall" \
          --name "$(cluster_name)-firewall-ipconfig" \
          --public-ip-address "$(cluster_name)-firewall-pip" \
          --vnet-name "$(cluster_name)-net" \
          --subscription "$(subscription_id)"

        FIREWALL_PRIVATE_IP=$(az network firewall show \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-firewall" \
          --subscription "$(subscription_id)" \
          --query "ipConfigurations[0].privateIPAddress" -o tsv)

        az network route-table create \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-firewall-rt" \
          --location "$(location)" \
          --subscription "$(subscription_id)"

        az network route-table route create \
          --resource-group "$(RUN_ID)" \
          --route-table-name "$(cluster_name)-firewall-rt" \
          --name egress \
          --address-prefix 0.0.0.0/0 \
          --next-hop-type VirtualAppliance \
          --next-hop-ip-address "$FIREWALL_PRIVATE_IP" \
          --subscription "$(subscription_id)"

        az network vnet subnet update \
          --resource-group "$(RUN_ID)" \
          --vnet-name "$(cluster_name)-net" \
          --name "nodes" \
          --route-table "$(cluster_name)-firewall-rt" \
          --subscription "$(subscription_id)"

        # Merge rule collections from the policy file into the current firewall and PUT it back in one call.
        # This handles large rule sets faster than incremental CLI commands (az network firewall policy rule-collection-group)
        # and avoids overwriting other firewall properties (e.g. location, ipConfigurations).
        if [ -n "$(Pipeline.Workspace)/s/kcl/ccp_team/15K_cluster/firewall-policy.json" ]; then
          FW_CURRENT=$(mktemp)
          FW_MERGED=$(mktemp)
          az rest \
            --method get \
            --uri "https://management.azure.com/subscriptions/$(subscription_id)/resourceGroups/$(RUN_ID)/providers/Microsoft.Network/azureFirewalls/$(cluster_name)-firewall?api-version=2025-05-01" \
            > "$FW_CURRENT"
          jq -s '
            .[0] as $fw | .[1] as $rules |
            $fw
            | .properties.applicationRuleCollections = ($rules.properties.applicationRuleCollections // [])
            | .properties.networkRuleCollections     = ($rules.properties.networkRuleCollections // [])
            | .properties.natRuleCollections         = ($rules.properties.natRuleCollections // [])
          ' "$FW_CURRENT" "$(Pipeline.Workspace)/s/kcl/ccp_team/15K_cluster/firewall-policy.json" > "$FW_MERGED"
          az rest \
            --method put \
            --uri "https://management.azure.com/subscriptions/$(subscription_id)/resourceGroups/$(RUN_ID)/providers/Microsoft.Network/azureFirewalls/$(cluster_name)-firewall?api-version=2025-05-01" \
            --headers "Content-Type=application/json" \
            --body "@$FW_MERGED"
          rm -f "$FW_CURRENT" "$FW_MERGED"
        fi
    displayName: Setup firewall $(cluster_name)-firewall for subnet nodes
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        cat > /tmp/cloud-init.yaml << 'CLOUDINIT'
        #cloud-config
        package_update: true
        package_upgrade: true
        packages:
          - git
          - ca-certificates
          - curl
          - apt-transport-https
          - lsb-release
          - gnupg
        runcmd:
          - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          - wget -q https://go.dev/dl/go1.22.2.linux-amd64.tar.gz -O /tmp/go.tar.gz
          - tar -C /usr/local -xzf /tmp/go.tar.gz
          - echo 'export PATH=$PATH:/usr/local/go/bin' >> /etc/profile.d/go.sh
          - rm /tmp/go.tar.gz
          - curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          - rm kubectl
        CLOUDINIT

        az vm create \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-jumpbox" \
          --image Ubuntu2204 \
          --size Standard_D32ds_v5 \
          --vnet-name "$(cluster_name)-net" \
          --subnet "jumpbox" \
          --public-ip-address "$(cluster_name)-jumpbox-pip" \
          --admin-username "azureuser" \
          --generate-ssh-keys \
          --custom-data /tmp/cloud-init.yaml \
          --subscription "$(subscription_id)"

        JUMPBOX_PRINCIPAL_ID=$(az vm identity assign \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-jumpbox" \
          --subscription "$(subscription_id)" \
          --query systemAssignedIdentity -o tsv)
        az role assignment create \
          --assignee "$JUMPBOX_PRINCIPAL_ID" \
          --role "Azure Kubernetes Service Cluster Admin Role" \
          --scope "$(az group show --name "$(RUN_ID)" --subscription "$(subscription_id)" --query id -o tsv)" \
          --subscription "$(subscription_id)"

        az role assignment create \
          --assignee "$JUMPBOX_PRINCIPAL_ID" \
          --role "Azure Kubernetes Service Contributor Role" \
          --scope "$(az group show --name "$(RUN_ID)" --subscription "$(subscription_id)" --query id -o tsv)" \
          --subscription "$(subscription_id)"
    displayName: Create jumpbox $(cluster_name)-jumpbox
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        KEY_ID="$(kms_key_id)"
        HOST="${KEY_ID#https://}"
        VAULT_NAME="${HOST%%.*}"

        KEY_VAULT_RESOURCE_ID=$(az keyvault show \
          --subscription "$(subscription_id)" \
          --name "${VAULT_NAME}" \
          --query id -o tsv)

        az role assignment create \
          --role "Key Vault Crypto User" \
          --assignee-object-id "$(createManagedIdentity.IDENTITY_PRINCIPAL_ID)" \
          --assignee-principal-type ServicePrincipal \
          --scope "${KEY_VAULT_RESOURCE_ID}"
    condition: ne(variables['kms_key_id'], 'none')
    displayName: Grant KMS access to cluster identity
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az extension add --name aks-preview --allow-preview true --upgrade --yes

        CREATE_ARGS=(
          --subscription "$(subscription_id)"
          --resource-group "$(RUN_ID)"
          --name "$(cluster_name)"
          --location "$(location)"
          --kubernetes-version "1.35.0"
          --dns-name-prefix "$(cluster_name)-dns"
          --tier standard
          --assign-identity "$(createManagedIdentity.IDENTITY_ID)"
          --tags SkipAKSCluster=true
          --control-plane-scaling-size H2
          --nodepool-name system
          --node-count 3
          --node-vm-size Standard_D48ds_v5
          --max-pods 60
          --os-sku Ubuntu
          --vnet-subnet-id "$(createNodesSubnet.NODES_SUBNET_ID)"
          --network-plugin azure
          --network-plugin-mode overlay
          --pod-cidr 10.64.0.0/10
          --outbound-type userDefinedRouting
          --enable-private-cluster
          --auto-upgrade-channel none
          --node-os-upgrade-channel None
          --generate-ssh-keys
          --yes
        )
        [[ "$(network_dataplane)" != "none" ]] && CREATE_ARGS+=(--network-dataplane "$(network_dataplane)")
        [[ "$(apiserver_vnet_integration)" == "true" ]] && CREATE_ARGS+=(--enable-apiserver-vnet-integration --apiserver-subnet-id "$(createApiserverSubnet.APISERVER_SUBNET_ID)")
        [[ "$(kms_key_id)" != "none" ]] && CREATE_ARGS+=(--enable-azure-keyvault-kms --azure-keyvault-kms-key-id "$(kms_key_id)" --azure-keyvault-kms-key-vault-network-access Public)


        az aks create "${CREATE_ARGS[@]}"
    displayName: Create AKS cluster
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        while true; do
          STATE=$(az aks show \
            --name "$(cluster_name)" \
            --resource-group "$(RUN_ID)" \
            --subscription "$(subscription_id)" \
            --query "provisioningState" \
            --output tsv)
          echo "Cluster provisioning state: $STATE"
          if [ "$STATE" = "Succeeded" ]; then
            echo "Cluster is ready."
            break
          elif [ "$STATE" = "Failed" ] || [ "$STATE" = "Canceled" ]; then
            echo "Cluster failed with state: $STATE."
            exit 1
          else
            echo "Provisioning state: $STATE. Retry in 30 seconds"
          fi
          sleep 30
        done
    displayName: Wait for cluster to succeed
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        TOTAL_NODES="$(user_total_nodes)"
        MAX_NODES_PER_POOL=800
        MAX_NODE_POOLS=100

        if ! [[ "$TOTAL_NODES" =~ ^[1-9][0-9]*$ ]]; then
          echo "Total user nodes must be a positive integer; got '$TOTAL_NODES'."
          exit 1
        fi
        if [ "$TOTAL_NODES" -gt $((MAX_NODES_PER_POOL * MAX_NODE_POOLS)) ]; then
          echo "Total user nodes cannot exceed $((MAX_NODES_PER_POOL * MAX_NODE_POOLS)); got '$TOTAL_NODES'."
          exit 1
        fi

        remaining=$TOTAL_NODES
        pool_index=0
        while [ "$remaining" -gt 0 ]; do
          node_count=$MAX_NODES_PER_POOL
          if [ "$remaining" -lt "$MAX_NODES_PER_POOL" ]; then
            node_count=$remaining
          fi
          pool_name="workerpool$pool_index"
          echo "Creating node pool $pool_name with $node_count nodes."

          deadline=$(($(date +%s) + 600))
          sleep_between=30
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            set +e
            output=$(az aks nodepool add \
              --cluster-name "$(cluster_name)" \
              --resource-group "$(RUN_ID)" \
              --subscription "$(subscription_id)" \
              --name "$pool_name" \
              --node-count "$node_count" \
              --node-vm-size "$(user_pool_vm_size)" \
              --mode User \
              --vnet-subnet-id "$(createNodesSubnet.NODES_SUBNET_ID)" \
              --os-sku Ubuntu 2>&1)
            rc=$?
            set -e
            echo "$output"
            if [ $rc -eq 0 ]; then
              break
            fi
            if echo "$output" | grep -qiE "OperationNotAllowed"; then
              now=$(date +%s)
              if [ $now -ge $deadline ]; then
                echo "Retriable error persisted past 600s retry window ($attempt attempts); giving up."
                exit $rc
              fi
              remaining_retry_seconds=$((deadline - now))
              echo "Attempt $attempt matched retriable pattern; retrying in $sleep_between seconds ($remaining_retry_seconds seconds remain in retry window)."
              sleep $sleep_between
            else
              echo "Non-retriable error (rc=$rc); giving up after attempt $attempt."
              exit $rc
            fi
          done

          remaining=$((remaining - node_count))
          pool_index=$((pool_index + 1))
        done
    displayName: Create user node pools
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        RUN_COMMAND_OUTPUT=$(az vm run-command invoke \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-jumpbox" \
          --subscription "$(subscription_id)" \
          --command-id RunShellScript \
          --scripts \
            "set -eu" \
            "az login --identity --output none" \
            "az account set --subscription '$(subscription_id)'" \
            "az aks get-credentials --admin --overwrite-existing --file /var/tmp/telescope-kubeconfig --resource-group '$(RUN_ID)' --name '$(cluster_name)' --subscription '$(subscription_id)'" \
            "chmod 600 /var/tmp/telescope-kubeconfig" \
            "test -s /var/tmp/telescope-kubeconfig" \
            "echo __KUBECONFIG_READY__" \
          --query 'value[0].message' \
          --output tsv)
        echo "$RUN_COMMAND_OUTPUT"
        if ! grep -q '__KUBECONFIG_READY__' <<< "$RUN_COMMAND_OUTPUT"; then
          echo "Failed to configure kubeconfig on jumpbox."
          exit 1
        fi
    displayName: Configure kubeconfig on jumpbox $(cluster_name)-jumpbox
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        work_dir=$(mktemp -d)
        trap 'rm -rf "$work_dir"' EXIT

        manifest_path="$(Pipeline.Workspace)/s/kcl/ccp_team/15K_cluster/disable-thp.yaml"
        if [ ! -f "$manifest_path" ]; then
          echo "Kubernetes manifest not found: $manifest_path"
          exit 1
        fi
        manifest_size=$(wc -c < "$manifest_path" | tr -d ' ')
        if [ "$manifest_size" -gt 45000 ]; then
          echo "Kubernetes manifest is too large for az vm run-command invoke: $manifest_size bytes."
          exit 1
        fi

        remote_script="$work_dir/apply-manifest.sh"
        cat > "$remote_script" <<'REMOTE_SCRIPT'
        set -eu
        export KUBECONFIG=/var/tmp/telescope-kubeconfig
        test -s "$KUBECONFIG"
        kubectl apply -f - <<'MANIFEST'
        REMOTE_SCRIPT
        cat "$manifest_path" >> "$remote_script"
        cat >> "$remote_script" <<'REMOTE_SCRIPT'
        MANIFEST
        echo "__MANIFEST_APPLIED__"
        REMOTE_SCRIPT

        run_command_output=$(az vm run-command invoke \
          --resource-group "$(RUN_ID)" \
          --name "$(cluster_name)-jumpbox" \
          --subscription "$(subscription_id)" \
          --command-id RunShellScript \
          --scripts @"$remote_script" \
          --query 'value[0].message' \
          --output tsv)
        echo "$run_command_output"
        if ! grep -q '__MANIFEST_APPLIED__' <<< "$run_command_output"; then
          echo "Failed to apply kcl/ccp_team/15K_cluster/disable-thp.yaml from jumpbox."
          exit 1
        fi
    displayName: Apply kcl/ccp_team/15K_cluster/disable-thp.yaml from jumpbox
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        work_dir=$(mktemp -d)
        trap 'rm -rf "$work_dir"' EXIT

        invoke_jumpbox() {
          script_file=$1
          az vm run-command invoke \
            --resource-group "$(RUN_ID)" \
            --name "$(cluster_name)-jumpbox" \
            --subscription "$(subscription_id)" \
            --command-id RunShellScript \
            --scripts @"$script_file" \
            --query 'value[0].message' \
            --output tsv
        }

        cl2_config_file_path="$(Pipeline.Workspace)/s/kcl/ccp_team/15K_cluster/cl2.yaml"
        if [ ! -f "$cl2_config_file_path" ]; then
          echo "ClusterLoader2 config file not found: $cl2_config_file_path"
          exit 1
        fi
        cl2_config_file_size=$(wc -c < "$cl2_config_file_path" | tr -d ' ')
        if [ "$cl2_config_file_size" -gt 45000 ]; then
          echo "ClusterLoader2 config file is too large for az vm run-command invoke: $cl2_config_file_size bytes."
          exit 1
        fi

        launch_script="$work_dir/launch-cl2.sh"
        cat > "$launch_script" <<'REMOTE_SCRIPT'
        set -eu
        export KUBECONFIG=/var/tmp/telescope-kubeconfig
        test -s "$KUBECONFIG"
        kubectl create namespace "clusterloader2" --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f - <<'MANIFEST'
        REMOTE_SCRIPT
        cat "$cl2_config_file_path" >> "$launch_script"
        cat >> "$launch_script" <<'REMOTE_SCRIPT'
        MANIFEST
        echo "__CL2_STARTED__"
        REMOTE_SCRIPT

        echo "Starting ClusterLoader2 from jumpbox $(cluster_name)-jumpbox..."
        launch_message=$(invoke_jumpbox "$launch_script")
        echo "$launch_message"
        if ! grep -q '__CL2_STARTED__' <<< "$launch_message"; then
          echo "Failed to start ClusterLoader2 from jumpbox."
          exit 1
        fi

        status_script="$work_dir/cl2-status.sh"
        cat > "$status_script" <<'REMOTE_SCRIPT'
        set -eu
        export KUBECONFIG=/var/tmp/telescope-kubeconfig
        kubectl get pods \
          --namespace="clusterloader2" \
          --output jsonpath='{range .items[*]}{.status.phase}{"\n"}{end}'
        REMOTE_SCRIPT

        # Mirror the polling behavior of RunClusterLoader2.
        consecutive_status_errors=0
        while true; do
          set +e
          status_message=$(invoke_jumpbox "$status_script")
          status_rc=$?
          set -e
          echo "$status_message"
          if [ "$status_rc" -ne 0 ]; then
            consecutive_status_errors=$((consecutive_status_errors + 1))
            if [ "$consecutive_status_errors" -ge "20" ]; then
              echo "Unable to read ClusterLoader2 status after $consecutive_status_errors/20 consecutive attempts."
              exit 1
            fi
          else
            consecutive_status_errors=0
            phases=$(printf '%s\n' "$status_message" | tr -d '\r' | grep -E '^(Pending|Running|Succeeded|Failed|Unknown)$' || true)
            total=0
            terminal=0

            if [ -n "$phases" ]; then
              while IFS= read -r phase; do
                if [ -z "$phase" ]; then
                  continue
                fi

                total=$((total + 1))
                if [ "$phase" = "Succeeded" ] || [ "$phase" = "Failed" ]; then
                  terminal=$((terminal + 1))
                fi
              done <<< "$phases"
            fi

            if [ "$total" -gt 0 ] && [ "$terminal" -eq "$total" ]; then
              echo "All cl2 pods reached terminal state (Succeeded or Failed)"
              break
            fi
          fi

          sleep 30
        done

        results_script="$work_dir/cl2-results.sh"
        cat > "$results_script" <<'REMOTE_SCRIPT'
        set -eu
        export KUBECONFIG=/var/tmp/telescope-kubeconfig
        pods=$(kubectl get pods \
          --namespace="clusterloader2" \
          --selector job-name=cl2 \
          --output jsonpath='{.items[*].metadata.name}')
        test -n "$pods"
        for pod in $pods; do
          echo "===== Results for pod: $pod ====="
          kubectl logs --namespace="clusterloader2" "$pod" --container=cl2-results
        done
        echo "__CL2_RESULTS_PRINTED__"
        REMOTE_SCRIPT

        echo "Printing ClusterLoader2 results from jumpbox $(cluster_name)-jumpbox..."
        results_message=$(invoke_jumpbox "$results_script")
        echo "$results_message"
        if ! grep -q '__CL2_RESULTS_PRINTED__' <<< "$results_message"; then
          echo "Failed to print ClusterLoader2 results from jumpbox."
          exit 1
        fi
    displayName: Run ClusterLoader2 from jumpbox
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail
        az group delete --name "$(RUN_ID)" --subscription "$(subscription_id)" --yes
    condition: succeeded()
    displayName: Delete resource group ($(subscription_id))
