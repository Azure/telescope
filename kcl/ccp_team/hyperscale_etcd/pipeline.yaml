name: Hyperscale Etcd Benchmarking
pool: AKS-Telescope-Airlock
trigger: none
parameters:
- name: keep_cluster
  displayName: Keep cluster after benchmark
  type: boolean
  default: false
- name: existing_cluster_resource_group
  displayName: Existing cluster resource group (leave as none to create new)
  type: string
  default: none
- name: existing_cluster_name
  displayName: Existing cluster name (leave as none to create new)
  type: string
  default: none
- name: scaling_size
  displayName: Control plane scaling size
  type: string
  default: H2
  values:
  - H2
  - H4
  - H8
- name: ingest_configmap_gib
  displayName: ConfigMap ingest size (GiB)
  type: number
  default: 4
- name: ingest_events_gib
  displayName: Events ingest size (GiB)
  type: number
  default: 3
- name: ingest_secrets_gib
  displayName: Secrets ingest size (GiB)
  type: number
  default: 4
jobs:
- job: setup
  displayName: Cluster Setup
  timeoutInMinutes: 1440
  steps:
  - bash: |2

      set -eo pipefail

      if { [ "$PARAM_EXISTING_CLUSTER" = "none" ] && [ "$PARAM_EXISTING_RG" != "none" ]; } ||    { [ "$PARAM_EXISTING_CLUSTER" != "none" ] && [ "$PARAM_EXISTING_RG" = "none" ]; }; then
        echo "Existing cluster name and resource group must be provided together."
        exit 1
      fi

      # Resolve CLUSTER
      if [ -n "$PARAM_EXISTING_CLUSTER" ] && [ "$PARAM_EXISTING_CLUSTER" != "none" ]; then
        CLUSTER="$PARAM_EXISTING_CLUSTER"
        echo "Using existing cluster: $CLUSTER"
      else
        CLUSTER="hyperscale-etcd-testing"
        echo "Using default cluster: $CLUSTER"
      fi

      # Resolve RESOURCE_GROUP
      if [ -n "$PARAM_EXISTING_RG" ] && [ "$PARAM_EXISTING_RG" != "none" ]; then
        RESOURCE_GROUP="$PARAM_EXISTING_RG"
        echo "Using existing resource group: $RESOURCE_GROUP"
      else
        job_id="$(System.JobId)"
        RESOURCE_GROUP=$(Build.BuildId)-${job_id:0:8}
        echo "Generated resource group: $RESOURCE_GROUP"
      fi

      echo "##vso[task.setvariable variable=CLUSTER;isOutput=true]$CLUSTER"
      echo "##vso[task.setvariable variable=RESOURCE_GROUP;isOutput=true]$RESOURCE_GROUP"
    displayName: Bootstrap - resolve CLUSTER, RESOURCE_GROUP
    env:
      PARAM_EXISTING_CLUSTER: ${{ parameters.existing_cluster_name }}
      PARAM_EXISTING_RG: ${{ parameters.existing_cluster_resource_group }}
    name: resolve
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail

        az account set --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219"
        az config set defaults.location="westus2"
        az account show
    displayName: Login to Azure
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |+
        set -exo pipefail

        az group create \
          --name "$(resolve.RESOURCE_GROUP)" \
          --location "westus2" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \

    condition: and(succeeded(), not(and(ne('${{ parameters.existing_cluster_name }}', 'none'), ne('${{ parameters.existing_cluster_resource_group }}', 'none'))))
    displayName: Create resource group in westus2 (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail

        az extension add --name aks-preview --version 20.0.0b6 --allow-preview true --yes

        az aks create \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --resource-group "$(resolve.RESOURCE_GROUP)" \
            --name "$(resolve.CLUSTER)" \
            --location "westus2" \
            --kubernetes-version "1.36" \
            --dns-name-prefix "$(resolve.CLUSTER)-dns" \
            --tier standard \
            --enable-managed-identity \
            --generate-ssh-keys \
            --nodepool-name systempool \
            --node-count 3 \
            --node-vm-size Standard_D2_v4 \
            --max-pods 50 \
            --network-plugin azure \
            --network-plugin-mode overlay \
            --pod-cidr 10.64.0.0/10 \
            --service-cidr 10.0.0.0/16 \
            --dns-service-ip 10.0.0.10 \
            --outbound-type managedNATGateway \
            --nat-gateway-managed-outbound-ip-count 10 \
            --tags SkipAKSCluster=true \
            --control-plane-scaling-size ${{ parameters.scaling_size }} \
            --yes
    condition: and(succeeded(), not(and(ne('${{ parameters.existing_cluster_name }}', 'none'), ne('${{ parameters.existing_cluster_resource_group }}', 'none'))))
    displayName: Create cluster
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail

        while true; do
          STATE=$(az aks show \
            --name "$(resolve.CLUSTER)" \
            --resource-group "$(resolve.RESOURCE_GROUP)" \
            --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
            --query "provisioningState" \
            --output tsv)
          echo "Cluster provisioning state: $STATE"
          if [ "$STATE" = "Succeeded" ]; then
            echo "Cluster is ready."
            break
          elif [ "$STATE" = "Failed" ] || [ "$STATE" = "Canceled" ]; then
            echo "Cluster failed with state: $STATE."
            exit 1
          else
            echo "Provisioning state: $STATE. Retry in 30 seconds"
          fi
          sleep 30
        done
    displayName: Wait for cluster to succeed
  - script: |2

      set -euo pipefail
      START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
      echo "Benchmark start time: $START_TIME"
      echo "##vso[task.setvariable variable=BENCHMARK_START_TIME;isOutput=true]$START_TIME"
    displayName: Record start time
    name: timestamp
- job: ingest_configmap
  displayName: Ingest ConfigMaps (${{ parameters.ingest_configmap_gib }} GiB)
  dependsOn: setup
  condition: and(succeeded(), ne('${{ parameters.ingest_configmap_gib }}', '0'))
  timeoutInMinutes: 1440
  variables:
    CLUSTER: $[ dependencies.setup.outputs['resolve.CLUSTER'] ]
    RESOURCE_GROUP: $[ dependencies.setup.outputs['resolve.RESOURCE_GROUP'] ]
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail

        az aks get-credentials \
          --name "$(CLUSTER)" \
          --resource-group "$(RESOURCE_GROUP)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing
    displayName: Get credentials for $(CLUSTER)
  - script: |2

      set -euo pipefail
      set -x

      temp_dir=$(mktemp -p /tmp -d kperfinstall.XXXX)
      docker rmi ghcr.io/liyu-ma/kperf:hyperscale-etcd 2>/dev/null || true
      docker pull ghcr.io/liyu-ma/kperf:hyperscale-etcd
      docker run --rm -v $temp_dir:/install-dir \
        ghcr.io/liyu-ma/kperf:hyperscale-etcd bash -c "set -x; install /kperf /runkperf /install-dir"

      sudo install $temp_dir/kperf $temp_dir/runkperf /usr/local/bin
      rm -rf $temp_dir
      docker rmi ghcr.io/liyu-ma/kperf:hyperscale-etcd 2>/dev/null || true
    displayName: Install runkperf binary
  - script: |2

      set -euo pipefail
      set -x

      TOTAL_OBJECTS_COUNT=$(( ${{ parameters.ingest_configmap_gib }} * 1073741824 / 524288 ))
      TOTAL_BATCHES=$(( (TOTAL_OBJECTS_COUNT + 2000 - 1) / 2000 ))

      kubectl create namespace kperf-configmap-data 2>/dev/null || true

      echo "Ingesting $TOTAL_OBJECTS_COUNT configmaps in $TOTAL_BATCHES batches of 2000..."

      completed=0
      for batch in $(seq 1 $TOTAL_BATCHES); do
        REMAINING=$((TOTAL_OBJECTS_COUNT - completed))
        COUNT=2000
        if [ "$REMAINING" -lt "$COUNT" ]; then
          COUNT=$REMAINING
        fi

        echo "Batch $batch/$TOTAL_BATCHES: creating $COUNT configmaps..."
        run_batch() {
          runkperf data configmap \
            --namespace kperf-configmap-data \
            add $(System.JobId)-b$batch-$1 \
            --qps 80 \
            --burst 80 \
            --total $COUNT \
            --size 524288 \
            --group-size 80
        }
        run_batch first || run_batch retry

        completed=$((completed + COUNT))
        STORAGE_GIB=$(awk 'BEGIN{printf "%.1f", '$completed' * 524288 / 1073741824}')
        echo "Progress: $completed / $TOTAL_OBJECTS_COUNT configmaps created (~$STORAGE_GIB GiB)"
      done

      echo "Ingest complete: $completed configmaps created."
    condition: and(succeeded(), ne('${{ parameters.ingest_configmap_gib }}', '0'))
    displayName: Ingest configmap data (${{ parameters.ingest_configmap_gib }} GiB)
- job: ingest_events
  displayName: Ingest Events (${{ parameters.ingest_events_gib }} GiB)
  dependsOn: setup
  condition: and(succeeded(), ne('${{ parameters.ingest_events_gib }}', '0'))
  timeoutInMinutes: 1440
  variables:
    CLUSTER: $[ dependencies.setup.outputs['resolve.CLUSTER'] ]
    RESOURCE_GROUP: $[ dependencies.setup.outputs['resolve.RESOURCE_GROUP'] ]
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail

        az aks get-credentials \
          --name "$(CLUSTER)" \
          --resource-group "$(RESOURCE_GROUP)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing
    displayName: Get credentials for $(CLUSTER)
  - script: |2

      set -euo pipefail
      set -x

      temp_dir=$(mktemp -p /tmp -d kperfinstall.XXXX)
      docker rmi ghcr.io/liyu-ma/kperf:hyperscale-etcd 2>/dev/null || true
      docker pull ghcr.io/liyu-ma/kperf:hyperscale-etcd
      docker run --rm -v $temp_dir:/install-dir \
        ghcr.io/liyu-ma/kperf:hyperscale-etcd bash -c "set -x; install /kperf /runkperf /install-dir"

      sudo install $temp_dir/kperf $temp_dir/runkperf /usr/local/bin
      rm -rf $temp_dir
      docker rmi ghcr.io/liyu-ma/kperf:hyperscale-etcd 2>/dev/null || true
    displayName: Install runkperf binary
  - script: |2

      set -euo pipefail
      set -x

      TOTAL_OBJECTS_COUNT=$(( ${{ parameters.ingest_events_gib }} * 1073741824 / 524288 ))
      TOTAL_BATCHES=$(( (TOTAL_OBJECTS_COUNT + 2000 - 1) / 2000 ))

      kubectl create namespace kperf-event-data 2>/dev/null || true

      echo "Ingesting $TOTAL_OBJECTS_COUNT events in $TOTAL_BATCHES batches of 2000..."

      completed=0
      for batch in $(seq 1 $TOTAL_BATCHES); do
        REMAINING=$((TOTAL_OBJECTS_COUNT - completed))
        COUNT=2000
        if [ "$REMAINING" -lt "$COUNT" ]; then
          COUNT=$REMAINING
        fi

        echo "Batch $batch/$TOTAL_BATCHES: creating $COUNT events..."
        run_batch() {
          runkperf data event \
            --namespace kperf-event-data \
            add $(System.JobId)-b$batch-$1 \
            --qps 80 \
            --burst 80 \
            --total $COUNT \
            --size 524288 \
            --group-size 80
        }
        run_batch first || run_batch retry

        completed=$((completed + COUNT))
        STORAGE_GIB=$(awk 'BEGIN{printf "%.1f", '$completed' * 524288 / 1073741824}')
        echo "Progress: $completed / $TOTAL_OBJECTS_COUNT events created (~$STORAGE_GIB GiB)"
      done

      echo "Ingest complete: $completed events created."
    condition: and(succeeded(), ne('${{ parameters.ingest_events_gib }}', '0'))
    displayName: Ingest event data (${{ parameters.ingest_events_gib }} GiB)
- job: ingest_secrets
  displayName: Ingest Secrets (${{ parameters.ingest_secrets_gib }} GiB)
  dependsOn: setup
  condition: and(succeeded(), ne('${{ parameters.ingest_secrets_gib }}', '0'))
  timeoutInMinutes: 1440
  variables:
    CLUSTER: $[ dependencies.setup.outputs['resolve.CLUSTER'] ]
    RESOURCE_GROUP: $[ dependencies.setup.outputs['resolve.RESOURCE_GROUP'] ]
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail

        az aks get-credentials \
          --name "$(CLUSTER)" \
          --resource-group "$(RESOURCE_GROUP)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --overwrite-existing
    displayName: Get credentials for $(CLUSTER)
  - script: |2

      set -euo pipefail
      set -x

      temp_dir=$(mktemp -p /tmp -d kperfinstall.XXXX)
      docker rmi ghcr.io/liyu-ma/kperf:hyperscale-etcd 2>/dev/null || true
      docker pull ghcr.io/liyu-ma/kperf:hyperscale-etcd
      docker run --rm -v $temp_dir:/install-dir \
        ghcr.io/liyu-ma/kperf:hyperscale-etcd bash -c "set -x; install /kperf /runkperf /install-dir"

      sudo install $temp_dir/kperf $temp_dir/runkperf /usr/local/bin
      rm -rf $temp_dir
      docker rmi ghcr.io/liyu-ma/kperf:hyperscale-etcd 2>/dev/null || true
    displayName: Install runkperf binary
  - script: |2

      set -euo pipefail
      set -x

      TOTAL_OBJECTS_COUNT=$(( ${{ parameters.ingest_secrets_gib }} * 1073741824 / 524288 ))
      TOTAL_BATCHES=$(( (TOTAL_OBJECTS_COUNT + 2000 - 1) / 2000 ))

      kubectl create namespace kperf-secret-data 2>/dev/null || true

      echo "Ingesting $TOTAL_OBJECTS_COUNT secrets in $TOTAL_BATCHES batches of 2000..."

      completed=0
      for batch in $(seq 1 $TOTAL_BATCHES); do
        REMAINING=$((TOTAL_OBJECTS_COUNT - completed))
        COUNT=2000
        if [ "$REMAINING" -lt "$COUNT" ]; then
          COUNT=$REMAINING
        fi

        echo "Batch $batch/$TOTAL_BATCHES: creating $COUNT secrets..."
        run_batch() {
          runkperf data secret \
            --namespace kperf-secret-data \
            add $(System.JobId)-b$batch-$1 \
            --qps 80 \
            --burst 80 \
            --total $COUNT \
            --size 524288 \
            --group-size 80
        }
        run_batch first || run_batch retry

        completed=$((completed + COUNT))
        STORAGE_GIB=$(awk 'BEGIN{printf "%.1f", '$completed' * 524288 / 1073741824}')
        echo "Progress: $completed / $TOTAL_OBJECTS_COUNT secrets created (~$STORAGE_GIB GiB)"
      done

      echo "Ingest complete: $completed secrets created."
    condition: and(succeeded(), ne('${{ parameters.ingest_secrets_gib }}', '0'))
    displayName: Ingest secret data (${{ parameters.ingest_secrets_gib }} GiB)
- job: finalize
  displayName: Report and Cleanup
  dependsOn:
  - setup
  - ingest_configmap
  - ingest_events
  - ingest_secrets
  condition: always()
  timeoutInMinutes: 60
  variables:
    CLUSTER: $[ dependencies.setup.outputs['resolve.CLUSTER'] ]
    RESOURCE_GROUP: $[ dependencies.setup.outputs['resolve.RESOURCE_GROUP'] ]
    BENCHMARK_START_TIME: $[ dependencies.setup.outputs['timestamp.BENCHMARK_START_TIME'] ]
  steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail

        RESOURCE_UID=$(az aks show \
          --resource-group "$(RESOURCE_GROUP)" \
          --name "$(CLUSTER)" \
          --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" \
          --query "resourceUid" -o tsv)

        if [ -z "$RESOURCE_UID" ]; then
          echo "##[warning]Failed to fetch resourceUid, skipping ASI URL"
          exit 1
        fi

        END_TIME=""
        if [ -z "$END_TIME" ]; then
          END_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
        fi

        FROM_ENCODED=$(echo "$(BENCHMARK_START_TIME)" | sed 's/:/%3A/g')
        TO_ENCODED=$(echo "$END_TIME" | sed 's/:/%3A/g')

        echo "============================================"
        echo "ASI Managed Cluster Dashboard URL:"
        echo "https://asi.azure.ms/services/AKS/pages/Managed%20Cluster?clusterVersion=$RESOURCE_UID&globalFrom=$FROM_ENCODED&globalTo=$TO_ENCODED"
        echo ""
        echo "ASI API Server Analyzer URL:"
        echo "https://asi.azure.ms/services/AKS/pages/API%20Server%20Analyzer?clusterVersion=$RESOURCE_UID&globalFrom=$FROM_ENCODED&globalTo=$TO_ENCODED"
        echo "============================================"
    continueOnError: true
    displayName: Print ASI dashboard URL
  - task: AzureCLI@2
    inputs:
      azureSubscription: Azure-for-Telescope-internal
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -exo pipefail

        az group delete --name "$(RESOURCE_GROUP)" --subscription "b8ceb4e5-f05b-4562-a9f5-14acb1f24219" --yes
    condition: and(always(), not(and(ne('${{ parameters.existing_cluster_name }}', 'none'), ne('${{ parameters.existing_cluster_resource_group }}', 'none'))), not(${{ parameters.keep_cluster }}))
    displayName: Delete resource group (b8ceb4e5-f05b-4562-a9f5-14acb1f24219)
